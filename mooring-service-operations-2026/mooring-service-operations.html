function context(C,catalogue){return {workspace:C.create(catalogue,{id:'mooring-service-demonstration',title:'Six-operator seasonal mooring programme — demonstration records',now:'2026-10-13T09:00:00Z'})};}

async function readFile(file,kind){

if(isCSV){csvFile=null;csvReview=null;}else if(isEvidence)evidenceFile=null;else received=null;
const selector=isCSV?"#csv-map button, #csv-commit button":isEvidence?"#evidence-add button":'[data-action="receive"]';
root.querySelectorAll(selector).forEach(x=>x.disabled=true);const summary=document.getElementById(isCSV?"csv-summary":isEvidence?"evidence-summary":"receive-summary");if(summary)summary.textContent=file?"Reading the selected original…":"No file selected.";
try{if(!file)return;const max=(isCSV||isEvidence?8:64)*1024*1024;if(file.size>max)throw Error("Selected file exceeds "+max/1024/1024+" MiB.");
const data=isEvidence?await file.arrayBuffer():await file.text();
if(generation!==(isCSV?csvGeneration:isEvidence?evidenceGeneration:fileGeneration))return;
if(epoch!==atEpoch||w.revision!==atRevision)throw Error("The workspace or form changed during the read. Select this file again.");
if(!guard())return;
if(isCSV){const h=headers(data);if(h.some(x=>!x)||new Set(h).size!==h.length)throw Error("CSV needs distinct nonempty header names.");csvFile={name:file.name,text:data,headers:h};}
else if(isEvidence){const a=new Uint8Array(data);evidenceFile={name:file.name,mime:file.type||"application/octet-stream",bytes:a.length,contentBase64:b64(a)};}
else received={name:file.name,workspace:C.importWorkspace(data,{catalogue}),revision:w.revision};
dirty.clear();epoch++;render();message(isCSV?"Original CSV loaded. Map fields and decide each row.":isEvidence?"Original evidence loaded. Choose its actual asset and job before attaching.":"Complete workspace validated; review before replacing.");
}catch(err){if(generation===(isCSV?csvGeneration:isEvidence?evidenceGeneration:fileGeneration))message(err.message,true);}
}

if(["job-cancel","repair-reopen","repair-cancel","notice-cancel"].includes(a)){if(!guard())return;const reason=window.prompt("Record the actual reason for "+n.textContent.toLowerCase()+".","");if(reason?.trim())mutate({type:a,id,reason:reason.trim()});return;}

if(a==="evidence-download"){const r=by("evidence",id);download(r.name,unb64(r.contentBase64),r.mime);return;}

if(a==="source"){download("mooring-service-source.json",JSON.stringify(catalogue,null,2),"application/json");return;}
if(a==="browser-save"){localStorage.setItem("mooring-service-workspace",C.exportWorkspace(w));message("Complete working workspace saved in this browser. Unsaved form inputs are excluded; export JSON for a portable copy.");return;}

if(a==="receive"){if(!received)throw Error("Select and validate a complete file first.");if(received.revision!==w.revision)throw Error("The workspace changed. Select the file again.");if(!guard())return;if(!window.confirm("Replace the current workspace with "+received.name+"? Export first if needed."))return;sel={};changed(received.workspace,"Complete original workspace received.");return;}

try{const result=await E.buildAsync(C,catalogue,{onProgress:p=>{const m=document.getElementById("message");if(m)m.textContent="Building complete programme: "+(p.message||p.operations||"");}});if(epoch!==atEpoch||w.revision!==atRevision)throw Error("The workspace or form changed. The prepared example was not applied.");sel={};building=false;changed(result.workspace,"Worked example opened. All owners, assets, coordinates, permits and actions are demonstration records.");}finally{building=false;root.removeAttribute("aria-busy");const b=root.querySelector('[data-action="example"]');if(b)b.disabled=false;}return;}
}catch(err){message(err.message,true);}
});
window.addEventListener("beforeunload",e=>{if(dirty.size){e.preventDefault();e.returnValue="";}});
window.MooringServiceUI={getWorkspace:()=>w,getState:()=>({tab,operator,setup,sel,dirty:[...dirty],epoch}),render,formCommand,exportCSV,exportReport,headers};
render();
