<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="color-scheme" content="light"><title>Mooring service operations</title>
<style>

*{box-sizing:border-box}body{margin:0;background:#eeeeee;color:#1f1f1f}

#app .hint{background:#ebebeb;color:#3c3c3c;padding:14px}
#app a{color:#505050;text-decoration:underline;overflow-wrap:anywhere}
