[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "tjlabs-reach-chemistry"
version = "0.1.0"
description = "Mass-accounted reach-network chemical transport and observation inference"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "scipy>=1.12"]
[project.scripts]
reach-chemistry = "reach_chemistry.cli:main"
[tool.setuptools]
packages = ["reach_chemistry"]
