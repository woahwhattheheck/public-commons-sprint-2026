[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ecsa-retained-runs"
version = "0.2.1"
description = "Durable native-model execution and complete retained results for the existing ECSA workspace"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24", "pandas>=2.0"]

[project.optional-dependencies]
spatial = ["geopandas>=0.14", "shapely>=2"]

[project.scripts]
ecsa-runs = "ecsa_runs.__main__:main"

[tool.setuptools.packages.find]
include = ["ecsa_runs*"]
