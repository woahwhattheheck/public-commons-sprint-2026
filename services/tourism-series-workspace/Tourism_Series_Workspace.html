function rowPicker(name,rows){

 const count=paragraph('','muted');search.querySelector('input').addEventListener('input',options);input.addEventListener('input',refresh);
 root.append(search,choice,count,button('Add selected observation',()=>{if(!choice.value)throw Error('Select an original observation.');const a=ids();if(a.includes(choice.value))throw Error('That original row is already selected.');a.push(choice.value);set(a);}),area,list);

}

ex=\"-1\">\u003c/main>\u003c/div>\n\u003cfooter>Work stays in this browser and in the files you download. Keep a complete working copy when finishing a session.\u003c/footer>\n\u003cscript id=\"tourism-boot\" type=\"application/json\">__TOURISM_BOOT__\u003c/script>\n\u003cscript>__TOURISM_CODE__\u003c/script>\n\u003c/body>\n\u003c/html>\n","build.mjs":"import {readFile,mkdir,writeFile,rename,rm,lstat,open} from 'node:fs/promises';\nimport {dirname,join,resolve,relative,sep} from 'node:path';\nimport {fileURLToPath,pathToFileURL} from 'node:url';\nimport {randomUUID} from 'node:crypto';\nimport {sha256Utf8,sha256Bytes} from './sha256.mjs';\n\nimport {base64Decode,sourcePath,parseRecovery,workingHTML,completeFiles,zipBytes,json} from './portable.mjs';\n\nexport const SOURCE_FILES=['engine.mjs','sha256.mjs','portable.mjs','app.mjs','style.css','template.html','build.mjs','cli.mjs','README.md','BROWSER_OPERATING.md','API.md','CORE_OPERATING.md','templates/observations.csv','run_browser_receiving.mjs'];\nexport async function loadSource(root=dirname(fileURLToPath(import.meta.url))){\n  const source={};\n  for(const path of SOURCE_FILES){const full=join(root,path),stat=await lstat(full);if(!stat.isFile()||stat.isSymbolicLink())throw Error('Use the complete regular source file '+path+'.');source[path]=await readFile(full,'utf8');}\n  const helper=join(root,'..','migration-receiving','continuation.mjs'),stat=await lstat(helper);if(!stat.isFile()||stat.isSymbolicLink())throw Error('Retain the original migration receiving helper.');source['migration-receiving/continuation.mjs']=await readFile(helper,'utf8');\n  return source;\n}\nfunction bytes(file){return file.base64!==undefined?base64Decode(file.base64):new TextEncoder().encode(file.content);}\nexport async function publishFile(path,data){\n  const output=resolve(path),body=typeof data==='string'?new TextEncoder().encode(data):data;await mkdir(dirname(output),{recursive:true});\n  const temp=output+'.'+randomUUID()+'.tmp';let handle;\n  try{handle=await open(temp,'wx',0o600);await handle.writeFile(body);await handle.sync();await handle.close();handle=null;\n    // Link publishes create-only; retain an identical completed output after a lost reply.\n    const {link}=await import('node:fs/promises');\n    try{await link(temp,output);}catch(e){if(e.code!=='EEXIST')throw e;const stat=await lstat(output);if(!stat.isFile()||stat.isSymbolicLink())throw Error('Existing output is not an original regular file: '+output);const previous=await readFile(output);if(sha256Bytes(previous).sha256!==sha256Bytes(body).sha256)throw Error('The existing output contains different original bytes: '+output);}\n    return{path:output,...sha256Bytes(body)};\n  }finally{await handle?.close().catch(()=>{});await rm(temp,{force:true});}\n}\nexport async function publishDirectory(directory,files){\n  const out=resolve(directory),parent=dirname(out);await mkdir(parent,{recursive:true});\n  const stage=out+'.'+randomUUID()+'.tmp';await mkdir(stage,{mode:0o700});\n  const manifest=[];\n  try{\n    const names=new Set();\n    for(const file of files){\n      if(typeof file.path!=='string'||file.path.includes('\\\\')||file.path.startsWith('/')||file.path.split('/').some(x=>!x||x==='.'||x==='..')||names.has(file.path))throw Error('Use distinct complete relative output paths.');\n      names.add(file.path);const data=bytes(file);const target=resolve(stage,file.path);if(relative(stage,target).startsWith('..'+sep))throw Error('Output path escapes the complete package.');\n      await mkdir(dirname(target),{recursive:true});const handle=await open(target,'wx',0o600);try{await handle.writeFile(data);await handle.sync();}finally{await handle.close();}\n      manifest.push({path:file.path,...sha256Bytes(data)});\n    }\n    try{await rename(stage,out);}catch(e){\n      if(!['EEXIST','ENOTEMPTY'].includes(e.code))throw e;\n      const stat=await lstat(out);if(!stat.isDirectory()||stat.isSymbolicLink())throw Error('The original output destination is not a regular directory.');\n      // A completed same-operation directory is adopted only after all original selected bytes match.\n      for(const file of manifest){const target=join(out,file.path),stat=await lstat(target);if(!stat.isFile()||stat.isSymbolicLink())throw Error('A saved complete output is not regular: '+target);const retained=await readFile(target);if(retained.length!==file.bytes||sha256Bytes(retained).sha256!==file.sha256)throw Error('A saved complete output differs: '+target);}\n    }\n    return{directory:out,files:manifest};\n  }finally{await rm(stage,{recursive:true,force:true});}\n}\nexport async function build({out,workspacePath=null,copyId=null,sourceRoot=null}){\n  const source=await loadSource(sourceRoot||dirname(fileURLToPath(import.meta.url)));\n  const record=workspacePath?parseRecovery(await readFile(resolve(workspacePath),'utf8')):null;\n  if(record&&copyId)record.copyId=copyId;\n  const files=record?completeFiles(source,record):[\n    {path:'Tourism_Series_Workspace.html',content:workingHTML(source)},\n    ...Object.entries(source).map(([path,content])=>({path:'source/'+sourcePath(path),content}))\n  ];\n  const archive=zipBytes(files);\n  // Large archive bytes are passed directly, not through the original-file decoder's 32 MiB cap.\n  const result=await publishDirectory(out,files);\n  const zip=await publishFile(join(result.directory,'Tourism_Series_Complete.zip'),archive);\n  return{schema:'commons.tourism-series-build.v1',...result,zip,workspaceId:record?.workspace.id||null,revision:record?.workspace.revision||0};\n}\nfunction flags(argv){const result={};for(let i=0;i\u003cargv.length;i+=2){if(!['--out','--workspace','--copy-id'].includes(argv[i])||!argv[i+1]||result[argv[i]])throw Error('Usage: node build.mjs --out NEW_DIRECTORY [--workspace WORKING_JSON] [--copy-id ORIGINAL_BROWSER_COPY_ID]');result[argv[i]]=argv[i+1];}if(!result['--out'])throw Error('Supply --out NEW_DIRECTORY.');return result;}\nif(process.argv[1]&&pathToFileURL(resolve(process.argv[1])).href===import.meta.url){\n  try{const args=flags(process.argv.slice(2));console.log(json(await build({out:args['--out'],workspacePath:args['--workspace'],copyId:args['--copy-id']})));}\n  catch(e){console.error(e.message);process.exitCode=1;}\n}\n","cli.mjs":"#!/usr/bin/env node\nimport fs from 'node:fs';\nimport path from 'node:path';\nimport net from 'node:net';\nimport {randomUUID,createHash} from 'node:crypto';\nimport {fileURLToPath} from 'node:url';\nimport * as engine from './engine.mjs';\nconst need=(ok,message)=>{if(!ok)throw Error(message);};\nconst sha=b=>createHash('sha256').update(b).digest('hex');\nfunction regularBytes(file){const s=fs.lstatSync(file);need(s.isFile()&&!s.isSymbolicLink(),'Use a complete regular file: '+file);return fs.readFileSync(file);}\nfunction regular(file){const b=regularBytes(file),text=b.toString('utf8');need(Buffer.from(text,'utf8').equals(b),'Use complete original UTF-8 text: '+file);return text;}\nfunction exists(file){try{return regular(file);}catch(e){if(e.code==='ENOENT')return null;throw e;}}\nfunction absolute(value,label){need(typeof value==='string'&&path.isAbsolute(value),'Use an absolute '+label+'.');return path.resolve(value);}\nfunction durableDirectory(directory){let fd;try{fd=fs.openSync(directory,'r');fs.fsyncSync(fd);}catch(e){if(!['EINVAL','EPERM','EISDIR','ENOTSUP'].includes(e.code))throw e;}finally{if(fd!==undefined)fs.closeSync(fd);}}\nfunction publishBytes(file,bytes){\n let current;try{current=regularBytes(file);}catch(e){if(e.code!=='ENOENT')throw e;}\n if(current){need(current.equals(bytes),'An existing output contains another complete edition: '+file);return;}\n fs.mkdirSync(path.dirname(file),{recursive:true,mode:0o700});const temp=file+'.'+randomUUID()+'.candidate';let fd;\n try{fd=fs.openSync(temp,'wx',0o600);fs.writeFileSync(fd,bytes);fs.fsyncSync(fd);fs.closeSync(fd);fd=undefined;try{fs.linkSync(temp,file);}catch(e){if(e.code!=='EEXIST'||!regularBytes(file).equals(bytes))throw e;}durableDirectory(path.dirname(file));}\n finally{if(fd!==undefined)fs.closeSync(fd);fs.rmSync(temp,{force:true});}\n}\nfunction publish(file,text){publishBytes(file,Buffer.from(text,'utf8'));}\nfunction replace(file,before,after){const temp=file+'.'+randomUUID()+'.candidate';let fd;\n try{fd=fs.openSync(temp,'wx',0o600);fs.writeFileSync(fd,after,'utf8');fs.fsyncSync(fd);fs.closeSync(fd);fd=undefined;need(regular(file)===before,'The original workspace changed during this operation.');fs.renameSync(temp,file);durableDirectory(path.dirname(file));}\n finally{if(fd!==undefined)fs.closeSync(fd);fs.rmSync(temp,{force:true});}\n}\nasync function kernelLease(root){\n const name='tjlabs-tourism-cli-'+sha(Buffer.from(root)).slice(0,40);\n const address=process.platform==='linux'?'\\0'+name:process.platform==='win32'?'\\\\\\\\.\\\\pipe\\\\'+name:null;\n need(address,'Use the original Linux or Windows receiving runtime; this continuation requires a kernel-held local IPC lease.');\n const server=net.createServer(socket=>{socket.on('error',()=>{});socket.end('Original tourism workspace is active.\\n');});\n await new Promise((resolve,reject)=>{server.once('error',reject);server.listen(address,()=>{server.removeListener('error',reject);resolve();});});\n server.on('error',()=>{});let released=false;return()=>{if(released)return Promise.resolve();released=true;return new Promise((resolve,reject)=>server.close(e=>e?reject(e):resolve()));};\n}\n\nasync function locked(workspace,fn){fs.mkdirSync(path.dirname(workspace),{recursive:true,mode:0o700});const identity=path.join(fs.realpathSync(path.dirname(workspace)),path.basename(workspace));const close=await kernelLease(process.platform==='win32'?identity.toLowerCase():identity);try{return fn();}finally{await close();}}\nfunction args(argv){\n const command=argv.shift(),options={};need(command,'Choose init, apply, inspect, project, analyze, report, handover, receive or template.');need(argv.length%2===0,'Supply every flag with exactly one value.');\n const allowed=new Set(['--workspace','--input','--request','--out','--file','--id','--title','--at','--report']);\n for(let i=0;i\u003cargv.length;i+=2){need(allowed.has(argv[i])&&!Object.hasOwn(options,argv[i]),'Supply each documented option once.');options[argv[i]]=argv[i+1];}return{command,options};\n}\nfunction output(file,value){publish(absolute(file,'output'),JSON.stringify(value,null,2)+'\\n');}\nexport async function main(argv=process.argv.slice(2)){\n const {command,options:o}=args(argv.slice());\n if(command==='template'){publish(absolute(o['--out'],'blank template'),engine.encodeCsv([engine.FIELDS]));return{state:'COMPLETE',path:o['--out'],fields:engine.FIELDS};}\n const workspace=absolute(o['--workspace'],'workspace');\n if(command==='init')return locked(workspace,()=>{\n  const value=engine.createWorkspace({id:o['--id'],title:o['--title'],createdAt:o['--at']}),old=exists(workspace);\n  if(old!==null){const current=engine.importWorkspace(old);need(current.id===value.id&&current.title===value.title&&current.createdAt===value.createdAt,'The original destination belongs to another workspace.');return{state:'RETAINED',workspace,id:current.id,revision:current.revision};}\n  publish(workspace,engine.exportWorkspace(value));return{state:'CREATED',workspace,id:value.id,revision:0};\n });\n if(command==='receive')return locked(workspace,()=>{\n  const incoming=engine.importWorkspace(regular(absolute(o['--input'],'complete portable workspace'))),old=exists(workspace);\n  if(old!==null){const current=engine.importWorkspace(old);need(current.id===incoming.id&&current.title===incoming.title&&current.createdAt===incoming.createdAt&&current.revision>=incoming.revision&&JSON.stringify(current.operations.slice(0,incoming.revision))===JSON.stringify(incoming.operations),'The destination contains another history. Use a separate destination for an independent branch.');return{state:'RETAINED',workspace,id:current.id,revision:current.revision,incomingRevision:incoming.revision};}\n  publish(workspace,engine.exportWorkspace(incoming));return{state:'RECEIVED',workspace,id:incoming.id,revision:incoming.revision};\n });\n if(command==='apply')return locked(workspace,()=>{\n  const before=regular(workspace),ws=engine.importWorkspace(before),request=JSON.parse(regular(absolute(o['--request'],'saved operation JSON')));\n  const methods={importFile:engine.importFile,importCsv:engine.importCsv,saveRegistry:engine.saveRegistry,saveMapping:engine.saveMapping,saveCorrection:engine.saveCorrection,saveAnalysis:engine.saveAnalysis,saveReport:engine.saveReport,prepareTarget:engine.prepareTarget,recordTargetReturn:engine.recordTargetReturn};\n  need(Object.hasOwn(methods,request.action)&&request.input&&typeof request.input==='object','Use a documented action and its complete saved input.');\n  const input={...request.input},old=ws.operations.find(x=>x.id===input.operationId);\n  if(request.action==='importFile'||request.action==='importCsv'){\n   const field=request.action==='importFile'?'content_base64':'text';\n   if(o['--file']){\n    need(input[field]===undefined,'Choose one original byte source, inline or --file.');\n    const original=absolute(o['--file'],'complete original input');let bytes;\n    try{bytes=regularBytes(original);}catch(error){\n     if(error.code!=='ENOENT'||!old)throw error;\n     if(request.action==='importFile'){const f=ws.files.find(f=>f.id===old.fileInputId);need(f,'The completed import must retain its original file.');bytes=Buffer.from(f.content_base64,'base64');}\n     else{const s=ws.sources.find(s=>s.id===old.sourceInputId);need(s,'The completed import must retain its original CSV.');bytes=Buffer.from(s.text,'utf8');}\n    }\n    need(bytes.length\u003c=(request.action==='importFile'?engine.LIMITS.supportingBytes:engine.LIMITS.csvBytes),'The complete selected input exceeds its32 MiB ceiling.');\n    if(request.action==='importCsv'){const text=bytes.toString('utf8');need(Buffer.from(text,'utf8').equals(bytes),'Use the complete original UTF-8 CSV.');input.text=text;}else input.content_base64=bytes.toString('base64');\n    need(typeof input.filename==='string','Retain the original filename explicitly in the saved request.');\n   }\n  }else need(!o['--file'],'This action reads its complete saved request.');\n  const result=methods[request.action](ws,input);if(!result.replayed)replace(workspace,before,engine.exportWorkspace(result.workspace));\n  return{state:result.replayed?'REPLAYED':'SAVED',workspace,id:result.workspace.id,revision:result.workspace.revision,receipt:result.receipt};\n });\n const ws=engine.importWorkspace(regular(workspace));\n if(command==='inspect')return{...engine.metadata(),id:ws.id,title:ws.title,revision:ws.revision,files:ws.files.map(({content_base64,...f})=>f),sources:ws.sources.map(({text,rows,...s})=>({...s,rows:rows.length})),registries:ws.registries,mappings:ws.mappings,corrections:ws.corrections,analyses:ws.analyses.map(a=>({id:a.id,title:a.title,ready:a.result.ready,qualified:a.result.qualified})),reports:ws.reports.map(r=>({id:r.id,title:r.title,revision:r.revision})),targetPlans:ws.targetPlans.map(p=>({id:p.id,rows:p.rows.length,sha256:p.sha256})),targetReturns:ws.targetReturns.map(r=>({id:r.id,planId:r.planId,ready:r.ready})),operations:ws.operations};\n if(command==='project'||command==='analyze'){const selection=JSON.parse(regular(absolute(o['--input'],'complete selection JSON'))),result=command==='project'?engine.project(ws,selection):engine.runAnalysis(ws,selection);output(o['--out'],result);return{state:'COMPLETE',revision:ws.revision,ready:result.ready,qualified:result.qualified??null,path:o['--out']};}\n if(command==='report'){publish(absolute(o['--out'],'readable report'),engine.renderReport(ws,o['--report']));return{state:'COMPLETE',revision:ws.revision,path:o['--out']};}\n if(command==='handover'){\n  const root=absolute(o['--out'],'complete handover directory'),packet=engine.buildHandover(ws);fs.mkdirSync(root,{recursive:true,mode:0o700});const stat=fs.lstatSync(root);need(stat.isDirectory()&&!stat.isSymbolicLink(),'Use the original ordinary handover directory.');const realRoot=fs.realpathSync(root);\n  for(const f of packet.files){const target=path.resolve(root,f.path);need(target.startsWith(root+path.sep),'Keep complete outputs inside the selected handover.');fs.mkdirSync(path.dirname(target),{recursive:true,mode:0o700});const parent=fs.realpathSync(path.dirname(target));need(parent===realRoot||parent.startsWith(realRoot+path.sep),'Keep original member parents inside this handover.');const bytes=f.base64===undefined?Buffer.from(f.content,'utf8'):Buffer.from(f.base64,'base64');need(bytes.length===f.bytes&&sha(bytes)===f.sha256,'The complete member differs from its recorded identity.');publishBytes(target,bytes);}\n  return{state:'COMPLETE',workspaceId:ws.id,revision:ws.revision,directory:root,files:packet.files.map(({content,base64,...f})=>f)};\n }\n throw Error('Unknown command: '+command);\n}\nif(process.argv[1]&&path.resolve(process.argv[1])===fileURLToPath(import.meta.url)){try{process.stdout.write(JSON.stringify(await main(),null,2)+'\\n');}catch(e){process.stderr.write(JSON.stringify({error:e.code||e.name,message:e.message,...(e.details?{details:e.details}:{})})+'\\n');process.exitCode=1;}}\n","README.md":"# Tourism Series Workspace\n\nThis complete offline application retains original tourism observations, maps their actual source dimensions, records attributed corrections, freezes reproducible analyses and compares actual target CSV returns. Open **Tourism_Series_Workspace.html** in a current browser. It runs without a server, account, network request or third-party JavaScript.\n\nThe product begins blank. Source facts and commercial/customer material are separate editions loaded by the operator. This source does not embed a prospect list or a procurement response.\n\n## Start and keep the complete record\n\n1. Create a workspace or open an existing complete workspace/recovery JSON.\n2. Enter the actual operator name. Retain original reports, source transcriptions and target templates under their explicit stable file IDs. Record the original URL, publisher, displayed edition, actual retrieval time and representation.\n3. Import the complete original observation CSV with role **Original observation series**. UTF-8 bytes, headers, duplicate header positions, all literal cells and ragged rows are retained.\n4. Load or author a complete registry and save it as an immutable edition. Retain each declared source file before saving the registry.\n5. Map every canonical field to an exact zero-based source column or explicit literal constant. Unmapped fields remain findings. An empty constant stays empty.\n6. Inspect all projected rows, source findings and coverage. Record corrections against a specific original row and cell with the actual operator and reason. Original values remain available.\n7. Select an ordered set of source observations and a calculation. Preview the complete operands and qualification findings; freeze an analysis with an attributed interpretation.\n8. Freeze a report from explicitly selected saved analyses. Prepare an actual supplied target CSV template, then import and reconcile the real returned CSV.\n9. Download **the complete ZIP**, working HTML and recovery JSON. Open the downloaded working file independently and check its original rows, report and unfinished writing.\n\nThe application stores complete local copies in IndexedDB. Browser storage is not a substitute for a downloaded working file. File chooser selections cannot survive a browser reload; choose the original file again if it was not saved.\n\n## Original dimensions and exact values\n\nThe source schema is described completely in API.md. Required canonical fields are observation_id, geography_id, period_start, period_end, metric_id, value, unit, multiplier, method_id, population, price_basis, source_id, source_locator, original_display, status and note.\n\nPeriods are half-open: the end date is excluded. A calendar 2024 observation is [2024-01-01, 2025-01-01). Original printed years and definitions remain in original_display, the source locator and retained evidence.\n\nDecimal input is an exact string. Grouping marks, exponents and silently rounded values are rejected. Multiplier 1, 1000 or 1000000 is explicit. Missing, suppressed and unavailable observations have empty values, not zero. Literal CSV values and status remain unchanged in original source records.\n\nThe registry declares geographic parentage, documented partitions, metric units/currencies, populations, price bases and method editions. It separately records reviewed method comparability, ratio pairs and component relationships. Being in the same file does not make two observations comparable.\n\n### Calculations\n\n| Calculation | Required selection |\n| --- | --- |\n| Sum | One explicitly additive dimension. Geography requires a documented disjoint partition; selected members and incomplete coverage remain visible. Period sums retain the actual span and gaps. |\n| Difference | Two comparable operands, second minus first. |\n| Percentage change | Two comparable operands, first as baseline. A zero baseline yields no defined percentage. |\n| Ratio | Numerator then denominator, using an explicitly declared pair and its exact dimension exceptions. The complete rational and six-place display are retained. |\n| Reconcile | Published total first, then every declared component metric. The result preserves the printed total and reports components minus total. |\n \nNo calculation replaces a published value. An exact arithmetic discrepancy can be a useful qualified result. A tolerance is an explicit operator choice; it is not a statistical confidence interval. Parent and child geography, incompatible measured populations, incompatible methods and overlapping periods are not silently added. Website users remain a different metric from physical visitors.\n\nA saved analysis retains its complete original operands and source basis. Later mapping or cell corrections do not change a frozen analysis. Save a new analysis/report edition for a later interpretation.\n\n## Actual template and returned CSV\n\nRetain the actual UTF-8 CSV template as an original file. The Target view shows every exact header and position. Map each column to a canonical observation field, normalized_value or rowId, or an explicit literal constant. Select the actual identity-key columns. Keys must be nonblank and unique in prepared rows.\n\nThe prepared plan retains the complete template identity, source selection, row identities, column mappings, exact CSV and SHA-256. Download that exact CSV. This action does not invoke a vendor API or execute an import.\n\nAfter the intended platform operation, import its actual returned CSV with role **Actual returned target CSV**. Select the original plan and map every prepared column to its exact returned column position. The retained result exposes matched, missing, unexpected, duplicate and differing rows. Native extra columns survive. An unsuccessful or partial comparison remains a complete receiving edition; it does not rewrite the original observations.\n\n## Unfinished writing, two tabs and reopening\n\nEach form retains literal strings and checkbox booleans per browser tab. Saving snapshots the form and selected files at click time, disables controls during asynchronous reads, applies the complete engine operation and commits the new workspace plus deletion of only the submitted draft in one IndexedDB transaction.\n\nIf another tab saved first, the application retains the full prior, current and candidate workspaces and unfinished writing. It presents both branches. Continue one as an independent copy or open the current saved copy. No branch is silently overwritten.\n\nAn old working HTML reopens the newer local descendant where its exact saved copy already exists. Its embedded unfinished writing is restored when the new tab has no newer writing. Different embedded/local drafts remain separately recoverable in History. A different workspace branch opens as a new local copy.\n\nA recovered form that began at an earlier workspace head requires explicit review and **Use these values for the current revision** before submission. This preserves the raw writing while avoiding silent rebinding.\n\nComplete engine workspace JSON is limited to 128 MiB of actual pretty-printed UTF-8. The entire recovery envelope is also limited to 128 MiB including raw form drafts and selection. A workspace at its engine ceiling may therefore require downloading unfinished values separately; the additional recovery envelope must fit its own limit. Each original file/CSV is limited to 32 MiB. Source ceilings are not throughput claims. Raw unfinished values can be downloaded separately if a complete recovery reaches its limit.\n\n## Full source and command line\n\nNode.js 22+ is suitable for the maintained source. Keep the complete services/tourism-series-workspace/ selection together, including its API, CORE_OPERATING guide, blank CSV template and native callback. The original services/migration-receiving/continuation.mjs is its one receiving dependency. Complete ZIPs preserve these relative sibling directories under source/.\n\nBuild a blank complete application:\n\n    node build.mjs --out /absolute/new-blank-directory\n\nBuild a complete working delivery from original engine JSON or recovery JSON:\n\n    node build.mjs --out /absolute/new-delivery-directory \\\n      --workspace /absolute/Working_Recovery.json \\\n      --copy-id original-browser-copy-id\n\nThe output includes the working HTML, complete original engine handover, recovery JSON, full source and a ZIP. Outputs publish create-only; an identical completed output can be adopted after a lost reply. A different existing edition is rejected.\n\nThe existing cli.mjs operates the same pure engine and original saved workspace:\n\n    node cli.mjs init --workspace /absolute/workspace.json \\\n      --id original-workspace-id --title \"Source review\" --at 2026-10-13T17:00:00.000Z\n    node cli.mjs apply --workspace /absolute/workspace.json \\\n      --request /absolute/saved-operation.json --file /absolute/original.csv\n    node cli.mjs inspect --workspace /absolute/workspace.json\n    node cli.mjs project --workspace /absolute/workspace.json \\\n      --input /absolute/selection.json --out /absolute/project.json\n    node cli.mjs analyze --workspace /absolute/workspace.json \\\n      --input /absolute/calculation.json --out /absolute/calculation-result.json\n    node cli.mjs report --workspace /absolute/workspace.json \\\n      --out /absolute/report.html\n    node cli.mjs handover --workspace /absolute/workspace.json \\\n      --out /absolute/complete-engine-handover\n    node cli.mjs receive --workspace /absolute/independent-workspace.json \\\n      --input /absolute/workspace.json\n\nUse build.mjs for the full working application ZIP in addition to the engine handover. cli.mjs uses a kernel-held same-workspace lease on Linux/Windows. Its saved request must retain action and the complete original input including operationId, expectedRevision and at. The exact completed request is replayed before revision comparison. Completed import replay can recover the original bytes after a staging file disappears. A changed request under the same ID is rejected.\n\n## Delivery and installation boundaries\n\nThe offline application prepares source-qualified files and records a real returned file. Hosting, licensing, permissions, paid/live feeds, integration credentials and target import execution are separately defined partner/platform responsibilities. Keep the complete original evidence and contract with any actual implementation workshare.\n\nFollow BROWSER_OPERATING.md for the original receiving programme. Producing workers must actually run and use the exact outgoing files and inspect the rendered screens/attachments before calling them ready. Preserve the same programme and explicit source edition when continuing a native run.\n","BROWSER_OPERATING.md":"# Original tourism receiving and visual inspection\n\nContinue the existing visitor-data programme. The complete source/data edition, browser runtime and final outgoing attachments must be bound to that original operation. A changed application or source fixture gets an explicit successor edition within the same programme, preserving the former outputs.\n\nUse an isolated equipped cloud browser. Bryce reserved the local Codex in-app browser from 16:00 UTC on 13 October 2026 until his explicit meeting-end release. Do not occupy that browser.\n\n## Actual course\n\nThe maintained callback run_browser_receiving.mjs exports runTourismReceiving({page,context,outputDirectory,applicationPath,sourceWorkspacePath,attachmentPaths}). page and context are the existing authorized Playwright page/context; no second browser controller is created. All paths are absolute. applicationPath selects the exact built Tourism_Series_Workspace.html; sourceWorkspacePath selects the complete engine workspace constructed from the actual source edition. attachmentPaths is the explicit array containing the exact outgoing workshare and practical-guide HTML paths; all four outgoing original inputs are frozen and opened before the operator course.\n\nThe callback freezes the original application/source workspace bytes, opens one deterministic browser copy and drives the source fixture's original operations through the application's real controls. It preserves original source IDs, literal CSVs and registry facts. Browser mutation operation IDs and actor timestamps are actual browser actions. Source facts are compared independently of those new operation identities.\n\nThe course covers:\n\n1. Complete original file and CSV intake with actual source provenance.\n2. Registry edition loading and every mapped column/constant.\n3. Attributed cell corrections where selected by the source course.\n4. Ordered operands and the source-qualified calculation preview.\n5. Frozen reports and actual template-column/key mappings.\n6. Original returned CSV and complete row reconciliation when supplied. A separate explicitly authored software template/return course exercises the generic target controls without changing the outgoing public-reference edition.\n7. Working HTML, saved JSON, recovery JSON, every complete ZIP member and full original-source downloads.\n8. Unfinished writing in a downloaded working file, independent reopening, a later local edit, and two-tab revision conflict without losing either branch.\n\nThe original migration-receiving/continuation.mjs helper holds the operation lease, retains exact input/output bytes, checkpoints the full recovery envelope, reuses each original mutation and restores completed outputs after an interrupted reply. Preserve its entire receiving directory and original retained-byte store. Do not relabel a new run as a completed old run.\n\n## Stable browser controls\n\n- Boot JSON: #tourism-boot containing {source,record,copyId}; record is the complete commons.tourism-series-recovery.v1 envelope.\n- Header: #workspace-revision with Revision N; actual operator input #operator-name.\n- Sections: nav button[data-section=\"workspace|sources|registry|mapping|observations|analyses|reports|target|history\"].\n- Workspace downloads: #top-json (full recovery), #top-workspace (engine JSON), #top-working-html and #top-zip.\n- Form selectors: form[data-action=\"importFile\"], importCsv, saveRegistry.\n- Mapping: saveMapping:SOURCE_ID:REGISTRY_ID with mode:FIELD, column:FIELD and constant:FIELD.\n- Correction: saveCorrection:ROW_ID with column, value and reason.\n- Calculation: saveAnalysis:REGISTRY_ID with id,title,kind,rowIds,dimension,partitionId,ratioPairId,reconciliationId,tolerance,note. rowIds preserves exact ordered IDs separated by newlines.\n- Report: saveReport; analysis:ANALYSIS_ID checkboxes.\n- Target: prepareTarget:TEMPLATE_ID:REGISTRY_ID with kind:N,field:N,constant:N,key:N.\n- Return: recordTargetReturn:PLAN_ID:SOURCE_ID with column:N selections.\n- Every submitted form uses one ordinary Save button; original files and CSV forms use their clearly named retention buttons.\n\nSelect original registry/source context through visible controls before data operations. Do not mutate IndexedDB or call engine methods from the page to substitute for operator actions.\n\n## Render and look at the exact product\n\nCapture and **personally inspect** useful complete states at desktop width 1440 and phone width 390. Look at the source and original-file names, registry definitions, mappings, coverage findings, observation detail, residual calculation, frozen report, target and returned-row findings, recovery history and conflict controls. Operate important controls, rather than capturing a static landing page.\n\nThe exact outgoing attachments must be opened. Open the working HTML, load the downloaded JSON through the application, inspect the complete ZIP's usable contents, open every applicable PDF page and actual spreadsheet/CSV, and reopen working files after download. Large workspace JSON is inspected through the actual app and structured record views; do not create an enormous screenshot of a megabyte of raw text.\n\nEvery original ZIP member is compared against the engine/portable selection, including binary original bytes. The readable HTML must use actual original-file links from the complete extracted folder. Report controls must be usable on the phone layout. Keep long notes and original values readable; repair clipping, stale selections, missing rows or incomplete exports in their implementation.\n\nScreenshots being saved is not the producing worker looking at them. Return actual viewable PNGs from the equipped runtime to the producing worker. Record the exact inspected files/screens and any repaired defects in the original receiving result. A callback completion receipt is a source/runtime result; visual inspection is completed only when the actual images and attachments have been opened and assessed.\n\nIf final media is used, generate natural, high-quality voice/media and watch/listen to the exact final artifact. No synthetic clinical, procurement, platform execution or live-data claim should be added to this source workflow.\n\n## Useful source-specific checks\n\nUse the actual source registry and observations. Do not collapse county and district rows into a region sum. Keep website activity distinct from physical visitors. Preserve the actual published total where a component sum differs. Keep status blanks, suppressed/missing values, exact period boundaries and method editions visible.\n\nAny authored example template or returned row is explicitly software demonstration input, kept distinct from a real target-platform return. Source facts may come from actual public reports; that does not turn an authored platform exercise into an executed vendor import.\n","API.md":"# Tourism Series Workspace API v1\nAll pure synchronous exports from services/tourism-series-workspace/engine.mjs, importing {sha256Utf8,sha256Bytes} from './sha256.mjs'. Every mutation returns {workspace,receipt,replayed}; keep workspace. Common mutation input {operationId,expectedRevision,at} where at is explicit ISO. Completed exact request replay precedes CAS; altered request with reused operationId conflicts. IDs are exact ASCII [A-Za-z0-9][A-Za-z0-9._:-]{0,127}. Opaque CSV cell identifiers are preserved verbatim.\n\ncreateWorkspace({id,title,createdAt}) -> workspace {schema,id,title,createdAt,revision,files,sources,registries,mappings,mappingHistory,corrections,analyses,reports,targetPlans,targetReturns,operations}\nimportFile(ws,{...common,id,filename,mime_type,content_base64,source_url:'',publisher:'',published_at:'',retrieved_at,representation:'original'|'authored_transcription'|'extracted_text',note:''}) -> receipt.result.fileId. ID supplied explicitly; same id different bytes/metadata rejects. All original binary bytes retained (32MiB/file).\nimportCsv(ws,{...common,id,role:'source'|'target',filename,text}) -> receipt.result.sourceId. Complete text/duplicate headers/ragged rows retained; rows are {id:sourceId+':r'+(zeroBasedIndex+2),record,cells}.\nsaveRegistry(ws,{...common,registry}) -> receipt.result.registryId. Full immutable registry exact Scout contract plus ratio_pairs and reconciliations; id cannot overwrite another edition.\nsaveMapping(ws,{...common,sourceId,registryId,columns:{canonicalField:zeroBasedColumn},constants:{canonicalField:literalString}}) -> receipt.result.mappingId. Every canonical field explicitly mapped OR constant, never both; incomplete mapping accepted and yields findings. Latest mapping per source stored in ws.mappings[sourceId], history retained.\nsaveCorrection(ws,{...common,sourceId,rowId,column,value,actor,reason}) -> receipt.result.correctionId. Attributed raw-cell overlay, no original mutation.\nproject(ws,{registryId,sourceIds}) -> {registryId,basis_sha256,rows,issues,coverage,ready}. rows {rowId,sourceId,record,rawValues,values,normalized_value,currency,valid}; missing statuses have null normalized_value.\nrunAnalysis(ws,{registryId,sourceIds,kind:'sum'|'difference'|'percentage_change'|'ratio'|'reconcile',rowIds,dimension?,partitionId?,ratioPairId?,reconciliationId?,tolerance?}) -> {kind,selection,basis_sha256,operands,result,issues,qualified,ready}. Difference uses rowIds[1]-rowIds[0]; reconcile rowIds[0] total then declared components; tolerance exact nonnegative decimal optional default0. result includes value or exact rational {numerator,denominator,display,places:6}, unit and dimensions as applicable.\nsaveAnalysis(ws,{...common,id,title,actor,note,analysis:runAnalysisOptions}) -> immutable full ws.analyses entry {id,title,actor,note,at,revision,request,result}; no mutable overwritten analysis.\nsaveReport(ws,{...common,id,title,actor,note,analysisIds}) -> immutable ws.reports entry containing complete selected frozen analyses, exact original file/source identities and basis/history head. Full sources remain in workspace/handover.\nprepareTarget(ws,{...common,id,registryId,sourceIds,rowIds,templateFileId,columns:[{column:zeroBasedTemplateColumn,field:canonicalField|'normalized_value'|'rowId'} OR {column,constant:string}],keyColumns:[zeroBasedTemplateColumn],actor,note}) -> immutable ws.targetPlans entry {id,headers,rows:[{rowId,cells}],csv,bytes,sha256,...complete mapping and source bindings}. Every template column requires explicit field/constant. Exact actual template header retained. Required keys nonblank and unique; no provider/API invocation.\nrecordTargetReturn(ws,{...common,id,planId,sourceId,columns:[{preparedColumn,returnedColumn}],actor,note}) -> immutable ws.targetReturns entry with complete exact original returned-source binding and {matched,missing,unexpected,duplicates,differences,extraColumns,ready}. sourceId selects actual role target CSV. All prepared columns mapped once to returned header indexes; extra native cells retained. Zero/missing/status/dimensions compared as exported; no cloud-ingest claim.\nvalidateWorkspace(ws) -> ws; importWorkspace(fullJsonText) -> ws; exportWorkspace(ws) -> pretty full JSON plus newline.\nbuildHandover(ws) -> {schema,workspaceId,revision,files:[{path,type,content,bytes,sha256} OR {path,type,base64,bytes,sha256}],manifest}; all original files/CSV, corrected CSV, registries, analyses/reports readable HTML+JSON, frozen target CSV/mappings/returns, complete workspace and original history. Portable safe member paths.\nrenderReport(ws,reportId?) -> complete readable HTML.\nmetadata() -> {schema,limits,fields,statuses,analysisKinds}; FIELDS exported ordered canonical field names. parseCsv/encodeCsv/decimal also exported.\nLimits32MiB each source/file;128MiB pretty UTF8 workspace;100000 rows512columns/cell1Mchars; ceilings not measured throughput.\n","CORE_OPERATING.md":"# Tourism series core and native CLI\nThis maintained package retains complete original files and source observations, applies explicit reviewed mappings, and produces qualified analyses, frozen reports and exact returned-file reconciliation. It does not invoke a tourism platform, implement cloud permissions or assert statistical confidence.\n\n## Files and units\nUse original binary files through importFile and original UTF-8 comma-separated files through importCsv. Every physical file has an explicit ID, representation, publisher/source location and complete byte identity. A factual transcription is labelled authored_transcription; it is never presented as the original PDF. Source and target CSV roles are explicit. Original headers, duplicate names, row ordering, empty cells and ragged rows remain intact.\n\nThe source CSV has the ordered fields in templates/observations.csv. Column mappings use zero-based numeric positions; a duplicate header is therefore still unambiguous. A mapping may instead provide an explicit constant. Leaving fields unmapped creates source findings. Source-local opaque identifiers are preserved literally.\n\nPublished values are exact signed ordinary decimals with up to80 whole and18 fractional digits. Multipliers1,1000 or1000000 are explicit source fields. Empty values for missing, suppressed and not_available remain null. They never become zero. Periods use actual ISO dates with half-open bounds [start,end). Keep the original displayed date/value labels in original_display and note.\n\nEach immutable registry declares exact geography ancestry, source-backed disjoint partitions, metric units/currency/population/price basis, additivity, method editions, reviewed comparability, ratio pairs and component-total relationships. New definitions need a new registry ID; existing analyses retain their original edition. Addition never silently mixes currencies, populations, methods, overlaps or incompatible metric definitions.\n\n## Native CLI\nUse a current Node runtime on the original Linux or Windows host. Mutations take a kernel-held local IPC lease keyed to the canonical workspace path. A process exit releases that lease; a competing process fails to acquire it. There is no persistent lock file to delete, alternate controller or automatic provider dispatch. Read-only inspection and exports do not mutate the workspace.\n\nCreate a workspace with a fixed original identity and timestamp:\n```sh\nnode cli.mjs init --workspace /ABS/workspace.json --id original-project --title \"Original tourism source review\" --at 2026-10-13T16:20:29Z\n```\n\nSave each intended operation in a complete JSON file:\n```json\n{\n  \"action\": \"importCsv\",\n  \"input\": {\n    \"operationId\": \"original-import-1\",\n    \"expectedRevision\": 0,\n    \"at\": \"2026-10-13T16:20:29Z\",\n    \"id\": \"original-series-1\",\n    \"role\": \"source\",\n    \"filename\": \"actual-original.csv\"\n  }\n}\n```\n\nApply using the original full CSV:\n```sh\nnode cli.mjs apply --workspace /ABS/workspace.json --request /ABS/import-request.json --file /ABS/actual-original.csv\n```\n\nFor importFile the --file bytes supply content_base64; the saved request retains its explicit original filename and all metadata. For importCsv they supply text. Both also accept complete inline bytes/text in the saved request instead of --file. If a completed exact import is replayed after staging disappears, the CLI uses its already retained original bytes and the engine checks the complete original request. If staging still exists but differs, the request digest conflicts. Do not regenerate operation IDs on a lost reply.\n\nEvery other action uses the exact input documented in API.md: saveRegistry, saveMapping, saveCorrection, saveAnalysis, saveReport, prepareTarget and recordTargetReturn. Supply the actual current expectedRevision for a new operation; preserve the original expectedRevision for a completed replay. The engine checks an existing original operation before revision comparison. A reused ID with changed fields is rejected. All mutations publish one complete workspace atomically while holding the same lease.\n\nOther native commands:\n```sh\nnode cli.mjs inspect --workspace /ABS/workspace.json\nnode cli.mjs project --workspace /ABS/workspace.json --input /ABS/selection.json --out /ABS/projected.json\nnode cli.mjs analyze --workspace /ABS/workspace.json --input /ABS/analysis-selection.json --out /ABS/analysis.json\nnode cli.mjs report --workspace /ABS/workspace.json --report saved-report-id --out /ABS/report.html\nnode cli.mjs handover --workspace /ABS/workspace.json --out /ABS/complete-handover\nnode cli.mjs receive --workspace /ABS/independent/workspace.json --input /ABS/complete-handover/workspace.json\nnode cli.mjs template --out /ABS/blank-observations.csv\n```\n\nThe selection JSON for project contains registryId and sourceIds. Analysis adds kind and ordered rowIds plus its explicit partition/dimension/pair/relationship. See API.md. All paths used by the CLI are absolute. Reports and handover members publish create-only: the same complete bytes are reused on restart; a differing edition requires a new output path. Existing independent receiving accepts only the same original history or a later saved descendant, preserving later edits.\n\n## Meaning of the five calculations\nA sum selects one declared additive dimension. Geography sums require distinct children of one declared partition, reject ancestor/descendant mixing, and identify complete coverage or a selected subset. Period sums require the same geography, nonoverlapping half-open periods and disclose gaps. Returned aggregate dimensions name the actual parent/member selection or complete period span.\n\nA difference is second operand minus first. Percentage change divides that difference by the named first operand. The two operands must share metric/unit/currency/population/price basis and differ either by nonoverlapping period in one geography or by geography in one period. Unconfirmed method-edition comparability remains visible even when the exact published difference can be calculated.\n\nRatios use a declared numerator/denominator pair and output unit. Population or price-basis exceptions require explicit flags in that source-backed pair. Exact reduced fractions remain available; the displayed value rounds half away from zero to six decimal places. Zero denominators return an undefined result and a finding.\n\nReconciliation selects a named total followed by every declared component metric once. Scope/unit/currency/method/price basis must match; differing component populations require the declared relationship. It reports components minus total, keeps all original values, and treats any chosen tolerance as a reviewer choice. An observed residual does not modify source facts.\n\n## Actual target template and returns\nImport the actual authorized native CSV header/template as an original file. prepareTarget maps every actual column to a canonical source field, normalized_value, rowId or explicit literal. Key columns are explicit, complete and unique. Duplicate headings preserve their original positions. The engine freezes the complete template identity, source operands, mapping, prepared rows, exact CSV and SHA. Later source corrections do not rewrite that export.\n\nImport the actual returned CSV with role target. recordTargetReturn names the original prepared plan and maps every prepared column to its actual returned position. It preserves all returned rows and extra native columns, reports missing/unexpected/duplicate keys and compares every mapped cell. A file comparison is not proof that a provider imported it. Actual platform execution and receipt interpretation remain with the authorized platform owner.\n\n## Full exit and receiving\nbuildHandover and the CLI preserve every original byte, original/corrected CSV, full registry editions, mapping/correction history, frozen analyses and reports, target exports and actual returned files, complete workspace and operations. Original filenames are mapped to safe complete archive paths in MANIFEST.json. Keep the folder together so the readable report's original-file links work. Open workspace.json independently, make a new attributed edit and produce a successor; the original saved report/target remains available.\n\nThe browser build adds the complete maintained application, working HTML, unfinished-value recovery and full program source. Its operating guide owns actual desktop/mobile/print and attachment receiving. Workspace history is validated by reconstructing every ordered original request's effect, not merely accepting a supplied hash.\n\nValidation ceilings:32MiB each original file/CSV;100,000 data rows/CSV;512columns;1,000,000characters/cell;128MiB pretty UTF-8 workspace. These are selection ceilings, not measured full-scale throughput. The browser recovery envelope also has its complete limit; its additional unfinished values must fit.\n\n## Source exercise and actual rendered delivery\nThe complete real178-row source-derived selection was exercised with exact public report transcriptions: declared district partition, preserved published-total residual, method-qualified year comparison and exact ratio; immutable report, duplicated target headings, full returned-column matching, extra native fields, a new correction, original-operation replay, changed-request rejection and independent full JSON/handover reopening. This is a source execution result, not a native browser or production load claim.\n\nBefore presenting the actual application, report or any attachment, the responsible producer must open/run/render that exact version, LOOK at its real screen or screenshots and use the important controls at desktop1440 and mobile390 where relevant. Open the complete ZIP's usable contents, every applicable report/PDF page and the actual downloaded/reopened files. Capturing screenshots without viewing them, source review, schemas, HTTP200 or passing checks are not substitutes. Repair visible defects and continue the substantive delivery. Use the existing cloud/native programme; do not take over an owner-reserved local browser or create another controller.\n\nOnly reusable code belongs in this public repository. Customer data, contact/account state, source-only commercial briefings and original offer files remain in their existing private source case. Platform subscriptions, licensed datasets, resale/access rights, AI permissions and any vendor import/export agreement must be explicitly settled with their owner. This local original-source workbench grants none of those rights.\n","templates/observations.csv":"observation_id,geography_id,period_start,period_end,metric_id,value,unit,multiplier,method_id,population,price_basis,source_id,source_locator,original_display,status,note\r\n","run_browser_receiving.mjs":"import fs from 'node:fs/promises';\nimport path from 'node:path';\nimport {pathToFileURL} from 'node:url';\nimport {createHash,randomUUID} from 'node:crypto';\nimport * as Engine from './engine.mjs';\nimport * as Portable from './portable.mjs';\nimport {openMigrationReceiving} from '../migration-receiving/continuation.mjs';\n\nconst sha=bytes=>createHash('sha256').update(bytes).digest('hex');\nconst need=(ok,message)=>{if(!ok)throw Error(message);};\nconst json=x=>Buffer.from(JSON.stringify(x,null,2)+'\\n');\nconst same=(a,b)=>JSON.stringify(a)===JSON.stringify(b);\nasync function regular(file){const s=await fs.lstat(file);need(s.isFile()&&!s.isSymbolicLink(),'Retain a regular original file: '+file);return fs.readFile(file);}\nasync function optional(file){try{return await regular(file);}catch(e){if(e.code==='ENOENT')return null;throw e;}}\nasync function immutable(file,body){\n const old=await optional(file);if(old){need(old.equals(body),'The retained original receiving bytes differ: '+file);return;}\n await fs.mkdir(path.dirname(file),{recursive:true});const temporary=file+'.'+randomUUID()+'.tmp';let h;\n try{h=await fs.open(temporary,'wx',0o600);await h.writeFile(body);await h.sync();await h.close();h=null;try{await fs.link(temporary,file);}catch(e){if(e.code!=='EEXIST')throw e;need((await regular(file)).equals(body),'The original selected output changed: '+file);}}\n finally{await h?.close().catch(()=>{});await fs.rm(temporary,{force:true});}\n}\nconst esc=x=>String(x).replace(/\\\\/g,'\\\\\\\\').replace(/\"/g,'\\\\\"');\nconst field=(form,name)=>form.locator('[name=\"'+esc(name)+'\"]');\nasync function fill(form,name,value){const control=field(form,name);const tag=await control.evaluate(n=>({tag:n.tagName,type:n.type}));if(tag.type==='checkbox')await control.setChecked(value===true);else if(tag.tag==='SELECT')await control.selectOption(String(value));else await control.fill(String(value));}\nasync function values(form,data){for(const [key,value]of Object.entries(data))await fill(form,key,value);}\nasync function submit(form){await form.locator('button[type=\"submit\"]').click();}\nasync function section(page,id){await page.locator('nav button[data-section=\"'+id+'\"]').click();await page.locator('nav button[data-section=\"'+id+'\"][aria-current=\"page\"]').waitFor();}\nasync function frozenSource(root,file){\n need(path.isAbsolute(root)&&path.isAbsolute(file),'Use absolute original receiving and source-workspace paths.');\n const dir=path.join(root,'attempts','selected-source'),manifest=path.join(dir,'source-selection.json'),retained=path.join(dir,'complete-original-workspace.json'),old=await optional(manifest);\n const current=await optional(file);\n let selection;\n if(old){selection=JSON.parse(old);need(selection.path===path.resolve(file),'Continue the exact original source-workspace selection.');const original=await regular(retained);need(original.length===selection.bytes&&sha(original)===selection.sha256,'The retained complete original workspace changed.');if(current)need(current.equals(original),'The original source workspace changed; preserve this run and select an explicit successor edition.');return{selection,bytes:original,retained};}\n need(current,'Select the complete original source workspace.');Engine.importWorkspace(current.toString('utf8'));selection={schema:'tjlabs.tourism-receiving-source.v1',path:path.resolve(file),bytes:current.length,sha256:sha(current)};\n // Publish original bytes before the selected identity; an interrupted first write cannot create a false complete manifest.\n await immutable(retained,current);await immutable(manifest,json(selection));return{selection,bytes:current,retained};\n}\nasync function frozenAttachments(root,paths){\n need(Array.isArray(paths)&&paths.length>=2&&paths.every(p=>typeof p==='string'&&path.isAbsolute(p))&&new Set(paths.map(p=>path.resolve(p))).size===paths.length,'Select the exact complete workshare and practical-guide attachment paths.');\n const dir=path.join(root,'attempts','selected-attachments'),manifest=path.join(dir,'attachment-selection.json'),old=await optional(manifest),resolved=paths.map(p=>path.resolve(p));\n if(old){const saved=JSON.parse(old);need(same(saved.map(x=>x.originalPath),resolved),'Continue the exact original outgoing attachment selection.');for(const item of saved){const body=await regular(item.retainedPath);need(body.length===item.bytes&&sha(body)===item.sha256,'The complete retained outgoing attachment changed.');const current=await optional(item.originalPath);if(current)need(current.equals(body),'An exact outgoing attachment changed; select a deliberate successor edition.');}return saved;}\n const saved=[];\n for(const [index,file]of resolved.entries()){const body=await regular(file),ext=path.extname(file).toLowerCase();need(['.html','.htm','.json','.csv','.txt','.md'].includes(ext),'This current four-attachment course accepts complete HTML, JSON and text; use the existing actual page viewer for an additional PDF edition.');const retainedPath=path.join(dir,'attachment-'+index+ext);await immutable(retainedPath,body);saved.push({originalPath:file,retainedPath,filename:path.basename(file),bytes:body.length,sha256:sha(body),extension:ext});}\n await immutable(manifest,json(saved));return saved;\n}\nasync function waitFileOpened(page){await page.waitForFunction(()=>{const files=[...document.querySelectorAll('main input[type=\"file\"]')];return files.length&&files.every(n=>!n.value);});await page.locator('#workspace-revision').waitFor();}\nfunction bootOf(html){const match=html.match(/(\u003cscript id=\"tourism-boot\" type=\"application\\/json\">)([\\s\\S]*?)(\u003c\\/script>)/);need(match,'Use the actual Tourism Series standalone application.');return{match,data:JSON.parse(match[2])};}\nfunction seedHTML(html,{copyId,portable}){const b=bootOf(html),record=Portable.parseRecovery(portable);record.copyId=copyId;return html.replace(b.match[0],()=>b.match[1]+Portable.safeJSON({...b.data,copyId,record})+b.match[3]);}\nconst model={id:'tourism-complete-recovery-envelope-v1',identity:r=>({id:r.workspace.id,title:r.workspace.title,createdAt:r.workspace.createdAt}),revision:r=>r.workspace.revision,operations:r=>r.workspace.operations,sequence:o=>o.revision};\nconst facade={createWorkspace:input=>Portable.recovery(Engine.createWorkspace(input)),exportWorkspace:record=>Portable.json(Portable.recovery(record.workspace,record.drafts,record.selection,record.copyId)),importWorkspace:Portable.parseRecovery};\nasync function beforeCheckpoint(page){const old=await page.locator('nav button[aria-current=\"page\"]').getAttribute('data-section');if(old!=='workspace')await section(page,'workspace');return async()=>{if(old&&old!=='workspace')await section(page,old);};}\nasync function setContext(page,registryId,sourceIds){\n await page.locator('select[name=\"registrySelection\"]').selectOption(registryId);\n const open=async()=>{const details=page.locator('details').filter({has:page.getByText('Select complete source series',{exact:true})});if(await details.getAttribute('open')===null)await details.locator('summary').click();};\n const ids=await page.locator('input[name^=\"context:\"]:checked').evaluateAll(nodes=>nodes.map(n=>n.name.slice(8)));\n for(const id of ids){await open();await page.locator('input[name=\"'+esc('context:'+id)+'\"]').uncheck();}\n for(const id of sourceIds){await open();await page.locator('input[name=\"'+esc('context:'+id)+'\"]').check();}\n}\nfunction stripped(input){const out={...input};delete out.operationId;delete out.expectedRevision;delete out.at;delete out.content_base64;delete out.text;delete out.actor;return out;}\nasync function chooseAndSubmit(page,session,fixture,operation,revision,actor,files){\n const input=operation.input,expected={kind:operation.kind,input:stripped(input)};\n return session.mutation('original-source-operation-'+operation.revision,revision,expected,async()=>{\n  await page.locator('#operator-name').fill(actor);\n  if(operation.kind==='import-file'){\n   const original=fixture.files.find(f=>f.id===operation.fileInputId);need(original,'Retain the original file for '+operation.id);\n   await section(page,'sources');const form=page.locator('form[data-action=\"importFile\"]');\n   await values(form,{id:original.id,source_url:original.source_url,publisher:original.publisher,published_at:original.published_at,retrieved_at:original.retrieved_at,representation:original.representation,note:original.note});\n   await field(form,'file').setInputFiles({name:original.filename,mimeType:original.mime_type,buffer:Buffer.from(original.content_base64,'base64')});await submit(form);\n  }else if(operation.kind==='import-csv'){\n   const source=fixture.sources.find(s=>s.id===operation.sourceInputId);need(source,'Retain the original CSV for '+operation.id);\n   await section(page,'sources');const form=page.locator('form[data-action=\"importCsv\"]');await values(form,{id:source.id,role:source.role});await field(form,'file').setInputFiles({name:source.filename,mimeType:'text/csv',buffer:Buffer.from(source.text,'utf8')});await submit(form);\n  }else if(operation.kind==='save-registry'){\n   await section(page,'registry');const form=page.locator('form[data-action=\"saveRegistry\"]');await fill(form,'registry',JSON.stringify(input.registry,null,2));await submit(form);\n  }else if(operation.kind==='save-mapping'){\n   await section(page,'mapping');await setContext(page,input.registryId,[input.sourceId]);await page.locator('select[name=\"sourceSelection\"]').selectOption(input.sourceId);\n   const form=page.locator('form[data-action=\"'+esc('saveMapping:'+input.sourceId+':'+input.registryId)+'\"]');\n   for(const name of Engine.FIELDS){const mode=Object.hasOwn(input.columns,name)?'column':Object.hasOwn(input.constants,name)?'constant':'unmapped';await fill(form,'mode:'+name,mode);if(mode==='column')await fill(form,'column:'+name,input.columns[name]);if(mode==='constant')await fill(form,'constant:'+name,input.constants[name]);}\n   await submit(form);\n  }else if(operation.kind==='save-correction'){\n   const originalMapping=fixture.mappingHistory.filter(m=>m.sourceId===input.sourceId&&m.revision\u003coperation.revision).at(-1);need(originalMapping,'Select the correction’s original registry mapping.');await section(page,'observations');await setContext(page,originalMapping.registryId,[input.sourceId]);\n   // Inspect by actual row identity; move through the visible complete row pages.\n   while(!(await page.locator('button[data-row-id=\"'+esc(input.rowId)+'\"]').count())){const next=page.getByRole('button',{name:'Next 50',exact:true});need(await next.isEnabled(),'The original correction row is absent from the complete projected source.');await next.click();}\n   await page.locator('button[data-row-id=\"'+esc(input.rowId)+'\"]').click();const form=page.locator('form[data-action=\"'+esc('saveCorrection:'+input.rowId)+'\"]');await values(form,{column:input.column,value:input.value,reason:input.reason});await submit(form);\n  }else if(operation.kind==='save-analysis'){\n   await section(page,'analyses');await setContext(page,input.analysis.registryId,input.analysis.sourceIds);const form=page.locator('form[data-action=\"'+esc('saveAnalysis:'+input.analysis.registryId)+'\"]');\n   await values(form,{id:input.id,title:input.title,note:input.note,kind:input.analysis.kind,rowIds:input.analysis.rowIds.join('\\n'),dimension:input.analysis.dimension||'',partitionId:input.analysis.partitionId||'',ratioPairId:input.analysis.ratioPairId||'',reconciliationId:input.analysis.reconciliationId||'',tolerance:input.analysis.tolerance??''});\n   await page.locator('#analysis-preview-button').click();await page.locator('#analysis-preview .metric').waitFor();await submit(form);\n  }else if(operation.kind==='save-report'){\n   await section(page,'reports');const form=page.locator('form[data-action=\"saveReport\"]');await values(form,{id:input.id,title:input.title,note:input.note});for(const id of input.analysisIds)await fill(form,'analysis:'+id,true);await submit(form);\n  }else if(operation.kind==='prepare-target'){\n   await section(page,'target');await setContext(page,input.registryId,input.sourceIds);await page.locator('select[name=\"templateSelection\"]').selectOption(input.templateFileId);const form=page.locator('form[data-action=\"'+esc('prepareTarget:'+input.templateFileId+':'+input.registryId)+'\"]');\n   await values(form,{id:input.id,rowIds:input.rowIds.join('\\n'),note:input.note});for(const c of input.columns){await fill(form,'kind:'+c.column,Object.hasOwn(c,'field')?'field':'constant');await fill(form,(Object.hasOwn(c,'field')?'field:':'constant:')+c.column,c.field??c.constant);}for(const column of input.keyColumns)await fill(form,'key:'+column,true);await submit(form);\n  }else if(operation.kind==='record-target-return'){\n   await section(page,'target');await page.locator('select[name=\"planSelection\"]').selectOption(input.planId);await page.locator('select[name=\"returnedSelection\"]').selectOption(input.sourceId);const form=page.locator('form[data-action=\"'+esc('recordTargetReturn:'+input.planId+':'+input.sourceId)+'\"]');await values(form,{id:input.id,note:input.note});for(const c of input.columns)await fill(form,'column:'+c.preparedColumn,c.returnedColumn);await submit(form);\n  }else throw Error('The selected source course contains an unsupported native action: '+operation.kind);\n });\n}\nasync function download(page,locator,file){const waiting=page.waitForEvent('download');await locator.click();const d=await waiting;await d.saveAs(file);const bytes=await regular(file);return{path:file,name:d.suggestedFilename(),bytes:bytes.length,sha256:sha(bytes)};}\nasync function capture(page,dir,name,screens,{fullPage=true}={}){for(const width of [1440,390]){await page.setViewportSize({width,height:1000});const file=path.join(dir,name+'-'+width+'.png');await page.screenshot({path:file,fullPage});screens.push(file);}}\nfunction zipMembers(bytes){\n const map=new Map();let p=0;\n while(p+4\u003c=bytes.length&&bytes.readUInt32LE(p)===0x04034b50){need(p+30\u003c=bytes.length&&bytes.readUInt16LE(p+8)===0,'Open the complete stored ZIP generated by the actual application.');const size=bytes.readUInt32LE(p+18),n=bytes.readUInt16LE(p+26),extra=bytes.readUInt16LE(p+28),name=bytes.subarray(p+30,p+30+n).toString('utf8'),start=p+30+n+extra;need(start+size\u003c=bytes.length&&!map.has(name),'Retain every complete distinct ZIP member.');map.set(name,bytes.subarray(start,start+size));p=start+size;}\n need(map.size&&bytes.readUInt32LE(p)===0x02014b50,'Open the complete ZIP directory.');return map;\n}\nasync function verifyHandover(bytes,source,record){\n const members=zipMembers(bytes),expected=Portable.completeFiles(source,record);need(members.size===expected.length,'The complete ZIP member count differs from the selected delivery.');\n for(const f of expected){const body=f.base64===undefined?Buffer.from(f.content,'utf8'):Buffer.from(f.base64,'base64');need(members.get(f.path)?.equals(body),'The exact complete ZIP member differs: '+f.path);}\n return members;\n}\nexport async function runTourismReceiving({page,context,outputDirectory,applicationPath,sourceWorkspacePath,attachmentPaths}){\n await page.setViewportSize({width:1440,height:1000});\n const attachments=await frozenAttachments(outputDirectory,attachmentPaths);\n const frozen=await frozenSource(outputDirectory,sourceWorkspacePath),fixture=Engine.importWorkspace(frozen.bytes.toString('utf8')),actor='Original tourism receiving operator';\n const session=await openMigrationReceiving({page,outputDirectory,applicationPath,engine:facade,title:'Tourism Series complete source receiving',resultFilename:'tourism-receiving-result.json',workspaceModel:model,browserControls:{ready:'#workspace-revision',workspaceDownload:'#top-json',seedHTML,beforeCheckpoint}});\n if(session.completed)return session.completed;\n const outputs=[],screens=[],errors=[];const listen=error=>errors.push(error.message);page.on('pageerror',listen);\n try{\n  const app=await regular(applicationPath);need(app.length===session.intent.application.bytes&&sha(app)===session.intent.application.sha256,'The original application changed after its receiving intent was pinned.');const source=bootOf(app.toString('utf8')).data.source;\n  const exactOutgoing=await session.phase('open-exact-outgoing-attachments',async()=>{\n   const fresh=await context.browser().newContext({acceptDownloads:true,viewport:{width:1440,height:1000}}),view=await fresh.newPage();view.on('pageerror',listen);\n   try{\n    const directory=path.join(session.attempt,'exact-outgoing');await fs.mkdir(directory,{recursive:true});\n    const actual=path.join(directory,'Tourism_Series_Workspace.html');await immutable(actual,app);await view.goto(pathToFileURL(actual).href);\n    if(bootOf(app.toString('utf8')).data.record)await view.locator('#workspace-revision').waitFor();else await view.locator('#create-workspace').waitFor();\n    await capture(view,directory,'actual-outgoing-application',scree
