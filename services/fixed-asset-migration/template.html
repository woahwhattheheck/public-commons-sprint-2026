<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fixed asset migration and exit workspace</title><style>__STYLES__</style></head>
<body><div id="app"><p>Opening complete migration workspace…</p></div><noscript>Enable JavaScript to operate the migration workspace. Complete input files remain on your computer.</noscript>
<script id="bootstrap" type="application/json">__BOOTSTRAP__</script>
<script type="module">
const data=JSON.parse(document.querySelector('#bootstrap').textContent);
const shaURL=URL.createObjectURL(new Blob([data.shaSource],{type:'text/javascript'}));
const marker="import {sha256Utf8,sha256Bytes} from './sha256.mjs';";
if(!data.engineSource.startsWith(marker))throw new Error('The bundled engine dependency differs.');
const engineSource=data.engineSource.replace(marker,'import {sha256Utf8,sha256Bytes} from '+JSON.stringify(shaURL)+';');
const engineURL=URL.createObjectURL(new Blob([engineSource],{type:'text/javascript'}));
const appURL=URL.createObjectURL(new Blob([data.appSource],{type:'text/javascript'}));
const issuerURL=URL.createObjectURL(new Blob([data.issuerSource],{type:'text/javascript'}));
const issuerUIURL=URL.createObjectURL(new Blob([data.issuerUISource],{type:'text/javascript'}));
let workOrderURL=null,workOrderUIURL=null,applicationSourceURL=null;
const preparationURLs=[];let assetCrosswalkURL=null;
try{
const [engine,app,sha,issuer,issuerUI]=await Promise.all([import(engineURL),import(appURL),import(shaURL),import(issuerURL),import(issuerUIURL)]);
let extensions=null;
if(data.workOrderSource&&data.workOrderUISource){
const source=data.workOrderSource.replace("import * as E from './engine.mjs';",'import * as E from '+JSON.stringify(engineURL)+';').replace("import {sha256Utf8} from './sha256.mjs';",'import {sha256Utf8} from '+JSON.stringify(shaURL)+';');
workOrderURL=URL.createObjectURL(new Blob([source],{type:'text/javascript'}));
workOrderUIURL=URL.createObjectURL(new Blob([data.workOrderUISource],{type:'text/javascript'}));
const [workOrders,ui]=await Promise.all([import(workOrderURL),import(workOrderUIURL)]);
extensions={workOrders,createWorkOrderPanel:ui.createWorkOrderPanel};
}
if(data.masterPreparationSource&&data.workOrderPreparationSource&&data.sourcePreparationUISource){
const remap=source=>source.replace("from '../../engine.mjs'","from "+JSON.stringify(engineURL)).replace("from '../../sha256.mjs'","from "+JSON.stringify(shaURL));
for(const source of [remap(data.masterPreparationSource),remap(data.workOrderPreparationSource),data.sourcePreparationUISource])preparationURLs.push(URL.createObjectURL(new Blob([source],{type:'text/javascript'})));
const [master,orders,ui]=await Promise.all(preparationURLs.map(url=>import(url)));
extensions={...extensions,sourcePreparation:{prepareMasterCapture:master.prepareMasterCapture,prepareWorkOrderCapture:orders.prepareWorkOrderCapture,sha256Utf8:sha.sha256Utf8},createSourcePreparationPanel:ui.createSourcePreparationPanel};
}
if(data.assetCrosswalkSource&&data.assetCrosswalkUISource){
const source=data.assetCrosswalkSource.replace("import * as E from './engine.mjs';",'import * as E from '+JSON.stringify(engineURL)+';').replace("import {sha256Utf8} from './sha256.mjs';",'import {sha256Utf8} from '+JSON.stringify(shaURL)+';');
const urls=[source,data.assetCrosswalkUISource].map(text=>URL.createObjectURL(new Blob([text],{type:'text/javascript'})));preparationURLs.push(...urls);
assetCrosswalkURL=urls[0];
const [assetCrosswalk,ui]=await Promise.all(urls.map(url=>import(url)));
extensions={...extensions,assetCrosswalk,createAssetCrosswalkPanel:ui.createAssetCrosswalkPanel};
}
if(data.migrationRehearsalsSource&&data.migrationRehearsalsUISource){
if(!workOrderURL||!assetCrosswalkURL)throw new Error('Retain the original work-order and crosswalk engines for rehearsal observations.');
const source=data.migrationRehearsalsSource.replace("from './engine.mjs'","from "+JSON.stringify(engineURL)).replace("from './work-orders.mjs'","from "+JSON.stringify(workOrderURL)).replace("from './asset-crosswalk.mjs'","from "+JSON.stringify(assetCrosswalkURL)).replace("from './sha256.mjs'","from "+JSON.stringify(shaURL));
const urls=[source,data.migrationRehearsalsUISource].map(text=>URL.createObjectURL(new Blob([text],{type:'text/javascript'})));preparationURLs.push(...urls);
const [migrationRehearsals,ui]=await Promise.all(urls.map(url=>import(url)));
extensions={...extensions,migrationRehearsals,createRehearsalPanel:ui.createRehearsalPanel};
}
if(data.applicationSourceModule){
applicationSourceURL=URL.createObjectURL(new Blob([data.applicationSourceModule],{type:'text/javascript'}));
const source=await import(applicationSourceURL),applicationSource=source.createApplicationSource(sha);
applicationSource.assertRuntime(data.applicationSource,data);
extensions={...extensions,applicationSource};
}
await app.mountFixedAssetWorkspace(engine,data,issuer.createIssuerAnnex(engine,sha),issuerUI.createIssuerUI,extensions);
}catch(error){document.querySelector('#app').textContent='Unable to open this complete workspace: '+error.message;}
finally{for(const url of preparationURLs)URL.revokeObjectURL(url);if(applicationSourceURL)URL.revokeObjectURL(applicationSourceURL);if(workOrderURL)URL.revokeObjectURL(workOrderURL);if(workOrderUIURL)URL.revokeObjectURL(workOrderUIURL);URL.revokeObjectURL(engineURL);URL.revokeObjectURL(appURL);URL.revokeObjectURL(shaURL);URL.revokeObjectURL(issuerURL);URL.revokeObjectURL(issuerUIURL);}
</script></body></html>
