+'\" value=\"'+esc(model[key])+'\">\u003c/label>').join('')+'\u003c/div>\u003clabel>Review reason and source scope\u003ctextarea data-policy=\"note\" rows=\"4\">'+esc(model.note)+'\u003c/textarea>\u003c/label>';\n html+='\u003cdiv class=\"attestations\">\u003clabel>\u003cinput type=\"checkbox\" data-policy=\"event_scope_complete\" '+(model.event_scope_complete?'checked':'')+'> I confirm the selected events contain every signed movement for this company, book, currency and period, after the opening date through the closing date.\u003c/label>\u003clabel>\u003cinput type=\"checkbox\" data-policy=\"population_complete\" '+(model.population_complete?'checked':'')+'> I confirm the selected balance population is complete for comparison with its independent control totals.\u003c/label>\u003c/div>';\n html+='\u003clabel>Measures to reconcile from opening balances and movements\u003ctextarea id=\"policy-measures\" rows=\"4\" spellcheck=\"false\">'+esc(model.rollforward_measures.join('\\n'))+'\u003c/textarea>\u003c/label>\u003cp class=\"muted\">Enter one exact source-defined measure per line. No sign, accounting category or missing balance is inferred. Opening + signed movements after opening and on or before closing is compared with the recorded closing balance.\u003c/p>';\n html+='\u003ch3>Explicit carrying equations\u003c/h3>\u003cp>Add only equations supported by the selected book’s accounting basis. Choose each component and its sign explicitly; separate impairment is included only when the recorded basis requires it.\u003c/p>';\n for(const [index,equation]of model.carrying_equations.entries()){\n html+='\u003cdiv class=\"panel equation\">\u003cdiv class=\"toolbar\">\u003clabel>Recorded result measure\u003cinput data-equation=\"'+index+'\" data-equation-field=\"result_measure\" value=\"'+esc(equation.result_measure)+'\">\u003c/label>\u003cbutton data-remove-equation=\"'+index+'\">Remove equation\u003c/button>\u003c/div>';\n html+=equation.components.map((part,j)=>'\u003cdiv class=\"toolbar\">\u003clabel>Sign\u003cselect data-equation=\"'+index+'\" data-component=\"'+j+'\" data-component-field=\"coefficient\">'+options([['1','Add (+)'],['-1','Subtract (−)']],String(part.coefficient))+'\u003c/select>\u003c/label>\u003clabel>Exact component measure\u003cinput data-equation=\"'+index+'\" data-component=\"'+j+'\" data-component-field=\"measure\" value=\"'+esc(part.measure)+'\">\u003c/label>\u003cbutton data-remove-component=\"'+index+':'+j+'\">Remove component\u003c/button>\u003c/div>').join('');\n html+='\u003cbutton data-add-component=\"'+index+'\">Add component\u003c/button>\u003c/div>';\n }\n html+='\u003cdiv class=\"toolbar\">'+button('add-equation','Add explicit equation')+'\u003c/div>\u003clabel class=\"confirm\">\u003cinput type=\"checkbox\" id=\"confirm-policy\"> I have reviewed the current source selection and this exact financial basis.\u003c/label>\u003cdiv class=\"toolbar\">'+button('save-policy','Save reviewed financial basis')+button('download-policy-draft','Download this complete review draft')+'\u003c/div>\u003cp class=\"muted\">Editing any review field clears the confirmation. Unfinished entries remain in the saved working HTML. Source changes are always checked again by the engine.\u003c/p>\u003c/section>';\n return html;\n}\nfunction wirePolicy(){\n const chooser=$('#policy-select');if(chooser)chooser.onchange=()=>{policySelected=chooser.value;render();};\n wire('new-policy',newPolicy);\n const model=policyFormModel();if(!model)return;\n const retain=()=>{drafts.policies[model.id]=copy(model);dirty=true;const confirm=$('#confirm-policy');if(confirm)confirm.checked=false;};\n document.querySelectorAll('[data-policy]').forEach(n=>n.addEventListener('input',()=>{model[n.dataset.policy]=n.type==='checkbox'?n.checked:n.value;retain();}));\n const measures=$('#policy-measures');if(measures)measures.oninput=()=>{model.rollforward_measures=measures.value.split('\\n').filter(x=>x.length);retain();};\n document.querySelectorAll('[data-equation-field]').forEach(n=>n.oninput=()=>{model.carrying_equations[Number(n.dataset.equation)][n.dataset.equationField]=n.value;retain();});\n document.querySelectorAll('[data-component-field]').forEach(n=>n.addEventListener('input',()=>{const part=model.carrying_equations[Number(n.dataset.equation)].components[Number(n.dataset.component)];part[n.dataset.componentField]=n.dataset.componentField==='coefficient'?Number(n.value):n.value;retain();}));\n wire('add-equation',()=>{model.carrying_equations.push({result_measure:'',components:[{measure:'',coefficient:1}]});retain();render();});\n document.querySelectorAll('[data-remove-equation]').forEach(n=>n.onclick=()=>{model.carrying_equations.splice(Number(n.dataset.removeEquation),1);retain();render();});\n document.querySelectorAll('[data-add-component]').forEach(n=>n.onclick=()=>{model.carrying_equations[Number(n.dataset.addComponent)].components.push({measure:'',coefficient:1});retain();render();});\n document.querySelectorAll('[data-remove-component]').forEach(n=>n.onclick=()=>{const [i,j]=n.dataset.removeComponent.split(':').map(Number);model.carrying_equations[i].components.splice(j,1);retain();render();});\n wire('download-policy-draft',()=>download('financial-review-'+model.id+'-draft.json',JSON.stringify({schema:'tjlabs.fixed-asset-financial-review-draft.v1',workspaceId:ws.id,revision:ws.revision,basis_sha256:E.financeBasis(ws),policy:model},null,2)));\n wire('save-policy',async()=>{if(!$('#confirm-policy').checked)throw new Error('Review and confirm the current financial basis before saving.');const policy=copy(model);for(const key of ['basis_sha256','revision','at'])delete policy[key];await change(meta=>E.saveFinancePolicy(ws,{...meta,at:now(),policy}),submittedDrafts([['policies',model.id]]));});\n}\nfunction renderFinanceSchedules(){\n const f=report?.financial;if(!f)return '';\n const labels={rollforwards:'Opening balances and movements',controls:'Independent control totals',equations:'Explicit c .value;financePage=0;render();};\n wire('finance-prev',()=>{financePage=Math.max(0,financePage-1);render();});\n wire('finance-next',()=>{financePage++;render();});\n}\nfunction bytesToBase64(bytes){\n let text='';for(let at=0;at\u003cbytes.length;at+=16384)text+=String.fromCharCode(...bytes.subarray(at,at+16384));return btoa(text);\n}\nfunction base64ToBytes(value){\n const text=atob(value),bytes=new Uint8Array(text.length);for(let i=0;i\u003ctext.length;i++)bytes[i]=text.charCodeAt(i);return bytes;\n}\nfunction renderSupporting(){\n const files=ws.supportingFiles||[];\n return '\u003csection class=\"panel\">\u003ch2>Complete exit files\u003c/h2>\u003cp>Retain the original metadata, audit exports, data dictionaries, configuration and supporting documents alongside the financial records. These files are preserved byte-for-byte and travel with the complete editable handover.\u003c/p>\u003cp>Keep original XLSX files here. Import their explicitly prepared CSV exports under Source files for tabular comparison, and identify the corresponding workbook and sheet in the purpose below.\u003c/p>\u003cdiv class=\"fields\">\u003clabel>Original file\u003cinput type=\"file\" id=\"supporting-file\">\u003c/label>\u003clabel>Purpose and source relationship\u003ctextarea id=\"supporting-purpose\" rows=\"4\">'+esc(drafts.supportingPurpose||'')+'\u003c/textarea>\u003c/label>\u003c/div>'+button('receive-supporting','Retain complete original file')+'\u003cp class=\"muted\">The original format remains unchanged. Open retained documents with their appropriate application when reviewing the exit package. This workspace does not execute imported documents.\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>'+files.length+' complete supporting files\u003c/h3>'+table(['Original file','Purpose','Bytes / SHA-256','Download'],files.map((file,index)=>[\n esc(file.filename)+'\u003cbr>\u003cspan class=\"muted\">'+esc(file.mimeType||file.type||'application/octet-stream')+'\u003c/span>',esc(file.purpose),esc(file.bytes)+'\u003cbr>\u003cspan class=\"id\">'+esc(file.sha256)+'\u003c/span>','\u003cbutton data-supporting=\"'+index+'\">Download original\u003c/button>'\n ]))+'\u003c/section>';\n}\nfunction wireSupporting(){\n const purpose=$('#supporting-purpose');if(purpose)purpose.oninput=()=>{drafts.supportingPurpose=purpose.value;dirty=true;};\n wire('receive-supporting',async()=>{\n const file=$('#supporting-file').files[0],purpose=$('#supporting-purpose').value;\n if(!file)throw new Error('Choose the complete original supporting file.');\n if(!purpose.trim())throw new Error('Describe this file’s purpose and relationship to the financial records.');\n if(file.size>E.LIMITS.csvBytes)throw new Error('This file exceeds the supported per-file input size. Preserve the complete original in the source programme.');\n const bytes=new Uint8Array(await file.arrayBuffer()),base64=bytesToBase64(bytes);\n await change(meta=>E.importSupportingFile(ws,{...meta,at:now(),filename:file.name,mimeType:file.type||'application/octet-stream',purpose,base64}),{...copy(drafts),supportingPurpose:''});\n });\n document.querySelectorAll('[data-supporting]').forEach(n=>n.onclick=()=>{\n const f=ws.supportingFiles[Number(n.dataset.supporting)];\n download(f.filename,new Blob([base64ToBytes(f.base64)],{type:f.mimeType||'application/octet-stream'}),f.mimeType||'application/octet-stream');\n });\n}\nfunction renderSources(){\nconst src=selectedSource();if(src)selected=src.id;const list=ws.sources.filter(s=>s.role===role&&s.domain===domain);\nlet html=selectors()+'\u003csection class=\"panel\">\u003ch2>Receive original files\u003c/h2>\u003cp>Keep each source export and returned target export as a separate edition. Select a UTF-8 CSV file; its original text, duplicate column headings and all cells are retained.\u003c/p>\u003cdiv class=\"toolbar\">\u003clabel>CSV file\u003cinput type=\"file\" id=\"csv\" accept=\".csv,text/csv\">\u003c/label>'+button('import-csv','Import complete CSV')+but LowerCase().includes(query.toLowerCase())));const pages=Math.max(1,Math.ceil(filtered.length/50));issuePage=Math.min(issuePage,pages-1);\nlet html=renderFinanceSchedules()+'\u003csection class=\"panel\">\u003cdiv class=\"heading\">\u003ch2>Revision '+esc(report.revision)+' reconciliation\u003c/h2>\u003cstrong>'+ (report.ready?'Reconciled under selected mappings':'Review findings')+'\u003c/strong>\u003c/div>\u003cp>'+all.length+' findings across the complete selected source and target. Review unmapped columns and the actual target import result before operational acceptance.\u003c/p>\u003cdiv class=\"toolbar\">'+button('run-report','Refresh reconciliation')+button('report-json','Download report JSON')+button('report-html','Download full readable report')+'\u003clabel>Dataset\u003cselect id=\"report-domain\">'+options([['all','All datasets'],...Object.entries(E.DOMAINS).map(([k,v])=>[k,v.label])],domain)+'\u003c/select>\u003c/label>\u003clabel>Search findings\u003cinput id=\"issue-search\" type=\"search\" value=\"'+esc(query)+'\">\u003c/label>\u003c/div>';\nhtml+=table(['Severity','Dataset / role','Finding','Record / field','Details'],filtered.slice(issuePage*50,issuePage*50+50).map(i=>[esc(i.severity),esc(i.domain)+'\u003cbr>'+esc(i.role),'\u003cstrong>'+esc(i.code)+'\u003c/strong>\u003cbr>'+esc(i.message),'\u003cspan class=\"id\">'+esc(i.rowId||'')+'\u003c/span>\u003cbr>'+esc(i.field||'')+(i.sourceId?'\u003cbr>\u003cbutton data-finding=\"'+esc(i.id)+'\">Open source record\u003c/button>':''),'\u003cdetails>\u003csummary>Full finding\u003c/summary>\u003cpre>'+esc(JSON.stringify(i,null,2))+'\u003c/pre>\u003c/details>']))+'\u003cdiv class=\"toolbar\">'+button('issue-prev','Previous')+'\u003cspan>'+filtered.length+' findings · page '+(issuePage+1)+' of '+pages+'\u003c/span>'+button('issue-next','Next')+'\u003c/div>\u003c/section>';\nfor(const r of ['source','target'])for(const [d,selection]of Object.entries(report.domains[r]||{})){if(domain!=='all'&&domain!==d)continue;h ll12 class/measure rows, four printed totals, opening/increase/decrease/closing values and three source discrepancies are retained in JSON. Annual movements remain annual summary columns; no artificial transaction dates or journals are created.\n\nThe separate statement of net position differs from Note4 by +USD1 for buildings and −USD1 for improvements. Its depreciation/amortization expense is USD1 below the Note4 movement total. Keep these displayed as source reconciliation items. Never silently round the source or call the aggregate reference a completed customer migration.\n\nNote1 printed34–35 defines the capital thresholds and straight-line policy. Normal maintenance is expensed. The complete work-order workflow therefore keeps maintenance cost allocation separate from financial capitalization and FA/GL reconciliation; actual authorized exports determine that joining work.\n\nFor a real installation, receive complete original asset/book/FA/GL/event/control exports and the actual returned target files into their own workspace identity. Keep the published class reference as a separate selected source scope.\n","bytes":1930,"sha256":"cbfc348759f1968c0b256499792e65cfe45db3a2539ddd4c4e6d3c18edf824c2"},{"path":"services/fixed-asset-migration/examples/port-bellingham-2025/assets.csv","type":"text/csv;charset=utf-8","text":"company_id,asset_id,parent_asset_id,class_code,description\r\nPORT-PUBLISHED-2025,PUBCLASS-land,,land,Land — published class aggregate\r\nPORT-PUBLISHED-2025,PUBCLASS-construction,,construction,Construction in progress — published class aggregate\r\nPORT-PUBLISHED-2025,PUBCLASS-buildings,,buildings,Buildings and Structures — published class aggregate\r\nPORT-PUBLISHED-2025,PUBCLASS-intangibles,,intangibles,Intangible Assets — published class aggregate\r\nPORT-PUBLISHED-2025,PUBCLASS-improvements,,improvements,Improvements/Infrastructure — published class aggregate\r\nPORT-PUBLISHED-2025,PUBCLASS-equipment,,equipment,Machinery and Equipment — publis t cells in the published additive capital table are represented as zero for that table's arithmetic, with their meaning limited to the reported aggregate.\",\n    \"The exact Note4 amounts are retained; the separate one-dollar statement differences remain visible.\",\n    \"Reporting-class IDs are local reference keys prefixed PUBCLASS in generated files; they are never represented as the Port's private asset IDs.\",\n    \"Annual increases and decreases are retained as annual summary columns. No private journal entries, transaction dates, asset master or target system return is fabricated.\"\n  ]\n}\n","bytes":5653,"sha256":"27db336bc62c368ded42998bdf593554e6580cafb75b70dd5db3bcf3f2053cd6"},{"path":"services/fixed-asset-migration/integrations/business-central/FIELD_MAPPING.csv","type":"text/csv;charset=utf-8","text":"area,canonical_field,native_origin,identity_or_value_rule,source_ids\r\nasset master,company_id,selected native company GUID + reviewed canonicalCompanyId,Retain both identities; do not infer a legal company from dimension/division,MS-FA;DYN-ASSETS\r\nfinancial asset master,asset_id,fixedAssets.number,Literal business number; native fixedAssets.id remains crosswalk GUID,MS-FA\r\nfinancial asset master,description,fixedAssets.displayName,Retain original text without trim or normalization,MS-FA\r\nfinancial asset master,class_code,fixedAssets.classCode,Retain original code; additional subclass stays in raw source,MS-FA\r\nmaintenance master,asset_id,assets.assetNo,Separate identity population; do not replace financial fixed-asset number,DYN-ASSETS\r\nmaintenance master,parent_asset_id,assets.parentAssetNo,Literal same-company parent; original engine checks references and cycles,DYN-ASSETS\r\nmaintenance master,class_code,assets.categoryCode,Maintenance classification only; not inferred financial class,DYN-ASSETS\r\nmaintenance financial link,fixed_asset_id,assets.fixedAssetNumber,Explicit link; several maintenance records can point to one financial asset,DYN-ASSETS\r\nbooks,book_id;currency;accounting_basis,actual selected depreciation-book export and company LCY,No book or currency invented from master card or cost name,MS-FA-SETUP\r\nbalances,as_of;measure;amount,actual selected native opening/closing book export,Exact decimal strings with explicit measure/scale/company/book/currency,MS-FA-SETUP\r\nevents,event_id;effective_date;signed_amount,actual complete fixed-asset movement export,Native event identity and original sign; no synthetic posted event from master data,MS-FA-SETUP\r\njournals,journal_id;line_id;debit;credit,actual fixed-asset/G/L export selected for book integration,Original posting IDs and nonnegative debit/credit columns,MS-FA-SETUP\r\ncontrols,as_of;measure;amount;source_reference,actual independent book/control source,Retain complete control source and units; not a sum fabricated from prepared target,MS-FA-SETUP\r\nwork-order line,work_order_id,line.documentId with actual workOrders native ID crosswalk,Preserve header identity; do not use ledger planNo,DYN-RESOURCES;DYN-ITEMS;DYN-EXPENSES;DYN-LEDGER\r\nwork-order line,line_id;native_record_id,line.id,Native line GUID within selected company/header; sequence is not the record ID,DYN-RESOURCES;DYN-ITEMS;DYN-EXPENSES\r\nwork-order line,line_kind,selected resource/item/expense collection,Retain selected native kind; do not infer it from a description,DYN-RESOURCES;DYN-ITEMS;DYN-EXPENSES\r\nwork-order line,native_document_id,line.documentId,Retain original document ID even when canonical order key is a business number,DYN-RESOURCES;DYN-ITEMS;DYN-EXPENSES\r\nwork-order line,quantity;unit_code,quantity;unitOfMeasureCode with qtyToConsume/qtyConsumed separately,Each quantity state is distinct; no expected-versus-consumed substitution,DYN-RESOURCES;DYN-ITEMS;DYN-EXPENSES\r\nexpense expectation,cost_amount;cost_basis;currency,expectedUnitCostLCY or explicit expected line cost source,Expected unit and line amounts differ; LCY requires actual selected company currency,DYN-EXPENSES;DYN-LEDGER\r\nposted expense,cost_amount;cost_basis;currency,expenseActualLineCostLCY + actual company LCY,Actual line amount only; missing costs remain missing,DYN-LEDGER\r\nposted ledger,native_record_id;posting_date,woLedgerEntries.id;postingDate,Entry identity distinct from a work-order line or plan number,DYN-LEDGER\r\nposted ledger,fixed_asset_id,woLedgerEntries.fixedAssetNo,Financial fixed-asset business number; preserve literal native value,DYN-LEDGER\r\nwork-order context,project_id;project_task_id,actual supported project/task export or reviewed mapping,The documented sample is not proof of target JSON field names or project flags,DYN-PROJECTS\r\nwork-order context,dimension_set_id,actual selected dimension export and configuration,Retain native dimension identities/values/priorities; no allocation implied,DYN-DIMENSIONS\r\nsource record,source_reference,original filename/page + exact row/index + capture hash,Stable source locator; preserve full original instead of an abbreviated result,MS-PAGING;DYN-LEDGER\r\ntarget match,reviewed bridge IDs / explicit match,actual returned target row native identity,\"One actual returned row once; no heuristic pairing by amount, name or sequence\",MS-FA;DYN-LEDGER\r\n","bytes":4373,"sha256":"fc2bf81b899a2e3d7d52b15c8a8fac95d5416acbbc52d123351849402bd81a89"},{"path":"services/fixed-asset-migration/integrations/business-central/MICROSOFT_CONTEXT_CONTRACT.json","type":"application/json","text":"{\n  \"schema\": \"tjlabs.business-central-microsoft-context-contract.v1\",\n  \"edition\": \"2026-10-13\",\n  \"purpose\": \"Configure original source acquisition and review for prepare-master.mjs, prepare-work-orders.mjs and the existing six-domain/work-order migration engine. This file performs no network request or posting.\",\n  \"sourceIndex\": \"MICROSOFT_SOURCE_INDEX.json\",\n  \"originalInterfaces\": {\n    \"master\": \"prepareMasterCapture(capture)\",\n    \"workOrders\": \"prepareWorkOrderCapture(capture)\",\n    \"workOrderSchema\": \"tjlabs.business-central-work-order-capture.v1\",\n    \"financialDomains\": [\n      \"assets\",\n      \"books\",\n      \"balances\",\n      \"events\",\n      \"journals\",\n      \"controls\"\n    ],\n    \"workOrderModule\": \"prepare-work-orders.mjs\",\n    \"workOrderOperatingGuide\": \"WORK_ORDER_SOURCE.md\"\n  },\n  \"deploymentSelection\": {\n    \"tenantId\": null,\n    \"environment\": null,\n    \"apiRoot\": null,\n    \"companyId\": null,\n    \"canonicalCompanyId\": null,\n    \"companyName\": null,\n    \"companySystemVersion\": null,\n    \"dynawayVersion\": null,\n    \"metadataSourceReference\": null\n  },\n  \"unconfiguredMeaning\": \"Null selections are deliberately unconfigured. Use actual authorized environment/company and retained installed metadata; never use documentation example IDs.\",\n  \"companyContext\": {\n    \"requiredWhen\": \"selection.expenseLineCostField selects an LCY line amount\",\n    \"acceptedResource\": \"generalLedgerSetup\",\n    \"uriTemplate\": \"/api/v2.0/companies({companyId})/generalLedgerSetup({setupId})\",\n    \"responseShape\": \"single object\",\n    \"captureFields\": {\n      \"url\": \"exact credential-free original HTTPS GET URL\",\n      \"status\": 200,\n      \"bodyText\": \"complete original UTF-8 response text\",\n      \"sha256\": \"optional expected SHA-256 of bodyText\"\n    },\n    \"bindings\": [\n      {\n        \"selection\": \"companyId\",\n        \"source\": \"company GUID in original response request path\",\n        \"rule\": \"same actual company as the selected Dynaway response\"\n      },\n      {\n        \"selection\": \"setupId\",\n        \"sourcePointer\": \"/id\",\n        \"rule\": \"native response GUID equals setup GUID in request URI\"\n      },\n      {\n        \"selection\": \"selection.lcyCode\",\n        \"sourcePointer\": \"/localCurrencyCode\",\n        \"rule\": \"exact original code; must also satisfy the current engine's three-uppercase-letter currency constraint\"\n      },\n      {\n        \"selection\": \"selection.lcySourceReference\",\n        \"source\": \"retained actual response descriptor and /localCurrencyCode\",\n        \"rule\": \"retain reviewer reference plus computed response bytes/SHA/pointer; a free-text code alone is insufficient\"\n      }\n    ],\n    \"retainedFile\": \"originals/general-ledger-setup.json\",\n    \"excludedInferences\": [\n      \"currency symbol\",\n      \"company display name\",\n      \"assumed country currency\",\n      \"companyInformation.currencyCode without accounting setup\",\n      \"documentation example currency\"\n    ],\n    \"sources\": [\n      \"MS-GLSETUP\",\n      \"MS-GLSETUP-GET\",\n      \"MS-CURRENCY-BASIS\"\n    ]\n  },\n  \"readPlan\": [\n    {\n      \"resource\": \"company\",\n      \"uriTemplate\": \"/api/v2.0/companies({companyId})\",\n      \"fields\": [\n        \"id\",\n        \"name\",\n        \"displayName\",\n        \"systemVersion\",\n        \"timestamp\",\n        \"systemCreatedAt\",\n        \"systemModifiedAt\"\n      ],\n      \"identity\": [\n        \"tenantId\",\n        \"environment\",\n        \"id\"\n      ],\n      \"sources\": [\n        \"MS-ENDPOINT\",\n        \"MS-COMPANY\"\n      ]\n    },\n    {\n      \"resource\": \"generalLedgerSetup\",\n      \"uriTemplate\": \"/api/v2.0/companies({companyId})/generalLedgerSetup({setupId})\",\n      \"fields\": [\n        \"id\",\n        \"localCurrencyCode\",\n        \"localCurrencySymbol\",\n        \"additionalReportingCurrency\",\n        \"allowPostingFrom\",\n        \"allowPostingTo\",\n        \"shortcutDimension1Code\",\n        \"shortcutDimension2Code\",\n        \"shortcutDimension3Code\",\n        \"shortcutDimension4Code\",\n        \"shortcutDimension5Code\",\n        \"shortcutDimension6Code\",\n        \"shortcutDimension7Code\",\n        \"shortcutDimension8Code\",\n        \"lastModifiedDateTime\"\n      ],\n      \"identity\": [\n        \"companyId\",\n        \"id\"\n      ],\n      \"sources\": [\n        \"MS-GLSETUP\",\n        \"MS-GLSETUP-GET\"\n      ]\n    },\n    {\n      \"resource\": \"currency\",\n      \"uriTemplate\": \"/api/v2.0/companies({companyId})/currencies({currencyId})\",\n      \"fields\": [\n        \"id\",\n        \"code\",\n        \"displayName\",\n        \"symbol\",\n        \"amountDecimalPlaces\",\n        \"amountRoundingPrecision\",\n        \"lastModifiedDateTime\"\n      ],\n      \"identity\": [\n        \"companyId\",\n        \"id\"\n      ],\n      \"sources\": [\n        \"MS-CURRENCY\"\n      ],\n      \"limits\": \"Currencies list is not the LCY authority; LCY rounding may require a separately retained setup export because standard generalLedgerSetup lists no amount-rounding field.\"\n    },\n    {\n      \"resource\": \"dimension\",\n      \"uriTemplate\": \"/api/v2.0/companies({companyId})/dimensions({dimensionId})\",\n      \"fields\": [\n        \"id\",\n        \"code\",\n        \"displayName\",\n        \"consolidationCode\",\n        \"lastModifiedDateTime\"\n      ],\n      \"identity\": [\n        \"companyId\",\n        \"id\"\n      ],\n      \"sources\": [\n        \"MS-DIMENSION\"\n      ]\n    },\n    {\n      \"resource\": \"dimensionValue\",\n      \"uriTemplate\": \"/api/v2.0/companies({companyId})/dimensions({dimensionId})/dimensionValues({valueId})\",\n      \"fields\": [\n        \"id\",\n        \"dimensionId\",\n        \"code\",\n        \"displayName\",\n        \"consolidationCode\",\n        \"lastModifiedDateTime\"\n      ],\n      \"identity\": [\n        \"companyId\",\n        \"dimensionId\",\n        \"id\"\n      ],\n      \"sources\": [\n        \"MS-DIMENSION-VALUE\"\n      ]\n    },\n    {\n      \"resource\": \"dimensionSetLine\",\n      \"uriTemplate\": \"/api/v2.0/companies({companyId})/generalLedgerEntries({entryId})/dimensionSetLines({lineId})\",\n      \"fields\": [\n        \"id\",\n        \"parentId\",\n        \"parentType\",\n        \"code\",\n        \"valueId\",\n        \"valueCode\",\n        \"displayName\",\n        \"valueDisplayName\"\n      ],\n      \"identity\": [\n        \"companyId\",\n        \"parentType\",\n        \"parentId\",\n        \"id\"\n      ],\n      \"sources\": [\n        \"MS-DIMENSION-SET\",\n        \"MS-DIMENSION-SET-GET\"\n      ],\n      \"limits\": \"These are G/L parent dimension lines, not an inferred Dynaway order-to-G/L link; retain actual linkage evidence.\"\n    },\n    {\n      \"resource\": \"defaultDimension\",\n      \"uriTemplate\": \"/api/v2.0/companies({companyId})/defaultDimensions({defaultDimensionId})\",\n      \"fields\": [\n        \"id\",\n        \"parentId\",\n        \"parentType\",\n        \"dimensionId\",\n        \"dimensionCode\",\n        \"dimensionValueId\",\n        \"dimensionValueCode\",\n        \"postingValidation\",\n        \"lastModifiedDateTime\"\n      ],\n      \"identity\": [\n        \"companyId\",\n        \"parentType\",\n        \"parentId\",\n        \"id\"\n      ],\n      \"sources\": [\n        \"MS-DEFAULT-DIMENSION\",\n        \"MS-DEFAULT-DIMENSION-GET\"\n      ],\n      \"limits\": \"Resolve supported collection/key routes against installed metadata. Default dimensions are not proof of posted dimensions.\"\n    },\n    {\n      \"resource\": \"generalLedgerEntry\",\n      \"uriTemplate\": \"/api/v2.0/companies({companyId})/generalLedgerEntries({entryId})\",\n      \"fields\": [\n        \"id\",\n        \"entryNumber\",\n        \"postingDate\",\n        \"documentNumber\",\n        \"documentType\",\n        \"accountId\",\n        \"accountNumber\",\n        \"debitAmount\",\n        \"creditAmount\",\n        \"additionalCurrencyDebitAmount\",\n        \"additionalCurrencyCreditAmount\",\n        \"lastModifiedDateTime\"\n      ],\n      \"identity\": [\n        \"companyId\",\n        \"id\"\n      ],\n      \"sources\": [\n        \"MS-GLENTRY\",\n        \"MS-CURRENCY-BASIS\"\n      ]\n    },\n    {\n      \"resource\": \"fixedAsset\",\n      \"uriTemplate\": \"/api/v2.0/companies({companyId})/fixedAssets({fixedAssetId})\",\n      \"fields\": [\n        \"id\",\n        \"number\",\n        \"displayName\",\n        \"fixedAssetLocationCode\",\n        \"fixedAssetLocationId\",\n        \"classCode\",\n        \"subclassCode\",\n        \"blocked\",\n        \"serialNumber\",\n        \"employeeNumber\",\n        \"employeeId\",\n        \"underMaintenance\",\n        \"lastModifiedDateTime\"\n      ],\n      \"identity\": [\n        \"companyId\",\n        \"id\"\n      ],\n      \"businessKey\": [\n        \"companyId\",\n        \"number\"\n      ],\n      \"sources\": [\n        \"MS-FA\"\n      ]\n    }\n  ],\n  \"dimensions\": {\n    \"canonicalMappings\": [\n      {\n        \"target\": \"dimension_1\",\n        \"source\": \"valueCode for the dimension whose code equals captured shortcutDimension1Code\",\n        \"require\": \"same company and actual original cost/posted parent binding\"\n      },\n      {\n        \"target\": \"dimension_2\",\n        \"source\": \"valueCode for the dimension whose code equals captured shortcutDimension2Code\",\n        \"require\": \"same company and actual original cost/posted parent binding\"\n      },\n      {\n        \"target\": \"dimension_set_id\",\n        \"source\": \"explicit original source field or approved export only\",\n        \"require\": \"do not substitute dimensionSetLine.id, parentId, dimensionId or concatenated values\"\n      }\n    ],\n    \"retain\": \"All returned dimension lines and native references, including dimensions beyond canonical dimension_1/dimension_2.\",\n    \"readback\": \"Compare exact company + parent + dimension/value identity sets after target import; retain supported target IDs separately from original IDs.\",\n    \"allocation\": \"A dimension labels an accounting classification. It does not establish a split percentage or monetary amount. Existing allocation review retains exact signed cost and quantity conservation independently.\",\n    \"postingPolicy\": \"Retain actual defaults, priorities, allowed values and blocked combinations when available; unresolved policy stays an explicit cutover input.\",\n    \"sources\": [\n      \"MS-DIMENSION\",\n      \"MS-DIMENSION-VALUE\",\n      \"MS-DIMENSION-SET\",\n      \"MS-DEFAULT-DIMENSION\",\n      \"MS-DIMENSION-POLICY\"\n    ]\n  },\n  \"exactAmounts\": {\n    \"preserve\": \"original numeric token in bodyText; exact-decimal canonical engine value separately\",\n    \"prohibit\": [\n      \"JSON Number round-trip for money or quantities\",\n      \"implicit two-decimal rounding\",\n      \"unit-price multiplication to invent posted cost\",\n      \"absolute-value sign removal\",\n      \"combining LCY and additional reporting currency\",\n      \"automatic FX conversion\"\n    ],\n    \"currencyResourceTypes\": {\n      \"amountDecimalPlaces\": \"string\",\n      \"amountRoundingPrecision\": \"decimal\"\n    },\n    \"engineConstraint\": \"Canonical currency is exactly three uppercase letters; unsupported original codes remain source evidence until an attributed explicit mapping is approved. No automatic code normalization.\",\n    \"roundingPolicy\": \"Retain amount rounding, display decimals, quantity/UoM and any conversion policy independently. A source value is not changed merely to match display precision.\",\n    \"sources\": [\n      \"MS-CURRENCY\",\n      \"MS-CURRENCY-BASIS\",\n      \"MS-GLENTRY\"\n    ]\n  },\n  \"readback\": {\n    \"sourceRecordKey\": [\n      \"tenantId\",\n      \"environment\",\n      \"companyId\",\n      \"resource\",\n      \"nativeId\"\n    ],\n    \"fields\": [\n      \"operation_id\",\n      \"source_response_sha256\",\n      \"source_pointer\",\n      \"original_native_id\",\n      \"target_native_id\",\n      \"target_business_number\",\n      \"request_url\",\n      \"request_payload_sha256\",\n      \"before_etag\",\n      \"after_etag\",\n      \"response_status\",\n      \"request_or_correlation_id\",\n      \"response_sha256\",\n      \"observed_at\",\n      \"reviewed_fields\",\n      \"posted_entry_ids\",\n      \"dimension_links\"\n    ],\n    \"updateRule\": \"Use the exact original ETag for a reviewed PATCH. A mismatch requires fresh read/reconciliation; do not replace with wildcard to suppress the conflict.\",\n    \"successRule\": \"Retain actual response and independent target readback for selected fields and posted effects. A200 or matching record count alone is insufficient.\",\n    \"limits\": \"GET/master CRUD does not establish historical ledger import or posting support. Resolve actual supplier-approved import action and installed API metadata.\",\n    \"sources\": [\n      \"MS-FA-PATCH\",\n      \"MS-SYSTEMID\",\n      \"MS-API\"\n    ]\n  },\n  \"historicalFinance\": {\n    \"requiredOriginals\": [\n      \"complete asset master and maintenance-to-financial links\",\n      \"depreciation books and integration settings\",\n      \"opening balances by company/book/asset/date/currency/measure\",\n      \"original financial events and posting dates\",\n      \"FA and G/L ledger readbacks\",\n      \"independently sourced control totals\",\n      \"supplier-approved opening-vs-detailed-history migration decision\"\n    ],\n    \"rule\": \"Retain acquisition cost, accumulated depreciation, adjustments and net book value as separate declared measures. Avoid replaying costs already included in opening balances or capitalized assets.\",\n    \"workOrderBoundary\": \"Maintenance expense/history and fixed-asset acquisition/depreciation remain separate domains until explicit original source linkage and accounting classification support a reconciliation.\",\n    \"sources\": [\n      \"MS-FA-OPENING\",\n      \"MS-FA-REPORTS\",\n      \"MS-GLENTRY\"\n    ]\n  }\n}\n","bytes":13229,"sha256":"2207daed066b5a5e3184bbe17d40d77b27bc2978adb7fa1c024e1d971bbae63d"},{"path":"services/fixed-asset-migration/integrations/business-central/MICROSOFT_RECONCILIATION.md","type":"text/plain;charset=utf-8","text":"# Business Central accounting context and migration readback\n\nThis companion configures the existing fixed-asset migration workspace and its Business Central/Dynaway source preparers. It preserves actual source identity and accounting meaning before any destination import. It does not discover a customer tenant, authenticate, modify records, post journals or replace the supplier's import process.\n\nUse `MICROSOFT_CONTEXT_CONTRACT.json` as the reusable acquisition/review configuration and `MICROSOFT_SOURCE_INDEX.json` for the official documentation reviewed on 13 October 2026. Unconfigured deployment values are deliberately null. The documentation describes a product capability, not proof that a particular customer has that API, version, permission or accounting policy.\n\n## 1. Bind the actual company before preparing rows\n\nKeep tenant, environment and company GUID together. Retain the original company response with its business name and system version; a display name is not a durable record key. Preserve native GUIDs and business numbers in separate columns. Microsoft distinguishes immutable SystemId from business fields; a record timestamp/rowversion must not be treated as an observation time. [Microsoft company resource](https://learn.microsoft.com/en-us/dynamics365/business-central/dev-itpro/api-reference/v2.0/resources/dynamics_company) · [System fields](https://learn.microsoft.com/en-us/dynamics365/business-central/dev-itpro/developer/devenv-table-system-fields).\n\nFor Business Central Online, the environment route and the API version are separate path components:\n\n```text\nhttps://api.businesscentral.dynamics.com/v2.0/{tenantId}/{environment}/api/v2.0\nhttps://api.businesscentral.dynamics.com/v2.0/{tenantId}/{environment}/api/dynaway/eam/v1.0\nhttps://api.businesscentral.dynamics.com/v2.0/{tenantId}/{environment}/api/dynaway/eamAnalytics/v1.0\n```\n\nUse the actual installed service root for on-premises deployments. The preparers retain the exact company path and source URL; they do not convert alternate routes or infer an environment from a business name. Capture the installed service document/metadata and its observation time before selecting fields. [Microsoft endpoint structure](https://learn.microsoft.com/en-us/dynamics365/business-central/dev-itpro/webservices/api-endpoint-structure).\n\n## 2. Supply real LCY evidence to the work-order preparer\n\nWhen `selection.expenseLineCostField` selects a documented posted expense line amount, include `capture.companyContext` with the **original single-record General Ledger Setup response**:\n\n```text\nGET {actualApiRoot}/companies({actualCompanyId})/generalLedgerSetup({actualSetupId})\n```\n\nThe documented GET returns an object. Use the setup GUID actually returned by that tenant; the example GUID in Microsoft's documentation is not a discovery mechanism. The selected company, response `id` and `localCurrencyCode` must match the captured URL and `selection.lcyCode`. Preserve complete `bodyText`, HTTP status, original URL and its computed bytes/SHA. The source preparer retains it as `originals/general-ledger-setup.json`; its `/localCurrencyCode` pointer supplies the source binding. Retain the reviewer's `lcySourceReference` alongside that computed evidence. [GET contract](https://learn.microsoft.com/en-us/dynamics365/business-central/dev-itpro/api-reference/v2.0/api/dynamics_generalledgersetup_get) · [Setup fields](https://learn.microsoft.com/en-us/dynamics365/business-central/dev-itpro/api-reference/v2.0/resources/dynamics_generalledgersetup).\n\nCompany Information's `currencyCode` is documented as a default currency. It is not a substitute for the direct accounting setup in this adapter. [Company Information](https://learn.microsoft.com/en-us/dynamics365/business-central/dev-itpro/api-reference/v2.0/resources/dynamics_companyinformation).\n\nBusiness Central uses a blank transaction currency for LCY and does not require a duplicate LCY record in the currency list. Its general ledger is recorded in LCY; original foreign-currency provenance requires the underlying documents. Additional reporting currency remains a different quantity. Do not infer USD from a dollar symbol or aggregate the two bases. [Currency semantics](https://learn.microsoft.com/en-us/dynamics365/business-central/finance-currencies).\n\n## 3. Preserve exact money and quantity independently\n\nThe source preparer parses numeric tokens without a JavaScript floating-point round-trip. The original response and `native:*` columns retain those spellings; canonical decimal fields use the existing engine's exact arithmetic. Selecting `quantity`, `qtyToConsume` or `qtyConsumed` is an explicit review decision. A unit price is not a posted line cost; missing cost stays missing.\n\nThe current canonical engine accepts three uppercase currency letters. That is an engine constraint, not a claim that every Business Central code has that shape. An unsupported original code needs an attributed, source-backed mapping; do not silently truncate or uppercase it.\n\nFor each relevant currency, retain `id`, `code`, `amountDecimalPlaces` and `amountRoundingPrecision`. The first precision field is a **string**, the second a **decimal**; display precision and rounding interval are separate settings. Preserve them lexically and never assume two decimals. The standard General Ledger Setup resource does not list LCY amount-rounding fields, so obtain an actual supported setup export if those settings are needed. [Currency API](https://learn.microsoft.com/en-us/dynamics365/business-central/dev-itpro/api-reference/v2.0/resources/dynamics_currency).\n\n## 4. Keep dimensions as original relationships\n\n| Original record | Preserve | Canonical use |\n| --- | --- | --- |\n| Dimension | Company, dimension GUID and code | Identifies the accounting axis. |\n| Dimension value | Company, dimension GUID, value GUID and code | Resolves a value within its own dimension. |\n| Dimension-set line | Company, parent type/GUID, line GUID, dimension code and value GUID/code | Retains the actual parent-bound classification. |\n| Default dimension | Original parent, dimension/value and postingValidation | Retains proposed/default policy; it is not evidence of a posted value. |\n\nThe configuration uses documented parent-scoped G/L dimension reads. It does not assert that a Dynaway work order automatically shares that parent identity. Capture the actual original order/ledger link before mapping the classification. [Dimension](https://learn.microsoft.com/en-us/dynamics365/business-central/dev-itpro/api-reference/v2.0/resources/dynamics_dimension) · [Values](https://learn.microsoft.com/en-us/dynamics365/business-central/dev-itpro/api-reference/v2.0/resources/dynamics_dimensionvalue) · [Set lines](https://learn.microsoft.com/en-us/dynamics365/business-central/dev-itpro/api-reference/v2.0/resources/dynamics_dimensionsetline).\n\nThe API's `dimensionSetLine.id` is the line GUID, **not** the internal numeric Dimension Set ID. The listed fields do not expose that numeric key. Leave canonical `dimension_set_id` unpopulated until an actual export or supported API establishes it. Do not substitute `parentId`, `dimensionId` or a synthesized concatenation. [Parent-scoped GET](https://learn.microsoft.com/en-us/dynamics365/business-central/dev-itpro/api-reference/v2.0/api/dynamics_dimensionsetline_get).\n\nMap canonical `dimension_1`/`dimension_2` only after matching the captured shortcut-dimension codes and the exact original parent. Retain every other dimension line as source evidence. Two global or eight shortcut positions do not exhaust possible dimension sets. Defaults, priority conflicts and blocked combinations can change posting behavior; retain their actual policy where relevant. [Dimension policy](https://learn.microsoft.com/en-us/dynamics365/business-central/finance-dimensions) · [Default-dimension fields](https://learn.microsoft.com/en-us/dynamics365/business-central/dev-itpro/api-reference/v2.0/resources/dynamics_defaultdimension).\n\nA department or project code does not supply an allocation percentage. Existing work-order allocation review still conserves signed amount and original quantity independently within the original company, currency, basis, kind and unit. Never manufacture a division split from labels.\n\n## 5. Separate master, maintenance history and financial opening state\n\nThe standard `fixedAssets` property list describes the asset master. It does not establish a complete acquisition-cost, depreciation-book or opening-balance dataset. Dynaway maintenance identities and their financial-asset links stay distinct; several maintenance assets can reference one financial asset without duplicating its balance. [Fixed-asset resource](https://learn.microsoft.com/en-us/dynamics365/business-central/dev-itpro/api-reference/v2.0/resources/dynamics_fixedasset).\n\nThe current fixed-asset PATCH documentation contains illustrative business-number IDs and extra financial fields that conflict with its resource table. Resolve that discrepancy using installed metadata and actual source responses. Do not create a guessed financial import endpoint from the example. Standard API fields cannot simply be extended in place; a supported custom API/export needs its own retained contract. [PATCH example](https://learn.microsoft.com/en-us/dynamics365/business-central/dev-itpro/api-reference/v2.0/api/dynamics_fixedasset_update) · [API overview](https://learn.microsoft.com/en-us/dynamics365/business-central/dev-itpro/api-reference/v2.0/).\n\nFor the original six domains, obtain the actual books, balances, events, journals and controls in addition to assets. Preserve asset/book/date/currency/measure and the source's sign convention. Acquisition cost, accumulated depreciation, write-downs and net book value are different measures.\n\nMicrosoft's initial FA setup treats acquisition and accumulated-depreciation opening entries separately and makes depreciation-book G/L integration relevant to the transition. The supplier must choose a reviewed opening-balance or detailed-history strategy; this adapter does not change that setup or post it. Retain the existing G/L state so imported history is not posted a second time. [FA opening setup](https://learn.microsoft.com/en-us/dynamics365/business-central/fa-how-setup-general).\n\nMaintenance costs are not automatically capitalized acquisition cost. Preserve their actual expected/actual classification and explicit original financial linkage. A historical ledger read API does not establish a supported historical write operation.\n\n## 6. Read back actual target effects\n\nFor reviewed master updates, preserve the exact original `@odata.etag`/ETag and use the supplier's supported `If-Match` contract. A changed tag calls for a fresh read and reconciliation; replacing it with a wildcard would discard the concurrency protection. A successful PATCH can also recalculate omitted fields, so retain the actual returned object and independent readback of relevant relationships. [Fixed-asset update](https://learn.microsoft.com/en-us/dynamics365/business-central/dev-itpro/api-reference/v2.0/api/dynamics_fixedasset_update).\n\nRecord source and target identities separately, actual request/payload hash, before/after ETags, HTTP and request/correlation IDs, response hash, observed time, reviewed fields and any original posted-entry IDs. A matching count or HTTP200 is not financial acceptance.\n\nThe standard G/L entry exposes separate debit/credit and additional-currency debit/credit values. Keep them within their declared currency basis; retain account/document/date/native IDs and parent dimension lines. It is a GET resource, not a journal import contract. [G/L entries](https://learn.microsoft.com/en-us/dynamics365/business-central/dev-itpro/api-reference/v2.0/resources/dynamics_generalledgerentry).\n\nReconcile the supplier's actual FA Book Value, Register and G/L Analysis populations against the selected books and cutoff. Those reports answer different questions; none substitutes for all original six-domain controls. [FA report catalogue](https://learn.microsoft.com/en-us/dynamics365/business-central/fa-reports).\n\n## 7. Use the existing workspace and preserve the complete delivery\n\n1. Retain complete authorized original pages and the exact page chain; document population/filter and snapshot basis. Paging completeness does not establish a transactionally consistent snapshot.\n2. Prepare master data with `prepareMasterCapture` and work-order source data with `prepareWorkOrderCapture`. Select quantity/cost basis and supply original company context when required.\n3. Import the resulting source CSV into the existing Work orders and costs desk. Use its current mapping, attributed corrections, allocation review, target readback and acceptance operations. Missing headers, cost, units or target links stay visible.\n4. Retain every original response, capture, scope, mapping and findings file through the original supporting-file API. Original limits apply to every member and the complete portable workspace; split a genuinely separate scope explicitly rather than truncate a response.\n5. Reopen the delivered workspace and handover through the existing receiver. The original financial and work-order acceptance results remain separate and require their actual source populations.\n\nBefore presenting the outgoing app or attachments as ready, the responsible receiver must open and visually inspect the exact delivered version, operate its important controls and reopen all attachments in their normal viewer. Source review alone is not rendered acceptance. This work uses isolated/cloud execution only while the owner's local browser is reserved.\n\n## Current evidence boundary\n\nThis contract was checked against Microsoft's official documentation and the maintained workspace source. It does not assert access to a Port of Bellingham tenant, current database, supplier import template or operational accounting approvals. Actual supplier records, full issuer package and destination configuration remain separate intake inputs. Missing evidence remains named rather than filled with sample IDs, zero amounts or assumed policies.\n","bytes":14183,"sha256":"90e92155d097da97bb3341cb1a7ac15d2a13eb005dce22e5ddefd6e548c07627"},{"path":"services/fixed-asset-migration/integrations/business-central/MICROSOFT_SOURCE_INDEX.json","type":"application/json","text":"{\n  \"schema\": \"tjlabs.business-central-microsoft-source-index.v1\",\n  \"edition\": \"2026-10-13\",\n  \"scope\": \"Official product contracts; not evidence of any customer's installed tenant, records, permissions or accounting policy.\",\n  \"sources\": [\n    {\n      \"id\": \"MS-ENDPOINT\",\n      \"title\": \"API endpoint structure\",\n      \"url\": \"https://learn.microsoft.com/en-us/dynamics365/business-central/dev-itpro/webservices/api-endpoint-structure\",\n      \"reviewed_on\": \"2026-10-13\",\n      \"publisher\": \"Microsoft\",\n      \"finding\": \"Online host separates environment /v2.0 from API route /api/v2.0; tenant can be in path. Partner routes include publisher/group/version. Company can be path GUID or query parameter.\"\n    },\n    {\n      \"id\": \"MS-COMPANY\",\n      \"title\": \"company resource\",\n      \"url\": \"https://learn.microsoft.com/en-us/dynamics365/business-central/dev-itpro/api-reference/v2.0/resources/dynamics_company\",\n      \"reviewed_on\": \"2026-10-13\",\n      \"publisher\": \"Microsoft\",\n      \"finding\": \"Read actual company id, name, systemVersion and source timestamps; names do not replace GUID scope.\"\n    },\n    {\n      \"id\": \"MS-SYSTEMID\",\n      \"title\": \"Table system fields\",\n      \"url\": \"https://learn.microsoft.com/en-us/dynamics365/business-central/dev-itpro/developer/devenv-table-system-fields\",\n      \"reviewed_on\": \"2026-10-13\",\n      \"publisher\": \"Microsoft\",\n      \"finding\": \"SystemId is immutable GUID; a native business number is a distinct key. Audit fields are platform-managed; rowversion is not a wall-clock time.\"\n    },\n    {\n      \"id\": \"MS-GLSETUP\",\n      \"title\": \"generalLedgerSetup resource\",\n      \"url\": \"https://learn.microsoft.com/en-us/dynamics365/business-central/dev-itpro/api-reference/v2.0/resources/dynamics_generalledgersetup\",\n      \"reviewed_on\": \"2026-10-13\",\n      \"publisher\": \"Microsoft\",\n      \"finding\": \"Exposes actual localCurrencyCode, additionalReportingCurrency, posting bounds and shortcutDimension1Code through shortcutDimension8Code.\"\n    },\n    {\n      \"id\": \"MS-GLSETUP-GET\",\n      \"title\": \"Get generalLedgerSetup\",\n      \"url\": \"https://learn.microsoft.com/en-us/dynamics365/business-central/dev-itpro/api-reference/v2.0/api/dynamics_generalledgersetup_get\",\n      \"reviewed_on\": \"2026-10-13\",\n      \"publisher\": \"Microsoft\",\n      \"finding\": \"Documented individual GET includes company GUID and setup GUID; response is one object, not a value array. Sample GUID is illustrative.\"\n    },\n    {\n      \"id\": \"MS-COMPANY-INFO\",\n      \"title\": \"companyInformation resource\",\n      \"url\": \"https://learn.microsoft.com/en-us/dynamics365/business-central/dev-itpro/api-reference/v2.0/resources/dynamics_companyinformation\",\n      \"reviewed_on\": \"2026-10-13\",\n      \"publisher\": \"Microsoft\",\n      \"finding\": \"currencyCode is documented as company default currency. General Ledger Setup is the direct LCY source.\"\n    },\n    {\n      \"id\": \"MS-CURRENCY\",\n      \"title\": \"currency resource\",\n      \"url\": \"https://learn.microsoft.com/en-us/dynamics365/business-central/dev-itpro/api-reference/v2.0/resources/dynamics_currency\",\n      \"reviewed_on\": \"2026-10-13\",\n      \"publisher\": \"Microsoft\",\n      \"finding\": \"amountDecimalPlaces is a string; amountRoundingPrecision is decimal. Preserve exact source settings and actual currency identity.\"\n    },\n    {\n      \"id\": \"MS-CURRENCY-BASIS\",\n      \"title\": \"Currencies in Business Central\",\n      \"url\": \"https://learn.microsoft.com/en-us/dynamics365/business-central/finance-currencies\",\n      \"reviewed_on\": \"2026-10-13\",\n      \"publisher\": \"Microsoft\",\n      \"finding\": \"LCY is defined in General Ledger Setup; blank transaction currency represents LCY. G/L entries carry LCY; original foreign currency requires its source documents. Additional reporting currency is separate.\"\n    },\n    {\n      \"id\": \"MS-DIMENSION\",\n      \"title\": \"dimension resource\",\n      \"url\": \"https://learn.microsoft.com/en-us/dynamics365/business-central/dev-itpro/api-reference/v2.0/resources/dynamics_dimension\",\n      \"reviewed_on\": \"2026-10-13\",\n      \"publisher\": \"Microsoft\",\n      \"finding\": \"Dimension GUID/code identifies an axis; dimensionValues is its navigation.\"\n    },\n    {\n      \"id\": \"MS-DIMENSION-VALUE\",\n      \"title\": \"dimensionValue resource\",\n      \"url\": \"https://learn.microsoft.com/en-us/dynamics365/business-central/dev-itpro/api-reference/v2.0/resources/dynamics_dimensionvalue\",\n      \"reviewed_on\": \"2026-10-13\",\n      \"publisher\": \"Microsoft\",\n      \"finding\": \"Value GUID/code retains its dimensionId. Do not join a value code across unrelated dimensions.\"\n    },\n    {\n      \"id\": \"MS-DIMENSION-SET\",\n      \"title\": \"dimensionSetLine resource\",\n      \"url\": \"https://learn.microsoft.com/en-us/dynamics365/business-central/dev-itpro/api-reference/v2.0/resources/dynamics_dimensionsetline\",\n      \"reviewed_on\": \"2026-10-13\",\n      \"publisher\": \"Microsoft\",\n      \"finding\": \"id is the line GUID. Parent identity/type and code/valueId/valueCode are available; numeric internal Dimension Set ID is not listed.\"\n    },\n    {\n      \"id\": \"MS-DIMENSION-SET-GET\",\n      \"title\": \"Get dimensionSetLines\",\n      \"url\": \"https://learn.microsoft.com/en-us/dynamics365/business-central/dev-itpro/api-reference/v2.0/api/dynamics_dimensionsetline_get\",\n      \"reviewed_on\": \"2026-10-13\",\n      \"publisher\": \"Microsoft\",\n      \"finding\": \"Documented reads include generalLedgerEntries(parentGUID)/dimensionSetLines(lineGUID). Use actual parent-scoped identities.\"\n    },\n    {\n      \"id\": \"MS-DEFAULT-DIMENSION\",\n      \"title\": \"defaultDimension resource\",\n      \"url\": \"https://learn.microsoft.com/en-us/dynamics365/business-central/dev-itpro/api-reference/v2.0/resources/dynamics_defaultdimension\",\n      \"reviewed_on\": \"2026-10-13\",\n      \"publisher\": \"Microsoft\",\n      \"finding\": \"Default records include parentId/type, dimensionId/code, dimensionValueId/code and postingValidation. Defaults are separate from posted dimension-set lines.\"\n    },\n    {\n      \"id\": \"MS-DIMENSION-POLICY\",\n      \"title\": \"Work with dimensions\",\n      \"url\": \"https://learn.microsoft.com/en-us/dynamics365/business-central/finance-dimensions\",\n      \"reviewed_on\": \"2026-10-13\",\n      \"publisher\": \"Microsoft\",\n      \"finding\": \"Two global and up to eight shortcut dimensions do not replace full sets. Priorities and blocked combinations can affect posting; defaults can change on document lines.\"\n    },\n    {\n      \"id\": \"MS-FA\",\n      \"title\": \"fixedAsset resource\",\n      \"url\": \"https://learn.microsoft.com/en-us/dynamics365/business-central/dev-itpro/api-reference/v2.0/resources/dynamics_fixedasset\",\n      \"reviewed_on\": \"2026-10-13\",\n      \"publisher\": \"Microsoft\",\n      \"finding\": \"Standard master fields do not establish an acquisition, depreciation-book or ledger balance export.\"\n    },\n    {\n      \"id\": \"MS-FA-PATCH\",\n      \"title\": \"Update fixedAssets\",\n      \"url\": \"https://learn.microsoft.com/en-us/dynamics365/business-central/dev-itpro/api-reference/v2.0/api/dynamics_fixedasset_update\",\n      \"reviewed_on\": \"2026-10-13\",\n      \"publisher\": \"Microsoft\",\n      \"finding\": \"PATCH requires If-Match; stale tag prevents update. Omitted fields remain or may recalculate. Example IDs/extra financial fields conflict with the resource table, so installed metadata and actual response govern.\"\n    },\n    {\n      \"id\": \"MS-GLENTRY\",\n      \"title\": \"generalLedgerEntry resource\",\n      \"url\": \"https://learn.microsoft.com/en-us/dynamics365/business-central/dev-itpro/api-reference/v2.0/resources/dynamics_generalledgerentry\",\n      \"reviewed_on\": \"2026-10-13\",\n      \"publisher\": \"Microsoft\",\n      \"finding\": \"Read-only ledger has native GUID/entry number/document/date/account, exact debit/credit, separate additional-currency amounts, and dimensionSetLines navigation.\"\n    },\n    {\n      \"id\": \"MS-FA-OPENING\",\n      \"title\": \"Set up general fixed assets information\",\n      \"url\": \"https://learn.microsoft.com/en-us/dynamics365/business-central/fa-how-setup-general\",\n      \"reviewed_on\": \"2026-10-13\",\n      \"publisher\": \"Microsoft\",\n      \"finding\": \"Opening FA cost and accumulated depreciation are separate entries per book; G/L integration state matters. Preserve supplier-approved opening/history strategy and avoid duplicate posting.\"\n    },\n    {\n      \"id\": \"MS-FA-REPORTS\",\n      \"title\": \"Fixed assets reports\",\n      \"url\": \"https://learn.microsoft.com/en-us/dynamics365/business-central/fa-reports\",\n      \"reviewed_on\": \"2026-10-13\",\n      \"publisher\": \"Microsoft\",\n      \"finding\": \"Book Value, Register, Document Nos. and G/L Analysis provide different accounting readback populations.\"\n    },\n    {\n      \"id\": \"MS-API\",\n      \"title\": \"API v2.0 overview\",\n      \"url\": \"https://learn.microsoft.com/en-us/dynamics365/business-central/dev-itpro/api-reference/v2.0/\",\n      \"reviewed_on\": \"2026-10-13\",\n      \"publisher\": \"Microsoft\",\n      \"finding\": \"Published standard APIs are finite; additional fields require an actual supported custom API or export, not a guessed standard field.\"\n    },\n    {\n      \"id\": \"MS-DEFAULT-DIMENSION-GET\",\n      \"title\": \"Get defaultDimensions for an entity\",\n      \"url\": \"https://learn.microsoft.com/en-us/dynamics365/business-central/dev-itpro/api-reference/v2.0/api/dynamics_defaultdimension_get\",\n      \"reviewed_on\": \"2026-10-13\",\n      \"publisher\": \"Microsoft\",\n      \"finding\": \"Documents company-level and selected item/customer/vendor/employee default-dimension routes; actual installed metadata and responses remain authoritative.\"\n    }\n  ]\n}\n","bytes":9506,"sha256":"7f7010f33ff945887adca142c90fc6fcf1a9b03310f700d04e3974e3a9c9e339"},{"path":"services/fixed-asset-migration/integrations/business-central/PROVIDER_CONTRACTS.json","type":"application/json","text":"{\n  \"schema\": \"tjlabs.business-central-dynaway-contracts.v1\",\n  \"edition\": \"2026-10-13\",\n  \"status\": \"Documentation-bound preparation contracts. Native target metadata, source exports and receipts complete the tenant binding.\",\n  \"master\": {\n    \"fixedAssets\": {\n      \"relativeCollection\": \"api/v2.0/companies({companyId})/fixedAssets\",\n      \"nativeIdentity\": \"id (GUID)\",\n      \"businessIdentity\": \"number\",\n      \"fields\": [\n        \"id\",\n        \"number\",\n        \"displayName\",\n        \"fixedAssetLocationCode\",\n        \"fixedAssetLocationId\",\n        \"classCode\",\n        \"subclassCode\",\n        \"blocked\",\n        \"serialNumber\",\n        \"employeeNumber\",\n        \"employeeId\",\n        \"underMaintenance\",\n        \"lastModifiedDateTime\"\n      ],\n      \"sources\": [\n        \"MS-FA\",\n        \"MS-FA-PATCH\"\n      ],\n      \"coverage\": \"Master card only. Resolve additional fields against actual installed metadata; preserve their original bytes.\"\n    },\n    \"maintenanceAssets\": {\n      \"relativeCollection\": \"api/dynaway/eam/v1.0/companies({companyId})/assets\",\n      \"nativeIdentity\": \"id (GUID)\",\n      \"businessIdentity\": \"assetNo\",\n      \"hierarchy\": \"parentAssetNo\",\n      \"financialLink\": \"fixedAssetNumber\",\n      \"sources\": [\n        \"DYN-ASSETS\"\n      ],\n      \"financialLinkCardinality\": \"Several maintenance assets may relate to one financial fixed asset; no financial balance duplication.\"\n    }\n  },\n  \"costLines\": {\n    \"resource\": {\n      \"input\": [\n        \"resourceId\",\n        \"sequence\",\n        \"description\",\n        \"unitOfMeasureId\",\n        \"unitOfMeasureCode\",\n        \"workTypeId\",\n        \"workTypeCode\",\n        \"quantity\",\n        \"qtyToConsume\"\n      ],\n      \"response\": [\n        \"id\",\n        \"documentId\",\n        \"sequence\",\n        \"resourceId\",\n        \"no\",\n        \"description\",\n        \"unitOfMeasureId\",\n        \"unitOfMeasureCode\",\n        \"workTypeId\",\n        \"workTypeCode\",\n        \"quantity\",\n        \"qtyToConsume\",\n        \"qtyConsumed\",\n        \"startingDate\",\n        \"startingTime\",\n        \"endingDate\",\n        \"endingTime\"\n      ],\n      \"relativeCollection\": \"api/dynaway/eam/v1.0/companies({companyId})/workOrders({workOrderId})/workOrderResourceLines\",\n      \"nativeKey\": [\n        \"companyId\",\n        \"documentId\",\n        \"id\"\n      ],\n      \"amountStatus\": \"Documented create/read sample does not establish full actual line cost.\",\n      \"sources\": [\n        \"DYN-RESOURCES\"\n      ]\n    },\n    \"item\": {\n      \"input\": [\n        \"itemId\",\n        \"sequence\",\n        \"description\",\n        \"unitOfMeasureId\",\n        \"unitOfMeasureCode\",\n        \"quantity\",\n        \"qtyToConsume\"\n      ],\n      \"response\": [\n        \"id\",\n        \"documentId\",\n        \"sequence\",\n        \"itemId\",\n        \"no\",\n        \"description\",\n        \"unitOfMeasureId\",\n        \"unitOfMeasureCode\",\n        \"quantity\",\n        \"qtyToConsume\",\n        \"qtyConsumed\"\n      ],\n      \"relativeCollection\": \"api/dynaway/eam/v1.0/companies({companyId})/workOrders({workOrderId})/workOrderItemLines\",\n      \"nativeKey\": [\n        \"companyId\",\n        \"documentId\",\n        \"id\"\n      ],\n      \"amountStatus\": \"Documented create/read sample does not establish full actual line cost.\",\n      \"sources\": [\n        \"DYN-ITEMS\"\n      ]\n    },\n    \"expense\": {\n      \"input\": [\n        \"expenseId\",\n        \"sequence\",\n        \"description\",\n        \"unitOfMeasureId\",\n        \"unitOfMeasureCode\",\n        \"vendorId\",\n        \"vendorCode\",\n        \"quantity\",\n        \"expectedUnitCostLCY\",\n        \"qtyToConsume\"\n      ],\n      \"response\": [\n        \"id\",\n        \"documentId\",\n        \"sequence\",\n        \"expenseId\",\n        \"no\",\n        \"description\",\n        \"unitOfMeasureId\",\n        \"unitOfMeasureCode\",\n        \"vendorId\",\n        \"vendorNo\",\n        \"expectedUnitCostLCY\",\n        \"quantity\",\n        \"qtyToConsume\",\n        \"qtyConsumed\",\n        \"startingDate\",\n        \"startingTime\",\n        \"endingDate\",\n        \"endingTime\"\n      ],\n      \"relativeCollection\": \"api/dynaway/eam/v1.0/companies({companyId})/workOrders({workOrderId})/workOrderExpenseLines\",\n      \"nativeKey\": [\n        \"companyId\",\n        \"documentId\",\n        \"id\"\n      ],\n      \"amountStatus\": \"expectedUnitCostLCY is expected local-currency unit cost; actual cost is separately sourced.\",\n      \"sources\": [\n        \"DYN-EXPENSES\"\n      ]\n    }\n  },\n  \"postedLedger\": {\n    \"relativeCollection\": \"api/dynaway/eamAnalytics/v1.0/companies({companyId})/woLedgerEntries\",\n    \"response\": [\n      \"id\",\n      \"postingDate\",\n      \"planNo\",\n      \"fixedAssetNo\",\n      \"type\",\n      \"number\",\n      \"description\",\n      \"quantity\",\n      \"unitOfMeasureCode\",\n      \"locationCode\",\n      \"resourceWorkTypeCode\",\n      \"itemSerialNo\",\n      \"itemLotNo\",\n      \"expenseVendorNo\",\n      \"expenseExpectedLineCostLCY\",\n      \"expenseExpectedUnitCostLCY\",\n      \"expenseActualLineCostLCY\",\n      \"billToCustomerNo\",\n      \"billable\"\n    ],\n    \"nativeKey\": [\n      \"companyId\",\n      \"id\"\n    ],\n    \"planIdentity\": \"planNo is a maintenance-plan number, not a work-order header GUID.\",\n    \"costCaution\": \"expenseActualLineCostLCY, expenseExpectedLineCostLCY and expenseExpectedUnitCostLCY are separate measures. Missing resource/item actual amounts remain missing. Bind LCY to the selected company currency.\",\n    \"sources\": [\n      \"DYN-LEDGER\"\n    ]\n  },\n  \"allocation\": {\n    \"canonicalColumns\": [\n      \"company_id\",\n      \"work_order_id\",\n      \"line_id\",\n      \"line_kind\",\n      \"asset_id\",\n      \"fixed_asset_id\",\n      \"project_id\",\n      \"project_task_id\",\n      \"dimension_set_id\",\n      \"currency\",\n      \"quantity\",\n      \"unit_code\",\n      \"cost_amount\",\n      \"cost_basis\",\n      \"posting_date\",\n      \"native_record_id\",\n      \"native_document_id\",\n      \"source_reference\"\n    ],\n    \"nativeFieldPolicy\": \"These are workspace mapping labels, not asserted provider JSON keys. Retain actual supplier/export field names and explicit mappings.\",\n    \"conservationKey\": [\n      \"company_id\",\n      \"source_cost_identity\",\n      \"currency\",\n      \"cost_basis\"\n    ],\n    \"formula\": \"Sum of explicitly reviewed allocation amounts equals the exact original signed cost amount.\",\n    \"quantityPolicy\": \"Quantity/UoM is a separate axis; allocation amount does not change consumed quantity.\",\n    \"sourcePolicy\": \"Actual, expected, budget and capitalized values stay distinct. Divisions/dimensions do not create legal companies.\",\n    \"sources\": [\n      \"DYN-PROJECTS\",\n      \"DYN-DIMENSIONS\",\n      \"DYN-LEDGER\"\n    ]\n  },\n  \"actions\": {\n    \"prepare\": \"Original source selection, native field mapping and reviewed cost allocation.\",\n    \"post\": \"Separate native action with retained request and original line/document identities; reconcile outcome before retrying an uncertain post.\",\n    \"close\": \"Separate operational state from posting.\",\n    \"patch\": \"Use current captured ETag where the API supports it; return native conflict for fresh comparison.\",\n    \"sources\": [\n      \"DYN-POST\",\n      \"MS-FA-PATCH\"\n    ]\n  },\n  \"documentationDiscrepancies\": [\n    {\n      \"source\": \"MS-FA-PATCH\",\n      \"finding\": \"Example id values are business-number strings despite GUID type in MS-FA; sample includes acquisition/depreciation fields absent from the resource table.\",\n      \"resolution\": \"Use actual API Overview/$metadata and returned schema. Do not copy example IDs or infer financial book support.\"\n    },\n    {\n      \"source\": \"DYN-POST\",\n      \"finding\": \"Published bound-action URI omits the closing company parenthesis.\",\n      \"resolution\": \"Resolve exact published bound action from installed metadata. No executable URL is constructed from the malformed example.\"\n    }\n  ],\n  \"tenantSelectionFields\": [\n    \"tenantId\",\n    \"environment\",\n    \"companyId\",\n    \"companyName\",\n    \"LCYCode\",\n    \"BCVersion\",\n    \"DynawayVersion\",\n    \"API metadata identity\",\n    \"source filters\",\n    \"observation interval\",\n    \"native permission set\",\n    \"installed import-template identity\"\n  ],\n  \"readbackFields\": [\n    \"operation ID\",\n    \"source bytes/hash\",\n    \"selected tenant/environment/company\",\n    \"native URI/action\",\n    \"request hash\",\n    \"original record IDs\",\n    \"before/after ETag\",\n    \"HTTP status\",\n    \"request/correlation ID\",\n    \"provider response bytes/hash\",\n    \"posted ledger IDs\",\n    \"reviewed allocation reconciliation\"\n  ],\n  \"unresolvedTenantFacts\": [\n    \"Current Port systems, data volumes, configured companies/divisions/dimensions, enabled Dynaway modules and project flags await issued RFP/tenant evidence.\",\n    \"A vendor feature page or historical financial policy does not establish the Port's current configuration.\"\n  ]\n}\n","bytes":8682,"sha256":"e478a419e55e761f9f94a07aee373db94d6489cfc11a4a7d54cfcdea1dee4b7c"},{"path":"services/fixed-asset-migration/integrations/business-central/README.md","type":"text/plain;charset=utf-8","text":"# Business Central and Dynaway source preparation\n\nThis module prepares complete, already-received native asset-master responses for the existing fixed-asset migration workspace. It preserves each original response, the actual company and native record IDs, the business-number crosswalk, the observed page chain, and the distinction between maintenance and financial assets.\n\nThe installed product remains `services/fixed-asset-migration/`. Its six-domain engine, supporting-file journal, mappings, corrections, financial basis, handover and reopen functions are unchanged. Work-order costs and reviewed allocations use the product's separate work-order contribution.\n\n## What is implemented\n\n- A pure JavaScript `prepareMasterCapture(capture)` function for standard Business Central `fixedAssets` and Dynaway `assets` responses.\n- A command-line preparer that publishes complete immutable output files. An interrupted retry reuses exact completed files; a different edition cannot overwrite them.\n- Machine-readable provider contracts, source references and field mapping.\n- The original `assets.csv` format, native GUID/business-number crosswalk, maintenance-to-fixed-asset links, exact raw pages and a manifest.\n\nThis module makes no network request, holds no credentials, changes no tenant record and invokes no posting action. A prepared master is not financial reconciliation. The source index records the actual public documentation inspected on 13 October 2026; current customer settings and the full issued procurement remain separate inputs.\n\n## Run the preparer\n\nUse the same Node runtime as the existing workspace. No new package is required.\n\n~~~sh\nnode services/fixed-asset-migration/integrations/business-central/prepare-master-cli.mjs \\\n  --capture /absolute/native-master-capture.json \\\n  --out /absolute/prepared-native-master\n~~~\n\nFor an existing browser or source receiver, import the pure function:\n\n~~~js\nimport {prepareMasterCapture}\n  from './integrations/business-central/prepare-master.mjs';\n\nconst prepared = prepareMasterCapture(capture);\nfor (const file of prepared.files) {\n  // file.path, file.mimeType, file.text, file.bytes, file.sha256\n  // Retain complete files through the original supporting-file/import workflow.\n}\n~~~\n\nThe included `capture-example.json` is an explicitly illustrative two-page maintenance response. Its GUIDs, tenant name and records are examples, not a customer export. It exercises punctuation, an embedded newline and two maintenance assets linked to one fixed asset. Replace the entire capture with the original selected provider responses; do not relabel the example as received source.\n\n## Capture contract\n\n`schema` is `tjlabs.business-central-master-capture.v1`. Supply:\n\n| Field | Meaning |\n| --- | --- |\n| kind | `fixedAssets` or `maintenanceAssets` |\n| tenantId / environment | Actual selected tenant and environment, retained literally |\n| companyId | Actual native company GUID |\n| canonicalCompanyId | Explicit company key used by the original migration workspace |\n| collectionUrl | Exact HTTPS company collection, with no query, credentials or fragment |\n| observedAt | Actual ISO capture time; the preparer does not generate an observation |\n| population.complete | Operator declaration of the full selected master population |\n| population.description | Selection, exclusions, filters, snapshot/export basis and observation limitations |\n| pages | Ordered complete HTTP 200 responses with `url` and exact UTF-8 `bodyText` |\n| pages[].sha256 | Optional prior hash, checked against complete response text |\n| pages[].requestId / etag | Optional original text metadata; never an authorization header dump |\n\nEach body must contain its native `value` array. The next page URL must exactly match the previous `@odata.nextLink`; every continuation must be received. A terminal page ends the capture. Repeated URLs, native record IDs or business numbers fail preparation. Continuations must retain the selected company collection and contain no authentication query value. A declaration of a complete population cannot begin with a filter, search, apply, top, skip or skip-token selection.\n\nOnly the original literal URLs are retained; this module does not follow them. Complete pagination proves a received page chain. It does not establish a transactionally consistent export if records changed during capture. Retain the actual provider snapshot/export basis and capture interval in the source description. An intentionally filtered complete chain must declare `population.complete:false`.\n\nThe original engine limits apply: 100,000 master rows, 32 MiB per raw supporting file and CSV, 128 supporting files, and a 128 MiB portable workspace. Raw page text is limited to 128 MiB in aggregate and at most 124 pages, reserving four supporting-file slots for this module's crosswalks, scope and manifest. The whole workspace also includes base64 overhead, other sources and journal history, so its original import/export limit remains authoritative. Preserve a complete independent source scope when an existing workspace has insufficient room; do not truncate source pages.\n\n## Output and original workspace adoption\n\n| File | Purpose |\n| --- | --- |\n| assets.csv | Exact original asset domain: company_id, asset_id, parent_asset_id, class_code, description |\n| native-identities.csv | Native API kind, GUID, literal business number, ETag, original page and zero-based array index |\n| maintenance-fixed-asset-links.csv | Every native maintenance-to-financial link, with its original record location |\n| originals/page-NNNN.json | Byte-identical UTF-8 response text, including additional unprojected fields |\n| capture-scope.json | Selected tenant/company, actual source scope, native page chain and limitations |\n| manifest.json | Full file lengths/hashes and the same source scope |\n\nImport the complete original pages, crosswalks, scope and manifest through the existing `supporting` action. Import the selected prepared CSV through the original `import` action with domain `assets`, then use the existing `map` action. The five column indexes are 0 through 4; amount_multiplier is 1. Every action keeps its own original operationId and expectedRevision. A request retry uses its saved original body and operation ID.\n\nA minimal saved asset import request, after selecting the actual current workspace revision, is:\n\n~~~json\n{\n  \"operationId\": \"bc-master-import-selected-edition\",\n  \"expectedRevision\": 6,\n  \"role\": \"source\",\n  \"domain\": \"assets\",\n  \"filename\": \"assets.csv\",\n  \"observedAt\": \"2026-10-13T16:00:00Z\"\n}\n~~~\n\nThe revision and timestamp above are illustrative. Use the actual saved workspace values and capture time.\n\n~~~sh\nnode services/fixed-asset-migration/cli.mjs import \\\n  --workspace /absolute/migration-workspace.json \\\n  --request /absolute/saved-import-request.json \\\n  --csv /absolute/prepared-native-master/assets.csv\n~~~\n\nThe command returns the source ID for the separately saved mapping request. For each retained supporting file, the original `supporting` command takes `--file`, plus a saved request containing operationId, expectedRevision, filename, mimeType and purpose. The existing browser performs the same original journal actions.\n\n**Choose the financial master deliberately.** Standard `fixedAssets.number` is the fixed-asset business key used to join financial exports. Dynaway `assetNo` is a maintenance identity. Keep the maintenance capture as work-order context/supporting source when the financial workspace already uses fixed-asset numbers. Do not replace that financial master with maintenance assets or union the two identity spaces. Several maintenance assets can link to one fixed asset; preserve all those links while counting its financial balance once.\n\nFor a maintenance-only master review, the adapter preserves `parentAssetNo` and `categoryCode`; the original engine detects missing parents and cycles. A maintenance category is not automatically a financial fixed-asset class. Standard fixed-asset parent hierarchy is left blank because the documented card projection does not establish it.\n\n## Complete the financial and work-order delivery\n\n`FIELD_MAPPING.csv` and `PROVIDER_CONTRACTS.json` carry the exact source-to-workspace distinctions. The preparer creates no books, balances, movements, journals or control totals. Obtain those complete exports from the actual source and target, preserving company, book, currency, dates, posting identity, amount scale and exact decimal strings.\n\nUse the existing work-order contribution to retain original order/cost CSVs, reviewed field mappings, corrections, allocation decisions and actual-return matches. Expected cost, actual posted cost, budget and capitalization are different bases. A quantity is not a currency amount. An expense's expected unit cost multiplied by its quantity does not prove an actual posting. A missing native amount stays missing.\n\nNative resource, item and expense line records retain their `id` and `documentId`. The analytics ledger `id` is a ledger-entry identity. Its published `planNo` is a maintenance-plan number and cannot be substituted for a work-order GUID. The documented ledger sample does not establish all resource/item actual costs or an order-header link. Obtain a supported actual export/metadata field or record an explicitly reviewed source-to-target match; do not pair by description, sequence or amount alone.\n\nFor allocations, retain each source cost's signed decimal amount and separate currency/cost basis. Explicit destination amounts must sum to the original amount. A company is not inferred from a division or dimension. Keep the actual project/task references and original dimension setup. Dynaway's project integration requires the selected project and receiving project line to be marked for maintenance, and applies its configured dimension priorities. Inspect those actual settings before using that path. [Dynaway project integration](https://help.dynaway.com/eam-bc/work-orders/integration-with-projects/) · [dimension setup](https://help.dynaway.com/eam-bc/dynaway-eam/dimension-setup/)\n\nThe original financial engine then compares complete source/target rows, movement roll-forwards, journal balance and declared carrying equations. It requires the actual financial basis and population declarations; a master-only capture remains financially incomplete. Export the full original handover, receive it at a new location and compare the exact source files, mapping/correction history, supporting bytes and financial result.\n\n## Native target selection and recovery\n\nAn authorized native receiver should retain tenant, environment, company GUID and LCY, installed Business Central/Dynaway versions, actual API metadata, selected import template, filters and account permissions. Reuse the existing approved application/account route. Microsoft's existing S2S route distinguishes API and automation permissions and applies Business Central object permissions. This module does not create an application or r
