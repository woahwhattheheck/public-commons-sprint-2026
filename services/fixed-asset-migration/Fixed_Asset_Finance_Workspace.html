equest tenant-wide authority. [Microsoft S2S contract](https://learn.microsoft.com/en-us/dynamics365/business-central/dev-itpro/administration/automation-apis-using-s2s-authentication)\n\nNative import and posting are separate operator actions. Download the selected installed assisted-setup template and validate the complete prepared workbook against it; template availability does not establish that arbitrary historical posted entries can be imported. Native fixed-asset journal choice depends on the selected depreciation book's G/L integration. [Dynaway assisted setup](https://help.dynaway.com/eam-bc/dynaway-eam/use-the-assisted-setup-wizard/) · [Microsoft fixed-asset setup](https://learn.microsoft.com/en-us/dynamics365/business-central/fa-setup)\n\nBefore a target edit, preserve its current native ID and ETag where supported. Preserve request bytes/hash, provider status, request/correlation ID, complete response and returned ledger IDs. Microsoft fixed-asset PATCH requires If-Match. Posting and closing have distinct native meanings; an uncertain post must be reconciled against the original native operation and resulting entries before retrying. No provider idempotency guarantee is asserted here. Follow actual provider 429/timeout instructions and continuation tokens. [Microsoft fixed-asset PATCH](https://learn.microsoft.com/en-us/dynamics365/business-central/dev-itpro/api-reference/v2.0/api/dynamics_fixedasset_update) · [API limits](https://learn.microsoft.com/en-us/dynamics365/business-central/dev-itpro/api-reference/v2.0/dynamics-rate-limits)\n\nTwo documentation discrepancies remain explicit: Microsoft's fixed-asset update example uses business-number-looking IDs despite GUID resource typing and includes extra financial fields; Dynaway's example posting URI omits a closing company parenthesis. The preparer requires actual GUID master identities and never constructs a posting URL. Resolve installed metadata instead of treating these examples as tenant facts.\n\n## Receiving and review status\n\nThe exact adapter and original engine were executed together in V8 using an illustrative interface fixture. The run retained complete raw pages, two maintenance links to one financial asset, original supporting/import/mapping receipts, unchanged replay, and exact portable export/reopen. It confirmed that master-only data remains financially incomplete and rejected missing/different-company continuations, an encoded limited full-population request, duplicate native identity and an invalid date.\n\nThat is a source-level producer/consumer check. It is not a customer tenant run, a native Node CLI run or a rendered browser review. The whole joined product's original receiving operation must run the command, import actual selected sources, operate the important browser controls at desktop and narrow widths, and inspect real exported/reopened files. Preserve that single receiving operation and its original source/target identities.\n","bytes":14005,"sha256":"cd39e4b4865b14537d0657cbeb801e727d46307632a79d619572862a6c388864"},{"path":"services/fixed-asset-migration/integrations/business-central/SOURCE_INDEX.json","type":"application/json","text":"{\n  \"schema\": \"tjlabs.provider-source-index.v1\",\n  \"scope\": \"Public supported interfaces; selected customer tenant has not been inspected.\",\n  \"productBase\": {\n    \"repository\": \"woahwhattheheck/public-commons-sprint-2026\",\n    \"commit\": \"21dae00a10e0341054bbe8892a1fb6636a0a08a7\",\n    \"donor\": \"48e63c7a45e7b2e5c5bf8c30f18d0a1f577f2681\",\n    \"engine\": \"services/fixed-asset-migration/engine.mjs\"\n  },\n  \"sources\": [\n    {\n      \"id\": \"MS-FA\",\n      \"title\": \"Microsoft Learn: fixedAsset resource\",\n      \"url\": \"https://learn.microsoft.com/en-us/dynamics365/business-central/dev-itpro/api-reference/v2.0/resources/dynamics_fixedasset\",\n      \"publisher\": \"Microsoft\",\n      \"readAt\": \"2026-10-13\",\n      \"observation\": \"Standard master-card field list; GUID id; financial-book coverage must be checked against actual tenant metadata.\"\n    },\n    {\n      \"id\": \"MS-FA-PATCH\",\n      \"title\": \"Microsoft Learn: update fixedAssets\",\n      \"url\": \"https://learn.microsoft.com/en-us/dynamics365/business-central/dev-itpro/api-reference/v2.0/api/dynamics_fixedasset_update\",\n      \"publisher\": \"Microsoft\",\n      \"readAt\": \"2026-10-13\",\n      \"observation\": \"If-Match required; update changed properties. Examples conflict with the resource property list and GUID typing.\"\n    },\n    {\n      \"id\": \"MS-API\",\n      \"title\": \"Microsoft Learn: API v2 overview\",\n      \"url\": \"https://learn.microsoft.com/en-us/dynamics365/business-central/dev-itpro/api-reference/v2.0/\",\n      \"publisher\": \"Microsoft\",\n      \"readAt\": \"2026-10-13\",\n      \"observation\": \"API Overview identifies installed APIs; custom API needed for additional field exposure.\"\n    },\n    {\n      \"id\": \"MS-FA-SETUP\",\n      \"title\": \"Microsoft Learn: fixed-asset setup\",\n      \"url\": \"https://learn.microsoft.com/en-us/dynamics365/business-central/fa-setup\",\n      \"publisher\": \"Microsoft\",\n      \"readAt\": \"2026-10-13\",\n      \"observation\": \"Depreciation book G/L integration determines the relevant native financial journal.\"\n    },\n    {\n      \"id\": \"MS-PACKAGES\",\n      \"title\": \"Microsoft Learn: company configuration packages\",\n      \"url\": \"https://learn.microsoft.com/en-us/dynamics365/business-central/dev-itpro/administration/set-up-standard-company-configuration-packages\",\n      \"publisher\": \"Microsoft\",\n      \"readAt\": \"2026-10-13\",\n      \"observation\": \"Configuration packages/templates support company setup and master-data import.\"\n    },\n    {\n      \"id\": \"MS-AUTH\",\n      \"title\": \"Microsoft Learn: S2S authentication\",\n      \"url\": \"https://learn.microsoft.com/en-us/dynamics365/business-central/dev-itpro/administration/automation-apis-using-s2s-authentication\",\n      \"publisher\": \"Microsoft\",\n      \"readAt\": \"2026-10-13\",\n      \"observation\": \"Existing Entra application uses client-credentials and BC object permissions; API and automation privileges are distinct.\"\n    },\n    {\n      \"id\": \"MS-PAGING\",\n      \"title\": \"Microsoft Learn: OData paging\",\n      \"url\": \"https://learn.microsoft.com/en-us/dynamics365/business-central/dev-itpro/webservices/server-driven-paging-in-odata-web-services\",\n      \"publisher\": \"Microsoft\",\n      \"readAt\": \"2026-10-13\",\n      \"observation\": \"Server-driven pages; Prefer odata.maxpagesize; every continuation must be retained.\"\n    },\n    {\n      \"id\": \"MS-LIMITS\",\n      \"title\": \"Microsoft Learn: API limits\",\n      \"url\": \"https://learn.microsoft.com/en-us/dynamics365/business-central/dev-itpro/api-reference/v2.0/dynamics-rate-limits\",\n      \"publisher\": \"Microsoft\",\n      \"readAt\": \"2026-10-13\",\n      \"observation\": \"429 cooldown, bounded requests, 504 request-timeout recovery and continuation capture.\"\n    },\n    {\n      \"id\": \"DYN-ASSETS\",\n      \"title\": \"Dynaway: native assets GET\",\n      \"url\": \"https://help.dynaway.com/eam-bc/api/v1/assets-eam/get-assets/\",\n      \"publisher\": \"Dynaway\",\n      \"readAt\": \"2026-10-13\",\n      \"observation\": \"Maintenance assetNo/parentAssetNo/fixedAssetNumber and native id are distinct identities.\"\n    },\n    {\n      \"id\": \"DYN-RESOURCES\",\n      \"title\": \"Dynaway: create resource line\",\n      \"url\": \"https://help.dynaway.com/eam-bc/api/v1/work-orders/create-res-line/\",\n      \"publisher\": \"Dynaway\",\n      \"readAt\": \"2026-10-13\",\n      \"observation\": \"Resource/UoM/work type, quantities, consumed state and native line/document identities.\"\n    },\n    {\n      \"id\": \"DYN-ITEMS\",\n      \"title\": \"Dynaway: create item line\",\n      \"url\": \"https://help.dynaway.com/eam-bc/api/v1/work-orders/create-item-line/\",\n      \"publisher\": \"Dynaway\",\n      \"readAt\": \"2026-10-13\",\n      \"observation\": \"Item/UoM quantities and native line/document identities.\"\n    },\n    {\n      \"id\": \"DYN-EXPENSES\",\n      \"title\": \"Dynaway: create expense line\",\n      \"url\": \"https://help.dynaway.com/eam-bc/api/v1/work-orders/create-exp-line/\",\n      \"publisher\": \"Dynaway\",\n      \"readAt\": \"2026-10-13\",\n      \"observation\": \"Expense/vendor/UoM, expected LCY unit cost, quantities and native identities.\"\n    },\n    {\n      \"id\": \"DYN-LEDGER\",\n      \"title\": \"Dynaway: work-order ledger entries\",\n      \"url\": \"https://help.dynaway.com/eam-bc/api/v1/ledger-entries/get-work-order-entries/\",\n      \"publisher\": \"Dynaway\",\n      \"readAt\": \"2026-10-13\",\n      \"observation\": \"Posted analytics fields include expense expected/actual LCY; sample lacks complete resource/item cost and order-header identity.\"\n    },\n    {\n      \"id\": \"DYN-POST\",\n      \"title\": \"Dynaway: post work order\",\n      \"url\": \"https://help.dynaway.com/eam-bc/api/v1/work-orders/post-wo/\",\n      \"publisher\": \"Dynaway\",\n      \"readAt\": \"2026-10-13\",\n      \"observation\": \"Explicit bound posting action; published URI has a missing parenthesis, requiring actual metadata resolution.\"\n    },\n    {\n      \"id\": \"DYN-PROJECTS\",\n      \"title\": \"Dynaway: project integration\",\n      \"url\": \"https://help.dynaway.com/eam-bc/work-orders/integration-with-projects/\",\n      \"publisher\": \"Dynaway\",\n      \"readAt\": \"2026-10-13\",\n      \"observation\": \"Project and receiving project line must be marked Maintenance; resource/item/expense posting and project-task linkage.\"\n    },\n    {\n      \"id\": \"DYN-DIMENSIONS\",\n      \"title\": \"Dynaway: dimension setup\",\n      \"url\": \"https://help.dynaway.com/eam-bc/dynaway-eam/dimension-setup/\",\n      \"publisher\": \"Dynaway\",\n      \"readAt\": \"2026-10-13\",\n      \"observation\": \"EAM_MAINT default dimension priorities and dimensions applied at work-order creation.\"\n    },\n    {\n      \"id\": \"DYN-IMPORT\",\n      \"title\": \"Dynaway: assisted setup\",\n      \"url\": \"https://help.dynaway.com/eam-bc/dynaway-eam/use-the-assisted-setup-wizard/\",\n      \"publisher\": \"Dynaway\",\n      \"readAt\": \"2026-10-13\",\n      \"observation\": \"Installed Excel templates for assets, fixed-asset links, plans, warranties, counters and measurements.\"\n    },\n    {\n      \"id\": \"DYN-BUDGET\",\n      \"title\": \"Dynaway: maintenance budgets\",\n      \"url\": \"https://help.dynaway.com/eam-bc/maintenance-budgets/working-with-maintenance-budgets/\",\n      \"publisher\": \"Dynaway\",\n      \"readAt\": \"2026-10-13\",\n      \"observation\": \"Scenario budgets are planned resource/item/expense amounts with periods and dimensions, separate from posted actuals.\"\n    }\n  ]\n}\n","bytes":7168,"sha256":"b4a85ad67e2b803d47079bb9ead51ea6d814dbf4c45c7af96374ff8f596ef83a"},{"path":"services/fixed-asset-migration/integrations/business-central/WORK_ORDER_SOURCE.md","type":"text/plain;charset=utf-8","text":"# Native work-order source preparation\n\nThis addition connects original Dynaway responses to the existing **Work orders and costs** desk. It runs offline, uses the current fixed-asset engine's CSV, decimal and hash functions, and leaves its mapping, corrections, allocations, target matching, rehearsal, handover and reopen operations unchanged.\n\nIt prepares **retained source**, not a target import or accounting posting. Current Port of Bellingham tenant records and the complete issued RFP have not been received by this adapter. The companion fixture is expressly illustrative.\n\n## Business Central metadata and readback companion\n\nUse [MICROSOFT_CONTEXT_CONTRACT.json](MICROSOFT_CONTEXT_CONTRACT.json) for the source-bound company, currency, dimensions and readback capture plan. [MICROSOFT_SOURCE_INDEX.json](MICROSOFT_SOURCE_INDEX.json) retains the 21 official Microsoft references and their resource scope. [MICROSOFT_RECONCILIATION.md](MICROSOFT_RECONCILIATION.md) explains how those original records join the existing work-order and financial journals without inferring historical balances, target IDs, dimension allocations or currency conversion.\n\nThe required `companyContext` below is the contract's actual single `generalLedgerSetup` response. Currency decimal-place settings and rounding precision remain distinct original values; the preparer does not round amounts to two decimals. Dimension-set line GUIDs, default dimensions and posted dimensions remain distinct identities and evidence.\n\n## Use the original application\n\nFrom the complete existing application source, run:\n\n```sh\nnode services/fixed-asset-migration/integrations/business-central/prepare-work-orders-cli.mjs \\\n  --capture /absolute/retained-work-order-capture.json \\\n  --out /absolute/prepared-original-work-orders\n```\n\nThe output directory is immutable. Repeating the same capture reuses identical files; conflicting members fail preflight instead of overwriting an earlier edition. This is the same create-only publication pattern as the installed master preparer. Use a different explicit directory for another source edition.\n\nFor the existing browser/engine integration:\n\n```js\nimport {prepareWorkOrderCapture}\n  from './integrations/business-central/prepare-work-orders.mjs';\n\nconst prepared = prepareWorkOrderCapture(capture);\n// prepared.scope describes original selection and missing fields.\n// prepared.files contains every complete {path,mimeType,text,bytes,sha256}.\n```\n\nNo additional npm package, server, account or credential is required.\n\n## What can be prepared\n\n| kind | Retained response | Identity and usable result |\n| --- | --- | --- |\n| resourceLines | One or more individually requested native resource line objects | Actual company + documentId + id; labor kind; explicitly selected quantity state. Actual line cost remains missing. |\n| itemLines | Individually requested item line objects | Actual company + documentId + id; material kind and selected quantity. Actual cost remains missing. |\n| expenseLines | Individually requested expense line objects | Actual expense/vendor/document/line identities. expectedUnitCostLCY remains a unit price, so no total cost is invented. |\n| postedLedger | Complete ordered Analytics woLedgerEntries response pages | Actual company + ledger id; posted quantity; optionally selected actual or expected expense **line** cost. The documented projection does not establish the order header link. |\n\nThe individual GET routes are documented by Dynaway: [resource line](https://help.dynaway.com/eam-bc/api/v1/work-orders/get-res-line/), [item line](https://help.dynaway.com/eam-bc/api/v1/work-orders/get-item-line/), [expense line](https://help.dynaway.com/eam-bc/api/v1/work-orders/get-exp-line/). An individually selected set must declare population.complete=false; it does not prove the complete work-order population.\n\nThe [Analytics ledger response](https://help.dynaway.com/eam-bc/api/v1/ledger-entries/get-work-order-entries/) retains planNo separately. It is not substituted for a work-order number or document GUID. Resource, Item and Expense are mapped explicitly to the existing labor, material and expense kinds. Other native types remain unmapped.\n\n## Complete capture contract\n\nThe schema is `tjlabs.business-central-work-order-capture.v1`. Supply actual tenantId, environment, companyId GUID, canonicalCompanyId, collectionUrl, observedAt, population, selection and pages. companyId identifies the original API company; canonicalCompanyId is the reviewed original workspace key. A division, location, project or dimension does not create a legal company.\n\nFor individual lines, supply the actual workOrderId GUID. collectionUrl ends in the corresponding workOrders(orderId)/workOrderResourceLines, workOrderItemLines or workOrderExpenseLines collection. Each pages[].url includes the individually requested line GUID in parentheses. The original response id must match that URI, and its documentId must match the selected order. These are documented single-record GETs; no undocumented collection-list capability is assumed.\n\nFor postedLedger, collectionUrl ends in `/api/dynaway/eamAnalytics/v1.0/companies(companyId)/woLedgerEntries`. Each pages[] entry has status 200, its literal requested url and complete bodyText; optional sha256 is verified. Optional requestId and etag stay attached to the original page. The first page and every @odata.nextLink must be retained in exact order. Repeated URLs, duplicate native IDs, missing continuations, another company/collection or a page after the terminal response fail.\n\nA complete ledger population cannot start with a filtered, searched, limited or resumed URL. A selected subset must say complete=false and describe its selection. Even a complete page chain does not prove a transactionally consistent snapshot; retain the provider's actual export/observation basis. The adapter performs no HTTP request and follows no URL.\n\n`selection` contains:\n\n- quantityField: exactly quantity, qtyToConsume or qtyConsumed for individual lines; exactly quantity for posted ledger.\n- actor and reason: the explicit reviewer and the selected quantity/cost basis.\n- Optional expenseLineCostField: expenseActualLineCostLCY or expenseExpectedLineCostLCY, permitted only for postedLedger and applied only to literal Expense rows.\n- For that LCY selection, lcyCode and lcySourceReference identify the actual company currency and reviewed source reference.\n\nSelecting expenseLineCostField also requires **companyContext** with status=200, exact url and complete bodyText for the original single generalLedgerSetup record. Its actual returned id must match the URL key, its tenant/environment/company prefix must match the selected Dynaway capture, and localCurrencyCode must equal selection.lcyCode. Optional sha256 is verified. The complete company response is retained alongside the ledger originals.\n\nMicrosoft documents this [generalLedgerSetup GET](https://learn.microsoft.com/en-us/dynamics365/business-central/dev-itpro/api-reference/v2.0/api/dynamics_generalledgersetup_get). Its example setup GUID is illustrative; obtain the real installed record. A currency symbol, another company's setting, or additional reporting currency cannot establish LCY. The existing workspace accepts three uppercase-letter currency codes; other actual codes require an explicitly reviewed supported mapping or product extension, never silent substitution.\n\n## Exact output and deliberate missing values\n\n| File | Original application use |\n| --- | --- |\n| work-order-source.csv | Import into the existing source/costs or target/costs selection and map the canonical columns explicitly. |\n| source-findings.csv | Original rows whose required header link, amount, quantity or native kind remains unresolved. |\n| originals/page-NNNN.json | Byte-identical full provider responses, preserving all unprojected fields. |\n| originals/general-ledger-setup.json | Required original company LCY evidence when LCY line costs were selected. |\n| capture.json | Complete selected capture and review inputs, including all original responses. |\n| capture-scope.json | Native identities, row locations, page chain, exact mapping indexes, field types, review and limitations. |\n| manifest.json | Complete prepared member paths, lengths and hashes. |\n\nThe canonical columns follow the installed work-orders.mjs FIELDS.costs order. capture-scope.json includes mappingColumns with the actual zero-based column indexes. The remaining columns preserve every native top-level field as `native:\u003cfield>`, paired with `native-type:\u003cfield>`. Scalar strings are directly readable/mappable, numbers retain their exact original lexical spelling, and objects/arrays stay complete JSON. The type column distinguishes absent members, null, empty strings, numbers and other JSON types.\n\nSelected numeric values never pass through JavaScript Number. Exponents are expanded exactly; the original engine then validates its supported decimal range without rounding. Native numeric spellings—including trailing zeroes—and full response bytes stay retained. Repeated JSON member names are rejected so a second value cannot silently replace the mapped source.\n\nThe staging file does not insert an actual cost of zero when the source lacks one. An explicitly present numeric zero remains zero. Expected unit cost is never multiplied by quantity to manufacture a posted total. The selected line-cost basis remains actual or expected; no exchange conversion, tax adjustment, capitalization, or unit conversion is inferred.\n\nThe original Analytics example lacks an order header ID. That row therefore remains missing work_order_id even if its planNo is populated. Resolve it using the supplier's real additional export or an attributed original correction and supporting bridge, then preserve that review in the existing workspace. Do not pair records by similar descriptions, sequence numbers or amounts.\n\n## Adopt through the existing journal and continue\n\n1. Retain every supporting original and the prepared scope/manifest through the original `supporting` command. Each saved request supplies its original operationId, expectedRevision, filename, mimeType and purpose. Preserve returned receipts.\n2. Import work-order-source.csv using the existing `wo-import` command, with the intended source or target role and domain costs. Save the complete request before invoking it; a retry uses that same operation ID and body.\n3. Read the actual returned source ID. Use it in the separately saved `wo-map` request; copy the reviewed capture-scope mappingColumns. Do not invent a source ID or current revision.\n4. Import the real order headers separately. Use source findings and the existing correction/column-mapping controls to resolve missing links and amounts from actual source evidence.\n5. Continue the installed allocation, header readback, target cost matching, two rehearsals and original financial basis. A prepared API file cannot satisfy those outcomes by itself.\n6. Export the original complete handover. At the independent receiving location, reopen the same workspace and inspect its original API files, exact numeric values, source rows, review operations and reconciliation.\n\n```sh\nnode services/fixed-asset-migration/cli.mjs wo-import \\\n  --workspace /absolute/migration/workspace.json \\\n  --request /absolute/requests/import-native-costs.json \\\n  --csv /absolute/prepared-original-work-orders/work-order-source.csv\n\nnode services/fixed-asset-migration/cli.mjs wo-map \\\n  --workspace /absolute/migration/workspace.json \\\n  --request /absolute/requests/map-native-costs.json\n\nnode services/fixed-asset-migration/cli.mjs wo-report \\\n  --workspace /absolute/migration/workspace.json \\\n  --out /absolute/results/native-cost-readback.json\n\nnode services/fixed-asset-migration/cli.mjs handover \\\n  --workspace /absolute/migration/workspace.json \\\n  --out /absolute/results/complete-handover\n```\n\nThe existing financial and work-order journals retain the operation history, original source and current basis. A source change does not replace the earlier receipt or turn an old rehearsal into a current acceptance.\n\nAll generated members are preflighted against the original file limit. The preparer also checks the aggregate and minimum base64 payload against the original workspace budget. Existing sources, operations, JSON escaping and later edits consume additional space; the original workspace's complete serialized limit remains authoritative. Select a smaller explicit complete scope when needed. Never truncate a page or discard historical originals to force import.\n\n## Native posting and dimensions\n\n[Posted work orders](https://help.dynaway.com/eam-bc/reporting-history/posted-work-orders/) are read-only history. Current line GET/POST/PATCH interfaces do not establish a supported migration route for arbitrary historical posted entries. Obtain the installed supplier import contract before any target load.\n\nThe [ledger UI documentation](https://help.dynaway.com/eam-bc/reporting-history/work-order-ledger-entries/) names links to original work orders, connected ledger entries, dimensions and fixed assets. Those UI labels do not prove equivalent API JSON fields. Bind actual installed metadata and preserve the full supported export.\n\n[Project integration](https://help.dynaway.com/eam-bc/work-orders/integration-with-projects/) requires the relevant project and project line to be maintenance-marked. [Dimension setup](https://help.dynaway.com/eam-bc/dynaway-eam/dimension-setup/) describes EAM_MAINT priorities and creation-time inheritance. Neither fact defines the Port's multi-division percentage split. Preserve actual dimension sets, project/task links, source costs and the existing explicit allocation decisions separately.\n\n## Receiving state\n\nA focused exercise used the actual adapter and original engine/work-order module: a signed decimal beyond the safe JS integer range stayed exact; complete native numeric spelling and nested values survived; import/mapping/reopen retained a missing order link as an unresolved finding. This is an illustrative source-level exercise, not Port data or a tenant/native browser run.\n\nThe producing owner must run the exact installed CLI and existing application, open and LOOK at the real desktop/narrow result, use the mapping/correction/source controls, download all actual outputs and reopen the complete handover before calling it recipient ready. The current application owner's receiving operation remains the sole product/visual course. Do not use Bryce's personal browser during his reserved period.\n","bytes":14619,"sha256":"93b0213f5220ad174e37dabf92be47690010ef374f75060b07e2fcdafc0020c8"},{"path":"services/fixed-asset-migration/integrations/business-central/WORK_ORDER_SOURCE_CONTRACT.json","type":"application/json","text":"{\n  \"schema\": \"tjlabs.business-central-work-order-source-contract.v1\",\n  \"edition\": \"2026-10-13\",\n  \"product\": \"services/fixed-asset-migration\",\n  \"entrypoint\": \"integrations/business-central/prepare-work-orders.mjs#prepareWorkOrderCapture\",\n  \"scope\": \"Pure retained-response preparation into the existing work-order mapping desk. No target tenant read/write, new posting, historical import or completeness certification.\",\n  \"captureSchema\": \"tjlabs.business-central-work-order-capture.v1\",\n  \"collections\": [\n    {\n      \"kind\": \"resourceLines\",\n      \"namespace\": \"dynaway/eam/v1.0\",\n      \"response\": \"individual line JSON\",\n      \"uri\": \"companies({companyId})/workOrders({workOrderId})/workOrderResourceLines({lineId})\",\n      \"identity\": [\n        \"companyId\",\n        \"documentId\",\n        \"id\"\n      ],\n      \"canonicalKind\": \"labor\",\n      \"quantitySelection\": [\n        \"quantity\",\n        \"qtyToConsume\",\n        \"qtyConsumed\"\n      ],\n      \"costProjection\": null,\n      \"source\": \"DYN-RESOURCE-GET\"\n    },\n    {\n      \"kind\": \"itemLines\",\n      \"namespace\": \"dynaway/eam/v1.0\",\n      \"response\": \"individual line JSON\",\n      \"uri\": \"companies({companyId})/workOrders({workOrderId})/workOrderItemLines({lineId})\",\n      \"identity\": [\n        \"companyId\",\n        \"documentId\",\n        \"id\"\n      ],\n      \"canonicalKind\": \"material\",\n      \"quantitySelection\": [\n        \"quantity\",\n        \"qtyToConsume\",\n        \"qtyConsumed\"\n      ],\n      \"costProjection\": null,\n      \"source\": \"DYN-ITEM-GET\"\n    },\n    {\n      \"kind\": \"expenseLines\",\n      \"namespace\": \"dynaway/eam/v1.0\",\n      \"response\": \"individual line JSON\",\n      \"uri\": \"companies({companyId})/workOrders({workOrderId})/workOrderExpenseLines({lineId})\",\n      \"identity\": [\n        \"companyId\",\n        \"documentId\",\n        \"id\"\n      ],\n      \"canonicalKind\": \"expense\",\n      \"quantitySelection\": [\n        \"quantity\",\n        \"qtyToConsume\",\n        \"qtyConsumed\"\n      ],\n      \"costProjection\": null,\n      \"source\": \"DYN-EXPENSE-GET\"\n    },\n    {\n      \"kind\": \"postedLedger\",\n      \"namespace\": \"dynaway/eamAnalytics/v1.0\",\n      \"response\": \"complete paged value array\",\n      \"uri\": \"companies({companyId})/woLedgerEntries\",\n      \"identity\": [\n        \"companyId\",\n        \"id\"\n      ],\n      \"canonicalKindByLiteralType\": {\n        \"Resource\": \"labor\",\n        \"Item\": \"material\",\n        \"Expense\": \"expense\"\n      },\n      \"quantitySelection\": [\n        \"quantity\"\n      ],\n      \"costProjection\": {\n        \"onlyLiteralType\": \"Expense\",\n        \"choices\": {\n          \"expenseActualLineCostLCY\": \"actual\",\n          \"expenseExpectedLineCostLCY\": \"expected\"\n        },\n        \"requires\": [\n          \"selection.lcyCode\",\n          \"selection.lcySourceReference\",\n          \"selection.actor\",\n          \"selection.reason\",\n          \"companyContext: exact original generalLedgerSetup single-record URL/body/id\"\n        ]\n      },\n      \"workOrderIdentity\": \"Not established by documented response; stays missing. planNo cannot substitute.\",\n      \"source\": \"DYN-LEDGER-GET\"\n    }\n  ],\n  \"originalFields\": \"Every original top-level field is carried in native:\u003cfield> plus native-type:\u003cfield>. Literal strings, booleans and original numeric tokens remain directly mappable; complete nested arrays/objects remain JSON. The type column distinguishes absence, null, empty text and numeric values. Exact page text remains authoritative.\",\n  \"numericPolicy\": \"No JS Number for amounts, quantities or sequence IDs. Selected decimals expand exponent notation exactly, then use the original engine's 80 whole/18 fractional digit contract. Native numeric spellings remain in raw pages and native columns. Unsupported precision rejects preparation instead of rounding.\",\n  \"statuses\": {\n    \"NEEDS_SOURCE_OR_REVIEW\": \"One or more required original fields are unavailable. Existing work-order mapping/reconciliation remains authoritative.\",\n    \"PREPARED_SOURCE_REQUIRES_EXISTING_WORKSPACE_RECONCILIATION\": \"Prepared source only; neither destination matching nor tenant acceptance established.\"\n  },\n  \"missingFacts\": [\n    \"Actual Port source and target exports\",\n    \"Current companies and actual LCY evidence\",\n    \"Selected installed BC/Dynaway metadata and versions\",\n    \"Sanctioned historical-data import route\",\n    \"Exact original ledger-to-work-order link\",\n    \"Actual item/resource cost export and full dimensions\",\n    \"Original issuer package RFP-2026-24 / Bonfire256919\"\n  ],\n  \"sources\": [\n    {\n      \"id\": \"DYN-RESOURCE-GET\",\n      \"url\": \"https://help.dynaway.com/eam-bc/api/v1/work-orders/get-res-line/\",\n      \"publisher\": \"Dynaway\",\n      \"readAt\": \"2026-10-13\",\n      \"supports\": \"Native line/document/resource IDs; independent quantity states, UoM/work type and source date/time.\"\n    },\n    {\n      \"id\": \"DYN-ITEM-GET\",\n      \"url\": \"https://help.dynaway.com/eam-bc/api/v1/work-orders/get-item-line/\",\n      \"publisher\": \"Dynaway\",\n      \"readAt\": \"2026-10-13\",\n      \"supports\": \"Native item line/document identity and independent quantities.\"\n    },\n    {\n      \"id\": \"DYN-EXPENSE-GET\",\n      \"url\": \"https://help.dynaway.com/eam-bc/api/v1/work-orders/get-exp-line/\",\n      \"publisher\": \"Dynaway\",\n      \"readAt\": \"2026-10-13\",\n      \"supports\": \"Native expense/vendor/document identities; expected UNIT cost is not an actual LINE cost.\"\n    },\n    {\n      \"id\": \"DYN-LEDGER-GET\",\n      \"url\": \"https://help.dynaway.com/eam-bc/api/v1/ledger-entries/get-work-order-entries/\",\n      \"publisher\": \"Dynaway\",\n      \"readAt\": \"2026-10-13\",\n      \"supports\": \"Separate ledger ID and planNo; posted quantity and expected/actual expense LINE costs in LCY.\"\n    },\n    {\n      \"id\": \"DYN-LEDGER-FIELDS\",\n      \"url\": \"https://help.dynaway.com/eam-bc/reporting-history/work-order-ledger-entries/\",\n      \"publisher\": \"Dynaway\",\n      \"readAt\": \"2026-10-13\",\n      \"supports\": \"Native ledger concepts include work-order links, related posting entries, locations, quantity/base quantity, dimensions and capitalization. UI fields do not prove corresponding API property names.\"\n    },\n    {\n      \"id\": \"DYN-POSTED\",\n      \"url\": \"https://help.dynaway.com/eam-bc/reporting-history/posted-work-orders/\",\n      \"publisher\": \"Dynaway\",\n      \"readAt\": \"2026-10-13\",\n      \"supports\": \"Posted work orders are read-only historical records; mutable current lines are not an arbitrary historical import contract.\"\n    },\n    {\n      \"id\": \"DYN-PROJECTS\",\n      \"url\": \"https://help.dynaway.com/eam-bc/work-orders/integration-with-projects/\",\n      \"publisher\": \"Dynaway\",\n      \"readAt\": \"2026-10-13\",\n      \"supports\": \"Project and relevant project line must be maintenance-marked; original project/task links remain separate from dimensions.\"\n    },\n    {\n      \"id\": \"DYN-DIMENSIONS\",\n      \"url\": \"https://help.dynaway.com/eam-bc/dynaway-eam/dimension-setup/\",\n      \"publisher\": \"Dynaway\",\n      \"readAt\": \"2026-10-13\",\n      \"supports\": \"EAM_MAINT dimension priorities and work-order creation-time inheritance; not a percentage cost-split specification.\"\n    },\n    {\n      \"id\": \"MS-GENERAL-LEDGER-SETUP\",\n      \"url\": \"https://learn.microsoft.com/en-us/dynamics365/business-central/dev-itpro/api-reference/v2.0/api/dynamics_generalledgersetup_get\",\n      \"publisher\": \"Microsoft\",\n      \"readAt\": \"2026-10-13\",\n      \"supports\": \"Native setup record ID and company localCurrencyCode readback; same selected company and setup body must bind selected LCY amounts.\"\n    }\n  ]\n}\n","bytes":7473,"sha256":"953895b4ea9009f15272cff7f7c549b22e8996332e8caf34169909eb92d103ec"},{"path":"services/fixed-asset-migration/integrations/business-central/capture-example.json","type":"application/json","text":"{\n  \"schema\": \"tjlabs.business-central-master-capture.v1\",\n  \"kind\": \"maintenanceAssets\",\n  \"tenantId\": \"example-tenant-not-a-customer\",\n  \"environment\": \"Sandbox\",\n  \"companyId\": \"00000000-0000-4000-8000-000000000001\",\n  \"canonicalCompanyId\": \"example-company\",\n  \"collectionUrl\": \"https://api.businesscentral.dynamics.com/v2.0/example-tenant/Sandbox/api/dynaway/eam/v1.0/companies(00000000-0000-4000-8000-000000000001)/assets\",\n  \"observedAt\": \"2026-10-13T16:00:00Z\",\n  \"population\": {\n    \"complete\": true,\n    \"description\": \"Illustrative two-row interface fixture, not a customer export.\"\n  },\n  \"pages\": [\n    {\n      \"status\": 200,\n      \"url\": \"https://api.businesscentral.dynamics.com/v2.0/example-tenant/Sandbox/api/dynaway/eam/v1.0/companies(00000000-0000-4000-8000-000000000001)/assets\",\n      \"bodyText\": \"{\\n  \\\"value\\\": [\\n    {\\n      \\\"id\\\": \\\"00000000-0000-4000-8000-000000000002\\\",\\n      \\\"assetNo\\\": \\\"MA-001\\\",\\n      \\\"description\\\": \\\"Example parent, with comma\\\",\\n      \\\"categoryCode\\\": \\\"PUMP\\\",\\n      \\\"parentAssetNo\\\": \\\"\\\",\\n      \\\"fixedAssetNumber\\\": \\\"FA-001\\\",\\n      \\\"@odata.etag\\\": \\\"W/\\\\\\\"example-a\\\\\\\"\\\"\\n    }\\n  ],\\n  \\\"@odata.nextLink\\\": \\\"https://api.businesscentral.dynamics.com/v2.0/example-tenant/Sandbox/api/dynaway/eam/v1.0/companies(00000000-0000-4000-8000-000000000001)/assets?$skiptoken=unchanged-page-token\\\"\\n}\\n\"\n    },\n    {\n      \"status\": 200,\n      \"url\": \"https://api.businesscentral.dynamics.com/v2.0/example-tenant/Sandbox/api/dynaway/eam/v1.0/companies(00000000-0000-4000-8000-000000000001)/assets?$skiptoken=unchanged-page-token\",\n      \"bodyText\": \"{\\\"value\\\":[{\\\"id\\\":\\\"00000000-0000-4000-8000-000000000003\\\",\\\"assetNo\\\":\\\"MA-002\\\",\\\"description\\\":\\\"Example child\\\\nsecond line\\\",\\\"categoryCode\\\":\\\"PUMP\\\",\\\"parentAssetNo\\\":\\\"MA-001\\\",\\\"fixedAssetNumber\\\":\\\"FA-001\\\"}]}\"\n    }\n  ]\n}\n","bytes":1850,"sha256":"5e304d70c6144c5a2d3d12cf261129aa50e4ee1c5e28bbafab70d47f1835c61e"},{"path":"services/fixed-asset-migration/integrations/business-central/prepare-master-cli.mjs","type":"text/javascript;charset=utf-8","text":"#!/usr/bin/env node\nimport fs from 'node:fs';\nimport path from 'node:path';\nimport {randomUUID} from 'node:crypto';\nimport {fileURLToPath} from 'node:url';\nimport {prepareMasterCapture} from './prepare-master.mjs';\n\nfunction regular(file){\n  const st=fs.lstatSync(file);if(!st.isFile()||st.isSymbolicLink())throw new Error('Use a complete regular file: '+file);\n  return fs.readFileSync(file);\n}\nfunction durableDirectory(directory){\n  let fd;try{fd=fs.openSync(directory,'r');fs.fsyncSync(fd);}\n  catch(error){if(!['EINVAL','EPERM','EISDIR','ENOTSUP'].includes(error.code))throw error;}\n  finally{if(fd!==undefined)fs.closeSync(fd);}\n}\nfunction publish(file,text){\n  const bytes=Buffer.from(text,'utf8');\n  try{if(!regular(file).equals(bytes))throw new Error('Another complete output edition exists at '+file);return;}\n  catch(error){if(error.code!=='ENOENT')throw error;}\n  const temporary=file+'.'+randomUUID()+'.candidate';let fd;\n  try{\n    fd=fs.openSync(temporary,'wx',0o600);fs.writeFileSync(fd,bytes);fs.fsyncSync(fd);fs.closeSync(fd);fd=undefined;\n    try{fs.linkSync(temporary,file);}catch(error){if(error.code!=='EEXIST'||!regular(file).equals(bytes))throw error;}\n    durableDirectory(path.dirname(file));\n  }finally{if(fd!==undefined)fs.closeSync(fd);fs.rmSync(temporary,{force:true});}\n}\nexport function main(args=process.argv.slice(2)){\n  if(args.length!==4||args[0]!=='--capture'||args[2]!=='--out')throw new Error('Use --capture /absolute/capture.json --out /absolute/output-directory');\n  if(!path.isAbsolute(args[1])||!path.isAbsolute(args[3]))throw new Error('Use absolute capture and output paths.');\n  const input=fs.lstatSync(args[1]);if(!input.isFile()||input.isSymbolicLink())throw new Error('Use a complete original regular capture file.');\n  if(input.size>128*1024*1024)throw new Error('Capture exceeds the original workspace limit.');\n  const raw=regular(args[1]),text=raw.toString('utf8');\n  if(!Buffer.from(text,'utf8').equals(raw))throw new Error('Capture must be complete UTF-8.');\n  const result=prepareMasterCapture(JSON.parse(text)),root=path.resolve(args[3]);\n  fs.mkdirSync(root,{recursive:true,mode:0o700});const st=fs.lstatSync(root);\n  if(!st.isDirectory()||st.isSymbolicLink())throw new Error('Use an ordinary output directory.');\n  const actualRoot=fs.realpathSync(root);\n  for(const file of result.files){\n    const target=path.resolve(root,file.path);\n    if(!target.startsWith(root+path.sep))throw new Error('Keep prepared output inside its selected directory.');\n    fs.mkdirSync(path.dirname(target),{recursive:true,mode:0o700});\n    const parent=fs.realpathSync(path.dirname(target));\n    if(parent!==actualRoot&&!parent.startsWith(actualRoot+path.sep))throw new Error('Keep output members inside the selected directory.');\n    publish(target,file.text);\n  }\n  return {scope:result.scope,output:root,files:result.files.map(({text,...file})=>file)};\n}\nif(process.argv[1]&&path.resolve(process.argv[1])===fileURLToPath(import.meta.url)){\n  try{process.stdout.write(JSON.stringify(main(),null,2)+'\\n');}\n  catch(error){process.stderr.write(JSON.stringify({error:error.code||error.name,message:error.message})+'\\n');process.exitCode=1;}\n}\n","bytes":3184,"sha256":"ba424938969137de1c6dd64b3b190c0519c899c301ff3aaa59804b9c2f4f6c72"},{"path":"services/fixed-asset-migration/integrations/business-central/prepare-master.mjs","type":"text/javascript;charset=utf-8","text":"import {encodeCsv, LIMITS} from '../../engine.mjs';\nimport {sha256Utf8} from '../../sha256.mjs';\n\nexport const CAPTURE_SCHEMA='tjlabs.business-central-master-capture.v1';\nconst kinds=Object.freeze({\n  fixedAssets:{tail:'/fixedAssets',api:'/api/v2.0/',number:'number',description:'displayName',category:'classCode',parent:null},\n  maintenanceAssets:{tail:'/assets',api:'/api/dynaway/eam/v1.0/',number:'assetNo',description:'description',category:'categoryCode',parent:'parentAssetNo'}\n});\nconst need=(ok,message)=>{if(!ok)throw new Error(message);};\nconst value=(x,label,max=1000)=>{need(typeof x==='string'&&x.length>0&&x.length\u003c=max,'Supply '+label+'.');return x;};\nconst guid=(x,label)=>{value(x,label,36);need(/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(x),'Use the actual GUID for '+label+'.');return x;};\nconst field=(row,key)=>{const v=row[key];need(v===undefined||v===null||typeof v==='string','Expected original text in '+key+'.');return v??'';};\nconst optionalText=(x,label,max=4000)=>{need(x===undefined||x===null||typeof x==='string'&&x.length\u003c=max,'Retain the original text for '+label+'.');return x??null;};\nfunction queryNames(url){\n  const query=url.includes('?')?url.slice(url.indexOf('?')+1):'';\n  return query.split('&').filter(Boolean).map(part=>{\n    try{return decodeURIComponent(part.split('=')[0].replace(/\\+/g,' ')).toLowerCase();}\n    catch{throw new Error('The retained page query has an invalid escaped field name.');}\n  });\n}\nfunction pageUrl(input,collectionUrl){\n  const url=value(input,'original requested page URL',16000);\n  need(url.split('?')[0]===collectionUrl&&!/[\\s#\\\\]/.test(url),'Retain p
