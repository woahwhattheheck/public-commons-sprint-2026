asterDraft=model.receiveCapture(masterOriginal.text,path.basename(captureFile));masterDraft.role='source';masterDraft.actor='Illustrative receiving operator';masterDraft.reason='Review the complete original illustrative maintenance source; not Port tenant data.';\n  // The guided field controls retain the selection attribution inside capture.\n  masterDraft.capture.selection??={};masterDraft.capture.selection.actor=masterDraft.actor;masterDraft.capture.selection.reason=masterDraft.reason;\n  const masterPreview=model.prepare(masterDraft);await collectPreview(masterPreview,'master');\n  await page.locator('#sp-confirm').check();await page.locator('#sp-adopt').click();\n  await page.getByRole('heading',{name:'Preparation adopted'}).waitFor();\n  const masterWS=await state('master-adopted-workspace.json');\n  need(masterWS.sources.length===1&&masterWS.sources[0].rows.length===2,'The complete two-page master population changed.');\n  const masterExpected=model.adopt(E.createWorkspace({id:masterWS.id,title:masterWS.title,createdAt:masterWS.createdAt}),masterDraft,masterPreview,{operationId:masterWS.operations[0].id.split(':source-preparation:')[0],expectedRevision:0,at:masterWS.operations[0].at,confirmed:true});\n  need(E.exportWorkspace(masterExpected.workspace)===E.exportWorkspace(masterWS),'Original master journal adoption differs.');\n  await view('master-adopted');\n\n  await page.locator('#sp-clear').click();await field('kind').selectOption('postedLedger');\n  const cost=JSON.parse(costOriginal.text);\n  for(const key of ['tenantId','environment','companyId','canonicalCompanyId','collectionUrl','observedAt'])await field(key).fill(cost[key]);\n  await field('role').selectOption('source');await field('complete').selectOption(String(cost.population.complete));await field('description').fill(cost.population.description);\n  await field('actor').fill('Illustrative receiving operator');await field('reason').fill('Review actual versus expected LCY and the unresolved original header; not Port tenant data.');\n  await field('quantityField').selectOption(cost.selection.quantityField);await field('expenseLineCostField').selectOption(cost.selection.expenseLineCostField);\n  const pageFiles=[];\n  for(let i=0;i\u003ccost.pages.length;i++){const file=path.join(root,'original-ledger-page-'+(i+1)+'.json');await fs.writeFile(file,cost.pages[i].bodyText,{flag:'wx'});pageFiles.push(file);}\n  await page.locator('#sp-page-files').setInputFiles(pageFiles);await page.locator('#sp-add-pages').click();\n  for(let i=0;i\u003ccost.pages.length;i++){await field('page:'+i+':url').fill(cost.pages[i].url);await field('page:'+i+':status').fill(String(cost.pages[i].status));}\n  const contextFile=path.join(root,'original-company-general-ledger-setup.json');await fs.writeFile(contextFile,cost.companyContext.bodyText,{flag:'wx'});\n  await page.locator('#sp-context-file').setInputFiles(contextFile);await page.locator('#sp-load-context').click();\n  await field('context:url').fill(cost.companyContext.url);await field('context:status').fill(String(cost.companyContext.status));\n  await field('lcyCode').fill(cost.selection.lcyCode);await field('lcySourceReference').fill(cost.selection.lcySourceReference);\n  // Save and cold-reopen unfinished choices before validating/adopting them.\n  const draftFile=await download('#top-save','unfinished-source-preparation.html');\n  await page.goto(pathToFileURL(draftFile.path).href);await page.locator('[data-tab=\"preparation\"]').click();\n  need(await field('companyId').inputValue()===cost.companyId&&await field('expenseLineCostField').inputValue()===cost.selection.expenseLineCostField,'Unfinished source/company/cost choices were lost on reopening.');\n  const draftMatch=/\u003cscript id=\"bootstrap\" type=\"application\\/json\">([\\s\\S]*?)\u003c\\/script>/.exec(draftFile.bytes.toString('utf8'));\n  const actualDraft=JSON.parse(draftMatch[1]).drafts.sourcePreparation;\n  need(actualDraft.capture.pages.every((p,i)=>p.bodyText===cost.pages[i].bodyText)&&actualDraft.capture.companyContext.bodyText===cost.companyContext.bodyText,'An unfinished original response changed.');\n  await page.locator('#sp-preview-button').click();await page.locator('#sp-preview').waitFor();\n  const costPreview=model.prepare(actualDraft);await collectPreview(costPreview,'ledger');\n  await page.locator('#sp-file').selectOption('source-findings.csv');\n  need((await page.locator('#sp-preview').innerText()).includes('work_order_id'),'The missing original work-order header was hidden.');\n  await view('ledger-original-findings');\n  await page.locator('#sp-confirm').check();await field('reason').fill(actualDraft.reason+' Rechecked.');\n  need(await page.locator('#sp-preview').isHidden(),'Editing reviewed context kept an obsolete preview active.');\n  await field('reason').fill(actualDraft.reason);await page.locator('#sp-preview-button').click();await page.locator('#sp-confirm').check();await page.locator('#sp-adopt').click();\n  await page.getByRole('heading',{name:'Preparation adopted'}).waitFor();\n  const finalWS=await state('source-preparation-complete-workspace.json'),wo=W.read(finalWS),source=wo.sources.find(f=>f.role==='source'&&f.domain==='costs');\n  need(source?.rows.length===1&&source.text===costPreview.files.find(f=>f.path===costPreview.sourcePath).text,'The complete cost source changed.');\n  const mapped=W.reconcile(finalWS).domains.source.costs[0].values;\n  need(mapped.cost_amount==='-9007199254740993.123456789012345678'&&mapped.quantity==='1.23'&&mapped.work_order_id===''&&mapped.cost_basis==='actual','Exact amounts or missing original header meanings changed.');\n  for(const f of [...masterPreview.files,...costPreview.files]){\n   const retained=finalWS.supportingFiles.some(x=>x.bytes===f.bytes&&x.sha256===f.sha256&&Buffer.from(x.base64,'base64').equals(Buffer.from(f.text)));\n   need(retained,'The full journal lost an original/prepared member: '+f.path);\n  }\n  need(JSON.stringify(finalWS.operations.slice(0,masterWS.revision))===JSON.stringify(masterWS.operations),'The earlier master history changed.');\n  await page.locator('[data-tab=\"workorders\"]').click();await view('adopted-work-order-desk');\n  await page.locator('[data-tab=\"handover\"]').click();await page.locator('#prepare-handover').click();\n  const archive=await download('#zip','guided-source-complete-handover.zip'),entries=members(archive.bytes),manifest=JSON.parse(entries.get('MANIFEST.json').toString('utf8'));\n  for(const f of manifest.files){const content=entries.get(f.path);need(content&&content.length===f.bytes&&digest(content)===f.sha256,'A complete outgoing member differs: '+f.path);}\n  const received=E.importWorkspace(entries.get('workspace.json').toString('utf8'));need(E.exportWorkspace(received)===E.exportWorkspace(finalWS),'The complete ZIP workspace changed.');\n  for(const f of bundle.files)need(entries.get('application/'+f.path)?.equals(Buffer.from(f.text)),'The full editable application source is missing: '+f.path);\n  const extracted=path.join(root,'received');await fs.mkdir(extracted,{recursive:true});\n  for(const [name,content]of entries){const file=path.resolve(extracted,name);need(file.startsWith(extracted+path.sep),'An archive member escapes the received root.');await fs.mkdir(path.dirname(file),{recursive:true});await fs.writeFile(file,content,{flag:'wx'});}\n  const cold=await browser.newContext({acceptDownloads:true}),opened=await cold.newPage();opened.on('pageerror',e=>errors.push(String(e)));\n  try{\n   await opened.goto(pathToFileURL(path.join(extracted,'Fixed_Asset_Finance_Workspace.html')).href);await opened.locator('[data-tab=\"preparation\"]').click();await opened.locator('#sp-preview-button').click();await opened.locator('#sp-preview').waitFor();\n   for(const width of [1440,390]){await opened.setViewportSize({width,height:width===390?844:1000});const file=path.join(root,'cold-complete-preparation-'+width+'.png');await opened.screenshot({path:file,fullPage:true});screenshots.push(file);}\n   const wait=opened.waitForEvent('download');await opened.locator('#top-json').click();const d=await wait,file=path.join(root,'cold-reopened-workspace.json');await d.saveAs(file);\n   const bytes=await fs.readFile(file);need(E.exportWorkspace(E.importWorkspace(bytes.toString('utf8')))===E.exportWorkspace(finalWS),'The cold reopened source/mapping journal changed.');outputs.push({path:file,bytes:bytes.length,sha256:digest(bytes)});\n  }finally{await cold.close();}\n  need(!errors.length,'The actual guided receiving browser reported: '+errors.join('; '));\n  const result={schema:'tjlabs.guided-source-preparation-receiving.v1',application:{path:applicationPath,bytes:original.length,sha256:digest(original)},sourceMeaning:'Original bundled illustrative master/posted-ledger responses, not Port tenant records.',masterRows:2,costRows:1,sourceFindings:costPreview.scope.findings,originalPagesUnchanged:true,exactCost:mapped.cost_amount,originalRevision:finalWS.revision,workspaceId:finalWS.id,outputs,screenshots,extractedApplication:path.join(extracted,'application'),pageErrors:errors,producerView:'Open and LOOK at actual desktop/narrow screens and use the full application, original source files, readable reports and extracted complete handover. These paths are observations, not a substitute for producer inspection.'};\n  await fs.writeFile(path.join(root,'guided-source-result.json'),JSON.stringify(result,null,2)+'\\n',{flag:'wx'});return result;\n }finally{await own.close();}\n}\n","bytes":15344,"sha256":"7dbfa5e096caa866995feb251b6431de6510f5b9609e8c0e18de6079f636e84c"},{"path":"services/fixed-asset-migration/integrations/business-central/SOURCE_PREPARATION_OPERATING.md","type":"text/plain;charset=utf-8","text":"# Guided native source preparation\n\nOpen the complete Fixed_Asset_Finance_Workspace.html and choose **Prepare native sources**. This is part of the existing fixed-asset and work-order workspace. It uses the same maintained prepareMasterCapture and prepareWorkOrderCapture functions as the original CLI. It makes no supplier request, tenant edit, posting or import.\n\n## Retain the actual input and company context\n\nYou can open an existing complete capture JSON, or choose the already-received original response JSON files and enter their recorded request context. Every file is decoded as fatal UTF-8; invalid encoding is rejected. A Unicode BOM and original line endings remain in the retained file. A capture envelope may have a BOM; the original envelope is retained unchanged. Original response bodies must satisfy the maintained converter's JSON contract.\n\nChoose the dataset and its role explicitly: original source or actual returned target. Enter the recorded tenant, environment, native company GUID, collection URL and capture timestamp. The workspace company identifier is an explicit mapping; it is not guessed from the tenant or a company name. State the population, filter and snapshot basis. A terminal page chain proves completion of that selected chain, not a transactionally consistent tenant snapshot.\n\nResponses stay in their selected order. Enter each literal requested URL and recorded HTTP status. Optional request IDs and ETags stay attached to the original source. Move pages earlier/later only to reflect the actual continuation chain; missing pages, repeated URLs/IDs and extra pages are rejected. Individual Dynaway line responses require the original work-order GUID and the individual requested line URLs; they cannot establish a complete order population.\n\nFor work-order data, select the original quantity field. Posted-ledger quantities use quantity. Choosing an actual or expected expense LCY line amount requires the original same-company generalLedgerSetup record, its literal record URL/status and the declared currency/source reference. The converter checks the record and currency. Actual expense line cost, expected expense line cost and expected unit cost remain different quantities. It never multiplies a unit cost or replaces a missing amount with zero.\n\nEnter the preparation reviewer and source/selection explanation. No current timestamp is silently substituted for the original capture time.\n\n## Preview the entire selection\n\n**Preview all rows and findings** validates the complete source through the maintained converter. The preview shows the actual population, API cautions, complete mappings and source findings. Choose any output file to inspect all rows, every original/native field or the complete JSON text. CSV search covers all cells; fifty visible rows per page do not limit the exported population. Scroll the table for every column. Download returns the complete selected file.\n\nFixed-asset and maintenance-asset cards prepare asset mapping plus native-ID and maintenance/fixed-asset crosswalks. They do not establish book balances, financial classification or depreciation history.\n\nWork-order projections preserve additional native fields with their types. Absent, null and empty values stay distinguishable; original numeric spellings and nested fields remain in the source. A posted plan number does not become a work-order header ID. Missing header links and cost values remain findings for the original Work orders and costs workflow. Preparation does not mark those lines reconciled.\n\nChanging source, role, company, population, quantity/cost meaning or reviewer choices invalidates the prior preview and confirmation. Unfinished files and choices travel with **Save working HTML**. Preview again after reopening. Original capture documents remain separate from the edited effective capture metadata.\n\n## Adopt into the existing journals\n\nConfirm review of the source scope, complete rows, mappings and findings, then choose **Adopt originals, source and mapping**.\n\nThe application builds a complete candidate with the original engine and work-order actions. It retains every exact response, company record, capture, crosswalk, findings file, manifest and preparation review in Exit files. It imports the canonical CSV and selects the converter's explicit column mapping. The complete candidate must export and independently reopen before it is passed to the existing single browser-storage commit. A validation or capacity failure leaves the current workspace unchanged. The existing storage-conflict recovery preserves both complete versions.\n\nAdoption changes the selected mapping for the chosen source/target role and domain. Earlier sources, mappings, corrections and decisions remain in history. Existing financial attestations may become stale after this source change; review them against their actual new basis. Source findings remain unresolved until the operator records real source evidence or a reviewed correction in the original workflow.\n\nContinue in **Source files / Field mapping** for master data or **Work orders and costs** for cost rows, header references, allocation and returned-target matching. The converter does not create target IDs, supplier posting capabilities, acceptance or missing header records.\n\n## Save, deliver and independently reopen\n\nSave the working HTML and complete workspace JSON. Handover includes all original data, source/mapping/correction journals, preparation context, readable reports and the complete application source tree. The standalone builder binds the operating preparer/UI modules to that source manifest. The receiving application uses those same retained modules, with no CDN, runtime installation or network dependency.\n\nThe normal source files remain available individually through Exit files. The saved HTML also retains unfinished preparation choices. A full workspace JSON retains adopted original sources and their journals; it does not substitute for unfinished browser draft state, which belongs in the saved working HTML.\n\n## Continue the existing actual browser course\n\nThe maintained run_browser_receiving.mjs now calls runSourcePreparationReceiving in the same original receiving operation. Its independently isolated browser copy exercises both original illustrative captures bundled in the application: the two-page maintenance master and the posted expense example with exact long decimal tokens. These are explicitly illustrative source data, not Port tenant records.\n\nThe course operates existing-capture intake, raw-response and company-context intake, scope/quantity controls, full files/findings, explicit adoption, source/mapping journals, complete downloads, complete ZIP/application manifest, and cold-reopened working HTML at desktop and 390 pixels. It preserves the original financial receiving workspace and its existing counts/history. No browser is installed or supplier API queried.\n\nUse the original equipped receiving driver's existing browser/context and output operation. Keep the full actual result, any first product exception, downloaded originals and screenshots. The producing owner must open and LOOK at the actual screens, working application, readable report, source CSV/JSON and extracted handover. An authored driver or a successful source exercise is not a claim that a browser course ran or that the outgoing product was visually inspected.\n","bytes":7419,"sha256":"9b51523e47b1c9ac895180a051a5d8581e38f38eb911b64fb253e0a84ee6abd1"},{"path":"services/fixed-asset-migration/integrations/business-central/work-order-capture-example.json","type":"application/json","text":"{\n  \"schema\": \"tjlabs.business-central-work-order-capture.v1\",\n  \"kind\": \"postedLedger\",\n  \"tenantId\": \"illustrative-not-a-customer\",\n  \"environment\": \"Example\",\n  \"companyId\": \"00000000-0000-4000-8000-000000000001\",\n  \"canonicalCompanyId\": \"illustrative-company\",\n  \"collectionUrl\": \"https://example.invalid/v2.0/example/Example/api/dynaway/eamAnalytics/v1.0/companies(00000000-0000-4000-8000-000000000001)/woLedgerEntries\",\n  \"observedAt\": \"2026-10-13T16:00:00Z\",\n  \"population\": {\n    \"complete\": false,\n    \"description\": \"Explicit illustrative provider contract exercise, not Port data.\"\n  },\n  \"selection\": {\n    \"quantityField\": \"quantity\",\n    \"expenseLineCostField\": \"expenseActualLineCostLCY\",\n    \"lcyCode\": \"USD\",\n    \"lcySourceReference\": \"Illustrative company selection\",\n    \"actor\": \"Illustrative source exercise\",\n    \"reason\": \"Select actual expense line amount; keep unknown ledger/order relationship missing.\"\n  },\n  \"pages\": [\n    {\n      \"status\": 200,\n      \"url\": \"https://example.invalid/v2.0/example/Example/api/dynaway/eamAnalytics/v1.0/companies(00000000-0000-4000-8000-000000000001)/woLedgerEntries\",\n      \"bodyText\": \"{\\\"value\\\":[{\\\"id\\\":\\\"00000000-0000-4000-8000-000000000002\\\",\\\"type\\\":\\\"Expense\\\",\\\"planNo\\\":\\\"PLAN-001\\\",\\\"quantity\\\":1.2300,\\\"expenseActualLineCostLCY\\\":-9007199254740993.123456789012345678,\\\"postingDate\\\":\\\"2026-10-12\\\",\\\"unitOfMeasureCode\\\":\\\"HOUR\\\",\\\"nested\\\":{\\\"empty\\\":null,\\\"large\\\":90071992547409931234}}]}\"\n    }\n  ],\n  \"companyContext\": {\n    \"status\": 200,\n    \"url\": \"https://example.invalid/v2.0/example/Example/api/v2.0/companies(00000000-0000-4000-8000-000000000001)/generalLedgerSetup(00000000-0000-4000-8000-000000000009)\",\n    \"bodyText\": \"{\\\"id\\\":\\\"00000000-0000-4000-8000-000000000009\\\",\\\"localCurrencyCode\\\":\\\"USD\\\",\\\"additionalReportingCurrency\\\":\\\"EUR\\\"}\"\n  }\n}\n","bytes":1835,"sha256":"b1d89a65502f5343c5c9a09b0f78c3e6b050a7d148f42ce5e8a67d9a677a8577"},{"path":"services/fixed-asset-migration/issuer-annex.mjs","type":"text/javascript;charset=utf-8","text":"/**\n * Complete issuer-reference intake on the original financial supporting-file writer.\n * No public aggregate row becomes a tenant asset, movement, journal or control.\n */\nexport function createIssuerAnnex(E,H){\n const PACKAGE='tjlabs.complete-source-carrier.v1',SELECTION='tjlabs.fixed-asset-issuer-selection.v1',REVIEW='tjlabs.fixed-asset-issuer-review.v1';\n const clone=x=>JSON.parse(JSON.stringify(x)),hash=x=>H.sha256Utf8(JSON.stringify(x)).sha256;\n const need=(ok,message)=>{if(!ok)throw Error(message);};\n const bytes=value=>{const a=[],b64='ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/';need(typeof value==='string'&&/^(?:[A-Za-z0-9+/]{4})*(?:[A-Za-z0-9+/]{2}==|[A-Za-z0-9+/]{3}=)?$/.test(value),'Choose complete Base64 bytes.');let bits=0,n=0;for(const c of value){if(c==='=')break;bits=(bits\u003c\u003c6)|b64.indexOf(c);n+=6;if(n>=8){n-=8;a.push((bits>>n)&255);}}return Uint8Array.from(a);};\n function base64(value){const a=typeof value==='string'?new TextEncoder().encode(value):value,b='ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/';let out='';for(let i=0;i\u003ca.length;i+=3){const n=(a[i]\u003c\u003c16)|((a[i+1]||0)\u003c\u003c8)|(a[i+2]||0);out+=b[(n>>>18)&63]+b[(n>>>12)&63]+(i+1\u003ca.length?b[(n>>>6)&63]:'=')+(i+2\u003ca.length?b[n&63]:'=');}return out;}\n const decode=value=>new TextDecoder('utf-8',{fatal:true,ignoreBOM:true}).decode(bytes(value));\n const json=value=>JSON.stringify(value,null,2)+'\\n';\n const media=path=>path.endsWith('.json')?'application/json':path.endsWith('.csv')?'text/csv;charset=utf-8':path.endsWith('.html')?'text/html;charset=utf-8':'text/markdown;charset=utf-8';\n function packet(text){\n  need(H.sha256Utf8(text).bytes\u003c=E.LIMITS.supportingBytes,'The complete issuer packet exceeds32 MiB.');\n  const p=JSON.parse(text);need(p.schema===PACKAGE&&Array.isArray(p.files)&&p.files.length>0&&p.files.length\u003c=64,'Choose the complete source carrier with its original files.');\n  const seen=new Set(),by={};\n  for(const f of p.files){need(typeof f.path==='string'&&/^[A-Za-z0-9][A-Za-z0-9._-]{0,199}$/.test(f.path)&&!seen.has(f.path),'Every original annex member needs one safe unique filename.');seen.add(f.path);need(typeof f.content==='string','Retain every complete annex text member.');const actual=H.sha256Utf8(f.content);need(actual.bytes===f.bytes&&actual.sha256===f.sha256,'An original annex member changed: '+f.path);by[f.path]=f;}\n  const read=name=>{need(by[name],'The complete original annex is missing '+name);return JSON.parse(by[name].content);};\n  const integration=read('EA_Accounting_Integration.json'),matrix=read('EA_Policy_Data_Matrix.json'),index=read('EA_Accounting_Source_Index.json'),normalized=read('EA_Notes11_13_Normalized_Values.json'),arithmetic=read('EA_Notes11_13_Arithmetic.json');\n  need(integration.schema==='tjlabs.ea-accounting-annex-integration.v1'&&matrix.schema==='tjlabs.ea-policy-data-matrix.v1'&&index.schema==='tjlabs.ea-accounting-source-index.v1','Retain the original issuer integration, policy and source contracts.');\n  need(by[integration.original_contract_copy]?.sha256===integration.contract_sha256,'The original financial contract copy changed.');\n  for(const name of integration.annex_files)need(by[name],'A declared annex member is absent: '+name);\n  need(Array.isArray(matrix.rows)&&matrix.rows.length>0&&new Set(matrix.rows.map(r=>r.id)).size===matrix.rows.length,'Policy identities must be complete and unique.');\n  for(const r of matrix.rows){need(typeof r.id==='string'&&Array.isArray(r.existing_domain_fields)&&Array.isArray(r.additional_original_annex_fields),'Keep complete policy-field definitions.');for(const f of r.existing_domain_fields){const[d,n]=f.split('.');need(E.DOMAINS[d]?.fields.some(v=>v.name===n),'Unknown original financial field '+f);}}\n  const tables=p.files.filter(f=>f.path.endsWith('_Original_Tokens.json')).map(f=>JSON.parse(f.content));\n  need(tables.length>0&&normalized.schema==='tjlabs.ea-public-reference-normalization.v1'&&arithmetic.schema==='tjlabs.ea-public-table-arithmetic.v1','Retain original-token tables, separate normalization and arithmetic.');\n  return {packet:p,by,integration,matrix,index,normalized,arithmetic,tables,...H.sha256Utf8(text),text};\n }\n async function parseInput(text,inflateRaw){\n  let decoded=text;\n  if(!text.trimStart().startsWith('{')){\n   const fences=[...text.matchAll(/\\x60\\x60\\x60base64-deflate\\s+([\\s\\S]*?)\\x60\\x60\\x60/g)];\n   need(fences.length===1,'Choose the complete issuer JSON or its one complete base64-deflate source Canvas.');\n   need(typeof inflateRaw==='function','This runtime needs raw-DEFLATE support to open the original Canvas. Choose the complete decoded JSON source carrier.');\n   const compressed=bytes(fences[0][1].replace(/\\s/g,''));\n   const out=await inflateRaw(compressed,E.LIMITS.supportingBytes);\n   need(out.length\u003c=E.LIMITS.supportingBytes,'The expanded complete annex exceeds32 MiB.');\n   decoded=new TextDecoder('utf-8',{fatal:true,ignoreBOM:true}).decode(out);\n  }\n  return {...packet(decoded),originalTransport:text===decoded?null:text};\n }\n function records(ws,schema){const out=[];for(const file of ws.supportingFiles){if(file.purpose!=='Issuer reference record · '+schema)continue;const value=JSON.parse(decode(file.base64));need(value.schema===schema,'A retained issuer record has another schema.');out.push({file,value});}return out;}\n function packages(ws){return records(ws,PACKAGE).map(({file})=>({file,...packet(decode(file.base64))}));}\n function packageByFile(ws,fileId){const file=ws.supportingFiles.find(f=>f.id===fileId);need(file?.purpose==='Issuer reference record · '+PACKAGE,'Select a retained complete issuer source package.');return {file,...packet(decode(file.base64))};}\n function retained(ws,ids){need(Array.isArray(ids)&&new Set(ids).size===ids.length,'Select each complete supporting original once.');return ids.map(id=>{const f=ws.supportingFiles.find(f=>f.id===id);need(f,'The selected supporting original is absent.');return{id:f.id,filename:f.filename,bytes:f.bytes,sha256:f.sha256};});}\n function actor(value){need(typeof value==='string'&&value.trim().length>0&&value.length\u003c=300,'Name the source owner or reviewer.');return value;}\n function note(value){need(typeof value==='string'&&value.trim().length>0&&value.length\u003c=100000,'Describe the explicit source scope and decision.');return value;}\n function saveRecord(ws,meta,value,filename){return E.importSupportingFile(ws,{...meta,filename,mimeType:'application/json',purpose:'Issuer reference record · '+value.schema,base64:base64(json(value))});}\n function attach(ws,input){\n  E.validateWorkspace(ws);const p=packet(input.text);\n  const result=E.importSupportingFile(ws,{operationId:input.operationId,expectedRevision:input.expectedRevision,at:input.at,filename:input.filename||'Issuer_Accounting_Source.json',mimeType:'application/json',purpose:'Issuer reference record · '+PACKAGE,base64:base64(input.text)});\n  return result;\n }\n function select(ws,input){\n  const p=packageByFile(ws,input.packageFileId),value={schema:SELECTION,packageFileId:p.file.id,packageSha256:p.file.sha256,sourceEdition:p.packet.edition,sourceRevision:p.packet.revision,originals:retained(ws,input.originalFileIds),actor:actor(input.actor),note:note(input.note),at:input.at};\n  return saveRecord(ws,{operationId:input.operationId,expectedRevision:input.expectedRevision,at:input.at},value,'Issuer_Source_Selection.json');\n }\n function selection(ws,id){\n  const all=records(ws,SELECTION),selected=id?all.find(r=>r.file.id===id):all.at(-1);if(!selected)return null;\n  const p=packageByFile(ws,selected.value.packageFileId);need(p.file.sha256===selected.value.packageSha256,'The selected complete issuer source differs.');for(const f of selected.value.originals){const actual=ws.supportingFiles.find(v=>v.id===f.id);need(actual?.sha256===f.sha256&&actual.bytes===f.bytes,'A selected supporting original differs.');}\n  return {...selected,source:p};\n }\n function dataSelection(ws){\n  const mappings=clone(ws.mappings),ids=new Set(Object.values(mappings).flatMap(o=>Object.values(o).map(m=>m.sourceId)));\n  return {mappings,sources:ws.sources.filter(s=>ids.has(s.id)).map(s=>({id:s.id,sha256:s.sha256,role:s.role,domain:s.domain,filename:s.filename})),corrections:ws.corrections.filter(c=>ids.has(c.sourceId))};\n }\n function bindingOptions(ws,field,role){const[domain,name]=field.split('.'),m=ws.mappings[role]?.[domain],s=ws.sources.find(s=>s.id===m?.sourceId);if(!m||!s||m.columns[name]===undefined)return null;return {role,domain,field:name,sourceId:s.id,sourceSha256:s.sha256,mappingId:m.id,column:m.columns[name],header:s.headers[m.columns[name]],amount_multiplier:m.amount_multiplier};}\n function draft(ws,selectionId,policyId){\n  const s=selection(ws,selectionId),p=s?.source.matrix.rows.find(r=>r.id===policyId);need(p,'Choose the original selected policy.');\n  return {policyId,status:'pending',decision:'',actor:'',bindings:p.existing_domain_fields.flatMap(field=>['source','target'].map(role=>({field,role,state:'pending',reason:'',binding:null}))),additional:p.additional_original_annex_fields.map(name=>({name,state:'pending',fileId:null,locator:'',reason:''})),supportingFileIds:[]};\n }\n function validateReview(ws,s,review){\n  const spec=s.source.matrix.rows.find(p=>p.id===review.policyId);need(spec,'This policy does not belong to the selected issuer source.');\n  need(['pending','selected','not_applicable'].includes(review.status),'Choose an explicit policy decision.');actor(review.actor);note(review.decision);\n  const expected=spec.existing_domain_fields.flatMap(field=>['source','target'].map(role=>role+':'+field));\n  need(Array.isArray(review.bindings)&&review.bindings.length===expected.length&&new Set(review.bindings.map(b=>b.role+':'+b.field)).size===expected.length,'Retain every source and target policy-field decision.');\n  for(const b of review.bindings){need(expected.includes(b.role+':'+b.field)&&['pending','mapped','not_used'].includes(b.state),'Choose each actual source/target field disposition.');if(b.state==='mapped'){need(JSON.stringify(b.binding)===JSON.stringify(bindingOptions(ws,b.field,b.role))&&b.binding!==null,'The selected original mapping changed; review '+b.role+' '+b.field);}else{need(b.binding===null,'An unbound policy field cannot retain a mapped target.');if(b.state==='not_used')note(b.reason);}}\n  need(Array.isArray(review.additional)&&review.additional.length===spec.additional_original_annex_fields.length&&new Set(review.additional.map(a=>a.name)).size===review.additional.length,'Retain every requested additional source field.');\n  for(const a of review.additional){need(spec.additional_original_annex_fields.includes(a.name)&&['pending','retained','not_used'].includes(a.state),'Choose each additional original-field disposition.');if(a.state==='retained'){retained(ws,[a.fileId]);note(a.locator);}else{need(a.fileId===null,'An unselected evidence field must not bind another file.');if(a.state==='not_used')note(a.reason);}}\n  retained(ws,review.supportingFileIds);\n }\n function review(ws,input){\n  E.validateWorkspace(ws);\n  const previous=ws.operations.find(o=>o.id===input.operationId);\n  if(previous){\n   const file=ws.supportingFiles.find(f=>f.id===previous.supportingInputId);need(previous.kind==='import-supporting'&&file?.purpose==='Issuer reference record · '+REVIEW,'The original operation belongs to another source action.');\n   const original=JSON.parse(decode(file.base64));need(original.selectionFileId===input.selectionFileId&&JSON.stringify(original.review)===JSON.stringify(input.review)&&original.at===input.at,'The original review request changed. Continue its exact selection, review and timestamp.');\n   return E.importSupportingFile(ws,{operationId:input.operationId,expectedRevision:input.expectedRevision,at:input.at,filename:file.filename,mimeType:file.mimeType,purpose:file.purpose,base64:file.base64});\n  }\n  const s=selection(ws,input.selectionFileId);need(s,'Select an issuer edition first.');validateReview(ws,s,input.review);\n  const value={schema:REVIEW,selectionFileId:s.file.id,selectionSha256:s.file.sha256,packageFileId:s.source.file.id,packageSha256:s.source.file.sha256,dataSelection:dataSelection(ws),dataBasis:hash(dataSelection(ws)),review:clone(input.review),supporting:retained(ws,input.review.supportingFileIds),at:input.at};\n  return saveRecord(ws,{operationId:input.operationId,expectedRevision:input.expectedRevision,at:input.at},value,'Issuer_Policy_'+input.review.policyId+'_Review.json');\n }\n function assessment(ws){\n  E.validateWorkspace(ws);const selections=records(ws,SELECTION),s=selection(ws),all=records(ws,REVIEW);\n  if(!s)return{schema:'tjlabs.fixed-asset-issuer-assessment.v1',selected:false,ready:false,selections:selections.map(r=>({file:r.file.id,...r.value})),policies:[],history:all.map(r=>({file:r.file.id,...r.value}))};\n  const basis=hash(dataSelection(ws));\n  const policies=s.source.matrix.rows.map(spec=>{const editions=all.filter(r=>r.value.selectionFileId===s.file.id&&r.value.review.policyId===spec.id),last=editions.at(-1),v=last?.value,current=!!v&&v.dataBasis===basis;\n   if(v){need(v.selectionSha256===s.file.sha256&&v.packageSha256===s.source.file.sha256,'A retained policy review changed its original source selection.');need(v.dataBasis===hash(v.dataSelection),'A retained policy review changed its original mapping selection.');}\n   const pending=v?v.review.bindings.filter(b=>b.state==='pending').length+v.review.additional.filter(a=>a.state==='pending').length:spec.existing_domain_fields.length*2+spec.additional_original_annex_fields.length;\n   return {policyId:spec.id,spec,reviewFileId:last?.file.id||null,review:v?.review||null,current,state:!v?'UNREVIEWED':!current?'STALE_MAPPING':v.review.status==='pending'||pending?'PENDING':v.review.status==='not_applicable'?'NOT_APPLICABLE':'SELECTED',pending,editionCount:editions.length,dataSelection:v?.dataSelection||null};\n  });\n  return {schema:'tjlabs.fixed-asset-issuer-assessment.v1',workspaceId:ws.id,revision:ws.revision,selected:true,ready:policies.every(p=>['SELECTED','NOT_APPLICABLE'].includes(p.state)),selectionFileId:s.file.id,selection:s.value,dataBasis:basis,policies,selections:selections.map(r=>({file:r.file.id,...r.value})),history:all.map(r=>({file:r.file.id,...r.value})),referenceCounts:{printedRows:s.source.tables.reduce((n,t)=>n+t.rows.length,0),normalizedCells:s.source.normalized.tables.reduce((n,t)=>n+t.rows.reduce((v,r)=>v+r.values.length,0),0),arithmeticChecks:s.source.arithmetic.checks.length,arithmeticDifferences:s.source.arithmetic.checks.filter(c=>c.status!=='MATCH').length},interpretation:'Issuer aggregate references and attributed policy/field decisions. Actual tenant identities, cutover dates, amount scales, complete population declarations and carrying equations remain explicitly selected in the original financial workspace.'};\n }\n const esc=x=>String(x??'').replace(/[&\u003c>\"']/g,c=>({'&':'&amp;','\u003c':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[c]));\n function reportHTML(ws){\n  const a=assessment(ws),s=selection(ws),table=(heads,rows)=>'\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>'+heads.map(h=>'\u003cth>'+esc(h)+'\u003c/th>').join('')+'\u003c/tr>\u003c/thead>\u003ctbody>'+rows.map(r=>'\u003ctr>'+r.map(v=>'\u003ctd>'+esc(typeof v==='object'?JSON.stringify(v,null,2):v)+'\u003c/td>').join('')+'\u003c/tr>').join('')+'\u003c/tbody>\u003c/table>\u003c/div>';\n  let body='\u003ch1>Issuer source and policy decisions\u003c/h1>\u003cp>'+esc(ws.title)+' · revision '+ws.revision+'\u003c/p>\u003cp>'+esc(a.interpretation||'No issuer reference is selected.')+'\u003c/p>';\n  if(s){body+='\u003ch2>Selected original edition\u003c/h2>'+table(['Source file','SHA-256','Edition','Reviewer','Scope'],[[s.source.file.filename,s.source.file.sha256,s.source.packet.edition,s.value.actor,s.value.note]])+'\u003ch3>Selected supporting originals\u003c/h3>'+table(['Original','Bytes','SHA-256'],s.value.originals.map(f=>[f.filename,f.bytes,f.sha256]));\n   for(const p of a.policies){body+='\u003csection>\u003ch2>'+esc(p.policyId)+' · '+esc(p.state)+'\u003c/h2>\u003cp>'+esc(p.spec.source_policy_summary)+'\u003c/p>\u003cp>Source section '+esc(p.spec.section)+' · printed pages '+esc(p.spec.printed_pages.join(', '))+' · '+esc(p.spec.effective_period)+'\u003c/p>'+table(['Original policy values'],[[p.spec.original_values]])+'\u003cp>'+esc(p.review?.actor||'Reviewer not recorded')+': '+esc(p.review?.decision||p.spec.owner_decision)+'\u003c/p>'+table(['Role','Field','Decision','Exact selected original mapping','Reason'],(p.review?.bindings||[]).map(b=>[b.role,b.field,b.state,b.binding,b.reason]))+table(['Additional original field','Decision','Original file','Exact locator','Reason'],(p.review?.additional||[]).map(f=>[f.name,f.state,f.fileId,f.locator,f.reason]))+'\u003c/section>';}\n   body+='\u003ch2>All published original tokens\u003c/h2>';\n   for(const t of s.source.tables)body+='\u003csection>\u003ch3>'+esc(t.id)+' · Note '+esc(t.note)+'\u003c/h3>'+table(['Section','Printed row','Published date',...t.column_labels],t.rows.map(r=>[r.section,r.label,r.reported_date,...r.reported_tokens]))+'\u003c/section>';\n   body+='\u003ch2>Separate normalized interpretations\u003c/h2>';for(const t of s.source.normalized.tables)body+=table(['Table','Original row','Column','Original token','Reported £000','GBP','Displayed-table arithmetic','Dash convention'],t.rows.flatMap(r=>r.values.map((v,i)=>[t.table_id,r.label,t.column_labels[i],v.original_token,v.reported_thousands,v.gbp,v.table_arithmetic_thousands,v.dash_interpretation])));\n   body+='\u003ch2>Every original arithmetic check\u003c/h2>'+table(['Table','Check','Description','Calculated £000','Published £000','Difference £000','State'],s.source.arithmetic.checks.map(c=>[c.table_id,c.id,c.detail,c.left_thousands,c.published_thousands,c.difference_thousands,c.status]))+'\u003cp>'+esc(s.source.arithmetic.notes.join(' '))+'\u003c/p>';\n  }\n  body+='\u003ch2>Complete selection and decision history\u003c/h2>\u003cdetails>\u003csummary>Every original saved selection and mapping-bound review\u003c/summary>\u003cpre>'+esc(json({selections:a.selections,history:a.history}))+'\u003c/pre>\u003c/details>';\n  return '\u003c!doctype html>\u003chtml lang=\"en\">\u003chead>\u003cmeta charset=\"utf-8\">\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\u003ctitle>Issuer source and policy decisions\u003c/title>\u003cstyle>body{font:15px/1.5 system-ui,sans-serif;color:#202020;max-width:1240px;margin:28px auto;padding:0 20px}h1,h2,h3{line-height:1.25}table{border-collapse:collapse;width:100%;font-size:13px}td,th{border:1px solid #bbb;padding:8px;text-align:left;vertical-align:top;white-space:pre-wrap;overflow-wrap:anywhere}th{background:#eee}.table-wrap{overflow:auto}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px}section{margin:28px 0}@media print{details>*{display:block}body{max-width:none;margin:0}.table-wrap{overflow:visible}thead{display:table-header-group}tr{break-inside:avoid}}\u003c/style>\u003c/head>\u003cbody>'+body+'\u003c/body>\u003c/html>';\n }\n function handover(ws,basePacket){\n  const out=basePacket||E.buildHandover(ws),a=assessment(ws),add=(path,type,text)=>out.files.push({path,type,text,...H.sha256Utf8(text)});\n  add('issuer/assessment.json','application/json',json(a));add('issuer/Issuer_Source_and_Policy_Report.html','text/html;charset=utf-8',reportHTML(ws));\n  for(const item of packages(ws))for(const f of item.packet.files)add('issuer/originals/'+item.file.id+'/'+f.path,media(f.path),f.content);\n  const native=out.files.find(f=>f.path==='MANIFEST.json');out.files=out.files.filter(f=>f!==native);out.manifest={...out.manifest,issuerReference:{selected:a.selected,ready:a.ready,selectionFileId:a.selectionFileId||null},files:out.files.map(({text,base64,...f})=>f)};\n  add('MANIFEST.json','application/json',json(out.manifest));return out;\n }\n return {textIdentity:H.sha256Utf8,PACKAGE,SELECTION,REVIEW,packet,parseInput,attach,select,review,selection,packages,draft,assessment,dataSelection,bindingOptions,reportHTML,h issuer-additional=\"'+i+'\">'+options([['pending','Pending'],['retained','Retained original'],['not_used','Not used in this scope']],f.state)+'\u003c/select>','\u003cselect data-issuer-file=\"'+i+'\">'+originalOptions(f.fileId)+'\u003c/select>','\u003ctextarea data-issuer-locator=\"'+i+'\" rows=\"2\">'+esc(f.locator)+'\u003c/textarea>','\u003ctextarea data-issuer-extra-reason=\"'+i+'\" rows=\"2\">'+esc(f.reason)+'\u003c/textarea>']));\n   out+='\u003clabel class=\"confirm\">\u003cinput id=\"issuer-confirm\" type=\"checkbox\"> I have reviewed this original source policy, the selected mapping context and every saved disposition.\u003c/label>\u003cdiv class=\"toolbar\">'+button('issuer-save-review','Save attributed policy decision')+button('issuer-draft','Download complete unfinished decision')+'\u003c/div>\u003cp>Saving preserves this full edition and invalidates an earlier financial-basis declaration through the existing supporting-source history. Review Financial basis after the selected source and all policy decisions are complete.\u003c/p>\u003c/section>';\n  }\n  return out;\n }\n async function inflate(compressed,limit){\n  if(typeof DecompressionStream!=='function')throw Error('This browser cannot decode the original Canvas. Choose its complete decoded JSON carrier.');\n  const stream=new Blob([compressed]).stream().pipeThrough(new DecompressionStream('deflate-raw')),reader=stream.getReader(),chunks=[];let n=0;\n  try{while(true){const{done,value}=await reader.read();if(done)break;n+=value.length;if(n>limit)throw Error('The expanded source exceeds32 MiB.');chunks.push(value);}}finally{await reader.cancel().catch(()=>{});}\n  const out=new Uint8Array(n);let at=0;for(const b of chunks){out.set(b,at);at+=b.length;}return out;\n }\n function wireAll(){\n  const $=s=>document.querySelector(s),dirty=()=>{C.dirty();const confirm=$('#issuer-confirm');if(confirm)confirm.checked=false;};\n  const input=(id,fn)=>{const n=$('#'+id);if(n)n.oninput=()=>{fn(n);dirty();};};\n fields input[type=date]{min-width:0}input[readonly]{background:#eee}\n\n/* Work-order allocation controls share the original industrial shell. */\n[data-wo-allocation]{min-width:130px}input[data-wo-match]{width:20px;height:20px}main section.panel+section.panel{margin-top:18px}\n","bytes":3876,"sha256":"0bff44f5b55b4d7efc912d307412d3a41b45038607cab3c779683eccd5c68e42"},{"path":"services/fixed-asset-migration/template.html","type":"text/html;charset=utf-8","text":"\u003c!doctype html>\n\u003chtml lang=\"en\">\u003chead>\u003cmeta charset=\"utf-8\">\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\u003ctitle>Fixed asset migration and exit workspace\u003c/title>\u003cstyle>__STYLES__\u003c/style>\u003c/head>\n\u003cbody>\u003cdiv id=\"app\">\u003cp>Opening complete migration workspace…\u003c/p>\u003c/div>\u003cnoscript>Enable JavaScript to operate the migration workspace. Complete input files remain on your computer.\u003c/noscript>\n\u003cscript id=\"bootstrap\" type=\"application/json\">__BOOTSTRAP__\u003c/script>\n\u003cscript type=\"module\">\nconst data=JSON.parse(document.querySelector('#bootstrap').textContent);\nconst shaURL=URL.createObjectURL(new Blob([data.shaSource],{type:'text/javascript'}));\nconst marker=\"import {sha256Utf8,sha256Bytes} from './sha256.mjs';\";\nif(!data.engineSource.startsWith(marker))throw new Error('The bundled engine dependency differs.');\nconst engineSource=data.engineSource.replace(marker,'import {sha256Utf8,sha256Bytes} from '+JSON.stringify(shaURL)+';');\nconst engineURL=URL.createObjectURL(new Blob([engineSource],{type:'text/javascript'}));\nconst appURL=URL.createObjectURL(new Blob([data.appSource],{type:'text/javascript'}));\nconst issuerURL=URL.createObjectURL(new Blob([data.issuerSource],{type:'text/javascript'}));\nconst issuerUIURL=URL.createObjectURL(new Blob([data.issuerUISource],{type:'text/javascript'}));\nlet workOrderURL=null,workOrderUIURL=null,applicationSourceURL=null;\nconst preparationURLs=[];\ntry{\nconst [engine,app,sha,issuer,issuerUI]=await Promise.all([import(engineURL),import(appURL),import(shaURL),import(issuerURL),import(issuerUIURL)]);\nlet extensions=null;\nif(data.workOrderSource&&data.workOrderUISource){\nconst source=data.workOrderSource.replace(\"import * as E from './engine.mjs';\",'import * as E from '+JSON.stringify(engineURL)+';').replace(\"import {sha256Utf8} from './sha256.mjs';\",'import {sha256Utf8} from '+JSON.stringify(shaURL)+';');\nworkOrderURL=URL.createObjectURL(new Blob([source],{type:'text/javascript'}));\nworkOrderUIURL=URL.createObjectURL(new Blob([data.workOrderUISource],{type:'text/javascript'}));\nconst [workOrders,ui]=await Promise.all([import(workOrderURL),import(workOrderUIURL)]);\nextensions={workOrders,createWorkOrderPanel:ui.createWorkOrderPanel};\n}\nif(data.masterPreparationSource&&data.workOrderPreparationSource&&data.sourcePreparationUISource){\nconst remap=source=>source.replace(\"from '../../engine.mjs'\",\"from \"+JSON.stringify(engineURL)).replace(\"from '../../sha256.mjs'\",\"from \"+JSON.stringify(shaURL));\nfor(const source of [remap(data.masterPreparationSource),remap(data.workOrderPreparationSource),data.sourcePreparationUISource])preparationURLs.push(URL.createObjectURL(new Blob([source],{type:'text/javascript'})));\nconst [master,orders,ui]=await Promise.all(preparationURLs.map(url=>import(url)));\nextensions={...extensions,sourcePreparation:{prepareMasterCapture:master.prepareMasterCapture,prepareWorkOrderCapture:orders.prepareWorkOrderCapture,sha256Utf8:sha.sha256Utf8},createSourcePreparationPanel:ui.createSourcePreparationPanel};\n}\nif(data.applicationSourceModule){\napplicationSourceURL=URL.createObjectURL(new Blob([data.applicationSourceModule],{type:'text/javascript'}));\nconst source=await import(applicationSourceURL),applicationSource=source.createApplicationSource(sha);\napplicationSource.assertRuntime(data.applicationSource,data);\nextensions={...extensions,applicationSource};\n}\nawait app.mountFixedAssetWorkspace(engine,data,issuer.createIssuerAnnex(engine,sha),issuerUI.createIssuerUI,extensions);\n}catch(error){document.querySelector('#app').textContent='Unable to open this complete workspace: '+error.message;}\nfinally{for(const url of preparationURLs)URL.revokeObjectURL(url);if(applicationSourceURL)URL.revokeObjectURL(applicationSourceURL);if(workOrderURL)URL.revokeObjectURL(workOrderURL);if(workOrderUIURL)URL.revokeObjectURL(workOrderUIURL);URL.revokeObjectURL(engineURL);URL.revokeObjectURL(appURL);URL.revokeObjectURL(shaURL);URL.revokeObjectURL(issuerURL);URL.revokeObjectURL(issuerUIURL);}\n\u003c/script>\u003c/body>\u003c/html>","bytes":4017,"sha256":"d795c12609b29257812633d97aefc1a00970cf80124ccfba5036eaf32200ad3e"},{"path":"services/fixed-asset-migration/templates/assets.csv","type":"text/csv;charset=utf-8","text":"company_id,asset_id,parent_asset_id,class_code,description\r\n","bytes":60,"sha256":"6718eb3b3257473c22d0c5d50eaa5e5c09a706f7fe8f12a74b641a69e2096b37"},{"path":"services/fixed-asset-migration/templates/balances.csv","type":"text/csv;charset=utf-8","text":"company_id,book_id,asset_id,as_of,currency,measure,amount\r\n","bytes":59,"sha256":"0b024f50b8173911a93fc3d7dc0281253175d6bf2ec5c38e0c340022f68bab7f"},{"path":"services/fixed-asset-migration/templates/books.csv","type":"text/csv;charset=utf-8","text":"company_id,book_id,currency,accounting_basis\r\n","bytes":46,"sha256":"6fe753c0c03e8952916dd41e02b6c7dccb2023cd4b95d93ad0d512427863c2f8"},{"path":"services/fixed-asset-migration/templates/controls.csv","type":"text/csv;charset=utf-8","text":"company_id,book_id,as_of,currency,measure,amount,source_reference\r\n","bytes":67,"sha256":"bfcd4794cc161dbcda6b7e0f56879a3b1a7d030c6a04d99c8f6b1a2421aeb0cc"},{"path":"services/fixed-asset-migration/templates/events.csv","type":"text/csv;charset=utf-8","text":"company_id,book_id,asset_id,event_id,effective_date,currency,measure,signed_amount,event_type\r\n","bytes":95,"sha256":"b2826002a694b19e32e46ca4d7b7223e61fdad32117958a02e6e6494111d9b50"},{"path":"services/fixed-asset-migration/templates/journals.csv","type":"text/csv;charset=utf-8","text":"company_id,book_id,journal_id,line_id,posting_date,currency,account_code,debit,credit,asset_id\r\n","bytes":96,"sha256":"56e2cc4abf71b29f3580135c5546dc4c36ac1c0be841835ac1d76592be6957a8"},{"path":"services/fixed-asset-migration/work-orders-ui.mjs","type":"text/javascript;charset=utf-8","text":"/** Industrial work-order desk inside the original fixed-asset operator. */\nexport function createWorkOrderPanel(W,{getWorkspace,change,download,getDraft,setDraft,notice,now}){\n const esc=x=>String(x??'').replace(/[&\u003c>\"']/g,c=>({'&':'&amp;','\u003c':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[c]));\n const $=s=>document.querySelector(s),clone=x=>JSON.parse(JSON.stringify(x));\n const btn=(id,label)=>'\u003cbutton id=\"'+id+'\">'+esc(label)+'\u003c/button>';\n const option=(value,label,chosen)=>'\u003coption value=\"'+esc(value)+'\"'+(value===chosen?' selected':'')+'>'+esc(label)+'\u003c/option>';\n const table=(headers,rows)=>'\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>'+headers.map(x=>'\u003cth>'+esc(x)+'\u003c/th>').join('')+'\u003c/tr>\u003c/thead>\u003ctbody>'+rows.map(r=>'\u003ctr>'+r.map(c=>'\u003ctd>'+esc(c)+'\u003c/td>').join('')+'\u003c/tr>').join('')+'\u003c/tbody>\u003c/table>\u003c/div>';\n const field=(id,label,value='',type='text')=>'\u003clabel>'+esc(label)+'\u003cinput id=\"'+id+'\" type=\"'+type+'\" value=\"'+esc(value)+'\">\u003c/label>';\n let headerSource='',headerTarget='';\n let section='sources',selected='',role='source',domain='orders',rowPage=0,targetPage=0,filter='',costRow='',allocationKey='',correctionRow='',correctionColumn=0;\n let state,report,redraw,wrap;\n const current=()=>state.sources.find(x=>x.id===selected)||state.sources.find(x=>x.id===state.selections[role][domain]);\n const draft=()=>getDraft()||{mapping:{},allocation:{},match:{},correction:{},review:{}};\n const keep=(kind,key,value)=>{const d=clone(draft());d[kind]??={};d[kind][key]=clone(value);setDraft(d);};\n const remove=(kind,key)=>{const d=clone(draft());if(d[kind])delete d[kind][key];return d;};\n const effective=(src,row)=>{const cells=[...row.cells];for(const c of state.corrections)if(c.sourceId===src.id&&c.rowId===row.id)cells[c.column]=c.value;return cells;};\n const inputValue=id=>$(id)?.value??'';\n const labelRow=r=>[r.values.company_id,r.values.work_order_id,r.values.line_id,r.values.line_kind,r.values.cost_amount,r.values.currency,r.values.cost_basis].filter(Boolean).join(' / ');\n async function save(action,input,clear){\n  const saved=clear?remove(clear[0],clear[1]):draft();\n  await change(meta=>W.run(getWorkspace(),action,{...meta,at:now(),...input}),saved);\n }\n function sourceView(){\n  const src=current();if(src){selected=src.id;const saved=draft().correction?.[src.id];if(saved){correctionRow=saved.rowId;correctionColumn=saved.column;}}\n  const choices=state.sources.filter(s=>s.role===role&&s.domain===domain);\n  let html='\u003csection class=\"panel\">\u003ch2>Original work-order files\u003c/h2>\u003cp>Retain complete original CSV files, map their actual columns, and select returned exports from the chosen target system. Costs require their original currency and cost basis; blank costs remain missing.\u003c/p>\u003cdiv class=\"toolbar\">\u003clabel>Side\u003cselect id=\"wo-role\">'+['source','target'].map(x=>option(x,x==='source'?'Original source':'Actual target return',role)).join('')+'\u003c/select>\u003c/label>\u003clabel>Content\u003cselect id=\"wo-domain\">'+['orders','costs'].map(x=>option(x,x==='orders'?'Work-order headers':'Cost lines',domain)).join('')+'\u003c/select>\u003c/label>\u003cinput type=\"file\" id=\"wo-file\" accept=\".csv,text/csv\">'+btn('wo-import','Import complete CSV')+btn('wo-template','Empty column template')+'\u003c/div>\u003clabel>Retained edition\u003cselect id=\"wo-source\">\u003coption value=\"\">Choose a source file\u003c/option>'+choices.map(s=>option(s.id,s.filename+' · '+s.rows.length+' rows'+(state.selections[role][domain]===s.id?' · selected':''),selected)).join('')+'\u003c/select>\u003c/label>'+btn('wo-select','Use this retained edition')+'\u003c/section>';\n  if(!src)return html;\n  const mapping=draft().mapping?.[src.id]||state.mappings[src.id]||Object.fromEntries(W.FIELDS[src.domain].filter(f=>src.headers.includes(f.name)).map(f=>[f.name,src.headers.indexOf(f.name)]));\n  html+='\u003csection class=\"panel\">\u003ch3>Field mapping\u003c/h3>\u003cp>Column numbers distinguish duplicate original headings. Required fields carry an asterisk. Save the reviewed mapping before reconciliation.\u003c/p>\u003cdiv class=\"fields\">'+W.FIELDS[src.domain].map(f=>'\u003clabel>'+esc(f.label)+(f.required?' *':'')+'\u003cselect data-wo-field=\"'+esc(f.name)+'\">\u003coption value=\"\">Not supplied\u003c/option>'+src.headers.map((h,i)=>option(String(i),(i+1)+': '+h,mapping[f.name]===undefined?'':String(mapping[f.name]))).join('')+'\u003c/select>\u003c/label>').join('')+'\u003c/div>'+btn('wo-map','Save reviewed mapping')+btn('wo-original','Download original CSV')+'\u003c/section>';\n  const rows=src.rows.filter(r=>!filter||effective(src,r).some(v=>v.toLowerCase().includes(filter.toLowerCase()))),page=rows.slice(rowPage*50,rowPage*50+50);\n  html+='\u003csection class=\"panel\">\u003ch3>Original rows and corrections\u003c/h3>'+field('wo-filter','Filter original or corrected cells',filter)+'\u003cp>'+rows.length+' rows · page '+(rowPage+1)+'\u003c/p>'+table(['Row',...src.headers],page.map(r=>[r.id,...effective(src,r)]))+btn('wo-prev','Previous')+btn('wo-next','Next')+'\u003cdetails id=\"wo-correction\">\u003csummary>Correct a selected source cell\u003c/summary>\u003cp>The original CSV remains unchanged. Each correction retains its prior value, reviewer and reason.\u003c/p>\u003clabel>Row\u003cselect id=\"wo-c-row\">\u003coption value=\"\">Select from this page\u003c/option>'+page.map(r=>option(r.id,'Record '+r.record+' · '+effective(src,r).slice(0,4).join(' / '),correctionRow)).join('')+'\u003c/select>\u003c/label>\u003clabel>Column\u003cselect id=\"wo-c-col\">'+src.headers.map((h,i)=>option(String(i),(i+1)+': '+h,String(correctionColumn))).join('')+'\u003c/select>\u003c/label>'+field('wo-c-value','Corrected value',draft().correction?.[src.id]?.value||'')+field('wo-c-actor','Reviewer',draft().correction?.[src.id]?.actor||'')+'\u003clabel>Reason\u003ctextarea id=\"wo-c-reason\">'+esc(draft().correction?.[src.id]?.reason||'')+'\u003c/textarea>\u003c/label>'+btn('wo-c-save','Save cell correction')+'\u003c/details>\u003c/section>';\n  return html;\n }\n const allocationFields=['id','work_order_id','asset_id','fixed_asset_id','project_id','project_task_id','dimension_set_id','dimension_1','dimension_2','cost_amount','quantity','unit_code','posting_date'];\n function allocationView(){\n  const costs=report.domains.source.costs;let row=costs.find(r=>r.rowId===costRow)||costs[0];if(row)costRow=row.rowId;\n  let html='\u003csection class=\"panel\">\u003ch2>Cost allocation\u003c/h2>\u003cp>Allocate the complete original cost to explicit destination orders, assets, projects and dimensions. Each amount must sum exactly to its source line. Quantities are conserved separately in their original unit.\u003c/p>\u003clabel>Original cost line\u003cselect id=\"wo-cost\">\u003coption value=\"\">Choose a mapped cost\u003c/option>'+costs.map(r=>option(r.rowId,labelRow(r),costRow)).join('')+'\u003c/select>\u003c/label>\u003c/section>';\n  if(!row)return html+'\u003cp>Import and map the original orders and costs first.\u003c/p>';\n  const existing=state.allocations[costRow],d=draft().allocation?.[costRow]||{rows:existing?.rows||[{id:'full',...row.values,note:''}],actor:existing?.actor||'',reason:existing?.reason||''};\n  html+='\u003csection class=\"panel\">\u003ch3>'+esc(labelRow(row))+'\u003c/h3>\u003cp>Company '+esc(row.values.company_id)+' · currency '+esc(row.values.currency)+' · basis '+esc(row.values.cost_basis)+' · kind '+esc(row.values.line_kind)+'\u003c/p>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>'+allocationFields.map(f=>'\u003cth>'+esc(f.replaceAll('_',' '))+'\u003c/th>').join('')+'\u003cth>Note\u003c/th>\u003cth>Action\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>'+d.rows.map((a,i)=>'\u003ctr>'+allocationFields.map(f=>'\u003ctd>\u003cinput aria-label=\"'+esc('Allocation '+(i+1)+' '+f)+'\" data-wo-allocation=\"'+i+'\" data-wo-key=\"'+f+'\" value=\"'+esc(a[f]??'')+'\">\u003c/td>').join('')+'\u003ctd>\u003cinput data-wo-allocation=\"'+i+'\" data-wo-key=\"note\" aria-label=\"Allocation note\" value=\"'+esc(a.note||'')+'\">\u003c/td>\u003ctd>\u003cbutton data-wo-remove=\"'+i+'\">Remove\u003c/button>\u003c/td>\u003c/tr>').join('')+'\u003c/tbody>\u003c/table>\u003c/div>'+btn('wo-add-allocation','Add destination')+field('wo-a-actor','Reviewer',d.actor)+'\u003clabel>Allocation reason\u003ctextarea id=\"wo-a-reason\">'+esc(d.reason)+'\u003c/textarea>\u003c/label>'+btn('wo-save-allocation','Save complete allocation')+'\u003cp>Original company, currency, cost basis and kind remain explicit. No implicit exchange rate, unit conversion or expected-to-actual cost conversion is applied.\u003c/p>\u003c/section>';\n  html+='\u003csection class=\"panel\">\u003ch3>Import a complete allocation schedule\u003c/h3>\u003cp>Download expected allocations, edit explicit destinations and amounts in the complete CSV, and import the reviewed schedule. Retain source_row_id and allocation_id. One import can apply up to 10,000 allocation rows through the same original journal.\u003c/p>'+btn('wo-expected-csv','Download current allocation CSV')+'\u003cinput type=\"file\" id=\"wo-batch-file\" accept=\".csv,text/csv\">'+field('wo-batch-actor','Schedule reviewer')+'\u003clabel>Schedule reason\u003ctextarea id=\"wo-batch-reason\">\u003c/textarea>\u003c/label>'+btn('wo-allocation-batch','Apply reviewed allocation CSV')+'\u003c/section>';\n  return html;\n }\n function readbackView(){\n  const expected=report.expected;let item=expected.find(x=>x.key===allocationKey)||expected[0];if(item)allocationKey=item.key;\n  let html='\u003csection class=\"panel\">\u003ch2>Returned target reconciliation\u003c/h2>\u003cp>Select the actual returned cost rows for each expected allocation. A returned row can serve one allocation. Native IDs and the reviewed match stay with the original files; descriptions and maintenance-plan numbers are never used as automatic order matches.\u003c/p>\u003clabel>Expected allocation\u003cselect id=\"wo-expected\">'+expected.map(a=>option(a.key,[a.values.work_order_id,a.values.asset_id,a.allocationId,a.values.cost_amount,a.values.currency,a.values.cost_basis].filter(Boolean).join(' / '),allocationKey)).join('')+'\u003c/select>\u003c/label>\u003c/section>';\n  if(!item)return html;\n  const saved=state.matches[item.key],d=draft().match?.[item.key]||{rowIds:saved?.rowIds||[],actor:saved?.actor||'',reason:saved?.reason||''};\n  const rows=report.domains.target.costs.filter(r=>!filter||labelRow(r).toLowerCase().includes(filter.toLowerCase())),page=rows.slice(targetPage*50,targetPage*50+50);\n  html+='\u003csection class=\"panel\">\u003ch3>Actual returned costs\u003c/h3>'+field('wo-filter','Filter returned company / order / line / amount',filter)+'\u003cp>'+d.rowIds.length+' selected · '+rows.length+' available rows · page '+(targetPage+1)+'\u003c/p>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Select\u003c/th>\u003cth>Original returned row\u003c/th>\u003cth>Company / order / line / amount\u003c/th>\u003cth>Asset\u003c/th>\u003cth>Project / task\u003c/th>\u003cth>Dimensions\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>'+page.map(r=>'\u003ctr>\u003ctd>\u003cinput type=\"checkbox\" data-wo-match=\"'+esc(r.rowId)+'\" aria-label=\"'+esc('Select returned '+r.rowId)+'\"'+(d.rowIds.includes(r.rowId)?' checked':'')+'>\u003c/td>\u003ctd>'+esc(r.rowId)+'\u00 lete match\u003c/button>\u003c/p>').join('')+'\u003c/section>';\n  return html;\n }\n\n function headerView(){\n  const rows=report.domains.source.orders,src=rows.find(r=>r.rowId===headerSource)||rows[0];if(src)headerSource=src.rowId;\n  let html='\u003csection class=\"panel\">\u003ch2>Returned work-order headers\u003c/h2>\u003cp>Map each original header to its actual returned header. Review destination identifiers, status, dates, location, assets and description. Original source values remain unchanged; explicit destination corrections retain their reviewer and reason.\u003c/p>\u003clabel>Original order\u003cselect id=\"wo-h-source\">\u003coption value=\"\">Choose a mapped header\u003c/option>'+rows.map(r=>option(r.rowId,r.values.company_id+' / '+r.values.work_order_id+' / '+r.values.description,headerSource)).join('')+'\u003c/select>\u003c/label>\u003c/section>';\n  if(!src)return html;\n  const saved=state.orderMatches[src.rowId],d=draft().header?.[src.rowId]||{targetRowId:saved?.targetRowId||'',expected:saved?.expected||{},actor:saved?.actor||'',reason:saved?.reason||''};\n  headerTarget=d.targetRowId;\n  html+='\u003csection class=\"panel\">\u003clabel>Actual returned header\u003cselect id=\"wo-h-target\">\u003coption value=\"\">Choose the returned header\u003c/option>'+report.domains.target.orders.map(r=>option(r.rowId,r.values.company_id+' / '+r.values.work_order_id+' / '+r.values.description,headerTarget)).join('')+'\u003c/select>\u003c/label>\u003cdiv class=\"fields\">'+W.FIELDS.orders.filter(f=>!['native_record_id','source_reference'].includes(f.name)).map(f=>'\u003clabel>'+esc(f.label)+'\u003cinput data-wo-header=\"'+f.name+'\" value=\"'+esc(Object.hasOwn(d.expected,f.name)?d.expected[f.name]:src.values[f.name])+'\">\u003cspan class=\"muted\">Original: '+esc(src.values[f.name]||'(not supplied)')+'\u003c/span>\u003c/label>').join('')+'\u003c/div>'+field('wo-h-actor','Header reviewer',d.actor)+'\u003clabel>Match and destination evidence\u003ctextarea id=\"w ation and returned-export basis accepted':report.ready?'All selected costs reconcile; ready for recorded acceptance':'Review the current source and returned-export differences')+'\u003c/strong>\u003c/p>\u003cp>'+s.errors+' source issues · '+s.differentAllocations+' differing allocations · '+s.unmatchedTarget+' unmatched target rows\u003c/p>'+table(['Issue','Original row / allocation','Detail'],report.issues.slice(0,100).map(i=>[i.code,i.rowId||i.allocationKey||i.sourceId||'',i.message]))+(report.issues.length>100?'\u003cp>The complete downloaded reconciliation includes all '+report.issues.length+' issues.\u003c/p>':'')+btn('wo-report','Download full reconciliation')+btn('wo-expected-csv','Download expected allocations')+'\u003c/section>\u003csection class=\"panel\">\u003ch3>Exact monetary totals\u003c/h3>'+['source','allocated','returned'].map(side=>'\u003ch4>'+esc(side)+'\u003c/h4>'+table(['Company','Currency','Cost basis','Kind','Amount','Rows'],report.totals[side].map(r=>[r.company_id,r.currency,r.cost_basis,r.line_kind,r.amount,r.rows]))).join('')+'\u003c/section>\u003csection class=\"panel\">\u003ch3>Record the actual review\u003c/h3>'+field('wo-r-label','Rehearsal or cutover label',d.label||'')+field('wo-r-actor','Reviewer',d.actor||'')+field('wo-r-reference','Actual export / run / cutover reference',d.reference||'')+'\u003clabel>Observation and correction notes\u003ctextarea id=\"wo-r-note\">'+esc(d.note||'')+'\u003c/textarea>\u003c/label>'+btn('wo-rehearsal','Record rehearsal result')+'\u003cbutton id=\"wo-accept\"'+(!report.ready?' disabled':'')+'>Accept current returned-export basis\u003c/button>\u003cp>Financial book balances and GL closure remain in Financial basis and Reconciliation. A later source, mapping, correction, allocation or match change makes this acceptance historical.\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch3>Retained review history\u003c/h3>'+table(['Time','Type','Label','Reviewer','Reference','Basis'],[...state.rehearsa
