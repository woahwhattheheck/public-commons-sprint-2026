it-and-independent-reopen',async()=>{\n   await section(page,'contract');await page.locator('#contract-note').fill('Unfinished supplier clarification — source remains exact; no implicit authorization.');await section(page,'workspace');\n   const recovery=await download(page,page.locator('#top-json'),path.join(session.attempt,'Working_Recovery.json')),html=await download(page,page.locator('#top-html'),path.join(session.attempt,'Harbour_Source_Workspace.html')),zip=await download(page,page.locator('#top-zip'),path.join(session.attempt,'Harbour_Complete_Workspace.zip'));outputs.push(recovery,html,zip);\n   const record=Portable.parseRecovery((await regular(recovery.path)).toString('utf8')),members=zipMembers(await regular(zip.path)),expected=Portable.completeFiles(source,record);\n   need(members.size===expected.length,'The complete ZIP omitted or added an original selected member.');for(const file of expected)need(members.get(file.path)?.equals(Buffer.from(Portable.memberBytes(file))),'The complete ZIP member changed: '+file.path);\n   const fresh=await context.browser().newContext({acceptDownloads:true,viewport:{width:1440,height:1000}}),view=await fresh.newPage();view.on('pageerror',listen);\n   try{\n    await view.goto(pathToFileURL(html.path).href);await ready(view);await section(view,'contract');need((await view.locator('#contract-note').inputValue()).includes('Unfinished supplier clarification'),'The complete working HTML lost its unfinished form.');\n    await capture(view,session.attempt,'independent-unfinished-reopen',screens);await section(view,'workspace');\n    const again=await download(view,view.locator('#top-json'),path.join(session.attempt,'Independent_Reopened_Recovery.json'));outputs.push(again);const reopened=Portable.parseRecovery((await regular(again.path)).toString('utf8'));need(same(reopened.workspace,record.workspace)&&Object.entries(record.drafts).filter(([key])=>key!=='$selection').every(([key,value])=>same(reopened.drafts[key],value))&&reopened.copyId===record.copyId,'Independent reopen lost complete history or unfinished values.');\n    // Open every generated complete HTML report from the same downloaded archive, plus its print view.\n    let index=0;for(const [name,body]of members)if(name.endsWith('.html')&&!name.endsWith('Harbour_Source_Workspace.html')){const file=path.join(session.attempt,'report-'+index+'.html');await immutable(file,body);outputs.push({path:file,bytes:body.length,sha256:sha(body)});await view.goto(pathToFileURL(file).href);await view.locator('body').waitFor();await documentViews(view,session.attempt,'full-report-'+index,screens);index++;}\n    for(const original of record.workspace.files.filter(f=>/\\.pdf$/i.test(f.filename))){need(typeof renderBinaryAttachment==='function','The complete original PDF in the outgoing workspace needs every applicable page rendered.');const file=path.join(session.attempt,'original-'+original.sha256+'.pdf');await immutable(file,Buffer.from(original.base64,'base64'));const result=await renderBinaryAttachment({page:view,file,outputDirectory:session.attempt,prefix:'original-'+original.sha256.slice(0,12),widths:[1440,390]});need(result?.screens?.length,'Retain actual original PDF page pixels.');screens.push(...result.screens);outputs.push(...(result.outputs||[]));}\n   }finally{await fresh.close();}\n   return{recovery,html,zip,members:members.size,revision:record.workspace.revision};\n  },{outputs,screens});\n  const competing=await session.phase('two-tabs-original-revision-conflict',async()=>{\n   const base=Portable.parseRecovery((await regular(exit.recovery.path)).toString('utf8')),copyId=session.intent.copyId+'-competing',record={...base,copyId},file=path.join(session.attempt,'Competing_Original.html');\n   await immutable(file,Buffer.from(Portable.workingHTML(source,record)));\n   const fresh=await context.browser().newContext({acceptDownloads:true,viewport:{width:1440,height:1000}}),one=await fresh.newPage(),two=await fresh.newPage();one.on('pageerror',listen);two.on('pageerror',listen);\n   try{\n    await one.goto(pathToFileURL(file).href);await ready(one);await two.goto(pathToFileURL(file).href);await ready(two);\n    for(const [p,title]of [[one,'First attributed later review'],[two,'Second independent proposed review']]){await section(p,'review');await actor(p,'Concurrent receiving operator');await fill(p.locator('#review-form'),'review-decision','needs-work');await fill(p.locator('#review-form'),'review-note',title);}\n    await submit(one.locator('#review-form'));await one.waitForFunction(n=>document.querySelector('#workspace-revision')?.textContent.startsWith('Revision '+n+' ·'),base.workspace.revision+1);await ready(one);\n    await submit(two.locator('#review-form'));await two.locator('#open-conflict').waitFor();await ready(two);await capture(two,session.attempt,'competing-branch-preserved',screens);\n    await two.locator('#open-conflict').click();await ready(two);await section(two,'workspace');const branch=await download(two,two.locator('#top-json'),path.join(session.attempt,'Competing_Proposed_Branch.json'));outputs.push(branch);\n    await section(one,'workspace');const current=await download(one,one.locator('#top-json'),path.join(session.attempt,'Competing_Current_Original.json'));outputs.push(current);\n    const a=Portable.parseRecovery((await regular(current.path)).toString('utf8')),b=Portable.parseRecovery((await regular(branch.path)).toString('utf8'));\n    need(a.workspace.revision===base.workspace.revision+1&&b.workspace.revision===base.workspace.revision+1&&Portable.compare(a.workspace,b.workspace)==='diverged','Both complete original competing branches must survive.');\n    return{current,branch,relationship:'diverged'};\n   }finally{await fresh.close();}\n  },{outputs,screens});\n  need(errors.length===0,'Actual browser page errors: '+errors.join('; '));await checkOriginals(selected);\n  return await session.finish({schema:'commons.harbour-source-rendered-receiving.v1',state:'CONTROLS_AND_EXPORTS_COMPLETED',originalInputs:selected,imported,corrected,outgoing,exit,competing,outputs,screens,pageErrors:errors,producerInspection:'Producing worker must personally LOOK at these exact returned pixels and all applicable attachment pages before marking the selected outgoing product ready.'});\n }finally{page.off('pageerror',listen);await session.close();}\n}\n","README.md":"# Harbour Source Workspace\n\nA complete editable source, operating-evidence, financial-basis and supplier-return workspace. Open Harbour_Source_Workspace.html directly in a current browser. This is a migration and evidence tool; the responsible authority and supplier retain actual harbour operations, billing and production loading.\n\n## Complete working flow\n\n1. **Workspace & delivery**: create the original workspace or open a complete engine/recovery JSON. Name the operator before changing retained source. Every operation keeps its original identity and actor.\n2. **Original files & CSV**: retain all original bytes, source URL and representation. Receive actual UTF-8 CSV as source, target or reference. Choose one of nineteen neutral roles; these are not asserted vendor tables. Native workbook, SQL, PDF and other files remain full supporting originals.\n3. **Role mapping**: select exact zero-based header occurrences and all opaque compound-key parts. Extra fields, constants and references are explicit. Unknown columns, missing positions and repeated witnesses stay in complete source.\n4. **Source scope**: select full mappings/files, declare every role included/not-supplied/not-applicable with reason, and record policy/history/evidence coverage. Source and target/reference sides remain distinct. External endpoints need exact retained declarations; they do not create a local record or target key.\n5. **Records & relationships**: inspect original versus effective cells and complete relationship/document/access/history evidence. Correct a cell only with its original current value and attributed reason. A later correction stales the old selection without rewriting earlier files or reports.\n6. **Operating evidence**: save an immutable profile from actual selected policy originals and mapping fields. Date formats, code meanings, conditional completeness, dimensions, contact evidence and recorded waiting-date decisions are explicit. Inspect every resulting finding. No automatic deadline, eligibility, vessel suitability, mooring allocation or permit action exists.\n7. **Financial basis**: declare actual amount/account/currency/period/type fields, sign multipliers, cross-namespace/period rules and source completeness. Blank remains absent. Exact selected totals never imply a complete debtor balance. Per-record residuals need all required coverage and valid linked data. The application does not calculate charges from public tariffs or move money.\n8. **Findings & review**: inspect the structural report and separate operating/finance assessments. An accepted review retains the exact current profiles; it does not grant an operational, financial or supplier approval. Download complete JSON and readable reports.\n9. **Supplier templates**: retain real original template/dictionary/route files or label an authored example. Map every selected source, every destination column and every relationship explicitly. A changed native ID needs an original supplied crosswalk. Actual API/write capability is not inferred.\n10. **Prepared output & returns**: freeze target CSV bytes only against the current reviewed selection. Receive actual complete returned files linked to that preparation. Inspect missing/extra/conflicting records, changed cells and available native outcomes. Previous editions remain exact.\n11. **History & recovery**: preserve full operations, independent copy identity and every unfinished form. Export complete working JSON, a self-contained working HTML, or the whole source-and-data ZIP. Reopen on a separate browser/copy and verify the complete history and original files.\n\n## Operating profile binding guide\n\nThe form retains the complete editable JSON array. Its initial skeleton uses actual selected mapping IDs with empty checks; it does not guess date/code semantics. Every binding contains mappingId, dateFields, codeMeanings, requiredByType, dateOrders, dimensions, localContacts and waitingDecisions. The included API.md gives the exact field names. A declared field must exist in that mapping. Date comparisons require the same explicitly declared format. The policy source files must belong to the selected scope. Missing checks stay undeclared rather than passing by default.\n\n## Financial profile binding guide\n\nEach financial binding selects actual charges/payments/allocations mapping fields and declares entry-type sign multipliers. Namespace and period triples are exact source permissions to compare; they are not conversion rules. Coverage identifies exact namespace/account/currency/period plus original files and all four completeness flags. Selected-only totals and unconfirmed residuals remain visibly separate. Review the source basis with the actual finance owner before relying on a control.\n\n## Persistence, original bytes and exit\n\nBrowser persistence uses a transactional revision compare-and-swap. Competing completed edits create independently retained branches. Unfinished forms are kept per tab, and conflicting incoming writing remains a recoverable lineage. A stale form retains its original basis until explicitly reviewed. Download raw unfinished values if a complete working-file limit is exceeded; the current writing is not deleted.\n\nThe product supports at most32MiB per selected file/CSV,100,000 rows and512 columns per CSV,256 files,128 sources,10,000 operations and128MiB complete portable JSON. These are validation ceilings, not measured browser throughput. Complete evidence, history, reports, row witnesses and unfinished writing count toward portable size. Actual commissioned populations require measurement.\n\nWhole delivery includes all originals, mappings, profiles, corrections, reviews, contract/template editions, frozen outputs, actual returned files, complete journal and all runnable source. Source permissions are retained declarations; an offline file must still be handled under its owner's access policy. This version does not enforce a supplier's tenant ACL.\n\n## Maintained build and native receiving\n\nRun `node build.mjs --out ABS_NEW_DIRECTORY` for the complete blank application and source ZIP. Add `--workspace ABS_COMPLETE_JSON` and optionally the original `--copy-id` to build an editable saved edition. Full output is published atomically/create-only; existing differing bytes are not overwritten. CLI commands and the complete original-request/replay contract are in CORE_OPERATING.md.\n\nBROWSER_OPERATING.md gives the existing-browser course. Source checks and parsed scripts are not actual rendering. The producer must personally view the exact outgoing app, full reports, each attachment and applicable PDF pages after operating the key controls and independently reopening the complete edition.\n","BROWSER_OPERATING.md":"# Original Harbour browser receiving course\n\nUse the existing equipped native browser/controller. The module exports:\n\n```js\nawait runHarbourReceiving({\n page, context, outputDirectory: ABS_ORIGINAL_OPERATION,\n applicationPath: ABS_EXACT_HARBOUR_HTML,\n fixturePath: ABS_AUTHORED_COMPLETE_ENGINE_WORKSPACE,\n attachmentPaths: [ABS_EXACT_HARBOUR_HTML, ABS_WORKSHARE_HTML, ABS_PUBLIC_REFERENCE_JSON, ABS_PRACTICAL_GUIDE_HTML],\n renderBinaryAttachment\n});\n```\n\nImport runHarbourReceiving from run_browser_receiving.mjs. All paths are absolute. The caller supplies and owns page/context and the existing browser. The callback creates isolated child contexts for independent received copies and closes only those; it does not create or close the caller's browser.\n\nThe fixture must be the exact workspace returned by the maintained buildReceivingFixture() in receiving-fixture.mjs. Export it with the original engine. It contains explicitly authored harbour records, policy sources, both profiles, supplied-example targets and full return. The first source is parties with its editable label at column1, so the actual successor course changes that one label and leaves every original prepared/returned byte intact. It is separate from the public council reference and never asserted to be live customer data.\n\nThe callback freezes the actual application, full authored fixture and every outgoing attachment before dispatch. An unchanged retry resumes the original operation and retained output bytes. It validates the executing complete source against the actual embedded application source. No new filename or run directory should replace an interrupted original request.\n\n## Complete actual course\n\n- Open every exact outgoing HTML through the real browser; read full documents at1440 and390 and their print view. Open the reference JSON through the actual application, inspect all source/profile/return/history sections and export its complete handover. Preserve source qualifiers and exact records.\n- Replay every maintained authored operation through actual controls: complete file/CSV import, mapping, scope, operating and financial profiles, correction/review, actual target preparation and full returned files.\n- Inspect all19-role source relationships, original/effective cells, source-bound profile findings, complete prepared CSV and actual comparison. Capture desktop/narrow views.\n- Correct one authored original party label, save a successor scope and both successor profiles, retain a new review/contract/preparation, and compare the earlier actual return. Exactly one differing label remains visible; old target bytes are unchanged.\n- Open every full report including original and successor returned-data reports, all applicable original PDFs, and actual outgoing attachments.\n- Save unfinished supplier notes, export complete working JSON/HTML/ZIP, compare every ZIP member against the original complete file selection, and reopen in a separate browser. Keep full source history, original files, profile editions and unfinished writing.\n- Exercise two tabs against the same original revision and retain both complete diverged branches after the competing edit.\n\nFor an original PDF or any other binary attachment, the equipped caller must supply renderBinaryAttachment({page,file,outputDirectory,prefix,widths}) returning actual screens[] and outputs[]. It must open usable ZIP contents and every applicable PDF page; byte verification alone is not viewing. The callback fails instead of silently counting a binary file as inspected without this adapter.\n\nThe result is controls/exports completion with exact input/output identities and screenshots. The producing worker must personally LOOK at the returned pixels and all attachment pages before reporting the selected outgoing edition ready. Preserve that observation in the same original operation; no external send is implied.\n","migration-receiving/continuation.mjs":"import fs from 'node:fs/promises';\nimport path from 'node:path';\nimport net from 'node:net';\nimport {randomUUID,createHash} from 'node:crypto';\nimport {pathToFileURL} from 'node:url';\nconst sha=b=>createHash('sha256').update(b).digest('hex');\nconst need=(ok,message)=>{if(!ok)throw Error(message);};\nconst json=value=>Buffer.from(JSON.stringify(value,null,2)+'\\n');\nasync function optional(file){try{const s=await fs.lstat(file);need(s.isFile()&&!s.isSymbolicLink(),'Keep a regular original receiving file: '+file);return await fs.readFile(file);}catch(e){if(e.code==='ENOENT')return null;throw e;}}\nasync function immutable(file,body){\n const old=await optional(file);if(old){need(old.equals(body),'The original receiving file already contains another edition: '+file);return;}\n await fs.mkdir(path.dirname(file),{recursive:true,mode:0o700});const temp function rawDrafts(){download('Harbour_Unfinished_Values.json',pretty({schema:'commons.harbour-source-unfinished.v1',workspaceId:S.ws?.id||null,copyId:S.key,baseRevision:S.ws?.revision??null,selection:S.selection,drafts:S.drafts}),'application/json');}
$('global-home').addEventListener('click',()=>act(()=>chooseSection('workspace')));
$('global-raw-drafts').addEventListener('click',rawDrafts);
(async()=>{
  try{
    if(boot.record){
      const incoming=Portable.parseRecovery(pretty(boot.record)),key=incoming.copyId||boot.copyId||id('harbour-copy'),current=await Store.readCopy(key);
      if(!current){await Store.createCopy(key,incoming.workspace,incoming.selection,tab,incoming.drafts);await useCopy(key);}
      else{
        const relation=Portable.compare(current.workspace,incoming.workspace);
        if(relation==='identical'||relation==='incoming_ancestor')await useCopy(key,incoming.drafts,incoming.selection);
        else{const independent=id('harbour-copy');await Store.createCopy(independent,incoming.workspace,incoming.selection,tab,incoming.drafts);await useCopy(independent);notice('The received file is preserved as an independent copy alongside the existing saved work.');}
      }
    }else render();
  }catch(error){notice('The complete working file could not be opened: '+error.message,true);$('harbour-app').innerHTML='<section class="card"><h2>Retain this original file</h2><p>'+esc(error.message)+'</p><p>The complete original bootstrap and saved browser copies remain available. Use the original unmodified file or a complete working JSON export.</p><button id="startup-download">Download exact embedded working record</button></section>';$('startup-download').onclick=()=>download('Original_Embedded_Working_Record.json',pretty(boot.record),'application/json');}
  finally{busy(false);}
})();

})();</script></body></html>
