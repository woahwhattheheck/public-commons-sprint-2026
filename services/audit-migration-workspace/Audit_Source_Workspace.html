Buffer.from(text,'utf8').equals(body))throw Error('Retain valid exact UTF-8 original bytes: '+file);return text;}\nexport async function loadSource(root=dirname(fileURLToPath(import.meta.url))){\n const source={};for(const name of SOURCE_FILES)source[name]=await sourceText(join(root,name));\n source['migration-receiving/continuation.mjs']=await sourceText(join(root,'..','migration-receiving','continuation.mjs'));return source;\n}\nexport async function publishFile(file,body){\n const output=resolve(file),bytes=typeof body==='string'?Buffer.from(body):Buffer.from(body),temporary=output+'.'+randomUUID()+'.tmp';await mkdir(dirname(output),{recursive:true});let handle;\n try{handle=await open(temporary,'wx',0o600);await handle.writeFile(bytes);await handle.sync();await handle.close();handle=null;\n  try{await link(temporary,output);}catch(error){if(error.code!=='EEXIST')throw error;if(!(await regular(output)).equals(bytes))throw Error('The original output path contains different complete bytes: '+output);}\n  return{path:output,...sha256Bytes(bytes)};\n }finally{await handle?.close().catch(()=>{});await rm(temporary,{force:true});}\n}\nasync function members(root,prefix=''){const rows=[];for(const name of await readdir(join(root,prefix))){const path=prefix?prefix+'/'+name:name,stat=await lstat(join(root,path));if(stat.isSymbolicLink())throw Error('The complete output contains a symbolic link.');if(stat.isDirectory())rows.push(...await members(root,path));else if(stat.isFile())rows.push(path);else throw Error('The complete output contains a nonregular member.');}return rows.sort();}\nexport async function publishDirectory(directory,files){\n const output=resolve(directory),stage=output+'.'+randomUUID()+'.tmp',selected=[];await mkdir(dirname(output),{recursive:true});await mkdir(stage,{mode:0o700});\n try{\n  const names=new Set();for(const file of files){if(typeof file.path!=='string'||file.path.startsWith('/')||file.path.includes('\\\\')||file.path.split('/').some(p=>!p||p==='.'||p==='..')||names.has(file.path))throw Error('Retain distinct safe relative output paths.');names.add(file.path);\n   const bytes=Portable.memberBytes(file),identity=sha256Bytes(bytes);if((file.bytes!==undefined&&identity.bytes!==file.bytes)||(file.sha256!==undefined&&identity.sha256!==file.sha256))throw Error('Selected complete output differs: '+file.path);\n   await publishFile(join(stage,file.path),bytes);selected.push({path:file.path,...identity});\n  }\n  try{await rename(stage,output);}catch(error){\n   if(!['EEXIST','ENOTEMPTY'].includes(error.code))throw error;\n   const stat=await lstat(output);if(!stat.isDirectory()||stat.isSymbolicLink())throw Error('Keep the original complete output directory.');\n   if(JSON.stringify(await members(output))!==JSON.stringify(selected.map(f=>f.path).sort()))throw Error('The existing output directory selects different complete members.');\n   for(const file of selected){const bytes=await regular(join(output,file.path)),identity=sha256Bytes(bytes);if(identity.bytes!==file.bytes||identity.sha256!==file.sha256)throw Error('The retained output differs: '+file.path);}\n  }\n  return{directory:output,files:selected};\n }finally{await rm(stage,{recursive:true,force:true});}\n}\nexport async function build({out,workspacePath=null,copyId=null,sourceRoot=null}){\n const source=await loadSource(sourceRoot||dirname(fileURLToPath(import.meta.url))),record=workspacePath?Portable.parseRecovery(await sourceText(resolve(workspacePath))):null;\n if(record&&copyId)record.copyId=copyId;\n const text=(path,type,body)=>({path,type,text:body,...sha256Utf8(body)});\n const files=record?Portable.completeFiles(source,record):[text('Audit_Source_Workspace.html','text/html',Portable.workingHTML(source)),text('START_HERE.txt','text/plain','Open Audit_Source_Workspace.html. This reusable application begins empty. Keep this complete directory and its source together. The supplied source has no customer records. See source/audit-migration-workspace/README.md for exact controls and full exit.\\n'),...Object.entries(source).map(([name,body])=>text('source/'+Portable.sourcePath(name),'text/plain',body))];\n const zip=Portable.zipBytes(files),manifest={schema:'commons.audit-migration-build.v1',workspaceId:record?.workspace.id||null,revision:record?.workspace.revision||0,copyId:record?.copyId||null,files:files.map(({path,type,bytes,sha256})=>({path,type,bytes,sha256})),zip:{path:resolve(out)+'.zip',...sha256Bytes(zip)}};\n // The complete selected directory is published atomically; a lost archive reply resumes create-only.\n const directory=await publishDirectory(out,[...files,text('BUILD.json','application/json',Portable.json(manifest))]);\n // ZIP is outside the immutable member directory so repeated directory comparison remains exact.\n const archive=await publishFile(resolve(out)+'.zip',zip);\n return{...manifest,...directory,archive};\n}\nfunction flags(argv){const out={};for(let i=0;i\u003cargv.length;i+=2){if(!['--out','--workspace','--copy-id'].includes(argv[i])||!argv[i+1]||out[argv[i]])throw Error('Usage: node build.mjs --out NEW_DIRECTORY [--workspace COMPLETE_JSON] [--copy-id ORIGINAL_COPY_ID]');out[argv[i]]=argv[i+1];}if(!out['--out'])throw Error('Supply a new complete --out directory.');return out;}\nif(process.argv[1]&&pathToFileURL(resolve(process.argv[1])).href===import.meta.url){try{const args=flags(process.argv.slice(2));console.log(Portable.json(await build({out:args['--out'],workspacePath:args['--workspace'],copyId:args['--copy-id']})));}catch(error){console.error(error.message);process.exitCode=1;}}\n","README.md":"# Audit Source Workspace\n\nA complete offline workspace for retaining audit records and evidence, declaring original mappings and scope, reviewing structural findings, preparing supplier-approved CSV files and comparing actual returned data. The twelve neutral roles are a migration model: universe, plans, engagements, controls, tests, findings, actions, documents, principals, access_rules, history and relations. They are not a supplier's native schema.\n\nOpen Audit_Source_Workspace.html in a current browser with IndexedDB available. The complete reusable application starts empty. All work stays in the selected browser copy until you deliberately download or move a complete working file. Keep confidential source records in an appropriately controlled environment; retained permission declarations do not create local authorization.\n\n## Whole operating flow\n\n1. **Workspace & delivery** — create a named workspace or open a complete working JSON. Enter the named operator above the section. A new operation retains that attribution, its actual time and the original revision.\n2. **Original files & CSV** — retain complete original evidence, dictionaries, workbooks, SQL extracts and response files. If document records declare a file binding ID, supply that exact ID when retaining the file. Mark original, authored transcription or authored example explicitly. Receive actual UTF-8 CSV separately, selecting its source/target/reference side and neutral role.\n3. **Role mapping** — select the original CSV and its exact namespace. Select every opaque key column. Map reserved or additional fields by numeric original occurrence, or an intentional exact constant. Declare relationship keys and their purposes explicitly. Duplicate headings and unmapped columns remain in the original.\n4. **Source scope** — select one mapping edition per intended original source, complete supporting files, every role's included/not-supplied/not-applicable declaration, and actual permission/history/evidence basis. All selected mappings share a side. A source-declared basis needs its retained original file. Save the complete population and cutoff statement.\n5. **Records & relationships** — inspect every original row through the 50-row controls. Exact compound keys keep namespace, role and original key parts separate. Missing positions and present empty strings are distinguished. Correct a source cell with an exact expected value and attributed reason. If several trailing cells are missing, append only the next missing position, one attributed correction at a time. Earlier scopes keep their original row edition.\n6. **Findings & review** — choose an exact frozen scope and inspect errors, warnings, source witnesses, document bytes and relationship continuity. Open a finding's original row. Save an accepted or needs-work review. Accepted is a structural preparation decision, not an audit opinion, vendor acceptance or confirmation of effective permission enforcement.\n7. **Supplier templates** — retain the supplier's complete actual route, dictionary, CSV template and any key crosswalk first. Select exact file IDs and source mapping IDs. The advanced JSON editors preserve ordered duplicate headers and explicit selector types. Every destination column needs a source selector or deliberate constant. Every actual source relationship needs an explicit target-key binding. Inspect the complete target assessment before preparing it. An authored teaching contract must be marked authored-example.\n8. **Prepared output & returns** — select the accepted current source review and actual target contract, then freeze the whole output. Download each complete frozen CSV. Later source edits preserve these original files. The supplier performs the sanctioned load. Retain actual returned CSV files and map every expected column to the returned occurrence, or null for an unreported non-key column. Omitted tables, duplicates, missing rows, unexpected rows, changed cells and unconfirmed positions stay visible. Keep the actual submission reference and interpretation.\n9. **History & recovery** — inspect every original operation and source edition. Recover another tab's unfinished forms into an independent copy. Download the complete working JSON, working HTML and whole ZIP before transferring or retiring a browser copy.\n\n## Source and identity rules\n\nCSV decoding is strict UTF-8. Original BOM, quoting, complete row order, duplicate headings and every original byte remain in retained files. Corrections create attributed editions. Identity uses the exact namespace, neutral role and ordered opaque key parts; no display-name merge or first/last-wins duplicate policy is applied. Conflicting rows include differences in unmapped original columns.\n\nWorkbook, ODF, SQL, PDF and binary evidence inputs remain whole original files. This product does not claim a native workbook parser or a supplier write API. Obtain the actual sanctioned receiving contract before selecting a target mapping.\n\nSource ACL and history rows retain explicit relationships and evidence. Undocumented effect, inheritance, roles, outcomes or native version meanings remain unconfirmed. Original audit opinions are retained as source text without generating new assurance conclusions.\n\n## Saved work, concurrent tabs and complete exit\n\nEach browser copy has one revision and original journal. Each page has its own unfinished form records. An IndexedDB transaction compares the original head, saves the complete next workspace and clears only the submitted unchanged form atomically. A competing saved revision preserves the proposed complete branch separately instead of overwriting the current copy.\n\nA stale unfinished form keeps its original head until the operator uses **Keep these values against current revision**. Saved HTML carries those unfinished values. On reopen they fill only missing current-tab draft slots; newer local writing remains. A different or diverged received branch is kept independently. Receiving a newer descendant requires an explicit choice and another original-head comparison.\n\n**Download complete working JSON** includes the entire workspace, copy identity, current selection and unfinished values. **Download working HTML** includes the same record plus all executable source. **Download whole ZIP** adds every complete original byte, full history, selected source reports, prepared CSVs, returned comparisons, the usable application and its full source tree. Raw unfinished-value download remains available when an oversized working envelope cannot be exported.\n\nThe complete recovery limit is 128 MiB of UTF-8 JSON, including drafts; the engine's 128 MiB workspace ceiling is a maximum, not an extra allowance. Each original file/CSV is limited to 32 MiB; selected work also has explicit row, column, file, source and operation limits in API.md. Browser storage quota may be smaller. Preserve a downloaded complete copy.\n\n## Build and command-line use\n\nUse Node with support for the maintained ES modules. No runtime package install or network service is needed for the application or builder.\n\n~~~sh\nnode build.mjs --out /absolute/new/audit-delivery\nnode build.mjs --out /absolute/new/audit-working-delivery --workspace /absolute/Working_Recovery.json --copy-id original-browser-copy\n~~~\n\nThe builder publishes a complete directory, BUILD.json and a sibling .zip file. Existing output paths are adopted only when every originally selected member and complete byte identity agrees. Use a distinct destination for a changed source edition. Inside an exported ZIP, the runnable source is under source/audit-migration-workspace; the shared original browser receiving helper is beside it under source/migration-receiving.\n\nThe original CLI owns init, apply, inspect, rows, analyze, assess-target, report, handover and receive. See API.md and CORE_OPERATING.md for exact flags, operation replay, kernel lease and original input custody. It uses the same engine and full working envelope; there is no parallel application store.\n\n## Actual rendered receiving\n\nBROWSER_OPERATING.md defines the original equipped receiving continuation. Source checks alone do not establish that a customer artifact has been rendered. Before exact outgoing files are marked ready, the producing worker must open and use them at desktop and phone widths, personally inspect the returned pixels, operate the important controls, and open downloaded/reopened work. Every outgoing attachment, useful ZIP content and applicable report/PDF page is part of that same inspection. Preserve actual current device/browser ownership; the previously time-limited meeting reservation must not be propagated after its release.\n","run_browser_receiving.mjs":"import fs from 'node:fs/promises';\nimport path from 'node:path';\nimport {pathToFileURL} from 'node:url';\nimport {createHash,randomUUID} from 'node:crypto';\nimport * as Engine from './engine.mjs';\nimport * as Portable from './portable.mjs';\nimport {loadSource} from './build.mjs';\nimport {buildReceivingFixture} from './receiving-fixture.mjs';\nimport {openMigrationReceiving} from '../migration-receiving/continuation.mjs';\nconst sha=b=>createHash('sha256').update(b).digest('hex');\nconst need=(ok,message)=>{if(!ok)throw Error(message);};\nconst json=v=>Buffer.from(JSON.stringify(v,null,2)+'\\n');\nconst same=(a,b)=>Portable.canonical(a)===Portable.canonical(b);\nasync function regular(file){const stat=await fs.lstat(file);need(stat.isFile()&&!stat.isSymbolicLink(),'Keep a regular original file: '+file);return fs.readFile(file);}\nasync function optional(file){try{return await regular(file);}catch(error){if(error.code==='ENOENT')return null;throw error;}}\nasync function immutable(file,bytes){\n const body=Buffer.from(bytes),old=await optional(file);if(old){need(old.equals(body),'Original receiving bytes changed: '+file);return;}\n await fs.mkdir(path.dirname(file),{recursive:true,mode:0o700});const temp=file+'.'+randomUUID()+'.tmp';let handle;\n try{handle=await fs.open(temp,'wx',0o600);await handle.writeFile(body);await handle.sync();await handle.close();handle=null;try{await fs.link(temp,file);}catch(error){if(error.code!=='EEXIST')throw error;need((await regular(file)).equals(body),'Original output differs: '+file);}}\n finally{await handle?.close().catch(()=>{});await fs.rm(temp,{force:true});}\n}\nfunction bootOf(html){const re=/\u003cscript type=\"application\\/json\" id=\"audit-boot\">([\\s\\S]*?)\u003c\\/script>/,match=html.match(re);need(match,'Read the exact complete Audit Source Workspace application.');return{match,data:JSON.parse(match[1])};}\nfunction seedHTML(html,{copyId,portable}){const {match,data}=bootOf(html),record=Portable.parseRecovery(portable);record.copyId=copyId;return html.replace(match[0],()=>'\u003cscript type=\"application/json\" id=\"audit-boot\">'+Portable.safeJSON({...data,record,copyId})+'\u003c/script>');}\nconst model={id:'audit-complete-recovery-v1',identity:r=>({id:r.workspace.id,title:r.workspace.title,createdAt:r.workspace.createdAt}),revision:r=>r.workspace.revision,operations:r=>r.workspace.operations,sequence:op=>op.revision};\nconst facade={createWorkspace:input=>Portable.recovery(Engine.createWorkspace(input)),importWorkspace:Portable.parseRecovery,exportWorkspace:r=>Portable.json(Portable.recovery(r.workspace,r.drafts,r.selection,r.copyId))};\nconst esc=x=>String(x).replace(/\\\\/g,'\\\\\\\\').replace(/\"/g,'\\\\\"');\nconst field=(form,name)=>form.locator('[name=\"'+esc(name)+'\"]');\nasync function ready(page){await page.locator('#audit-app[aria-busy=\"false\"]').waitFor();}\nasync function section(page,name){await ready(page);await page.locator('[data-section=\"'+name+'\"]').click();await page.locator('[data-section=\"'+name+'\"][aria-current=\"true\"]').waitFor();await ready(page);}\nasync function fill(form,name,value){const selected=field(form,name),kind=await selected.evaluate(el=>({tag:el.tagName,type:el.type}));if(kind.type==='checkbox')await selected.setChecked(value===true);else if(kind.tag==='SELECT')await selected.selectOption(String(value));else await selected.fill(String(value));}\nasync function values(form,data){for(const [key,value]of Object.entries(data))await fill(form,key,value);}\nasync function checks(form,prefix,selected){const wanted=new Set(selected.map(String)),nodes=await form.locator('input[type=\"checkbox\"][name^=\"'+esc(prefix+':')+'\"]').evaluateAll(list=>list.map(el=>el.name));for(const name of nodes)await fill(form,name,wanted.has(name.slice(prefix.length+1)));}\nasync function submit(form){await form.locator('button[type=\"submit\"]').click();}\nasync function beforeCheckpoint(page){await ready(page);const previous=await page.locator('nav button[aria-current=\"true\"]').getAttribute('data-section');if(previous!=='workspace')await section(page,'workspace');return async()=>{if(previous&&previous!=='workspace')await section(page,previous);};}\nasync function originalInputs(root,applicationPath,fixturePath,attachmentPaths){\n need(path.isAbsolute(root)&&path.isAbsolute(applicationPath)&&path.isAbsolute(fixturePath),'Use the same original absolute application, authored course and receiving directory.');\n need(Array.isArray(attachmentPaths)&&attachmentPaths.length>0&&attachmentPaths.every(path.isAbsolute),'Select every exact outgoing attachment by its absolute original path.');\n need(attachmentPaths.includes(applicationPath),'The exact application must be included in the outgoing attachment selection.');\n const manifestPath=path.join(root,'selected-inputs','inputs.json'),mirrorPath=path.join(root,'attempts','selected-inputs','inputs.json');let prior=await optional(manifestPath)||await optional(mirrorPath);\n if(!prior){const completed=await optional(path.join(root,'audit-receiving-result.json'));if(completed){const row=JSON.parse(completed).receiving?.files?.find(r=>r.path===path.join('attempts','selected-inputs','inputs.json'));need(row,'Retain the completed original selected-input manifest identity.');const body=await regular(path.join(root,'retained-bytes',row.sha256));need(body.length===row.bytes&&sha(body)===row.sha256,'The original manifest recovery bytes changed.');prior=body;}}\n if(prior)await immutable(manifestPath,prior);else need(!(await optional(path.join(root,'receiving-intent.json'))),'Recover ion(p,'review');await actor(p,'Concurrent receiving operator');await fill(p.locator('#review-form'),'review-decision','needs-work');await fill(p.locator('#review-form'),'review-note',title);}\n    await submit(one.locator('#review-form'));await one.waitForFunction(n=>document.querySelector('#workspace-revision')?.textContent.startsWith('Revision '+n+' ·'),base.workspace.revision+1);await ready(one);\n    await submit(two.locator('#review-form'));await two.locator('#open-conflict').waitFor();await ready(two);await capture(two,session.attempt,'competing-branch-preserved',screens);\n    await two.locator('#open-conflict').click();await ready(two);await section(two,'workspace');const branch=await download(two,two.locator('#top-json'),path.join(session.attempt,'Competing_Proposed_Branch.json'));outputs.push(branch);\n    await section(one,'workspace');const current=await download(one,one.locator('#top-json'),path.join(session.attempt,'Competing_Current_Original.json'));outputs.push(current);\n    const a=Portable.parseRecovery((await regular(current.path)).toString('utf8')),b=Portable.parseRecovery((await regular(branch.path)).toString('utf8'));\n    need(a.workspace.revision===base.workspace.revision+1&&b.workspace.revision===base.workspace.revision+1&&Portable.compare(a.workspace,b.workspace)==='diverged','Both complete original competing branches must survive.');\n    return{current,branch,relationship:'diverged'};\n   }finally{await fresh.close();}\n  },{outputs,screens});\n  need(errors.length===0,'Actual browser page errors: '+errors.join('; '));await checkOriginals(selected);\n  return await session.finish({schema:'commons.audit-migration-rendered-receiving.v1',state:'CONTROLS_AND_EXPORTS_COMPLETED',originalInputs:selected,imported,corrected,outgoing,exit,competing,outputs,screens,pageErrors:errors,producerInspection:'Producing worker must personally LOOK at these exact returned pixels and all applicable attachment pages before marking the selected outgoing product ready.'});\n }finally{page.off('pageerror',listen);await session.close();}\n}\n","BROWSER_OPERATING.md":"# Original complete audit receiving course\n\nContinue the same application and original receiving programme through its existing equipped browser owner and current browser lifecycle. The historical public reference, the explicitly authored twelve-role course and any actual supplier/customer files remain distinct source editions.\n\nThe producing worker must personally inspect the exact outgoing product at desktop 1440×1000 and phone width 390, use important controls and states, and reopen downloaded work. Every outgoing attachment, usable ZIP contents and every applicable PDF page belong to that inspection. Return actual screenshots to the producer for LOOK. A source-level run or a callback receipt alone does not satisfy the rendered-product requirement.\n\n## Complete maintained source\n\nRun from the complete selected repository source or the source/audit-migration-workspace directory in a complete exported package. Preserve the adjacent source/migration-receiving/continuation.mjs helper. The public reusable source includes engine, SHA, CLI, API, core guide, authored receiving fixture, application, portable storage, builder and this exact callback. No customer record is embedded in that generic source.\n\nUse the final application made by the same build.mjs source. The callback compares the full embedded source selection to its actual executing maintained source before continuing. A changed application is an explicit successor receiving edition; preserve the earlier operation and its outputs.\n\n## Generate the complete authored input\n\nThe maintained receiving fixture explicitly contains authored examples for all twelve neutral roles, thirteen records, every byte 0–255 in a binary evidence file, original source declarations, twelve target templates and complete supplied return files. It is an explicitly authored software receiving example.\n\n~~~js\nimport fs from 'node:fs/promises';\nimport * as Engine from './engine.mjs';\nimport {buildReceivingFixture} from './receiving-fixture.mjs';\n\nconst {workspace} = buildReceivingFixture();\nawait fs.writeFile('/absolute/original/authored-audit-course.json',\n  Engine.exportWorkspace(workspace), {flag:'wx', mode:0o600});\n~~~\n\nUse the same complete original fixture on restart. The course generates new browser operation IDs and retains their mapping to the original authored sequence. Its actual actor and time come from the visible UI. The input rows, source semantics, every original file, target relationships and returned values remain exact.\n\n## Invoke through the existing browser owner\n\nThe callback receives the owner's already-created Playwright page and context. It does not launch a browser, install dependencies or create a second service. The owner retains its current runtime lease and closes the page/context/browser after the callback finishes.\n\n~~~js\nimport {runAuditReceiving} from './run_browser_receiving.mjs';\n\nconst result = await runAuditReceiving({\n  page,\n  context,\n  outputDirectory: '/absolute/original/audit-receiving',\n  applicationPath: '/absolute/exact/Audit_Source_Workspace.html',\n  fixturePath: '/absolute/original/authored-audit-course.json',\n  attachmentPaths: [\n    '/absolute/exact/Audit_Source_Workspace.html',\n    '/absolute/exact/Audit_Source_Onboarding_Workshare.html',\n    '/absolute/exact/Audit_Public_Reference.json',\n    '/absolute/exact/Audit_Source_And_Operating_Guide.html'\n  ],\n  renderBinaryAttachment\n});\n~~~\n\nThe names in that example are selected complete files, not inferred paths. Pass the exact original current outgoing selection and actual absolute paths. All outgoing attachments must be selected; applicationPath must also occur in attachmentPaths. The original recipientless/customer draft remains with its sole sender.\n\nFor an outgoing PDF or a PDF retained inside the selected whole workspace, provide the existing equipped owner's renderer:\nrenderBinaryAttachment({page,file,outputDirectory,prefix,widths:[1440,390]})\nmust actually open/render every applicable original page and return {screens:[absolute PNG paths],outputs:[complete output identities]}. It must preserve the exact original bytes and document page order. Unsupported binary originals such as an authored every-byte .bin are retained and byte-checked without pretending they have a visual page.\n\nPreserve the owner's actual current browser availability and user tabs. A time-limited reservation must not survive its owner's explicit release.\n\n## What the one course operates\n\n- Opens each exact outgoing HTML attachment and captures readable screen and print views. Opens the actual complete public-reference JSON through the real application and downloads it again, preserving its entire source history. It never substitutes the authored example for the public reference.\n- Uses real file controls and forms for all 55 authored operations: complete binary originals, twelve original CSV roles, explicit compound keys and reference declarations, full source scope, attributed review, supplier-template selection, complete preparation and actual returned data.\n- Visits all important application sections and downloads every complete frozen target CSV through its visible control.\n- Makes an attributed correction to one original source value, freezes a successor scope/review/contract/preparation, and compares the unchanged earlier actual return to that successor. The earlier prepared CSV bytes remain unchanged; the one differing cell remains visible.\n- Saves unfinished supplier writing, downloads complete recovery JSON, working HTML and the whole ZIP, verifies every ZIP member against the exact selected engine/source output, reopens the actual working HTML in an independent browser context and checks the complete history and unfinished writing.\n- Opens all generated full HTML reports with screen and print views. Every original PDF encountered in the selected whole workspace uses the equipped renderer above.\n- Opens two tabs over one original saved browser copy, performs competing attributed reviews and verifies that the current original and the proposed independent branch both survive with their complete histories.\n- Rechecks all current original selected files against their frozen bytes before completion.\n\nThe helper holds one OS-released kernel IPC lease on the original output directory. Each original UI operation and phase is retained before dispatch; completed phases recover exact saved outputs from retained byte copies. Original input bytes, including every outgoing attachment, are saved before the helper's completion shortcut. Removed staging inputs can resume from those retained bytes; a present changed original is a concrete source conflict. Restart with the same input paths and same operation directory.\n\n## Returned files and final review\n\nThe original directory holds selected-inputs plus the complete manifest/body mirrors under attempts/selected-inputs, original-application.html, the original programme HTML, receiving intent/state, complete per-attempt inputs/downloads/images, retained byte copies and audit-receiving-result.json. Preserve this whole directory so an interrupted continuation can recover exact original outputs.\n\nThe result state CONTROLS_AND_EXPORTS_COMPLETED means the implemented course completed those controls and exports. Its producerInspection field identifies the remaining human-visible inspection: the producing worker opens the returned actual screenshots, checks desktop and phone layout, reads every outgoing attachment and applicable page, and repairs observed defects in the maintained source. Mark the exact outgoing edition ready only after that real inspection.\n\nCLI continuity and original operation replay remain in CORE_OPERATING.md. This browser course uses those same pure source contracts and adds actual UI/download/reopen operation; it does not invent a supplier import or audit assurance decision.\n","migration-receiving/continuation.mjs":"import fs from 'node:fs/promises';\nimport path from 'node:path';\nimport net from 'node:net';\nimport {randomUUID,createHash} from 'node:crypto';\nimport {pathToFileURL} from 'node:url';\nconst sha=b=>createHash('sha256').update(b).digest('hex');\nconst need=(ok,message)=>{if(!ok)throw Error(message);};\nconst json=value=>Buffer.from(JSON.stringify(value,null,2)+'\\n');\nasync function optional(file){try{const s=await fs.lstat(file);need(s.isFile()&&!s.isSymbolicLink(),'Keep a regular original receiving file: '+file);return await fs.readFile(file);}catch(e){if(e.code==='ENOENT')return null;throw e;}}\nasync function immutable(file,body){\n const old=await optional(file);if(old){need(old.equals(body),'The original receiving file already contains another edition: '+file);return;}\n await fs.mkdir(path.dirname(file),{recursive:true,mode:0o700});const temp=file+'.'+randomUUID()+'.candidate';let h;\n try{h=await fs.open(temp,'wx',0o600);await h.writeFile(body);await h.sync();await h.close();h=null;try{await fs.link(temp,file);}catch(e){if(e.code!=='EEXIST'||!(await optional(file))?.equals(body))throw e;}}\n finally{if(h)await h.close();await fs.unlink(temp).catch(e=>{if(e.code!=='ENOENT')throw e;});}\n}\nasync function replace(file,body){const temp=file+'.'+randomUUID()+'.candidate';let h;\n try{h=await fs.open(temp,'wx',0o600);await h.writeFile(body);await h.sync();await h.close();h=null;await fs.rename(temp,file);}\n finally{if(h)await h.close();await fs.unlink(temp).catch(e=>{if(e.code!=='ENOENT')throw e;});}\n}\nconst encode=value=>{\n if(Buffer.isBuffer(value)||value instanceof Uint8Array)return{$receiving_bytes:Buffer.from(value).toString('base64')};\n if(Array.isArray(value))return value.map(encode);\n if(value&&typeof value==='object')return Object.fromEntries(Object.entries(value).map(([k,v])=>[k,encode(v)]));\n return value;\n};\nconst decode=value=>{\n if(value&&typeof value==='object'&&!Array.isArray(value)&&Object.keys(value).length===1&&typeof value.$receiving_bytes==='string')return Buffer.from(value.$receiving_bytes,'base64');\n if(Array.isArray(value))return value.map(decode);\n if(value&&typeof value==='object')return Object.fromEntries(Object.entries(value).map(([k,v])=>[k,decode(v)]));\n return value;\n};\nfunction bootFrom(html){const match=html.match(/(\u003cscript id=\"bootstrap\" type=\"application\\/json\">)([\\s\\S]*?)(\u003c\\/script>)/);need(match,'Read the complete original standalone application.');return{match,data:JSON.parse(match[2])};}\nfunction seededHTML(html,data){const {match}=bootFrom(html);return html.replace(match[0],()=>match[1]+JSON.stringify(data).replace(/\u003c/g,'\\\\u003c')+match[3]);}\nasync function kernelLease(root){\n const name='tjlabs-migration-receiving-'+sha(Buffer.from(root)).slice(0,40);\n const address=process.platform==='linux'?'\\0'+name:process.platform==='win32'?'\\\\\\\\.\\\\pipe\\\\'+name:null;\n need(address,'Use the original Linux or Windows receiving runtime; this continuation requires a kernel-held local IPC lease.');\n const server=net.createServer(socket=>{socket.on('error',()=>{});socket.end('Original migration receiving is active.\\n');});\n await new Promise((resolve,reject)=>{server.once('error',reject);server.listen(address,()=>{server.removeListener('error',reject);resolve();});});\n server.on('error',()=>{});let released=false;return()=>{if(released)return Promise.resolve();released=true;return new Promise((resolve,reject)=>server.close(e=>e?reject(e):resolve()));};\n}\nfunction contains(actual,expected){\n if(expected===null||typeof expected!=='object')return actual===expected;\n if(Array.isArray(expected))return Array.isArray(actual)&&actual.length===expected.length&&expected.every((v,i)=>contains(actual[i],v));\n return actual&&typeof actual==='object'&&Object.entries(expected).every(([k,v])=>contains(actual[k],v));\n}\n/** Continue one original browser workspace, its requests and complete immutable outputs. */\nexport async function openMigrationReceiving({page,outputDirectory,applicationPath,engine,title,resultFilename,workspaceModel,browserControls}){\n const defaultModel={id:'ordered-operations-v1',identity:ws=>({id:ws.id,title:ws.title,createdAt:ws.createdAt}),revision:ws=>ws.revision,operations:ws=>ws.operations,sequence:op=>op.revision};\n const model=workspaceModel||defaultModel;\n need(typeof model.id==='string'&&model.id&&['identity','revision','operations','sequence'].every(k=>typeof model[k]==='function'),'Supply the exact original workspace history model.');\n const identityOf=ws=>{const value=model.identity(ws);need(value&&['id','title','createdAt'].every(k=>typeof value[k]==='string'&&value[k]),'Read the original logical workspace identity.');return value;};\n const revisionOf=ws=>{const value=model.revision(ws);need(Number.isSafeInteger(value)&&value>=0,'Read the original workspace revision.');return value;};\n const operationsOf=ws=>{const value=model.operations(ws);need(Array.isArray(value)&&value.length===revisionOf(ws),'Read the complete original ordered operation history.');return value;};\n const sequenceOf=op=>{const value=model.sequence(op);need(Number.isSafeInteger(value)&&value>0,'Read the original operation sequence.');return value;};\n const controls={ready:'#top-json',workspaceDownload:'#top-json',...browserControls};\n need(typeof controls.ready==='string'&&controls.ready&&typeof controls.workspaceDownload==='string'&&controls.workspaceDownload,'Supply the actual original workspace download control.');\n\n need(path.isAbsolute(outputDirectory)&&path.isAbsolute(applicationPath),'Use absolute original receiving and application paths.');\n await fs.mkdir(outputDirectory,{recursive:true,mode:0o700});const root=await fs.realpath(outputDirectory),release=await kernelLease(root);\n try{\n  const currentApplication=await fs.readFile(applicationPath),application={bytes:currentApplica       const incoming=Portable.parseRecovery(pretty(boot.record)),key=incoming.copyId||boot.copyId||id('audit-copy'),current=await Store.readCopy(key);
      if(!current){await Store.createCopy(key,incoming.workspace,incoming.selection,tab,incoming.drafts);await useCopy(key);}
      else{
        const relation=Portable.compare(current.workspace,incoming.workspace);
        if(relation==='identical'||relation==='incoming_ancestor')await useCopy(key,incoming.drafts,incoming.selection);
        else{const independent=id('audit-copy');await Store.createCopy(independent,incoming.workspace,incoming.selection,tab,incoming.drafts);await useCopy(independent);notice('The received file is preserved as an independent copy alongside the existing saved work.');}
      }
    }else render();
  }catch(error){notice('The complete working file could not be opened: '+error.message,true);$('audit-app').innerHTML='<section class="card"><h2>Retain this original file</h2><p>'+esc(error.message)+'</p><p>The complete original bootstrap and saved browser copies remain available. Use the original unmodified file or a complete working JSON export.</p><button id="startup-download">Download exact embedded working record</button></section>';$('startup-download').onclick=()=>download('Original_Embedded_Working_Record.json',pretty(boot.record),'application/json');}
  finally{busy(false);}
})();

})();</script></body></html>
