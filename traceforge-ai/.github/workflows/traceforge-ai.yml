name: TraceForge AI
on:
  pull_request:
    paths:
      - 'traceforge-ai/**'
  push:
    branches: [main]
    paths:
      - 'traceforge-ai/**'
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13']
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: traceforge-ai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m compileall -q traceforge tests
      - run: python -m unittest discover -s tests -v
      - run: python -m traceforge analyze examples/incident.txt --mode demo --json-out /tmp/traceforge-analysis.json
      - run: python -m traceforge verify /tmp/traceforge-analysis.json
      - name: JavaScript syntax
        run: node --check web/app.js
