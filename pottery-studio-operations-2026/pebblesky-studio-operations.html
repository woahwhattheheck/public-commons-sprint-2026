function value(form,name){return new FormData(form).get(name)||"";}
function number(form,name,blank=null){const s=value(form,name);return s===""?blank:Number(s);}
function mult(form,name){return new FormData(form).getAll(name);}
function common(form){const id=value(form,"id");return {id:id||C.uid("record"),studioKey:studio};}
function formCommand(f){
let p=common(f);
if(!studio&& !["csv-map","csv-commit"].includes(f.id))throw Error("Select a studio before saving an operating record.");
switch(f.id){
case"setup-form":
if(setup==="people")return{type:"person-save",person:{...p,...Object.fromEntries(["name","email","phone","externalRef","notes"].map(k=>[k,value(f,k)])),active:f.elements.active.checked}};
if(setup==="resources")return{type:"resource-save",resource:{...p,...Object.fromEntries(["name","kind","externalRef","notes"].map(k=>[k,value(f,k)])),capacity:number(f,"capacity"),active:f.elements.active.checked}};
if(setup==="programmes")return{type:"programme-save",programme:{...p,...Object.fromEntries(["name","kind","cone","materials","instructions"].map(k=>[k,value(f,k)])),sourceUrls:lines(value(f,"sourceUrls")),makeupLimit:number(f,"makeupLimit"),active:f.elements.active.checked}};
if(setup==="memberships")return{type:"membership-save",membership:{...p,...Object.fromEntries(["personId","name","access","validFrom","validTo","unit","externalRef","notes"].map(k=>[k,value(f,k)])),opening:number(f,"opening"),limits:lines(value(f,"limits")).map(l=>{const a=l.split(",").map(x=>x.trim());if(a.length!==3)throw Error("Each allowance rule needs period, unit and maximum.");return{period:a[0],unit:a[1],maximum:Number(a[2]),weekStartsOn:1};}),sourceUrls:lines(value(f,"sourceUrls")),active:f.elements.active.checked}};
break;
case"credit-form":return{type:"credit-adjust",membershipId:sel.memberships,amount:number(f,"amount"),reason:value(f,"reason")};
case"session-form":return{type:"session-save",session:{...p,...Object.fromEntries(["title","kind","programmeId","start","end","timezone","notes","externalRef"].map(k=>[k,value(f,k)])),resourceIds:mult(f,"resourceIds"),capacity:number(f,"capacity"),membershipRequired:f.elements.membershipRequired.checked}};
case"booking-form":return{type:"booking-save",booking:{...p,...Object.fromEntries(["personId","sessionId","membershipId","makeupOf","courseRef","notes","externalRef"].map(k=>[k,value(f,k)])),units:number(f,"units")}};
case"piece-form":return{type:"piece-save",piece:{...p,...Object.fromEntries(["ownerId","label","material","cone","stage","bookingId","externalRef","notes","gallery"].map(k=>[k,value(f,k)]))}};
case"clear-form":if(!value(f,"approved"))throw Error("Choose approve or decline explicitly.");return{type:"piece-clear",id:sel.pieces,programmeId:value(f,"programmeId"),approved:value(f,"approved")==="yes",reason:value(f,"reason")};
case"pickup-form":return{type:"piece-pickup",id:sel.pieces,collector:value(f,"collector"),actualAt:value(f,"actualAt"),notes:value(f,"notes")};
case"load-form":return{type:"load-save",load:{...p,...Object.fromEntries(["name","kilnId","programmeId","plannedStart","plannedEnd","timezone","notes"].map(k=>[k,value(f,k)])),pieceIds:mult(f,"pieceIds"),capacityAcknowledged:f.elements.capacityAcknowledged.checked}};
case"cooling-form":return{type:"load-cooling",id:sel.loads,actualAt:value(f,"actualAt"),notes:value(f,"notes")};
case"unload-form":return{type:"load-unload",id:sel.loads,actualAt:value(f,"actualAt"),outcomes:by("loads",sel.loads).pieceIds.map((pieceId,i)=>({pieceId,result:value(f,"result-"+i),notes:value(f,"note-"+i)}))};
case"notice-form":return{type:"notice-prepare",notice:{...p,...Object.fromEntries(["personId","channel","destination","body","notes"].map(k=>[k,value(f,k)])),pieceIds:mult(f,"pieceIds")}};
case"notice-send-form":return{type:"notice-record",id:sel.notices,sentAt:value(f,"sentAt"),reference:value(f,"reference")};
}throw Error("Unknown form.");
}
root.addEventListener("submit",e=>{e.preventDefault();const f=e.target;try{
if(f.id==="csv-map"){if(!csvFile)throw Error("Select and finish reading the current CSV first.");if(!guard(f.id))return;csvReview=C.reviewCSV(w,{name:csvFile.name,text:csvFile.text,mapping:Object.fromEntries(["label","ownerId","studioKey","material","cone","stage","externalRef","notes"].flatMap(k=>{const column=value(f,k),constant=value(f,"constant-"+k);return column?[[k,column]]:constant?[[k,{constant}]]:[];}))});dirty.clear();epoch++;render();return;}
if(f.id==="csv-commit"){if(!csvReview)throw Error("Review the current CSV first.");if(!guard(f.id))return;const decisions=csvReview.rows.map((r,i)=>({row:r.row,action:value(f,"action-"+i),pieceId:value(f,"piece-"+i)||undefined,reason:value(f,"reason-"+i)}));changed(C.commitCSV(w,csvReview,decisions,{expectedRevision:w.revision,now:new Date().toISOString(),actor:actor.trim()||"Studio operator"}),"Original CSV and every row decision retained.");return;}
const command=formCommand(f),record=command.person||command.resource||command.programme||command.membership||command.session||command.booking||command.piece||command.load||command.notice;
if(mutate(command,f.id)&&record){const coll={ "person-save":"people","resource-save":"resources","programme-save":"programmes","membership-save":"memberships","session-save":"sessions","booking-save":"bookings","piece-save":"pieces","load-save":"loads","notice-prepare":"notices"}[command.type];sel[coll]=record.id;render();}
}catch(err){message(err.message,true);}});
function askReason(title){const r=window.prompt(title+" — enter a reason");return r&&r.trim();}
function exportCSV(){const all=["people","resources","programmes","memberships","sessions","bookings","pieces","loads","notices","ledger","imports","history"];const q=x=>'"'+String(x??"").replace(/"/g,'""')+'"';return [["collection","id","studio","label","status","complete_record_json"],...all.flatMap(k=>w[k].map(r=>[k,r.id,r.studioKey||"",r.name||r.label||r.title||"",r.status||"",JSON.stringify(r)]))].map(row=>row.map(q).join(",")).join("\r\n");}
function exportReport(){const all=["people","resources","programmes","memberships","sessions","bookings","pieces","loads","notices","ledger","imports","history"];return '<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>'+esc(w.title)+' studio handover</title><style>body{background:#fff;color:#182026;font:16px/1.55 system-ui;max-width:1000px;margin:32px auto;padding:20px}h1,h2{line-height:1.2}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f1f3f4;color:#172126;padding:16px}summary{cursor:pointer;padding:10px}details{border:1px solid #b5bcc2;margin:10px 0}a{color:#164d70}</style><h1>'+esc(w.title)+'</h1><p>Complete operating handover at revision '+esc(w.revision)+'. Exported '+esc(new Date().toISOString())+'. Actual records retain their original decision and source history.</p>'+all.map(k=>'<h2>'+esc(k)+" ("+w[k].length+")</h2>"+w[k].map(r=>details(r.name||r.title||r.label||r.id,r)).join("")).join("")+'<h2>Original public catalogue</h2>'+json(w.catalogue)+"</html>";}
function headers(text){text=text.replace(/^\uFEFF/,"");let out=[],cell="",quoted=false;for(let i=0;i<text.length;i++){const c=text[i];if(c==='"'){if(quoted&&text[i+1]==='"'){cell+='"';i++;}else quoted=!quoted;}else if(!quoted&&c===","){out.push(cell);cell="";}else if(!quoted&&(c==="\n"||c==="\r")){out.push(cell);break;}else cell+=c;if(i===text.length-1)out.push(cell);}out=out.map(x=>x.trim());if(!out.length||out.some(x=>!x)||new Set(out).size!==out.length)throw Error("CSV needs unique, nonempty header names.");return out;}
async function readFile(file,kind){const isCSV=kind==="csv",generation=isCSV?++csvGeneration:++fileGeneration,capturedEpoch=epoch,capturedRevision=w.revision;
if(isCSV){csvReview=null;csvFile=null;}else received=null;document.getElementById(isCSV?"csv-commit":"receive-summary")?.replaceChildren();document.querySelectorAll(isCSV?'#csv-commit button, #csv-map button':'[data-action="receive"]').forEach(x=>x.disabled=true);
try{if(!file)return;if(file.size>(isCSV?8:64)*1024*1024)throw Error(isCSV?"CSV exceeds 8 MiB.":"Workspace exceeds 64 MiB.");const text=await file.text();if(generation!==(isCSV?csvGeneration:fileGeneration))return;if(epoch!==capturedEpoch||w.revision!==capturedRevision)throw Error("The workspace or form changed while reading. Select the file again.");
if(!guard())return;if(isCSV)csvFile={name:file.name,text,headers:headers(text)};else received={name:file.name,workspace:C.importWorkspace(text,{catalogue}),revision:w.revision};dirty.clear();epoch++;render();message(isCSV?"Original CSV loaded. Map fields and review every row.":"Complete file validated. Review its identity before replacing your workspace.");}catch(e){message(e.message,true);}
}
root.addEventListener("input",e=>{if(e.target.name==="actor"){actor=e.target.value;return;}if(e.target.closest("form"))touch(e.target.closest("form").id);else if(e.target.name==="startAt")touch("review-decision");});
root.addEventListener("change",e=>{if(e.target.id==="workspace-file"){readFile(e.target.files[0],"workspace");return;}if(e.target.id==="csv-file"){readFile(e.target.files[0],"csv");return;}if(e.target.name==="studio"){const next=e.target.value;if(!guard()){e.target.value=studio;return;}studio=next;sel={};review=null;dirty.clear();epoch++;render();}});
root.addEventListener("click",async e=>{
const n=e.target.closest("button");if(!n)return;
if(n.dataset.tab){if(!guard())return;tab=n.dataset.tab;dirty.clear();review=null;epoch++;render();return;}
const a=n.dataset.action,id=n.dataset.id;if(!a)return;try{
if(a==="select"||a==="new"){if(!guard())return;const [coll,rid]=id.split("|");sel[coll]=a==="new"?"":rid;if(rid&&by(coll,rid))studio=by(coll,rid).studioKey;tab=["people","resources","programmes","memberships"].includes(coll)?"setup":coll;if(tab==="setup")setup=coll;dirty.clear();review=null;epoch++;render();return;}
if(a==="setup"){if(!guard())return;setup=id;dirty.clear();epoch++;render();return;}
if(a==="review"){if(!guard())return;const[kind,rid]=id.split("|"),fn=kind==="Attend"?"Booking":kind==="Start"?"Load":kind;review={kind,id:rid,result:C["review"+fn](w,rid)};dirty.clear();epoch++;render();return;}
if(a==="close-review"){if(!guard())return;review=null;dirty.clear();epoch++;render();return;}
if(a==="apply-review"){const r=review;if(!r)throw Error("Open a current review.");const map={Session:"session-approve",Booking:"booking-confirm",Attend:"booking-attend",Load:"load-approve",Start:"load-start"},cmd={type:map[r.kind],id:r.id,expectedReviewSha256:r.result.reviewSha256};if(r.kind==="Start")cmd.actualAt=document.querySelector('[name="startAt"]').value;mutate(cmd,"review-decision");return;}
const reasonActions={"cancel-session":"session-cancel","cancel-booking":"booking-cancel","correct-attendance":"attendance-correct","withdraw":"piece-withdraw","cancel-load":"load-cancel","cancel-notice":"notice-cancel"};
if(reasonActions[a]){if(!guard())return;const reason=askReason(n.textContent);if(reason)mutate({type:reasonActions[a],id,reason});return;}
if(a==="missed"){if(!guard())return;const reason=askReason("Record missed visit");if(!reason)return;const answer=window.prompt("Enter DEBIT to consume the agreed allowance, or KEEP to preserve it.","");if(answer!=="DEBIT"&&answer!=="KEEP")throw Error("No outcome recorded. Choose DEBIT or KEEP explicitly.");mutate({type:"booking-missed",id,consume:answer==="DEBIT",reason});return;}
if(a==="export"){dl("pebble-studio-workspace.json",C.exportWorkspace(w),"application/json");return;}
if(a==="csv"){dl("pebble-studio-records.csv",exportCSV(),"text/csv;charset=utf-8");return;}
if(a==="report"){dl("pebble-studio-handover.html",exportReport(),"text/html;charset=utf-8");return;}
if(a==="source"){dl("pebble-public-catalogue.json",JSON.stringify(catalogue,null,2),"application/json");return;}
if(a==="browser-save"){localStorage.setItem("pebble-studio-workspace",C.exportWorkspace(w));message("Saved this complete working workspace in this browser. Unsaved form inputs are not included; export JSON for a portable copy.");return;}
if(a==="browser-load"){if(!guard())return;const text=localStorage.getItem("pebble-studio-workspace");if(!text)throw Error("This browser has no saved workspace.");const next=C.importWorkspace(text,{catalogue});if(!window.confirm("Replace the current working workspace with "+next.title+" at revision "+next.revision+"? Export first if needed."))return;sel={};changed(next,"Opened the saved browser copy.");return;}
if(a==="receive"){if(!received)throw Error("Select and validate a complete file first.");if(received.revision!==w.revision)throw Error("Workspace changed. Select the file again.");if(!guard())return;if(!window.confirm("Replace the complete current workspace with "+received.name+"? Export first if needed."))return;sel={};changed(received.workspace,"Complete workspace received with original records and history.");return;}
if(a==="new-workspace"){if(!guard())return;const title=window.prompt("Name the new empty workspace","Studio operating workspace");if(!title)return;if(!window.confirm("Replace the working workspace? Export the current one first if needed."))return;sel={};changed(C.create(catalogue,{id:C.uid("studio"),title,now:new Date().toISOString()}),"Created an empty workspace. Public sources are retained; actual records start empty.");return;}
if(a==="example"){if(building)return;if(!guard())return;if(!window.confirm("Open the complete worked example instead of the current workspace? Export first if needed."))return;dirty.clear();epoch++;const atEpoch=epoch,atRevision=w.revision;building=true;root.setAttribute("aria-busy","true");n.disabled=true;try{const result=await E.buildAsync(C,catalogue,{onProgress:p=>{const m=document.getElementById("message");if(m)m.textContent="Building worked example: "+(p.message||p.operations||"");},yieldEvery:1});if(epoch!==atEpoch||w.revision!==atRevision)throw Error("The workspace or form changed. The prepared example was not applied.");sel={};building=false;changed(result.workspace,"Worked example opened. Its people, assets, dates and physical decisions are demonstration records.");}finally{building=false;root.removeAttribute("aria-busy");const b=root.querySelector('[data-action="example"]');if(b){b.disabled=false;b.textContent="Open worked example";}}return;}
}catch(err){message(err.message,true);}
});
window.addEventListener("beforeunload",e=>{if(dirty.size){e.preventDefault();e.returnValue="";}});
window.PebbleStudioUI={getWorkspace:()=>w,getState:()=>({tab,studio,setup,sel,dirty:[...dirty],epoch}),render,formCommand,exportCSV,exportReport,headers};
render();
})();</script>
</body></html>
