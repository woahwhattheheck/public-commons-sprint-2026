<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="color-scheme" content="light"><title>Pebble and Sky studio operations</title>
<style>
:root{color-scheme:light;background:#ecefee;color:#17211e;font:16px/1.5 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
*{box-sizing:border-box}body{margin:0;background:#ecefee;color:#17211e}
#app{color:#17211e;background:#ecefee;font:16px/1.5 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;max-width:1420px;margin:auto;padding:28px}
#app header,#app main,#app nav,#app footer,#app form,#app fieldset,#app .toolbar{color:#17211e}
#app header{display:flex;justify-content:space-between;gap:32px;border-bottom:2px solid #34473e;padding:0 0 24px}
#app h1{font-size:clamp(1.7rem,3.6vw,2.5rem);line-height:1.15;letter-spacing:-.035em;margin:6px 0 12px}
#app h2{font-size:1.28rem;line-height:1.25;margin:0 0 16px}#app h3{font-size:1rem;line-height:1.3;margin:4px 0 12px}
#app p{margin:8px 0 16px;max-width:88ch}.eyebrow{font-size:.75rem;letter-spacing:.11em;font-weight:750}
#app .workspace{min-width:200px;max-width:32%;overflow-wrap:anywhere;align-self:center}#app .workspace span{display:block;font-size:.8rem;color:#415148}
#app .toolbar{display:flex;align-items:flex-start;gap:20px;flex-wrap:wrap;padding:22px 0;background:#ecefee}
#app .toolbar>label{flex:1 1 240px}#app .toolbar .actions{flex:2 1 360px;align-self:center}
#app nav,#app .subnav,#app .actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
#app nav{padding:0 0 16px;border-bottom:1px solid #abb7b0}
#app nav button[aria-current=page]{background:#244b3a;color:#fff;border-color:#244b3a}
#app button,#app input,#app select,#app textarea{font:inherit;line-height:1.35;max-width:100%;border:1px solid #819489;border-radius:4px;background:#fff;color:#17211e}
#app button{cursor:pointer;padding:9px 13px;min-height:42px;text-align:left;font-size:.9rem;font-weight:600}
#app button:hover{background:#e2eee7;color:#173924;border-color:#355c47}
#app button:focus-visible,#app input:focus-visible,#app select:focus-visible,#app textarea:focus-visible{outline:3px solid #d28d2c;outline-offset:2px}
#app button:disabled,#app fieldset:disabled button{background:#edf0ed;color:#58695f;border-color:#b6c0b9;cursor:not-allowed;opacity:1}
#app input:disabled,#app select:disabled,#app textarea:disabled{background:#edf0ed;color:#47574d;opacity:1}
#app button[type=submit]{background:#244b3a;color:#fff;border-color:#244b3a}#app button[type=submit]:disabled{background:#edf0ed;color:#58695f;border-color:#b6c0b9}
#app label{display:flex;flex-direction:column;gap:7px;font-size:.9rem;font-weight:650;color:#24352b;min-width:0}
#app label.check{display:flex;flex-direction:row;align-items:center;gap:10px;font-weight:500}

#app input,#app select,#app textarea{width:100%;padding:10px;font-weight:400}
#app select[multiple]{min-height:155px}
#app small,#app .muted{color:#506155;font-weight:400;font-size:.83rem;line-height:1.45}
#app .panel{background:#fff;color:#17211e;border:1px solid #b3beb7;border-radius:6px;padding:22px;margin:20px 0}
#app .subpanel{background:#f2f5f2;color:#17211e;padding:16px;border:1px solid #b9c3bc;border-radius:4px}
#app .fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
#app .wide{grid-column:1/-1}
#app fieldset{border:0;padding:0;margin:0;min-width:0}
#app form .actions{margin-top:20px}
#app .table-scroll{overflow:auto;max-width:100%;border:1px solid #b3beb7;background:#fff;color:#17211e;border-radius:4px;margin:16px 0}
#app table{border-collapse:collapse;min-width:580px;width:100%;background:#fff;color:#17211e;font-size:.9rem}
#app th{background:#dde5df;color:#1a2c20;text-align:left;font-size:.8rem;font-weight:750}
#app td{background:#fff;color:#17211e}#app th,#app td{padding:12px 14px;border-bottom:1px solid #ccd4ce;vertical-align:top;max-width:400px;overflow-wrap:anywhere}
#app tbody tr:last-child td{border-bottom:0}
#app .badge{display:inline-block;color:#284736;background:#e7eee8;border:1px solid #adc2b3;border-radius:3px;font-size:.76rem;font-weight:700;padding:3px 7px;white-space:nowrap}
#app .metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(105px,1fr));gap:10px}
#app .metrics>div{background:#eef3ef;color:#193224;border:1px solid #c0cec4;padding:14px}
#app .metrics strong{font-size:1.6rem;display:block}#app .metrics span{display:block;font-size:.8rem;text-transform:capitalize;color:#3c5344}
#app pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f1f4f2;color:#172b1d;padding:16px;font:12px/1.55 ui-monospace,SFMono-Regular,Consolas,monospace;max-height:500px;overflow:auto}
#app details{border:1px solid #c1cbc4;background:#fff;color:#17211e;padding:12px;margin:14px 0}#app summary{cursor:pointer;font-weight:600}
#app .message:empty{display:none}#app .message{padding:14px 18px;background:#e0ede4;color:#183e28;border:1px solid #80a28b;margin:18px 0}
#app .error,#app .message.error{background:#fff1e5;color:#763112;border:1px solid #be8965;padding:12px}
#app .decision{border:2px solid #697b35;background:#f6f8ed;color:#273019}
#app .hint{background:#e6ede9;color:#284333;padding:14px}
#app a{color:#155c87;text-decoration:underline;overflow-wrap:anywhere}
#app footer{border-top:1px solid #acb9b0;padding:20px 0;margin-top:32px;font-size:.85rem;color:#42584a}
@media(max-width:680px){#app{padding:16px}#app header{display:block;padding-bottom:16px}#app .workspace{max-width:100%;margin-top:18px}#app .fields{grid-template-columns:1fr}#app .panel{padding:16px}#app .toolbar{gap:12px}#app nav button{flex:1 1 44%;font-size:.82rem}#app .actions button{flex:1 1 150px}#app .metrics{grid-template-columns:repeat(2,minmax(0,1fr))}#app h1{font-size:1.8rem}#app .toolbar .actions{flex-basis:100%}}
@media print{#app nav,#app .toolbar,#app button{display:none}#app{padding:0;max-width:none}#app .panel{break-inside:avoid}}
</style></head><body><div id="app"><p>Loading the complete studio workspace…</p></div><noscript>This offline worksheet requires JavaScript. The complete original source and JSON handover remain available separately.</noscript>
