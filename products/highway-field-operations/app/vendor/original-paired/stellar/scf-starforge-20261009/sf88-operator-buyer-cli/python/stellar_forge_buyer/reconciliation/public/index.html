<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Dataset reconciliation · Stellar Forge</title>
  <link rel="stylesheet" href="/reconciliation/style.css">
  <script defer src="/reconciliation/app.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to workspace</a>
  <header class="topbar">
    <div><span class="brand">STELLAR FORGE</span><h1>Dataset reconciliation</h1></div>
    <div class="header-actions"><a id="dataset-home" href="/">Dataset workspace</a><a href="/reconciliation/OPERATING.md" target="_blank" rel="noopener">Operating guide</a><button id="refresh" type="button">Refresh lists</button></div>
  </header>
  <div class="shell">
    <aside class="sidebar">
      <nav aria-label="Reconciliation workspace">
        <button type="button" data-screen="pairs" aria-current="page">Saved pairs</button>
        <button type="button" data-screen="editor">Pair editor</button>
        <button type="button" data-screen="runs">Reconciliation runs</button>
        <button type="button" data-screen="reports">Reports and handover</button>
        <button type="button" data-screen="requests">Saved requests</button>
      </nav>
      <section class="workspace-info"><h2>Current workspace</h2><p id="workspace-name">Opening local workspace…</p><p id="workspace-id" class="mono wrap"></p><p id="workspace-counts" class="muted"></p></section>
      <p class="sidebar-note">Compare saved source editions, review differences and hand over the complete project.</p>
    </aside>
    <main id="main" tabindex="-1">
      <div id="notice" class="notice" role="status" aria-live="polite" hidden></div>
      <div id="storage-notice" class="notice" hidden></div>
      <section id="screen-pairs" class="screen" aria-labelledby="title-pairs"></section>
      <section id="screen-editor" class="screen" aria-labelledby="title-editor" hidden></section>
      <section id="screen-runs" class="screen" aria-labelledby="title-runs" hidden></section>
      <section id="screen-reports" class="screen" aria-labelledby="title-reports" hidden></section>
      <section id="screen-requests" class="screen" aria-labelledby="title-requests" hidden></section>
      <noscript><section class="panel"><h2>JavaScript is required</h2><p>This interface connects to the existing local DuckDB workspace. Its CLI and client remain available without the browser.</p></section></noscript>
    </main>
  </div>
</body>
</html>
