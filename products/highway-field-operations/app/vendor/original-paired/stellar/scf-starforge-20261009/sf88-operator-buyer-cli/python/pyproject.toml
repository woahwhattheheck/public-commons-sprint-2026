[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stellar-forge-buyer"
version = "0.5.0"
description = "Durable Python applications on the original Stellar Forge buyer runtime"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = []
readme = "README.md"

[project.optional-dependencies]
duckdb = ["duckdb==1.5.6"]
postgres = ["psycopg[binary]==3.3.6"]
vgi = [
  "duckdb==1.5.6",
  "vgi-python[http,oauth]==0.43.1",
  "vgi-rpc[http,oauth]==0.51.0",
  "waitress==3.0.2",
]
workbooks = ["openpyxl==3.1.5"]
synthesis = ["statsmodels==0.15.0", "matplotlib==3.10.8"]
agents = [
  "langchain-core>=1.6.9,<2",
  "langgraph>=1.2.14,<2",
  "langgraph-checkpoint-sqlite>=3.1.1,<4",
  "pydantic>=2.14,<3",
]

[project.scripts]
stellar-forge-dbnomics-analysis = "stellar_forge_buyer.dbnomics:main"
stellar-forge-vgi-results = "stellar_forge_buyer.vgi_service.cli:main"
stellar-forge-duckdb = "stellar_forge_buyer.duckdb_cli:main"
stellar-forge-postgres = "stellar_forge_buyer.postgres_cli:main"
stellar-forge-buyer = "stellar_forge_buyer.__main__:main"
stellar-forge-research = "stellar_forge_buyer.research_cli:main"
stellar-forge-agent = "stellar_forge_buyer.agent_workflow:main"
stellar-forge-workbook = "stellar_forge_buyer.analysis_workbooks:main"
stellar-forge-workbook-deliver = "stellar_forge_buyer.workbook_client:main"
stellar-forge-synthesis = "stellar_forge_buyer.synthesis_cli:main"

stellar-forge-worldbank-analysis = "stellar_forge_buyer.worldbank_analysis:main"

[tool.setuptools]
packages = ["stellar_forge_buyer", "stellar_forge_buyer.vgi_service", "stellar_forge_buyer.reconciliation"]

[tool.setuptools.package-data]
"stellar_forge_buyer.vgi_service" = ["public/*", "*.md", "runtime-selection.json"]

"stellar_forge_buyer.reconciliation" = ["public/*", "*.md", "*.mjs"]
