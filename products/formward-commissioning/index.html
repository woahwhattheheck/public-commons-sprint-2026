alues for a real submission. The local preview is inert. Record the actual response and mailbox result separately.","scope":"The website and provider account remain owned by their operator. This workbench prepares source and retains commissioning work; it does not provision the account or change its notification settings.","qualification":"Choose the actual delivery scope and website integration before deployment.","privacy_map":"Record the real purpose, fields, recipient, retention, consent requirements and privacy notice for this form.","contract_urls":["https://formward.eu/docs","https://formward.eu/docs/ingest","https://formward.eu/docs/fields","https://formward.eu/docs/responses","https://formward.eu/docs/ajax"]},"settings":{"language":"en","endpoint":"","site_origin":"","success_path":"","subject":"","recipient":"","title":"Contact","introduction":"","success_text":"Your message was received.","failure_text":"Your message could not be sent. Your entries have been kept.","uncertain_text":"Your message may have been received. Please check with the recipient before sending it again.","privacy_text":"","privacy_url":"","button_label":"Send message","require_consent":false,"consent_text":"","fields":[{"name":"name","label":"Name","type":"text","required":false,"value":"","options":[]},{"name":"email","label":"Email","type":"email","required":true,"value":"","options":[]},{"name":"message","label":"Message","type":"textarea","required":true,"value":"","options":[]}]}}]}</script><script id="last-actual-return" type="application/json">null</script><script id="initial-state" type="application/json">{"schema":"tjlabs.formward-commissioning/v1","pack_id":"formward-local-workbench","edition_id":"formward-local-workbench-edition","customer":{"name":"","domain":""},"revision":0,"selected_id":"form-1","cases":[{"id":"form-1","source":{"url":"","summary":"Prepare the owned form, deploy its source, and retain the actual submission and receiving results.","budget":"","observed_at":""},"plan":{"title":"Form commissioning","preserved":"Keep the existing website, CMS, editable source and its owner’s account.","route":"Owned website form → configured Formward submission inbox → confirmed notification recipient.","steps":["Record the actual website, form fields and recipient. Keep the current editable source and rollback copy.","Select or create the form in the owner’s Formward account. Configure its allowed website origins and actual notification recipient.","Confirm the notification recipient in the provider dashboard when required. Record the account’s consent and privacy settings.","Enter the actual endpoint, website origin, success path, recipient and field definitions in this workbench.","Save the complete working kit and deploy the generated form or fragment within the existing website.","Operate the rendered form on the actual website, receive its complete endpoint response and submission identifier, and inspect the destination mailbox.","Retain the actual receiving observations, full editable source, complete working record and rollback instructions for the owner."],"demonstration":"Use the owner’s authorized sample values for a real submission. The local preview is inert. Record the actual response and mailbox result separately.","scope":"The website and provider account remain owned by their operator. This workbench prepares source and retains commissioning work; it does not provision the account or change its notification settings.","qualification":"Choose the actual delivery scope and website integration before deployment.","privacy_map":"Record the real purpose, fields, recipient, retention, consent requirements and privacy notice for this form.","contract_urls":["https://formward.eu/docs","https://formward.eu/docs/ingest","https://formward.eu/docs/fields","https://formward.eu/docs/responses","https://formward.eu/docs/ajax"]},"settings":{"language":"en","endpoint":"","site_origin":"","success_path":"","subject":"","recipient":"","title":"Contact","introduction":"","success_text":"Your message was received.","failure_text":"Your message could not be sent. Your entries have been kept.","uncertain_text":"Your message may have been received. Please check with the recipient before sending it again.","privacy_text":"","privacy_url":"","button_label":"Send message","require_consent":false,"consent_text":"","fields":[{"name":"name","label":"Name","type":"text","required":false,"value":"","options":[]},{"name":"email","label":"Email","type":"email","required":true,"value":"","options":[]},{"name":"message","label":"Message","type":"textarea","required":true,"value":"","options":[]}]},"observations":[]}],"history":[]}</script><script id="core-source" type="application/json">"'use strict';\nconst SCHEMA='tjlabs.formward-commissioning/v1';\nconst TYPES=['text','email','tel','url','number','textarea','select','checkbox','hidden'];\nconst clone=v=>JSON.parse(JSON.stringify(v));\nconst esc=v=>String(v??'').replace(/[&\u003c>\"']/g,c=>({'&':'&amp;','\u003c':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[c]));\nfunction fail(message){throw new TypeError(message);}\nfunction text(v,max=10000){return typeof v==='string'&&v.length\u003c=max;}\nfunction stamp(v){return typeof v==='string'&&Number.isFinite(Date.parse(v))&&new Date(v).toISOString()===v;}\nfunction validField(f){return f&&/^[A-Za-z][A-Za-z0-9_]{0,63}$/.test(f.name)&&text(f.label,200)&&f.label.trim()&&TYPES.includes(f.type)&&typeof f.required==='boolean'&&text(f.value??'',2000)&&Array.isArray(f.options)&&f.options.every(o=>text(o.value,200)&&o.value.trim()&&text(o.label,200)&&o.label.trim())&&new Set(f.options.map(o=>o.value)).size===f.options.length;}\nfunction validateDraft(s){\n if(!s||!text(s.language,8)||!/^[a-z]{2}(?:-[A-Z]{2})?$/.test(s.language)||!text(s.failure_text,1000)||!text(s.uncertain_text,1000)||!text(s.endpoint,500)||!text(s.site_origin,500)||!text(s.success_path,500)||!text(s.subject,200)||!text(s.recipient,300)||!text(s.title,200)||!text(s.introduction,2000)||!text(s.success_text,1000)||!text(s.privacy_text,4000)||!text(s.privacy_url,1000)||!text(s.button_label,100)||typeof s.require_consent!=='boolean'||!text(s.consent_text,2000)||!Array.isArray(s.fields)||s.fields.length>40||!s.fields.every(validField))fail('Keep complete readable field settings.');\n if(new Set(s.fields.map(f=>f.name)).size!==s.fields.length)fail('Each submitted field needs a unique name.');\n return s;\n}\nfunction readiness(s){\n validateDraft(s);const errors=[];\n if(!/^https:\\/\\/forms\\.formward\\.eu\\/f\\/[A-Za-z0-9_-]{1,128}$/.test(s.endpoint))errors.push('Enter the actual owned Formward endpoint.');\n if(!/^https:\\/\\/[a-z0-9.-]+(?::\\d{1,5})?$/i.test(s.site_origin))errors.push('Enter the actual HTTPS website origin, without a trailing slash or path.');\n if(!/^\\/(?!\\/)[^?#\\s]*$/.test(s.success_path))errors.push('Enter a same-site success path such as /thank-you.');\n if(!s.title.trim()||!s.button_label.trim())errors.push('Give the form a title and submit-button label.');\n if(!/^[^\\s@]+@[^\\s@]+\\.[^\\s@]+$/.test(s.recipient))errors.push('Record the actual recipient configured in the Formward dashboard.');\n if(!s.fields.length)errors.push('Keep at least one enquiry field.');\n if(!s.fields.some(f=>f.name==='email'&&f.type==='email'))errors.push('Keep an email field named email for the normal Reply-To route.');\n if(s.fields.some(f=>f.type==='select'&&!f.options.length))errors.push('Give each choice field at least one option.');\n if(/[\\r\\n]/.test(s.subject))errors.push('Keep the notification subject on one line.');\n if(s.require_consent&&!s.consent_text.trim())errors.push('Write the actual displayed consent text.');\n if(s.privacy_url&&!/^https:\\/\\/[^\\s\"\u003c>]+$/.test(s.privacy_url))errors.push('Use an HTTPS privacy-notice URL.');\n return {ready:errors.length===0,errors};\n}\nfunction validateWorking(w){\n if(!w||typeof w!=='object'||Array.isArray(w)||JSON.stringify(w).length>500000)fail('Keep a complete working form.');\n if(w.settings!==undefined){const s=w.settings;if(!s||typeof s!=='object'||Array.isArray(s))fail('Keep the complete unfinished settings.');\n const keys=['language','endpoint','site_origin','success_path','subject','recipient','title','introduction','success_text','failure_text','uncertain_text','privacy_text','privacy_url','button_label','consent_text'];\n if(keys.some(k=>!text(s[k],10000))||typeof s.require_consent!=='boolean'||!Array.isArray(s.fields)||s.fields.length>40||s.fields.some(f=>!f||typeof f!=='object'||!text(f.name,200)||!text(f.label,500)||!text(f.type,32)||!text(f.value??'',2000)||typeof f.required!=='boolean'||!(text(f.options,20000)||Array.isArray(f.options))))fail('Keep the complete editable field rows; choice JSON may remain unfinished.');\n }\n if(w.pending){const p=w.pending;if(!text(p.id,160)||!p.id||!stamp(p.at)||!text(p.case_id,160)||!text(p.endpoint,500)||!p.request_fields||typeof p.request_fields!=='object'||Array.isArray(p.request_fields))fail('Keep the original pending request.');validateDraft(p.settings);if(p.endpoint!==p.settings.endpoint)fail('The pending request must retain its dispatched settings.');}\n for(const [k,v] of Object.entries(w))if(!['settings','pending'].includes(k)&&!text(v,200000))fail('Keep complete working text.');\n return w;\n}\nfunction readState(value,configuration){\n const v=typeof value==='string'?JSON.parse(value):clone(value);\n if(!v||v.schema!==SCHEMA||v.edition_id!==configuration.edition_id||v.pack_id!==configuration.pack_id||!Number.isSafeInteger(v.revision)||v.revision\u003c0||!Array.isArray(v.cases)||v.cases.length!==configuration.cases.length||!Array.isArray(v.history)||!text(v.selected_id,160))fail('Choose the complete saved record for this customer edition.');\n for(let i=0;i\u003cv.cases.length;i++){const c=v.cases[i],original=configuration.cases[i];if(c.id!==original.id||JSON.stringify(c.source)!==JSON.stringify(original.source)||JSON.stringify(c.plan)!==JSON.stringify(original.plan)||!Array.isArray(c.observations))fail('The selected customer source or plan changed.');validateDraft(c.settings);if(c.working!==undefined){validateWorking(c.working);if(c.working.pending&&c.working.pending.case_id!==c.id)fail('Keep the pending request in its original case.');}for(const o of c.observations){validateObservation(o);if(o.settings)validateDraft(o.settings);}if(new Set(c.observations.map(o=>o.id)).size!==c.observations.length)fail('Keep each observation once.');}\n if(!v.cases.some(c=>c.id===v.selected_id))fail('Select a case in this edition.');\n if(v.history.some(e=>!text(e.op_id,160)||!stamp(e.at)||!text(e.actor,200)||!['settings','observation','selection','working'].includes(e.kind)))fail('Keep the complete operation history.');\n if(new Set(v.history.map(e=>e.op_id)).size!==v.history.length)fail('Repeated operation identifiers need their original saved result.');\n return v;\n}\nfunction createKit(configuration){\n if(!configuration||!text(configuration.pack_id,160)||!text(configuration.edition_id,160)||!Array.isArray(configuration.cases)||!configuration.cases.length)fail('Complete customer edition required.');\n const state={schema:SCHEMA,pack_id:configuration.pack_id,edition_id:configuration.edition_id,customer:clone(configuration.customer),revision:0,selected_id:configuration.cases[0].id,cases:configuration.cases.map(c=>({...clone(c),observations:[]})),history:[]};\n return readState(state,configuration);\n}\nfunction selectCase(state,id){const c=state.cases.find(x=>x.id===id);if(!c)fail('Select an original case in this edition.');return c;}\nfunction mutate(state,id,kind,input,options,work){\n if(!options||!text(options.op_id,160)||!options.op_id||!stamp(options.at)||!text(options.actor,200)||!options.actor.trim())fail('Use the actual operator and original operation time.');\n const previous=state.history.find(x=>x.op_id===options.op_id),signature=JSON.stringify({id,kind,input,actor:options.actor,at:options.at});\n if(previous){if(previous.request!==signature)fail('This operation identifier already belongs to a different change.');return clone(state);}\n if(options.expected_revision!==state.revision)fail('The saved record changed. Reopen it before applying this change.');\n const next=clone(state);work(selectCase(next,id),next);next.revision++;next.history.push({op_id:options.op_id,at:options.at,actor:options.actor,kind,case_id:id,revision:next.revision,request:signature});return next;\n}\nfunction saveSettings(state,id,settings,options){validateDraft(settings);return mutate(state,id,'settings',settings,options,c=>{c.settings=clone(settings);});}\nfunction saveWorking(state,id,working,options){validateWorking(working);if(working.pending&&working.pending.case_id!==id)fail('Keep the pending request in its original case.');return mutate(state,id,'working',working,options,c=>{c.working=clone(working);});}\nfunction chooseCase(state,id,options){return mutate(state,id,'selection',{id},options,(c,n)=>{n.selected_id=c.id;});}\nfunction validateObservation(o){\n if(o&&o.settings)validateDraft(o.settings);\n if(!o||!text(o.id,160)||!o.id||!stamp(o.at)||!text(o.operator,200)||!o.operator.trim()||!['endpoint_return','imported_endpoint_return','mailbox_observation','provider_inbox_observation'].includes(o.kind)||!text(o.note,10000)||!o.source||typeof o.source!=='object')fail('Retain a complete actual observation with its operator and time.');\n if(o.kind==='endpoint_return'||o.kind==='imported_endpoint_return'){\n  if(!text(o.source.raw_response,200000)||!Number.isSafeInteger(o.source.http_status)||o.source.http_status\u003c0||o.source.http_status>599||!text(o.source.endpoint,500)||!o.source.request_fields||typeof o.source.request_fields!=='object'||Array.isArray(o.source.request_fields))fail('Keep the endpoint, request fields, returned status and full response text.');\n }else if(o.kind==='provider_inbox_observation'){if(!text(o.source.request_id,160)||!text(o.source.endpoint,500)||!text(o.source.search_description,10000)||!o.source.search_description.trim()||!text(o.source.observed_result,200000)||!o.source.observed_result.trim()||o.source.finding!=='not_found')fail('Retain the actual provider inbox check and original request identity.');}else if(!text(o.source.recipient,300)||!text(o.source.provider_message_id,500)||!text(o.source.subject,1000)||!text(o.source.body,200000)||!text(o.source.submission_id,500))fail('Keep the complete mailbox observation.');\n return o;\n}\nfunction recordObservation(state,id,observation,options){\n validateObservation(observation);return mutate(state,id,'observation',observation,options,c=>{const old=c.observations.find(o=>o.id===observation.id);if(old){const comparable=clone(old);if(!observation.settings)delete comparable.settings;if(JSON.stringify(comparable)!==JSON.stringify(observation))fail('Keep the original observation under its original identifier.');}if(!old)c.observations.push({...clone(observation),settings:clone(observation.settings||c.settings)});});\n}\nfunction submissionFields(settings,values){\n const ready=readiness(settings);if(!ready.ready)fail(ready.errors.join(' '));\n if(!values||typeof values!=='object'||Array.isArray(values))fail('Enter the sample field values as a JSON object.');\n const result={};for(const field of settings.fields){\n  const value=field.type==='hidden'?(field.value??''):values[field.name];if(field.type==='checkbox'){if(value===true||value==='yes'||value==='on')result[field.name]='yes';else if(field.required)fail('Complete '+field.label+'.');}\n  else{if(value!==undefined&&typeof value!=='string'&&typeof value!=='number')fail('Use a simple value for '+field.label+'.');const string=String(value??'');if(field.required&&!string.trim())fail('Complete '+field.label+'.');if(string.length>10000)fail('Shorten '+field.label+'.');if(field.type==='select'&&string&&!field.options.some(o=>o.value===string))fail('Select an existing option for '+field.label+'.');if(field.type==='email'&&string&&!/^[^\\s@]+@[^\\s@]+\\.[^\\s@]+$/.test(string))fail('Enter a valid reply address.');result[field.name]=string;}\n }\n if(settings.require_consent){if(values._consent!==true&&values._consent!=='yes')fail('Record the actual sample submitter consent.');result._consent='yes';}\n if(settings.subject)result._subject=settings.subject;result._redirect=settings.site_origin+settings.success_path;result._gotcha='';\n return result;\n}\nfunction fieldMarkup(f){\n const id='fw-'+f.name,required=f.required?' required':'',label=esc(f.label);\n if(f.type==='hidden')return '\u003cinput type=\"hidden\" name=\"'+esc(f.name)+'\" value=\"'+esc(f.value??'')+'\">';\n if(f.type==='checkbox')return '\u003clabel class=\"fw-check\">\u003cinput type=\"checkbox\" id=\"'+id+'\" name=\"'+esc(f.name)+'\" value=\"yes\"'+required+'> '+label+'\u003c/label>';\n const attrs=' id=\"'+id+'\" name=\"'+esc(f.name)+'\"'+required;\n const input=f.type==='textarea'?'\u003ctextarea'+attrs+' rows=\"5\">\u003c/textarea>':f.type==='select'?'\u003cselect'+attrs+'>\u003coption value=\"\">Choose…\u003c/option>'+f.options.map(o=>'\u003coption value=\"'+esc(o.value)+'\">'+esc(o.label)+'\u003c/option>').join('')+'\u003c/select>':'\u003cinput type=\"'+f.type+'\"'+attrs+'>';\n return '\u003clabel for=\"'+id+'\">'+label+(f.required?' \u003cspan aria-hidden=\"true\">*\u003c/span>':'')+'\u003c/label>\\n'+input;\n}\nfunction renderFragment(settings,{preview=false,enhance=true}={}){\n const ready=readiness(settings);if(!preview&&!ready.ready)fail(ready.errors.join(' '));\n return '\u003csection class=\"fw-contact\">\\n\u003ch2>'+esc(settings.title)+'\u003c/h2>\\n'+(settings.introduction?'\u003cp>'+esc(settings.introduction)+'\u003c/p>\\n':'')+\n '\u003cform class=\"fw-form\" data-failure=\"'+esc(settings.failure_text)+'\" data-success=\"'+esc(settings.success_text)+'\" data-uncertain=\"'+esc(settings.uncertain_text)+'\" method=\"POST\" action=\"'+esc(preview?'#':settings.endpoint)+'\" accept-charset=\"UTF-8\">\\n'+settings.fields.map(fieldMarkup).join('\\n')+'\\n'+\n (settings.privacy_text?'\u003cp class=\"fw-notice\">'+esc(settings.privacy_text)+(settings.privacy_url?(preview?' \u003cspan>'+esc(settings.privacy_url)+'\u003c/span>':' \u003ca href=\"'+esc(settings.privacy_url)+'\">Privacy notice\u003c/a>'):'')+'\u003c/p>\\n':'')+\n (settings.require_consent?'\u003clabel class=\"fw-check\">\u003cinput type=\"checkbox\" name=\"_consent\" value=\"yes\" required> '+esc(settings.consent_text)+'\u003c/label>\\n':'')+\n (settings.subject?'\u003cinput type=\"hidden\" name=\"_subject\" value=\"'+esc(settings.subject)+'\">\\n':'')+\n '\u003cinput type=\"hidden\" name=\"_redirect\" value=\"'+esc(settings.site_origin+settings.success_path)+'\">\\n'+\n '\u003clabel class=\"fw-honeypot\" aria-hidden=\"true\">Leave this field empty\u003cinput type=\"text\" name=\"_gotcha\" tabindex=\"-1\" autocomplete=\"off\">\u003c/label>\\n'+\n '\u003cbutton type=\"submit\"'+(preview?' disabled':'')+'>'+esc(settings.button_label)+'\u003c/button>\\n\u003cp class=\"fw-status\" role=\"status\" aria-live=\"polite\">\u003c/p>\\n\u003c/form>\\n\u003c/section>'+(enhance&&!preview?'\\n\u003cstyle>'+FORM_CSS+'\u003c/style>\\n\u003cscript>'+FORM_SCRIPT+'\u003c/script>':'');\n}\nconst FORM_CSS='.fw-contact{max-width:42rem;margin:2rem auto;font:16px/1.5 system-ui,sans-serif;color:#171717}.fw-contact label:not(.fw-check){display:block;margin-top:1rem;font-weight:600}.fw-contact input:not([type=checkbox]):not([type=hidden]),.fw-contact textarea,.fw-contact select{box-sizing:border-box;width:100%;padding:.7rem;border:1px solid #aaa;border-radius:2px;background:white;color:inherit;font:inherit}.fw-contact button{margin-top:1rem;padding:.75rem 1rem;border:1px solid #171717;background:#171717;color:white;font:inherit;cursor:pointer}.fw-check{display:flex;align-items:flex-start;gap:.45rem;margin-top:1rem}.fw-check input{margin-top:.4rem}.fw-notice{font-size:.9rem}.fw-honeypot{position:absolute!important;left:-9999px!important;opacity:0!important}  if(action==='reopen'){const raw=localStorage.getItem(key);if(!raw)throw new Error('There is no saved browser copy for this edition.');const v=JSON.parse(raw);const reopened=core.readState(v.state,configuration);storageRaw=raw;conflict=false;state=reopened;operator=v.operator||'';show();notice('Reopened the complete saved browser record.');return;}
 if(action==='stash'){stash();notice('Unfinished work is retained.');return;}
 if(action==='save'){acceptSettings();show();notice('Settings saved. The local preview uses this saved configuration.');return;}
 if(action==='add-field'){stash();const w=JSON.parse(JSON.stringify(active().working));let n=w.settings.fields.length+1;while(w.settings.fields.some(f=>f.name==='field'+n))n++;w.settings.fields.push({name:'field'+n,label:'New field',type:'text',required:false,value:'',options:'[]'});persist(core.saveWorking(state,state.selected_id,w,op()));show();return;}
 if(action==='record'){stash();download(configuration.edition_id+'.json',core.exportRecord(state),'application/json');return;}
 if(action==='portable'){download(configuration.edition_id+'-working.html',portableHTML(),'text/html;charset=utf-8');return;}
 if(['fragment','page','success','handover'].includes(action)){
 const s=acceptSettings(),c=active(),filename=c.id.toLowerCase();
 const data=action==='fragment'?core.renderFragment(s):action==='page'?core.renderDocument(s):action==='success'?core.renderSuccessDocument(s):core.handover(state,c.id);
 download(filename+(action==='handover'?'-handover.md':action==='success'?'-success.html':action==='page'?'-contact.html':'-fragment.html'),data,action==='handover'?'text/markdown;charset=utf-8':'text/html;charset=utf-8');updatePreview();return;
 }
 if(action==='post'){
 if(posting)throw new Error('The original request is still running.');
 const person=actualOperator();if(!$('live-confirm').checked)throw new Error('Authorize the single actual customer submission first.');
 const s=acceptSettings();if(location.origin!==s.site_origin)throw new Error('Open this kit on the configured customer website origin '+s.site_origin+' to make the sample request, or deploy its form there and import that actual endpoint result. Keep the provider’s allowed origins limited to the customer’s real site.');if(active().working?.pending)throw new Error('Reconcile the retained original submission before starting another.');
 const fields=core.submissionFields(s,JSON.parse($('sample').value)),id='submission-'+crypto.randomUUID(),at=new Date().toISOString(),w=JSON.parse(JSON.stringify(active().working));w.pending={id,at,case_id:state.selected_id,endpoint:s.endpoint,request_fields:fields,settings:JSON.parse(JSON.stringify(s))};
 persist(core.saveWorking(state,state.selected_id,w,op()),{requireDurable:true});posting=true;$('live-confirm').checked=false;notice('The original request is in progress. Its exact input is retained.');
 let http_status=0,raw_response='',failure='';
 try{const res=await fetch(s.endpoint,{method:'POST',headers:{Accept:'application/json','Content-Type':'application/x-www-form-urlencoded;charset=UTF-8'},body:new URLSearchParams(fields),credentials:'omit',redirect:'error'});http_status=res.status;raw_response=await res.text();}catch(e){failure=String(e.message||e);raw_response=failure;}finally{posting=false;}
 let body;try{body=JSON.parse(raw_response);}catch{}
 actualReturn={id,at:new Date().toISOString(),operator:person,kind:'endpoint_return',settings:s,note:failure||http_status>=500?'The outcome may include a stored submission. Inspect the actual provider inbox before any retry.':http_status>=200&&http_status<300&&body?.ok===true&&body.id?'The endpoint returned a stored submission identifier: '+String(body.id):'The actual response is retained. Confirm the receiving status in the owner inbox.',source:{endpoint:s.endpoint,request_fields:fields,http_status,raw_response,started_at:at,transport_error:failure}};
 $('actual-return-text').value=JSON.stringify(actualReturn,null,2);try{retainObservation(actualReturn,{keepPending:Boolean(failure)||uncertainReturn(http_status,raw_response)});}catch(e){notice('The actual return is available below. Download it before closing this page; then reconcile the original saved request. '+e.message,true);}
 return;
 }
 if(action==='receive-endpoint'){
 const person=actualOperator();stash();if(!$('observation-time').value)throw new Error('Enter the actual observation time.');if(!$('response-status').value)throw new Error('Enter the actual HTTP status.');
 const pending=active().working?.pending,observedFields=JSON.parse($('response-request').value),observedEndpoint=$('response-endpoint').value;if(pending&&(observedEndpoint!==pending.endpoint||JSON.stringify(observedFields)!==JSON.stringify(pending.request_fields)))throw new Error('Match the exact retained original endpoint and ordered request fields to reconcile that attempt.');
 retainObservation({id:'observation-'+crypto.randomUUID(),at:$('observation-time').value,operator:person,kind:'imported_endpoint_return',settings:pending?.settings||active().settings,note:$('observation-note').value,source:{endpoint:$('response-endpoint').value,request_fields:observedFields,http_status:Number($('response-status').value),raw_response:$('response-text').value,related_request_id:pending?.id||''}},{keepPending:Boolean(pending)&&uncertainReturn(Number($('response-status').value),$('response-text').value)});
 return;
 }
 if(action==='reconcile-absent'){const person=actualOperator();stash();const pending=active().working?.pending;if(!pending)throw new Error('There is no unresolved original request in this case.');if(!$('inbox-not-found').checked)throw new Error('Confirm the actual provider inbox finding before resolving the pending request.');retainObservation({id:'inbox-'+crypto.randomUUID(),at:new Date().toISOString(),operator:person,kind:'provider_inbox_observation',settings:pending.settings,note:'The operator inspected the actual provider inbox and reported the original request was not stored.',source:{request_id:pending.id,endpoint:pending.endpoint,request_fields:pending.request_fields,search_description:$('inbox-search').value,observed_result:$('inbox-result').value,finding:'not_found'}});return;}
 if(action==='receive-mail'){
 const person=actualOperator();stash();if(!$('mail-id').value.trim()||!$('submission-id').value.trim()||!$('mail-body').value.trim())throw new Error('Retain the actual message identifier, matching submission identifier and complete body.');
 const pending=active().working?.pending;if(pending)throw new Error('Retain the original endpoint result before linking its mailbox observation.');
 const submissionId=$('submission-id').value;const received=active().observations.find(o=>{if(!['endpoint_return','imported_endpoint_return'].includes(o.kind)||o.source.http_status<200||o.source.http_status>=300)return false;try{const body=JSON.parse(o.source.raw_response);return body.ok===true&&String(body.id)===submissionId;}catch{return false;}});if(!received)throw new Error('First retain the confirmed endpoint response with this exact submission identifier.');
 retainObservation({id:'mail-'+crypto.randomUUID(),at:new Date().toISOString(),operator:person,kind:'mailbox_observation',settings:received.settings,note:'The operator inspected the destination mailbox and retained the displayed message.',source:{recipient:$('mail-recipient').value,provider_message_id:$('mail-id').value,subject:$('mail-subject').value,body:$('mail-body').value,submission_id:submissionId,endpoint_observation_id:received.id}});
 }
}
document.addEventListener('click',async event=>{const el=event.target.closest('button');if(!el)return;try{if(posting)throw new Error('Wait for the original in-flight request before changing the selected case.');if(el.dataset.case){stash();persist(core.chooseCase(state,el.dataset.case,op()));show();}else if(el.dataset.remove!==undefined){stash();const w=JSON.parse(JSON.stringify(active().working));w.settings.fields.splice(Number(el.dataset.remove),1);persist(core.saveWorking(state,state.selected_id,w,op()));show();}else if(el.dataset.action)await perform(el.dataset.action);}catch(e){notice(e.message,true);}});
document.addEventListener('input',event=>{if(event.target.closest('#application')||event.target.id==='operator'){clearTimeout(timer);timer=setTimeout(()=>{try{stash();}catch(e){notice(e.message,true);}},500);}});
document.addEventListener('change',async event=>{if(event.target.id!=='import'||!event.target.files[0])return;try{if(posting)throw new Error('Wait for the original request before importing another record.');const file=event.target.files[0];if(file.size>8000000)throw new Error('Use an edition record smaller than 8 MB.');const candidate=core.readState(await file.text(),configuration);if(posting)throw new Error('The original request started while this file was being read. Wait for its result before reopening another record.');stash();if(!confirm('Open this complete edition record? Download the current working kit first if you need a separate copy.'))return;persist(candidate);show();notice('Complete edition reopened, including its original sources and observations.');}catch(e){notice(e.message,true);}});
window.addEventListener('storage',event=>{if(event.key===key&&event.newValue!==storageRaw){conflict=true;notice('This edition was saved in another tab. Reopen the saved browser copy before continuing.',true);}});
window.addEventListener('beforeunload',()=>{try{stash();}catch{}});
show();
})();
</script></body></html>
