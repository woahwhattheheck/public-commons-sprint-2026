<section class="rob-panel" aria-labelledby="rob-panel-title">
  <header class="rob-heading">
    <div><p class="rob-eyebrow">Research / Appraisal</p><h2 id="rob-panel-title">Risk-of-bias review</h2><p class="rob-subtitle">Review the selected result, retain its source basis, and resolve independent judgments.</p></div>
    <div class="rob-actions" data-rob="primary-actions"></div>
  </header>
  <div class="rob-message" data-rob="message" role="status" aria-live="polite" hidden></div>
  <div class="rob-workspace-context" data-rob="context"></div>
  <div class="rob-toolbar" data-rob="toolbar"></div>
  <nav class="rob-nav" data-rob="navigation" aria-label="Appraisal sections"></nav>
  <div class="rob-stats" data-rob="summary"></div>
  <p class="rob-loading" data-rob="loading" role="status" hidden>Opening the saved appraisal revision…</p>
  <div class="rob-desk">
    <section class="rob-register" aria-labelledby="rob-register-title">
      <header class="rob-section-heading"><div><h3 id="rob-register-title" data-rob="section-title">Saved appraisals</h3><p class="rob-muted" data-rob="section-count"></p></div><div class="rob-actions" data-rob="list-actions"></div></header>
      <div data-rob="filters"></div>
      <div class="rob-records" data-rob="records"></div>
      <div class="rob-pagination" data-rob="pagination"></div>
    </section>
    <section class="rob-review" aria-label="Selected appraisal">
      <div data-rob="detail"></div>
      <div data-rob="editor"></div>
    </section>
  </div>
  <section class="rob-source-desk" data-rob="sources" aria-label="Original source passages" hidden></section>
  <section class="rob-recovery" data-rob="recovery" aria-label="Browser drafts and original save requests"></section>
</section>
