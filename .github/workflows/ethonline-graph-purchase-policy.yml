name: ETHOnline Graph Purchase Policy

on:
  pull_request:
    paths:
      - 'ethonline_agent_revenue_rail/graph_purchase_policy/**'
      - '.github/workflows/ethonline-graph-purchase-policy.yml'
  push:
    branches: [main]
    paths:
      - 'ethonline_agent_revenue_rail/graph_purchase_policy/**'
      - '.github/workflows/ethonline-graph-purchase-policy.yml'

permissions:
  contents: read

jobs:
  node-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ethonline_agent_revenue_rail/graph_purchase_policy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: |
          node --check src/canonical.mjs
          node --check src/cli.mjs
          node --check src/live_graph.mjs
          node --check src/policy.mjs
          node --check test/policy.test.mjs
      - name: Hostile policy suite
        run: npm test
