name: ZKER Commercial Decision Relay Publisher

on:
  push:
    branches:
      - zker-j4m8/commercial-decision-relay-20260913

permissions:
  contents: write

jobs:
  verify-and-publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: zker-j4m8/commercial-decision-relay-20260913
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Reassemble exact frozen snapshot
        run: |
          cat _staging/zker-cdr/cdr.part*.b64 | base64 --decode > /tmp/commercial-decision-relay.zip
          echo '00e6b7c2bf82466154ad08bfa9b10ab551c190a11af35456c037535c0892c3d5  /tmp/commercial-decision-relay.zip' | sha256sum --check --strict
          rm -rf commercial-decision-relay
          mkdir commercial-decision-relay
          unzip -q /tmp/commercial-decision-relay.zip -d commercial-decision-relay
          chmod +x commercial-decision-relay/scripts/run_judge_fixture.sh
      - name: Install real Strands runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ./commercial-decision-relay
      - name: Full validation
        run: |
          python -m py_compile commercial-decision-relay/src/commercial_decision_relay/*.py
          PYTHONWARNINGS='error::ResourceWarning' python -m unittest discover -s commercial-decision-relay/tests -v
          PYTHONWARNINGS='error::ResourceWarning' python -O -m unittest discover -s commercial-decision-relay/tests -v
          rm -f /tmp/cdr-publish-judge.db
          decision-relay --db /tmp/cdr-publish-judge.db fixture --reset
          decision-relay --db /tmp/cdr-publish-judge.db queue > /tmp/cdr-publish-queue.json
          python - <<'PY'
          import json
          data=json.load(open('/tmp/cdr-publish-queue.json'))
          assert data['count'] == 6, data
          kinds={entry['decision_kind'] for entry in data['entries']}
          assert kinds == {'ACCEPTANCE_READY','COUNTEROFFER','AMBIGUITY','EXPIRY_REISSUE','EVIDENCE_CONFLICT'}, kinds
          assert all(not any(entry['authority'].values()) for entry in data['entries'])
          PY
      - name: Publish readable source and remove staging carrier
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -rf _staging/zker-cdr
          rm -f .github/workflows/zker-cdr-publish.yml
          git add -A commercial-decision-relay _staging/zker-cdr .github/workflows/zker-cdr-publish.yml
          git diff --cached --check
          git commit -m 'feat(hackathon): publish Commercial Decision Relay'
          git push origin HEAD:zker-j4m8/commercial-decision-relay-20260913
