name: WorkSeal GitHub Evidence Acquisition

on:
  pull_request:
    paths:
      - 'workseal/src/github_evidence_acquire*.mjs'
      - 'workseal/test/github_evidence_acquire.test.mjs'
      - 'workseal/GITHUB_EVIDENCE_ACQUISITION.md'
      - '.github/workflows/workseal-github-evidence-acquisition.yml'
  push:
    branches: [main]
    paths:
      - 'workseal/src/github_evidence_acquire*.mjs'
      - 'workseal/test/github_evidence_acquire.test.mjs'
      - 'workseal/GITHUB_EVIDENCE_ACQUISITION.md'
      - '.github/workflows/workseal-github-evidence-acquisition.yml'

permissions:
  contents: read

jobs:
  acquisition-contract:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Syntax gate
        run: |
          node --check workseal/src/github_evidence_acquire.mjs
          node --check workseal/src/github_evidence_acquire_cli.mjs
      - name: Existing evidence verifier + acquisition hostile suite
        working-directory: workseal
        run: node --test test/github_evidence.test.mjs test/github_evidence_acquire.test.mjs
