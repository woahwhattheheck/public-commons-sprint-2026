name: VisualLedger SAM dependencies
on:
  pull_request:
    paths:
      - 'visualledger-opencv/infra/**'
      - '.github/workflows/visualledger-sam-dependencies.yml'
permissions:
  contents: read
concurrency:
  group: visualledger-sam-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  dependency-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      AWS_DEFAULT_REGION: us-east-1
      AWS_EC2_METADATA_DISABLED: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install pinned offline transform tools
        run: python -m pip install -r visualledger-opencv/infra/validation-requirements.txt
      - name: Reproduce old cycle and verify repaired graph
        run: |
          set -o pipefail
          python visualledger-opencv/infra/check_sam_dependencies.py | tee visualledger-sam-dependencies.json
      - uses: actions/upload-artifact@v4
        with:
          name: visualledger-sam-dependency-receipt
          path: visualledger-sam-dependencies.json
          retention-days: 14
