name: ZPH Cookie Crumbs source repair

on:
  push:
    branches:
      - zph-n4v8/cookie-crumbs-source-hardening-20260914

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: zph-n4v8/cookie-crumbs-source-hardening-20260914
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Apply, test, commit, and push source repair
        run: python .github/zph_cookie_crumbs_run_no_workflow.py
