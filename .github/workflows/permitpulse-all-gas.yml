name: PermitPulse All Gas

on:
  pull_request:
    paths:
      - 'permitpulse-all-gas/**'
      - '.github/workflows/permitpulse-all-gas.yml'
  push:
    branches: [main]
    paths:
      - 'permitpulse-all-gas/**'
      - '.github/workflows/permitpulse-all-gas.yml'

permissions:
  contents: read

jobs:
  contract:
    strategy:
      matrix:
        node: [22, 24]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Deterministic source contract
        working-directory: permitpulse-all-gas
        run: npm run verify
