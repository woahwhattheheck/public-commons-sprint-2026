name: Cookie Crumbs CI

on:
  pull_request:
    paths:
      - 'cookie-crumbs/**'
      - '.github/workflows/cookie-crumbs-ci.yml'
      - '.github/workflows/cookie-crumbs-pages.yml'
  push:
    branches: [main]
    paths:
      - 'cookie-crumbs/**'
      - '.github/workflows/cookie-crumbs-ci.yml'
      - '.github/workflows/cookie-crumbs-pages.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
      - name: Syntax + regression contract
        working-directory: cookie-crumbs
        run: npm run ci
      - name: Static app inventory
        run: |
          test -s cookie-crumbs/index.html
          test -s cookie-crumbs/styles.css
          test -s cookie-crumbs/app.js
          test -s cookie-crumbs/receipt.mjs
          test -s cookie-crumbs/chain.mjs
          test -s cookie-crumbs/history.mjs
          test -s cookie-crumbs/verify-deploy.mjs
          grep -F 'https://rpc.cookiescan.io' cookie-crumbs/app.js
          grep -F 'window.nightly?.solana' cookie-crumbs/app.js
          grep -F 'transactionHasSigner(tx, state.publicKey)' cookie-crumbs/app.js
          grep -F 'MemoSq4gqABAXKb96qnH8TysNcWxMyWCqXgDLGmfcHr' cookie-crumbs/chain.mjs
          ! grep -E 'https?://[^"'"'"' ]+\.js' cookie-crumbs/index.html
          ! grep -E 'jsdelivr|unpkg|@solana/web3' cookie-crumbs/index.html
          grep -F 'cookie-crumbs/deployment-receipt/v1' cookie-crumbs/verify-deploy.mjs
