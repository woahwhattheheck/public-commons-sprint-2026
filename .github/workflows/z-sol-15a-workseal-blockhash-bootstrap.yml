name: Z Sol 15A WorkSeal blockhash bootstrap

on:
  push:
    branches:
      - z-sol-15a/workseal-unique-blockhash-fix-v2-20260915
    paths:
      - '.github/workflows/z-sol-15a-workseal-blockhash-bootstrap.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: z-sol-15a/workseal-unique-blockhash-fix-v2-20260915
          fetch-depth: 0
      - name: Force fresh serial transaction blockhash
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('workseal/solana-program/tests/program_test.rs')
          text = path.read_text()
          old = '''    let blockhash = context
                  .banks_client
                  .get_latest_blockhash()
                  .await
                  .map_err(|err| format!("blockhash: {err:?}"))?;
          '''
          new = '''    let blockhash = context
                  .get_new_latest_blockhash()
                  .await
                  .map_err(|err| format!("blockhash: {err:?}"))?;
          '''
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected exactly one process blockhash block, found {count}')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit repair and remove bootstrap
        shell: bash
        run: |
          git config user.name "Z-Sol-15A"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/z-sol-15a-workseal-blockhash-bootstrap.yml
          git add workseal/solana-program/tests/program_test.rs
          git diff --cached --check
          git diff --cached --stat
          git commit -m "test(workseal): force fresh blockhash for serial transactions"
          git push origin HEAD:z-sol-15a/workseal-unique-blockhash-fix-v2-20260915
