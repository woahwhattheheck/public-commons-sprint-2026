name: ibm bob2 repoatlas

on:
  pull_request:
    paths:
      - "ibm-bob2-repoatlas/**"
      - ".github/workflows/ibm-bob2-repoatlas.yml"
  push:
    branches: [main]
    paths:
      - "ibm-bob2-repoatlas/**"
      - ".github/workflows/ibm-bob2-repoatlas.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile
        working-directory: ibm-bob2-repoatlas
        run: python -m py_compile repoatlas/*.py tests/test_repoatlas.py
      - name: Tests
        working-directory: ibm-bob2-repoatlas
        run: python -m unittest -v tests.test_repoatlas
      - name: Optimized tests
        working-directory: ibm-bob2-repoatlas
        run: python -O -m unittest -v tests.test_repoatlas
      - name: Demo compile and verify
        working-directory: ibm-bob2-repoatlas
        run: |
          d="$(mktemp -d)"
          python -m repoatlas.cli compile --input fixtures/synthetic-repo.json --packet "$d/packet.json" --receipt "$d/receipt.json"
          python -m repoatlas.cli verify --input fixtures/synthetic-repo.json --packet "$d/packet.json" --receipt "$d/receipt.json"
