name: PR47 final source closure

on:
  push:
    branches:
      - z-glint/pr47-current-head-source-closure

permissions:
  contents: write

jobs:
  repair-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: macos-14
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply exact-source closure and run full acceptance
        run: bash .rebuild/pr47-final/apply.sh
      - name: Commit verified donor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "fix(mcp): close Ping and control-response false negatives"
          git push origin HEAD:z-glint/pr47-current-head-source-closure
