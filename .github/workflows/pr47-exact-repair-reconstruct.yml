name: PR47 exact repair reconstruction

on:
  push:
    branches:
      - z-glint/pr47-transport-security-closure

permissions:
  contents: write

jobs:
  reconstruct-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconstruct exact validated files and run acceptance
        run: bash .rebuild/pr47/reconstruct.sh
      - name: Commit exact repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "fix(mcp): close transport security false greens"
          git push origin HEAD:z-glint/pr47-transport-security-closure
