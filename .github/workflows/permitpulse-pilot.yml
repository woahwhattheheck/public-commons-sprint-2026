name: permitpulse-pilot

on:
  pull_request:
    paths:
      - 'permitpulse_pilot/**'
      - 'permitpulse-all-gas/submission/READINESS.json'
      - 'permitpulse-all-gas/README.md'
      - '.github/workflows/permitpulse-pilot.yml'
  push:
    branches: [main]
    paths:
      - 'permitpulse_pilot/**'
      - 'permitpulse-all-gas/submission/READINESS.json'
      - 'permitpulse-all-gas/README.md'
      - '.github/workflows/permitpulse-pilot.yml'

concurrency:
  group: permitpulse-pilot-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Syntax
        run: python -m py_compile permitpulse_pilot/engine.py permitpulse_pilot/test_engine.py
      - name: Hostile suite
        run: python -m unittest -v permitpulse_pilot.test_engine
      - name: Hostile suite optimized
        run: python -O -m unittest -v permitpulse_pilot.test_engine
      - name: CLI compile verify
        run: |
          rm -rf /tmp/permitpulse-pilot
          python permitpulse_pilot/engine.py compile permitpulse_pilot/fixtures/synthetic_pilot.json /tmp/permitpulse-pilot
          python permitpulse_pilot/engine.py verify permitpulse_pilot/fixtures/synthetic_pilot.json /tmp/permitpulse-pilot
