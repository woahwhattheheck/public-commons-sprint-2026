name: VisualLedger source proof

on:
  pull_request:
    paths:
      - "visualledger-opencv/**"
      - ".github/workflows/visualledger-opencv.yml"
  push:
    branches: [main]
    paths:
      - "visualledger-opencv/**"
      - ".github/workflows/visualledger-opencv.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: visualledger-opencv
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: visualledger-opencv/requirements.txt
      - name: Install source-proof runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install "opencv-python-headless>=5,<6" "numpy>=2,<3" "boto3>=1.35,<2"
      - name: Runtime truth
        run: |
          python - <<'PY'
          import cv2
          print(f"opencv={cv2.__version__}")
          print(f"competition_opencv5_runtime={int(cv2.__version__.split('.', 1)[0]) >= 5}")
          PY
      - name: Compile
        run: python -m compileall -q visualledger tests
      - name: Unit tests
        run: PYTHONPATH=. python -m unittest -v tests.test_visualledger tests.test_hough_shapes
      - name: Optimized unit tests
        run: PYTHONPATH=. python -O -m unittest -v tests.test_visualledger tests.test_hough_shapes
      - name: CLI evaluation
        run: PYTHONPATH=. python -m visualledger.cli evaluate --allow-opencv4-dev
      - name: Optimized CLI evaluation
        run: PYTHONPATH=. python -O -m visualledger.cli evaluate --allow-opencv4-dev
