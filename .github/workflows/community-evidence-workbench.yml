name: Community Evidence Workbench

on:
  pull_request:
    paths:
      - "accessibility/community-evidence-packet-workbench/**"
      - ".github/workflows/community-evidence-workbench.yml"
  push:
    branches: ["main"]
    paths:
      - "accessibility/community-evidence-packet-workbench/**"
      - ".github/workflows/community-evidence-workbench.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]
    defaults:
      run:
        working-directory: accessibility/community-evidence-packet-workbench
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm test
      - run: npm run build
