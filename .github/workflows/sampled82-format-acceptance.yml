name: Sampled 82 exact-source formatter acceptance

on:
  push:
    branches:
      - acceptance/sampled82-format-20261009-astra-density
    paths:
      - .github/workflows/sampled82-format-acceptance.yml

permissions:
  contents: read

concurrency:
  group: sampled82-format-acceptance-astra-density
  cancel-in-progress: false

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Read restored original contributor source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: woahwhattheheck/sampled
          ref: 251ef5ccea966632550e0522ba6f0496cc2802f4
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install only the repository-pinned formatter
        run: |
          npm install --prefix "$RUNNER_TEMP/prettier-tool" --ignore-scripts --no-audit --no-fund --no-package-lock prettier@3.6.2
          echo "$RUNNER_TEMP/prettier-tool/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Verify exact restored blobs without importing project code
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 251ef5ccea966632550e0522ba6f0496cc2802f4
          test "$(git hash-object eslint.config.js)" = 718493732dbbfaecccb8e43ea2b9a094022cf43e
          test "$(git hash-object SECURITY.md)" = 9d9609123c4e64686234496c9ab83cc25fd05471
          node --check eslint.config.js
          echo 'RESTORED_BLOB_AND_SYNTAX_CHECK=PASS'
      - name: Required full-project formatter acceptance
        shell: bash
        run: |
          set -euo pipefail
          printf 'SOURCE_HEAD='; git rev-parse HEAD
          printf 'NODE='; node --version
          printf 'PRETTIER='; prettier --version
          npm run format:check
          echo 'SOURCE_FULL_FORMAT_EXIT=0'
