name: Sampled 82 exact-source formatter acceptance

on:
  push:
    branches:
      - acceptance/sampled82-format-20261009-astra-density
    paths:
      - .github/workflows/sampled82-format-acceptance.yml

permissions:
  contents: read

concurrency:
  group: sampled82-format-acceptance-astra-density
  cancel-in-progress: false

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Read original contributor source
        uses: actions/checkout@v4
        with:
          repository: woahwhattheheck/sampled
          ref: b87dad80de5f306b4d07a6f3181f8c9cf04b5d38
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install only the repository-pinned formatter
        run: |
          npm install --prefix "$RUNNER_TEMP/prettier-tool" --ignore-scripts --no-audit --no-fund --no-package-lock prettier@3.6.2
          echo "$RUNNER_TEMP/prettier-tool/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Required full-project check and changed-file correction evidence
        shell: bash
        run: |
          set -uo pipefail
          printf 'SOURCE_HEAD='; git rev-parse HEAD
          printf 'NODE='; node --version
          printf 'PRETTIER='; prettier --version
          set +e
          npm run format:check > "$RUNNER_TEMP/source-format.log" 2>&1
          full_status=$?
          cat "$RUNNER_TEMP/source-format.log"
          echo "SOURCE_FULL_FORMAT_EXIT=$full_status"
          prettier SECURITY.md package.json .github/workflows/node.yml --check
          changed_status=$?
          echo "SOURCE_CHANGED_FORMAT_EXIT=$changed_status"
          if [ "$changed_status" -ne 0 ]; then
            prettier SECURITY.md package.json .github/workflows/node.yml --write
            echo 'BEGIN_FORMAT_ONLY_PATCH'
            git diff -- SECURITY.md package.json .github/workflows/node.yml
            echo 'END_FORMAT_ONLY_PATCH'
            prettier SECURITY.md package.json .github/workflows/node.yml --check
            echo "CORRECTED_CHANGED_FORMAT_EXIT=$?"
          fi
          if [ "$full_status" -ne 0 ]; then
            git fetch --depth=1 https://github.com/woahwhattheheck/sampled.git 08a2d1db8317e1620ead99f8eb7bdfe1e002aef0
            fetch_status=$?
            echo "BASE_FETCH_EXIT=$fetch_status"
            if [ "$fetch_status" -eq 0 ]; then
              git worktree add --detach "$RUNNER_TEMP/sampled-baseline" FETCH_HEAD
              (cd "$RUNNER_TEMP/sampled-baseline" && prettier . --check) > "$RUNNER_TEMP/base-format.log" 2>&1
              baseline_status=$?
              cat "$RUNNER_TEMP/base-format.log"
              echo "BASE_FULL_FORMAT_EXIT=$baseline_status"
            fi
          fi
          exit "$full_status"
