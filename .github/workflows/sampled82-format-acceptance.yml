name: Sampled source static preflight evidence

on:
  push:
    branches:
      - acceptance/sampled82-format-20261009-astra-density
    paths:
      - .github/workflows/sampled82-format-acceptance.yml

permissions:
  contents: read

concurrency:
  group: sampled82-format-acceptance-astra-density
  cancel-in-progress: false

jobs:
  static-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Read exact trusted inspection utility
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: b3038e625cb187ac4f05e647104370caa682a669
          persist-credentials: false
          fetch-depth: 1
      - name: Inspect historical source blobs as data only
        shell: bash
        run: |
          set -euo pipefail
          scanner="$GITHUB_WORKSPACE/tools/static-preflight/static_config_preflight.py"
          test "$(git hash-object "$scanner")" = d3fb5715053de2556c4ffab4aa8ddb0312138e28
          objects="$RUNNER_TEMP/sampled-source-objects.git"
          git -c core.hooksPath=/dev/null init --bare "$objects"
          git -c core.hooksPath=/dev/null --git-dir="$objects" fetch --no-tags --depth=1 https://github.com/woahwhattheheck/sampled.git 08a2d1db8317e1620ead99f8eb7bdfe1e002aef0 b3f9f606d144bdef143f6fc444acbc7ea157f341
          git --git-dir="$objects" show 08a2d1db8317e1620ead99f8eb7bdfe1e002aef0:eslint.config.js > "$RUNNER_TEMP/recorded-config.source.txt"
          git --git-dir="$objects" show b3f9f606d144bdef143f6fc444acbc7ea157f341:eslint.config.js > "$RUNNER_TEMP/restored-config.source.txt"
          test "$(git hash-object "$RUNNER_TEMP/recorded-config.source.txt")" = 7da565bcb57517fa1c3adc1c824b7e105dae2699
          test "$(git hash-object "$RUNNER_TEMP/restored-config.source.txt")" = 718493732dbbfaecccb8e43ea2b9a094022cf43e
          set +e
          python3 -I "$scanner" "$RUNNER_TEMP/recorded-config.source.txt" > "$RUNNER_TEMP/recorded-config.receipt.json"
          risk_status=$?
          set -e
          test "$risk_status" -eq 1
          python3 -I "$scanner" "$RUNNER_TEMP/restored-config.source.txt" > "$RUNNER_TEMP/restored-config.receipt.json"
          python3 -I - "$RUNNER_TEMP/recorded-config.receipt.json" "$RUNNER_TEMP/restored-config.receipt.json" <<'PY'
          import json, pathlib, sys
          recorded, restored = [json.loads(pathlib.Path(p).read_text()) for p in sys.argv[1:]]
          assert recorded['files'][0]['state'] == 'KNOWN_RISK'
          assert {x['code'] for x in recorded['files'][0]['findings']} == {'KNOWN_RISK_BLOB', 'LONG_ENCODED_DYNAMIC_LINE'}
          assert restored['state'] == 'NO_MATCH'
          print(json.dumps({'recorded': recorded, 'restored': restored}, indent=2))
          print('STATIC_REAL_SOURCE_CONTRAST=PASS; INSPECTED_CODE_EXECUTED=NO')
          PY
