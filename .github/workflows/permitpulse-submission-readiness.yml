name: PermitPulse submission readiness

on:
  pull_request:
    paths:
      - 'permitpulse-all-gas/submission/**'
      - 'permitpulse-all-gas/scripts/verify-submission-readiness.mjs'
      - '.github/workflows/permitpulse-submission-readiness.yml'
  push:
    branches: [main]
    paths:
      - 'permitpulse-all-gas/submission/**'
      - 'permitpulse-all-gas/scripts/verify-submission-readiness.mjs'
      - '.github/workflows/permitpulse-submission-readiness.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Verify last-mile carrier
        run: node permitpulse-all-gas/scripts/verify-submission-readiness.mjs
