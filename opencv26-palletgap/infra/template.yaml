AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: PalletGap fixed-camera human-review prototype (no automated safety clearance)
Resources:
  Inputs:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      LifecycleConfiguration:
        Rules:
          - Id: expire-raw-camera-images
            Prefix: frames/
            Status: Enabled
            ExpirationInDays: 7
  Inspections:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: inspection_id, AttributeType: S }
      KeySchema:
        - { AttributeName: inspection_id, KeyType: HASH }
      TimeToLiveSpecification:
        AttributeName: ttl_epoch
        Enabled: true
  ReviewQueue:
    Type: AWS::SQS::Queue
    Properties:
      FifoQueue: true
      ContentBasedDeduplication: false
      MessageRetentionPeriod: 1209600
      SqsManagedSseEnabled: true
  Inspector:
    Type: AWS::Serverless::Function
    Metadata:
      DockerContext: ../
      Dockerfile: Dockerfile
      DockerTag: palletgap-opencv5
    Properties:
      PackageType: Image
      Timeout: 60
      MemorySize: 1536
      Architectures: [arm64]
      Environment:
        Variables:
          PALLET_BUCKET: !Ref Inputs
          PALLET_TABLE: !Ref Inspections
          PALLET_REVIEW_QUEUE_URL: !Ref ReviewQueue
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Sid: ReadCameraInputs
              Effect: Allow
              Action: s3:GetObject
              Resource: !Sub '${Inputs.Arn}/*'
            - Sid: StoreDecision
              Effect: Allow
              Action: dynamodb:PutItem
              Resource: !GetAtt Inspections.Arn
            - Sid: HumanReviewQueue
              Effect: Allow
              Action: sqs:SendMessage
              Resource: !GetAtt ReviewQueue.Arn
      Events:
        RequestArrived:
          Type: S3
          Properties:
            Bucket: !Ref Inputs
            Events: s3:ObjectCreated:*
            Filter:
              S3Key:
                Rules:
                  - { Name: prefix, Value: 'requests/' }
                  - { Name: suffix, Value: '.json' }
Outputs:
  InputBucket:
    Value: !Ref Inputs
  ManualReviewQueue:
    Value: !Ref ReviewQueue
