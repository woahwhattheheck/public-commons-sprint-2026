[package]
name = "principal_oracle_adapter"
version = "0.1.0"
edition = "2021"
rust-version = "1.91.0"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = { version = "=26.0.1" }

[dev-dependencies]
soroban-sdk = { version = "=26.0.1", features = ["testutils"] }

[features]
testutils = ["soroban-sdk/testutils"]
