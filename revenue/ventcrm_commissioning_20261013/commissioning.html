nd its current system. List required integrations and any payroll or inventory dependency.\n\nCompleted outcome: The selected service matches the operator's actual daily route; each unusual dependency has a named treatment in the agreed scope.\n\nRetain: Business profile, dependency list and selected scope.","source_url":"https://ventcrm.com/"},{"id":"terms","phase":"intake","title":"Keep published terms and the selected agreement distinct","source_ids":["terms","exit"],"criterion_origin":"proposed_operator_commissioning_workflow","action":"Record links, retrieval dates and draft labels beside the agreement actually selected for this pilot. Record who selected it and when setup work begins.","acceptance":"The desk can display the source version separately from the operator's agreed scope, dates and commercial treatment. An unresolved source detail stays visible as a question assigned to its actual owner.","retain":"Source register, agreement reference, setup-start event and open questions.","depends_on":[],"default_status":"unreviewed","instruction":"Record links, retrieval dates and draft labels beside the agreement actually selected for this pilot. Record who selected it and when setup work begins.\n\nCompleted outcome: The desk can display the source version separately from the operator's agreed scope, dates and commercial treatment. An unresolved source detail stays visible as a question assigned to its actual owner.\n\nRetain: Source register, agreement reference, setup-start event and open questions.","source_url":"https://ventcrm.com/terms"},{"id":"fees","phase":"intake","title":"Record the actual service and usage basis","source_ids":["pricing"],"criterion_origin":"proposed_operator_commissioning_workflow","action":"Enter the selected setup/monthly amounts, billing start, usage responsibility and payment-account owner. Preserve a later negotiated amount beside the published reference.","acceptance":"The operating budget separates software, SMS and card costs and identifies whose account receives customer payments.","retain":"Selected commercial record and usage-cost owner.","depends_on":[],"default_status":"unreviewed","instruction":"Enter the selected setup/monthly amounts, billing start, usage responsibility and payment-account owner. Preserve a later negotiated amount beside the published reference.\n\nCompleted outcome: The operating budget separates software, SMS and card costs and identifies whose account receives customer payments.\n\nRetain: Selected commercial record and usage-cost owner.","source_url":"https://ventcrm.com/pricing"},{"id":"identity","phase":"setup","title":"Configure the operator's identity and service catalogue","source_ids":["pricing"],"criterion_origin":"proposed_operator_commissioning_workflow","action":"Load the agreed name, logo, domain, services, prices, taxes, service area and booking rules from the intake.","acceptance":"One authored booking displays the selected operator identity and service details consistently through the invoice and customer document.","retain":"Configuration export and the authored booking reference.","depends_on":["scope"],"default_status":"unreviewed","instruction":"Load the agreed name, logo, domain, services, prices, taxes, service area and booking rules from the intake.\n\nCompleted outcome: One authored booking displays the selected operator identity and service details consistently through the invoice and customer document.\n\nRetain: Configuration export and the authored booking reference.","source_url":"https://ventcrm.com/pricing"},{"id":"source","phase":"migration","title":"Retain the original export before mapping","source_ids":["migration"],"criterion_origin":"proposed_operator_commissioning_workflow","action":"Receive the operator-authorized original files, inventory every file and count records by entity. Preserve original bytes and timestamps before any transformations.","acceptance":"Every received file remains available and is attributable to one intake; corrections are separate editions with a stated reason.","retain":"Original-file manifest, row counts and intake owner.","depends_on":["scope"],"default_status":"unreviewed","instruction":"Receive the operator-authorized original files, inventory every file and count records by entity. Preserve original bytes and timestamps before any transformations.\n\nCompleted outcome: Every received file remains available and is attributable to one intake; corrections are separate editions with a stated reason.\n\nRetain: Original-file manifest, row counts and intake owner.","source_url":"https://ventcrm.com/jobber-alternative"},{"id":"mapping","phase":"migration","title":"Make each field and relationship explicit","source_ids":["migration"],"criterion_origin":"proposed_operator_commissioning_workflow","action":"Map source identifiers, customer/property relationships, visits, invoice amounts/statuses and dates. Record timezone, currency and duplicate rules. Keep exceptions assigned to an operator.","acceptance":"Every in-scope source field is mapped, intentionally retained as extra information or explicitly excluded; customer/job/invoice references remain connected.","retain":"Complete mapping, duplicate decisions and unresolved-source list.","depends_on":["source"],"default_status":"unreviewed","instruction":"Map source identifiers, customer/property relationships, visits, invoice amounts/statuses and dates. Record timezone, currency and duplicate rules. Keep exceptions assigned to an operator.\n\nCompleted outcome: Every in-scope source field is mapped, intentionally retained as extra information or explicitly excluded; customer/job/invoice references remain connected.\n\nRetain: Complete mapping, duplicate decisions and unresolved-source list.","source_url":"https://ventcrm.com/jobber-alternative"},{"id":"balances","phase":"migration","title":"Reconcile operational and financial continuity","source_ids":["migration"],"criterion_origin":"proposed_operator_commissioning_workflow","action":"Compare imported counts, future appointments, outstanding balances and paid/void states to the original export. Resolve missing links and unexpected differences within the same case.","acceptance":"Booked work and invoice balances can be traced to the received source; every remaining difference has a documented operator decision.","retain":"Before/after reconciliation and the complete exception decisions.","depends_on":["mapping"],"default_status":"unreviewed","instruction":"Compare imported counts, future appointments, outstanding balances and paid/void states to the original export. Resolve missing links and unexpected differences within the same case.\n\nCompleted outcome: Booked work and invoice balances can be traced to the received source; every remaining difference has a documented operator decision.\n\nRetain: Before/after reconciliation and the complete exception decisions.","source_url":"https://ventcrm.com/jobber-alternative"},{"id":"delta","phase":"migration","title":"Plan the changeover from the still-running system","source_ids":["migration"],"criterion_origin":"proposed_operator_commissioning_workflow","action":"Choose a cutover window, identify records created or changed during preparation, and name the responsible operator for the final delta and fallback.","acceptance":"The plan accounts for new bookings and payments through the selected switch time, with a way to resume the original process if the cutover is deferred.","retain":"Cutover worksheet, delta inventory and fallback contact.","depends_on":["balances"],"default_status":"unreviewed","instruction":"Choose a cutover window, identify records created or changed during preparation, and name the responsible operator for the final delta and fallback.\n\nCompleted outcome: The plan accounts for new bookings and payments through the selected switch time, with a way to resume the original process if the cutover is deferred.\n\nRetain: Cutover worksheet, delta inventory and fallback contact.","source_url":"https://ventcrm.com/jobber-alternative"},{"id":"owner_access","phase":"access","title":"Give the operator an individual account","source_ids":["product"],"criterion_origin":"proposed_operator_commissioning_workflow","action":"Use the intended owner identity in the selected private instance. Exercise ordinary sign-in, sign-out and the supported recovery path during the walkthrough.","acceptance":"The owner can return to the intended business workspace through its normal entry point; credentials are kept out of the desk and shared documents.","retain":"Instance URL, named account custodian and walkthrough result.","depends_on":["identity"],"default_status":"unreviewed","instruction":"Use the intended owner identity in the selected private instance. Exercise ordinary sign-in, sign-out and the supported recovery path during the walkthrough.\n\nCompleted outcome: The owner can return to the intended business workspace through its normal entry point; credentials are kept out of the desk and shared documents.\n\nRetain: Instance URL, named account custodian and walkthrough result.","source_url":"https://ventcrm.com/"},{"id":"technician_access","phase":"access","title":"Review the actual technician role","source_ids":["product"],"criterion_origin":"proposed_operator_commissioning_workflow","action":"With an operator-authorized technician account, open its normal day view and one same-day invoice. In the same workflow inspect the owner-only routes the operator depends on.","acceptance":"The observed role fits the published daily-work boundary; any broader access is recorded against the exact route for the product owner to correct.","retain":"Role matrix and actual route/result notes.","depends_on":["owner_access"],"default_status":"unreviewed","instruction":"With an operator-authorized technician account, open its normal day view and one same-day invoice. In the same workflow inspect the owner-only routes the operator depends on.\n\nCompleted outcome: The observed role fits the published daily-work boundary; any broader access is recorded against the exact route for the product owner to correct.\n\nRetain: Role matrix and actual route/result notes.","source_url":"https://ventcrm.com/"},{"id":"custody","phase":"access","title":"Record system and provider custody","source_ids":["privacy"],"criterion_origin":"proposed_operator_commissioning_workflow","action":"Name the business owner and technical custodian of the instance, domain, data store, email, messaging and payment connections. Record references and recovery contacts without secrets.","acceptance":"The operator can identify who controls each connection and where customer data belongs; a handover does not require a password embedded in a document.","retain":"Account-custody register and recovery contacts.","depends_on":["owner_access"],"default_status":"unreviewed","instruction":"Name the business owner and technical custodian of the instance, domain, data store, email, messaging and payment connections. Record references and recovery contacts without secrets.\n\nCompleted outcome: The operator can identify who controls each connection and where customer data belongs; a handover does not require a password embedded in a document.\n\nRetain: Account-custody register and recovery contacts.","source_url":"https://ventcrm.com/privacy"},{"id":"booking","phase":"daily_operation","title":"Operate a booking through the selected rules","source_ids":["product"],"criterion_origin":"proposed_operator_commissioning_workflow","action":"Use an authored pilot customer and the configured public booking route; carry the booking into the schedule, visit and final invoice on the operator's phone.","acceptance":"The intended service, time, address and selected charges remain consistent through the operator's normal day.","retain":"One linked booking-to-invoice course and reviewed phone/desktop views.","depends_on":["identity","balances"],"default_status":"unreviewed","instruction":"Use an authored pilot customer and the configured public booking route; carry the booking into the schedule, visit and final invoice on the operator's phone.\n\nCompleted outcome: The intended service, time, address and selected charges remain consistent through the operator's normal day.\n\nRetain: One linked booking-to-invoice course and reviewed phone/desktop views.","source_url":"https://ventcrm.com/"},{"id":"consent","phase":"communications","title":"Carry consent with the contact","source_ids":["sms"],"criterion_origin":"proposed_operator_commissioning_workflow","action":"For controlled pilot contacts, record consent source, scope, wording/version and time. Make absent or limited consent visible before enabling communications.","acceptance":"Only the communication appropriate to the recorded scope is selected; a service contact is not silently reclassified as a marketing subscriber.","retain":"Contact permission record and selected communication purpose.","depends_on":["mapping"],"default_status":"unreviewed","instruction":"For controlled pilot contacts, record consent source, scope, wording/version and time. Make absent or limited consent visible before enabling communications.\n\nCompleted outcome: Only the communication appropriate to the recorded scope is selected; a service contact is not silently reclassified as a marketing subscriber.\n\nRetain: Contact permission record and selected communication purpose.","source_url":"https://ventcrm.com/sms-policy"},{"id":"registration","phase":"communications","title":"Join the actual business messaging connection","source_ids":["sms"],"criterion_origin":"proposed_operator_commissioning_workflow","action":"Retain the provider's actual number/registration result and responsible custodian. Use a consenting operator-controlled contact for a send and reply in the private pilot instance.","acceptance":"The chosen business sender and reply appear in the intended conversation; registration status is an observed Review the resulting customer copy before a selected trigger is exercised.","acceptance":"Each enabled action has an intentional recipient and observable result; repeated operating actions do not leave unexplained repeated customer messages.","retain":"Selected automation list and linked delivery results.","depends_on":["booking","consent"],"default_status":"unreviewed","instruction":"Identify the actual triggers enabled for the authored course, their recipient, timing and owner. Review the resulting customer copy before a selected trigger is exercised.\n\nCompleted outcome: Each enabled action has an intentional recipient and observable result; repeated operating actions do not leave unexplained repeated customer messages.\n\nRetain: Selected automation list and linked delivery results.","source_url":"https://ventcrm.com/"},{"id":"stripe","phase":"payments","title":"Connect the operator-owned payment account","source_ids":["pricing"],"criterion_origin":"proposed_operator_commissioning_workflow","action":"Record the operator's chosen Stripe connection and use its supported test or operator-approved pilot flow; follow the hosted payment link through to the invoice result.","acceptance":"Payment belongs to the selected business account and reconciles to one invoice; the desk retains reference/status/amount rather than card details.","retain":"Payment-account custody, invoice reference and reconciliation.","depends_on":["custody","booking"],"default_status":"unreviewed","instruction":"Record the operator's chosen Stripe connection and use its supported test or operator-approved pilot flow; follow the hosted payment link through to the invoice result.\n\nCompleted outcome: Payment belongs to the selected business account and reconciles to one invoice; the desk retains reference/status/amount rather than card details.\n\nRetain: Payment-account custody, invoice reference and reconciliation.","source_url":"https://ventcrm.com/pricing"},{"id":"payment_states","phase":"payments","title":"Reconcile a corrected or incomplete payment state","source_ids":["product"],"criterion_origin":"proposed_operator_commissioning_workflow","action":"Select a relevant failed, reversed or manually recorded payment path with the operator. Preserve the original event and the correcting event together.","acceptance":"The resulting amount due and customer document match the selected payment history without discarding the original invoice.","retain":"Original payment history, correction and resulting customer document.","depends_on":["stripe"],"default_status":"unreviewed","instruction":"Select a relevant failed, reversed or manually recorded payment path with the operator. Preserve the original event and the correcting event together.\n\nCompleted outcome: The resulting amount due and customer document match the selected payment history without discarding the original invoice.\n\nRetain: Original payment history, correction and resulting customer document.","source_url":"https://ventcrm.com/"},{"id":"self_export","phase":"portability","title":"Receive each promised self-serve export","source_ids":["exit"],"criterion_origin":"proposed_operator_commissioning_workflow","action":"From the selected instance, download the available self-serve entity exports and inventory their columns, counts, timestamps and source view.","acceptance":"The recipient opens the actual files and reconciles the selected pilot records to the operating workspace.","retain":"Export manifest, original files and receiving notes.","depends_on":["booking","payment_states"],"default_status":"unreviewed","instruction":"From the selected instance, download the available self-serve entity exports and inventory their columns, counts, timestamps and source view.\n\nCompleted outcome: The recipient opens the actual files and reconciles the selected pilot records to the operating workspace.\n\nRetain: Export manifest, original files and receiving notes.","source_url":"https://ventcrm.com/cancellation"},{"id":"complete_export","phase":"portability","title":"Account for the full handover scope","source_ids":["exit"],"criterion_origin":"proposed_operator_commissioning_workflow","action":"Build a coverage matrix for every agreed entity, relationship, document and attachment. Mark whether each comes from self-service, a supplied export or another agreed path.","acceptance":"Every item in the selected handover has a real received output or a specifically assigned missing-output action; a smaller CSV set is not labeled complete.","retain":"Coverage matrix, missing-output ownership and received handover.","depends_on":["self_export"],"default_status":"unreviewed","instruction":"Build a coverage matrix for every agreed entity, relationship, document and attachment. Mark whether each comes from self-service, a supplied export or another agreed path.\n\nCompleted outcome: Every item in the selected handover has a real received output or a specifically assigned missing-output action; a smaller CSV set is not labeled complete.\n\nRetain: Coverage matrix, missing-output ownership and received handover.","source_url":"https://ventcrm.com/cancellation"},{"id":"reopen","phase":"portability","title":"Reopen the same records from the delivered files","source_ids":["exit"],"criterion_origin":"proposed_operator_commissioning_workflow","action":"Open the handover in a clean receiving workspace using the agreed destination, retaining original identifiers. Follow one customer's linked job, invoice, payment and communication through the received records.","acceptance":"The recipient can use the delivered information without the originating browser session, and exceptions remain connected to their source.","retain":"Receiving result, relationships and unresolved items.","depends_on":["complete_export"],"default_status":"unreviewed","instruction":"Open the handover in a clean receiving workspace using the agreed destination, retaining original identifiers. Follow one customer's linked job, invoice, payment and communication through the received records.\n\nCompleted outcome: The recipient can use the delivered information without the originating browser session, and exceptions remain connected to their source.\n\nRetain: Receiving result, relationships and unresolved items.","source_url":"https://ventcrm.com/cancellation"},{"id":"exit_plan","phase":"handover","title":"Document the operator's selected exit treatment","source_ids":["exit","terms"],"criterion_origin":"proposed_operator_commissioning_workflow","action":"Record the effective cancellation date, final billing, export destination and any agreed retention. Keep active-system removal and backup expiry as separate fields; preserve unset values when not established.","acceptance":"The plan states what will happen and who owns it using the selected agreement and actual provider information.","retain":"Exit plan, agreement reference and backup-retention source.","depends_on":["complete_export"],"default_status":"unreviewed","instruction":"Record the effective cancellation date, final billing, export destination and any agreed retention. Keep active-system removal and backup expiry as separate fields; preserve unset values when not established.\n\nCompleted outcome: The plan states what will happen and who owns it using the selected agreement and actual provider information.\n\nRetain: Exit plan, agreement reference and backup-retention source.","source_url":"https://ventcrm.com/cancellation"},{"id":"walkthrough","phase":"handover","title":"Let the operator complete the working course","source_ids":["pricing","product"],"criterion_origin":"proposed_operator_commissioning_workflow","action":"Have the operator use the saved pilot on the phone: find today's job, review access notes, continue the visit, invoice, receive a reply and locate its export. Open the same record on desktop.","acceptance":"The operator can resume the saved work through the normal entry points and identify how to obtain support.","retain":"Completed course, usable guide and assigned follow-up work.","depends_on":["technician_access","automation","reopen"],"default_status":"unreviewed","instruction":"Have the operator use the saved pilot on the phone: find today's job, review access notes, continue the visit, invoice, receive a reply and locate its export. Open the same record on desktop.\n\nCompleted outcome: The operator can resume the saved work through the normal entry points and identify how to obtain support.\n\nRetain: Completed course, usable guide and assigned follow-up work.","source_url":"https://ventcrm.com/pricing"},{"id":"publication","phase":"handover","title":"Review the actual operator package","source_ids":["cookies","privacy"],"criterion_origin":"proposed_operator_commissioning_workflow","action":"Review the outgoing guide, selected terms, screenshots and downloadable files as the operator will receive them. Keep private customer data out of the public sandbox and internal delivery destinations out of customer instructions.","acceptance":"The delivered package is readable, current and opens from its actual recipient-facing surface; the public/demo policy scope is not silently applied to the private instance.","retain":"Final package edition, image review and recipient-ready handover.","depends_on":["walkthrough","exit_plan"],"default_status":"unreviewed","instruction":"Review the outgoing guide, selected terms, screenshots and downloadable files as the operator will receive them. Keep private customer data out of the public sandbox and internal delivery destinations out of customer instructions.\n\nCompleted outcome: The delivered package is readable, current and opens from its actual recipient-facing surface; the public/demo policy scope is not silently applied to the private instance.\n\nRetain: Final package edition, image review and recipient-ready handover.","source_url":"https://ventcrm.com/cookies"}]},"guide_markdown":"# VentCRM operator profiles and commissioning desk\n\n## Open the complete package\n\nOpen the original sample.html or paid.html for the researched company profiles. The corresponding CSV and JSON preserve the original published contacts, observations, sources and tailored conversation openings.\n\nOpen sample-commissioning.html or paid-commissioning.html to work with the selected operators. Each is a complete local application. It contains its own source and needs no installation, login or network connection for editing. Source links open the original public websites separately.\n\nThe sample includes one operator. The paid edition includes its five original operators. The two researched replacement candidates remain in the internal source programme. An operator’s actual fleet, current system, data access, budget and interest are established during the conversation; the research profiles describe publicly observed workflows.\n\n## Enter actual programme details\n\nUse Operators to read the original profile and proposed comparison. Enter your name at the top before recording changes.\n\nIn Setup, enter the agreed service scope, original system, operating timezone, cutover plan and business choices. Unknown values remain blank. Record the selected commercial agreement separately from the current published reference. As retrieved on October 13, 2026, VentCRM advertises USD750 setup and USD129 monthly, with messaging and card processing separate. The selected operator agreement determines the programme.\n\nIn Records, retain the actual original-file register, field and relationship mappings, received export list, account custody and assigned follow-up work. Store nonsecret references and received-file locations. Keep passwords, API keys, payment card data and unrelated customer information in their established systems. Rows can be edited or removed; the complete working history preserves their earlier values.\n\nSource files should record their actual name, entity, count and SHA-256 when available. Mappings identify how each source field is mapped, retained or excluded. Export rows distinguish self-serve output from the wider agreed handover. Give unresolved work an owner and concrete output. Mark it done only after that output exists.\n\n## Complete one continuous operating course\n\nThe Acceptance section contains 24 source-linked operating steps. They cover the selected scope and terms; source receiving, mapping, reconciliation and cutover; owner and technician access; booking, messages and payments; and the complete export and handover. Use one authorized pilot from intake through its final received records. Each step includes its intended outcome and the output to retain.\n\nRecord the actual observed result and the person doing the work. Choose Not applicable only with the agreed scope reason. A passed source, mapping or custody step needs its corresponding working register. Self-serve and full-handover export steps require their respective received output routes.\n\nThe current public policy pages show published draft notices dated August 13, 2026. Keep those source versions distinct from the agreement selected for the private operator instance. Self-serve CSV is described for clients, invoices, leads and Stripe payouts; the wider cancellation handover names additional records and relationships. Record actual received coverage rather than assuming all entities are in an ordinary CSV.\n\n## Save, reopen and hand over\n\nWorking changes are saved in this browser when local storage is available. Use Save working JSON before closing or moving machines. The downloaded file contains the full source selection, all entered setup and registers, every check and decision, and the complete operation history.\n\nOpen working JSON receives that complete document, verifies its checksum and replays its history before replacing the local copy. A selected sample or paid desk accepts only the same selected research source. The empty general desk can open either complete programme.\n\nThe Handover section shows unfinished setup, mismatched migration counts and open work. Once the programme is complete, record the actual acceptance decision. Changing setup or registers resets its checks for review; editing a check reopens acceptance. Earlier values remain in the saved history. A second browser tab cannot silently overwrite a newer local copy.\n\nDownload the complete check register CSV and handover HTML for the receiving operator. The HTML includes source research, entered setup, every working register, results and the acceptance decision. The working JSON is the editable source.\n\n## Initial state and receiving\n\nThe supplied working JSON starts with blank operator-entered values and unreviewed checks. Open it in its accompanying desk to begin. Keep a downloaded original before working. Exercise your first edits in a separate copy if you are learning the interface.\n\nBefore handing over, open the exact selected HTML and all its accompanying CSV, JSON and guide files. Use both a desktop and a narrow phone view; save, reopen, edit and download the real outputs. Review the received records and source links together with the operator.\n\n## Source register\n\n- Product tour and operator FAQ: https://ventcrm.com/ — current product page; retrieved 2026-10-13.\n- Pricing and setup: https://ventcrm.com/pricing — current product page; retrieved 2026-10-13.\n- Jobber migration and cutover: https://ventcrm.com/jobber-alternative — current product page; retrieved 2026-10-13.\n- Privacy policy: https://ventcrm.com/privacy — published draft; retrieved 2026-10-13.\n- SMS policy: https://ventcrm.com/sms-policy — published draft; retrieved 2026-10-13.\n- Terms of service: https://ventcrm.com/terms — published draft; retrieved 2026-10-13.\n- Cancellation and data export: https://ventcrm.com/cancellation — published draft; retrieved 2026-10-13.\n- Acceptable use: https://ventcrm.com/acceptable-use — published draft; retrieved 2026-10-13.\n- Cookie policy: http  function setup(){const o=operator();if(!o)return empty();return '<h1>'+esc(source().company)+' — setup</h1><p>Record confirmed scope, source counts and operating choices. Unknown values stay blank. Changing setup resets its checks for review and reopens a previous acceptance. Earlier observations remain in the full working history.</p><form id="facts-form"><div class="fields">'+engine.fields.map(k=>{const small=['fleet','target_date','customers_expected','customers_received','jobs_expected','jobs_received','invoices_expected','invoices_received'].includes(k);return '<label>'+esc(labels[k])+(small?'<input name="'+k+'" '+(k==='target_date'?'type="date"':'inputmode="numeric"')+' value="'+esc(o.facts[k])+'">':'<textarea name="'+k+'" rows="'+(['notes','migration_scope','rollback_plan'].includes(k)?4:2)+'">'+esc(o.facts[k])+'</textarea>')+'</label>';}).join('')+'</div><button type="submit">Save complete setup</button></form>';}
 
 const registerTitles={files:'Original source files',mappings:'Field and relationship mapping',exports:'Received exports and handover',open_work:'Assigned open work',custody:'Account custody'};
 const fieldTitle=k=>({source_field:'Source field',target_field:'Destination field',source_date:'Source date',file_ref:'Received file reference',sha256:'SHA-256',rows:'Record count',keys:'Relationship keys',reference:'Nonsecret account / instance reference'}[k]||k.replace(/_/g,' ').replace(/^./,x=>x.toUpperCase()));
 function records(){
  const o=operator();if(!o)return empty();const keys=engine.registers[register],row=editingRow?o.registers[register].find(x=>x.id===editingRow):null;
  return '<h1>'+esc(source().company)+' — working records</h1><p>Retain source file identities, actual mapping decisions, received exports and assigned follow-up work. Each edit is preserved in the complete programme history and resets affected programme review.</p><label>Register<select id="register-select">'+Object.entries(registerTitles).map(([k,v])=>'<option value="'+k+'" '+(k===register?'selected':'')+'>'+v+'</option>').join('')+'</select></label><section><h2>'+(row?'Edit record':'Add record')+'</h2><form id="register-form"><div class="fields">'+keys.map(k=>{const v=row?.[k]||'',options=k==='decision'?['mapped','retained','excluded']:k==='route'?['self_serve','full_handover']:k==='status'?['open','done']:null;return '<label>'+esc(fieldTitle(k))+(options?'<select name="'+k+'">'+options.map(s=>'<option value="'+s+'" '+(v===s?'selected':'')+'>'+esc(s.replace(/_/g,' '))+'</option>').join('')+'</select>':'<textarea name="'+k+'" rows="'+(['note','output','transform','recovery'].includes(k)?3:2)+'">'+esc(v)+'</textarea>')+'</label>';}).join('')+'</div><button type="submit">'+(row?'Save record':'Add record')+'</button>'+(row?'<button type="button" data-action="cancel-row">Cancel edit</button>':'')+'</form></section><section><h2>'+esc(registerTitles[register])+' ('+o.registers[register].length+')</h2>'+(o.registers[register].length?o.registers[register].map(r=>'<article><dl>'+keys.map(k=>'<dt>'+esc(fieldTitle(k))+'</dt><dd>'+paragraphs(r[k]||'Not entered')+'</dd>').join('')+'</dl><button data-edit-row="'+esc(r.id)+'">Edit record</button> <button data-remove-row="'+esc(r.id)+'">Remove record</button></article>').join(''):'<p>No records entered.</p>')+'</section>';
 }

 function checks(){const o=operator();if(!o)return empty();return '<h1>'+esc(source().company)+' — acceptance checks</h1><p>Use the actual selected product and authorized operator data. Record the observed result or a specific reason when a check does not apply.</p>'+state.seed.criteria.map(c=>{const r=o.checks[c.id];return '<article><h2>'+esc(c.title)+'</h2>'+paragraphs(c.instruction)+'<p class="small"><a href="'+esc(c.source_url)+'" target="_blank" rel="noopener noreferrer">Published product source</a></p><form data-check="'+esc(c.id)+'"><label>Result<select name="status">'+[['unreviewed','Unreviewed'],['pass','Pass'],['follow_up','Follow up'],['fail','Fail'],['not_applicable','Not applicable — reason recorded']].map(([v,l])=>'<option value="'+v+'" '+(v===r.status?'selected':'')+'>'+l+'</option>').join('')+'</select></label><label>Observed result / retained output / reason<textarea name="evidence" rows="3">'+esc(r.evidence)+'</textarea></label><p class="muted">'+(r.checked_at?'Last recorded by '+esc(r.reviewer)+' at '+esc(r.checked_at):'No review has been recorded.')+'</p><button type="submit">Save this check</button></form></article>';}).join('');}
 function empty(){return '<h1>Open a programme</h1><p>Use Open working JSON to receive a complete saved programme. The operating guide is available before a programme is opened.</p>';}
 function handover(){const o=operator();if(!o)return empty();const r=engine.readiness(state,o.id);return '<h1>'+esc(source().company)+' — handover</h1><section><h2>Readiness</h2><p>'+esc(summary(o))+'</p>'+(['outstanding','missing','countDifferences','openWork'].map(k=>r[k].length?'<h3>'+({outstanding:'Checks to complete',missing:'Setup values to complete',countDifferences:'Migration count differences',openWork:'Assigned work to complete'}[k])+'</h3><ul>'+r[k].map(v=>'<li>'+esc(labels[v]||v)+'</li>').join('')+'</ul>':'').join(''))+(o.acceptance?'<h3>Recorded acceptance</h3>'+paragraphs(o.acceptance.summary)+'<p>'+esc(o.acceptance.by)+' · '+esc(o.acceptance.at)+' · revision '+o.acceptance.revision+'</p><form id="reopen-form"><label>Reason to reopen<textarea name="reason" required></textarea></label><button>Reopen this programme</button></form>':'<form id="accept-form"><label>Acceptance decision<textarea name="summary" required placeholder="Record the accepted scope, remaining agreed exclusions and handover decision."></textarea></label><button '+(!r.ready?'disabled':'')+'>Record acceptance</button></form>')+'</section><section><h2>Complete working outputs</h2><p>The JSON retains every selected operator, setup field, check, decision and operation. The CSV and HTML report are readable handover views.</p><div class="actions"><button data-action="json">Download working JSON</button><button data-action="csv">Download check register CSV</button><button data-action="report">Download complete handover HTML</button></div></section><section><h2>Recent operations</h2><ol>'+state.history.filter(e=>e.operator_id===selected).slice(-15).reverse().map(e=>'<li>'+esc(e.at)+' — '+esc(e.kind)+' — '+esc(e.by)+'</li>').join('')+'</ol></section>';}
 function guide(){return '<h1>Operating guide</h1>'+boot.guide_html+'<button data-action="guide">Download the complete guide</button>';}
 function report(){
  const body=state.seed.operators.map(s=>{const o=state.operators.find(x=>x.id===s.id);return '<article><h2>'+esc(s.company)+'</h2><p>'+esc(summary(o))+'</p><h3>Published workflow</h3>'+paragraphs(s.observed)+links(s.sources)+'<h3>Entered setup</h3><dl>'+engine.fields.map(k=>'<dt>'+esc(labels[k])+'</dt><dd>'+paragraphs(o.facts[k]||'Not entered')+'</dd>').join('')+'</dl><h3>Working registers</h3>'+Object.entries(engine.registers).map(([key,fields])=>'<h4>'+esc(registerTitles[key])+'</h4>'+o.registers[key].map(row=>'<dl>'+fields.map(f=>'<dt>'+esc(fieldTitle(f))+'</dt><dd>'+paragraphs(row[f]||'Not entered')+'</dd>').join('')+'</dl>').join('')).join('')+'<h3>Acceptance checks</h3>'+state.seed.criteria.map(c=>{const r=o.checks[c.id];return '<section><h4>'+esc(c.title)+' — '+esc(r.status)+'</h4>'+paragraphs(r.evidence||'No result recorded')+'<p>'+esc(r.reviewer)+' '+esc(r.checked_at)+'</p></section>';}).join('')+(o.acceptance?'<h3>Acceptance</h3>'+paragraphs(o.acceptance.summary)+'<p>'+esc(o.acceptance.by)+' '+esc(o.acceptance.at)+'</p>':'')+'</article>';}).join('');
  return '<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Commissioning handover</title><style>'+document.getElementById('programme-styles').textContent+'</style><main><h1>'+esc(state.seed.title)+' — handover</h1><p>Working revision '+state.revision+' · Generated '+esc(new Date().toISOString())+'</p>'+body+'</main></html>';
 }
 function render(){
  const nav=[['operators','Operators'],['setup','Setup'],['records','Records'],['checks','Acceptance'],['handover','Handover'],['guide','Guide']];
  $('#app').innerHTML='<header><div class="brand">VentCRM commissioning desk</div><p class="muted">'+esc(state.seed.title)+'</p><div class="toolbar"><label>Operator<select id="operator-select">'+state.seed.operators.map(s=>'<option value="'+esc(s.id)+'" '+(s.id===selected?'selected':'')+'>'+esc(s.company)+'</option>').join('')+'</select></label><label>Person recording changes<input id="reviewer" value="'+esc(reviewer)+'" autocomplete="name" placeholder="Your name"></label><button data-action="json">Save working JSON</button><label class="file-button">Open working JSON<input id="open-file" type="file" accept=".json,application/json"></label></div><nav aria-label="Programme sections">'+nav.map(([v,l])=>'<button data-tab="'+v+'" aria-current="'+(v===tab?'page':'false')+'">'+l+'</button>').join('')+'</nav></header><div id="status" role="status" class="status">'+esc(saveWarning||notice||'Original research loaded. Enter actual programme details to begin.')+'</div>'+ (pending?'<section class="import"><h2>Open saved programme</h2><p>'+esc(pending.seed.title)+' · '+pending.operators.length+' operators · revision '+pending.revision+'. This replaces the local working copy in this browser.</p><button data-action="confirm-import">Open this complete working copy</button><button data-action="cancel-import">Cancel</button></section>':'')+'<main>'+({operators,setup,records,checks,handover,guide}[tab]())+'</main><footer>Revision '+state.revision+' · Work is saved in this browser when available. Download working JSON for a durable copy.</footer>';
  document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{reviewer=$('#reviewer').value;tab=b.dataset.tab;notice='';render();window.scrollTo(0,0);});
  $('#reviewer').oninput=e=>reviewer=e.target.value;
  $('#operator-select').onchange=e=>{selected=e.target.value;render();};
  document.querySelectorAll('[data-operator]').forEach(b=>b.onclick=()=>{selected=b.dataset.operator;tab='setup';render();window.scrollTo(0,0);});
  const form=$('#facts-form');if(form)form.onsubmit=e=>{e.preventDefault();safe(()=>act({kind:'facts-save',facts:Object.fromEntries(engine.fields.map(k=>[k,form.elements[k].value]))}));};
  document.querySelectorAll('[data-check]').forEach(f=>f.onsubmit=e=>{e.preventDefault();safe(()=>act({kind:'check-save',check_id:f.dataset.check,status:f.elements.status.value,evidence:f.elements.evidence.value}));});
  const reg=$('#register-select');if(reg)reg.onchange=e=>{register=e.target.value;editingRow=null;render();};
  const rf=$('#register-form');if(rf)rf.onsubmit=e=>{e.preventDefault();safe(()=>{const row={id:editingRow||('row-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,7)),...Object.fromEntries(engine.registers[register].map(k=>[k,rf.elements[k].value]))};const rows=operator().registers[register].filter(x=>x.id!==row.id);rows.push(row);editingRow=null;act({kind:'register-save',register,rows});});};
  document.querySelectorAll('[data-edit-row]').forEach(b=>b.onclick=()=>{editingRow=b.dataset.editRow;render();window.scrollTo(0,0);});
  document.querySelectorAll('[data-remove-row]').forEach(b=>b.onclick=()=>safe(()=>{const row=operator().registers[register].find(x=>x.id===b.dataset.removeRow);if(confirm('Remove this record? Its earlier values remain in the complete operation history.')){editingRow=null;act({kind:'register-save',register,rows:operator().registers[register].filter(x=>x.id!==row.id)});}}));
  const accept=$('#accept-form');if(accept)accept.onsubmit=e=>{e.preventDefault();safe(()=>act({kind:'accept',summary:accept.elements.summary.value}));};
  const reopen=$('#reopen-form');if(reopen)reopen.onsubmit=e=>{e.preventDefault();safe(()=>act({kind:'reopen',reason:reopen.elements.reason.value}));};
  document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>safe(()=>{const a=b.dataset.action;if(a==='cancel-row'){editingRow=null;render();}else if(a==='json')download('commissioning-working.json',JSON.stringify(engine.receive(state),null,2)+'\n');else if(a==='csv')download('commissioning-checks.csv',engine.csv(state),'text/csv;charset=utf-8');else if(a==='report')download('commissioning-handover.html',report(),'text/html;charset=utf-8');else if(a==='guide')download('START-HERE.md',boot.guide_markdown,'text/markdown;charset=utf-8');else if(a==='cancel-import'){pending=null;render();}else if(a==='confirm-import'){save(pending);pending=null;selected=state.seed.operators[0]?.id||'';notice='Complete working programme reopened.';render();}}));
  $('#open-file').onchange=e=>safeAsync(async()=>{const f=e.target.files[0];if(!f)return;if(f.size>5000000)throw Error('Choose a working JSON smaller than 5 MB.');const received=engine.receive(JSON.parse(await f.text()));if(boot.seed.operators.length&&received.seed_sha256!==engine.hash(boot.seed))throw Error('This working file belongs to another selected customer programme. Open it in its original commissioning desk.');pending=received;render();});
 }
 function safe(fn){try{fn();}catch(e){notice=e.message;$('#status').textContent=e.message;$('#status').focus();}}
 async function safeAsync(fn){try{await fn();}catch(e){notice=e.message;$('#status').textContent=e.message;}}
 window.ventcrmProgramme={read:()=>engine.receive(state)};
 render();
})();
</script></body></html>
