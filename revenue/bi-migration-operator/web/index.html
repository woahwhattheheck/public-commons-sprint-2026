<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Commons BI Operator</title><link rel="stylesheet" href="/style.css"><script src="/report-server.js" defer></script><script src="/app.js" defer></script></head>
<body>
<aside><div class="brand">COMMONS<span>BI migration &amp; support</span></div><nav aria-label="Workspace sections">
<button data-tab="inventory" class="active">Inventory</button><button data-tab="migration">Migration plans</button>
<button data-tab="data">Data &amp; corrections</button><button data-tab="compare">Output comparison</button>
<button data-tab="server">Report Server</button><button data-tab="capture">Power BI capture</button><button data-tab="rollout">Rollout &amp; rollback</button>

<dialog id="inspector"><div class="dialog-head"><h2 id="inspect-title">Record</h2><button id="close-inspector">Close</button></div><pre id="inspect-content"></pre></dialog>
