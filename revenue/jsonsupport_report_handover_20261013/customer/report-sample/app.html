en app.html in a modern browser. The free edition contains SmoothWork. The paid edition contains the five original additional agency profiles. Each edition keeps its own complete working file and browser storage. Original research, contact routes and source URLs remain attached to each agency.\n\n1. SELECT THE ACTUAL REPORT\nUse Agency context to review the agency's current workflow. In Report setup, enter the actual client, reporting system, operator, recipient and cadence. Choose the route you intend to operate: browser converter, authenticated API or configured email webhook. Keep the report's existing formulas, transformations and delivery arrangements in the source process.\n\n2. PREPARE A REPRESENTATIVE SAMPLE\nPaste or open up to 1 MiB of JSON or JSON Lines. For JSON, a blank records pointer selects the whole value; /records selects a records array. A single selected object becomes one row. JSON Lines treats each nonempty line as one object.\n\nEnter explicit output headings and JSON pointers. /customer/name selects a nested property. Escape ~ as ~0 and / as ~1 inside property names. Use text for references such as 00017. Number accepts finite values within JavaScript's exact integer range. Unsafe integers and nonfinite values are rejected with a correction prompt; quote identifiers and precise decimal values in the source and keep them as text. Date requires an actual YYYY-MM-DD calendar date. JSON serializes an object/list into text. Preserve retains the selected JSON value. Missing optional values become null.\n\nPreview the current fields and resolve every required-field/type issue. Preview shows the first 25 rows; output files retain all mapped rows. The desk allows at most 20,000 sample records, 128 columns and 200,000 selected cells. These are preparation-desk limits, not statements of a vendor account's limits.\n\n3. SAVE AND OPERATE THE SELECTED ROUTE\nSave report. Conversion and results provides the exact documented API request, { \"data\": [ mapped records ] }, and a local review CSV. The review CSV protects spreadsheet formula-like strings with a leading apostrophe. The API request retains the original mapped values.\n\nFor an authenticated conversion, use the included conversion-adapter.mjs and its full operator guide with Node 22+. Credentials come from your existing terminal environment. The adapter makes the explicitly selected request, saves the complete returned output and records its operation. Read its --help and included guide before invoking it.\n\nFor JSON Support's browser converter or a configured email webhook, use the actual vendor account and agreed recipient. The browser route and service routes have different data-processing contexts. Review the current vendor documentation and privacy terms for the selected route. The desk itself stores data only in its browser session or the working files you download.\n\nCurrent source reviewed 13 October 2026:\nhttps://www.jsonsupport.com/\nhttps://www.jsonsupport.com/developers.html\nhttps://www.jsonsupport.com/privacy.html\nThe developer page describes forward JSON-to-XLSX and reverse XLSX/CSV-to-JSON endpoints, x-api-key authentication and a Pro inbound email webhook. Confirm current account entitlements, limits and pricing in the actual account when commissioning a workflow.\n\n4. INSPECT AND RECORD THE ACTUAL RESULT\nOpen the returned workbook with the intended spreadsheet software and inspect headers, identifiers, dates, numeric values, row totals and delivery. Record the actual output filename, observed rows, time and decision. Enter factual notes about the operation and the remaining changes.\n\nFor an actual reverse-conversion response, paste the raw array of records or the vendor's {data:[…]} JSON response. Compare returned JSON checks all row positions, field names, values and types against the saved mapped sample. It shows up to 50 differing rows while counting the full difference. It is an exact structured-data comparison; use the workbook inspection for formatting, formulas and spreadsheet behavior.\n\nA changed report configuration or source marks earlier results as belonging to an earlier report. Their original notes stay in the complete working file.\n\n5. HAND OVER AND CONTINUE\nSave a named handover after the report sample is valid. Each handover retains its full configuration, original sample, selected columns and all prepared rows. Download its full JSON and readable HTML report. Later edits preserve earlier handovers.\n\nDownload the complete working file after meaningful edits. It contains original research, every agency project, saved proposal history, actual result notes and named handovers. Open working file verifies the original edition and complete operation history before receiving it. The complete saved working file is limited to 20 MiB. A change that would exceed that full export size is refused before saving. Download the current complete copy, then open the original working.json from the selected edition to begin another report with a smaller representative sample; the downloaded earlier copy remains available.\n\nThe application uses browser storage when available. Session mode keeps all functionality available when storage is denied or full; download the working file before closing that session. A stale tab refuses to overwrite a newer browser copy. Use Reopen browser copy to continue the latest saved copy. Unsaved form changes require an explicit discard before switching agency or section.\n\nCOMPLETE SOURCE\nDownload application source supplies every file required to rebuild this same edition, its opening working file, complete model, renderer, adapter and guides. Use the included rebuild.cjs under Node 22+:\nnode rebuild.cjs --source report-sample/application-source.json --output-dir ./received-report-app\nChoose the source path from the selected edition and an absent output directory. This receives every complete source file and rebuilds app.html in that new directory. The complete customer ZIP also retains all original agency HTML/CSV/JSON profiles and instructions.\n","bytes":6152,"sha256":"403116e438e5fc9d3a93c824f26ac04390a25cfb145b2a13dfc836fdfa7e5e03"},{"path":"rebuild.cjs","content":"#!/usr/bin/env node\n\"use strict\";\nconst fs=require(\"node:fs\"),path=require(\"node:path\"),crypto=require(\"node:crypto\");\nfunction args(argv){const a={};for(let i=0;i\u003cargv.length;i++){if(![\"--source\",\"--output-dir\"].includes(argv[i])||!argv[i+1]||a[argv[i]])throw Error(\"Use --source application-source.json --output-dir NEW_DIRECTORY\");a[argv[i]]=argv[++i];}if(!a[\"--source\"]||!a[\"--output-dir\"])throw Error(\"Use --source application-source.json --output-dir NEW_DIRECTORY\");return a;}\nfunction rebuild(argv){\n const a=args(argv),input=path.resolve(a[\"--source\"]),out=path.resolve(a[\"--output-dir\"]);if(fs.existsSync(out))throw Error(\"Choose a new receiving directory.\");if(!fs.statSync(path.dirname(out)).isDirectory())throw Error(\"The output parent must already exist.\");\n const raw=fs.readFileSync(input,\"utf8\");if(Buffer.byteLength(raw)>8*1024*1024)throw Error(\"Application source exceeds 8 MiB.\");const source=JSON.parse(raw);\n if(source.schema!==\"jsonsupport.report-application-source.v1\"||!Array.isArray(source.files)||source.files.length\u003c7)throw Error(\"Open the complete original application source.\");\n const names=new Set();for(const f of source.files){if(typeof f.path!==\"string\"||f.path.includes(\"\\\\\")||f.path.includes(\":\")||f.path.split(\"/\").some(x=>x===\"..\"||x===\".\"||x===\"\")||path.isAbsolute(f.path)||names.has(f.path)||typeof f.content!==\"string\")throw Error(\"Invalid or duplicate source path.\");names.add(f.path);const b=Buffer.from(f.content,\"utf8\");if(b.length!==f.bytes||crypto.createHash(\"sha256\").update(b).digest(\"hex\")!==f.sha256)throw Error(\"Complete source differs: \"+f.path);}\n for(const required of [\"desk/report-core.cjs\",\"desk/report-view.cjs\",\"runtime/host/connected_sha256.cjs\",\"desk/README.txt\",\"initial-working.json\",\"conversion-adapter.mjs\",\"CONVERSION-ADAPTER.md\",\"conversion-return-contract.json\"])if(!names.has(required))throw Error(\"Complete application source is missing \"+required);\n if(names.has(\"application-source.json\")||names.has(\"app.html\"))throw Error(\"Reserved output names appear in the source.\");\n fs.mkdirSync(out,{mode:0o700});for(const f of source.files){const target=path.join(out,f.path);fs.mkdirSync(path.dirname(target),{recursive:true,mode:0o700});fs.writeFileSync(target,f.content,{flag:\"wx\",mode:0o600});}fs.writeFileSync(path.join(out,\"application-source.json\"),raw,{flag:\"wx\",mode:0o600});\n const read=p=>fs.readFileSync(path.join(out,p),\"utf8\"),api=require(path.join(out,\"desk/report-core.cjs\")),view=require(path.join(out,\"desk/report-view.cjs\")),sha=require(path.join(out,\"runtime/host/connected_sha256.cjs\"));\n const workspace=api.receiveWorking(read(\"initial-working.json\")),html=view.reportHtml({workspace,coreSource:read(\"desk/report-core.cjs\"),shaSource:read(\"runtime/host/connected_sha256.cjs\"),sourceFiles:source.files,guide:read(\"desk/README.txt\")});\n fs.writeFileSync(path.join(out,\"app.html\"),html,{flag:\"wx\",mode:0o600});return{output:out,app:path.join(out,\"app.html\"),files:source.files.length,...sha.sha256Utf8(html)};\n}\nif(require.main===module){try{process.stdout.write(JSON.stringify(rebuild(process.argv.slice(2)))+\"\\n\");}catch(e){process.stderr.write(e.message+\"\\n\");process.exitCode=1;}}\nmodule.exports={rebuild};\n","bytes":3197,"sha256":"8247a76ad55d00abb2fa3216e4739e41a73309e056b733921a2f124c01ee0405"},{"path":"conversion-adapter.mjs","content":"#!/usr/bin/env node\nimport { promises as fs } from 'node:fs';\nimport path from 'node:path';\nimport { createHash, randomUUID } from 'node:crypto';\nimport { pathToFileURL } from 'node:url';\nimport { inflateRawSync } from 'node:zlib';\n\nconst ORIGIN = 'https://veqix61rpf.execute-api.us-east-1.amazonaws.com';\nconst CONTRACT = 'https://www.jsonsupport.com/developers.html';\nconst RESERVED = new Set(['operation.json', 'request.json', 'original-input.json', 'original-input.csv', 'original-input.xlsx', 'response-error.txt']);\nconst MIME_XLSX = 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet';\nconst sha = bytes => createHash('sha256').update(bytes).digest('hex');\nconst utf8 = bytes => new TextDecoder('utf-8', { fatal: true, ignoreBOM: true }).decode(bytes);\nconst now = () => new Date().toISOString();\nconst plainObject = value => value !== null && typeof value === 'object' && !Array.isArray(value);\nconst recordArray = value => Array.isArray(value) && value.every(plainObject);\n\nexport function help() {\n  return [\n    'JSON Support conversion adapter — Node 22+',\n    '',\n    'node conversion-adapter.mjs to-xlsx --input records.json --output-dir NEW_DIRECTORY',\n    '  [--input-shape records|envelope] [--output-name converted.xlsx]',\n    'node conversion-adapter.mjs to-json --format xlsx|csv --input source.xlsx --output-dir NEW_DIRECTORY',\n    '  [--output-name converted.json]',\n    '',\n    'Both commands: [--timeout-seconds 180] [--max-input-mib 32] [--max-response-mib 64]',\n    'Set JSON_SUPPORT_API_KEY in the environment through your existing secret manager.',\n    'The directory must not exist. One request is sent; no retries or redirects.',\n    'Original bytes, exact request, output and operation.json are retained in that directory.',\n    'records accepts an array of objects or one object. envelope accepts only {\"data\":[...]}',\n    'Exit 0: validated conversion saved. Exit 1: failed or uncertain, inspect operation.json.',\n    'Exit 2: local arguments/input/configuration failed before the request.',\n    '',\n    'These commands send the input to the vendor API. The separate browser converter is local.',\n    'Published contract: ' + CONTRACT\n  ].join('\\n');\n}\n\nexport function parseArgs(argv) {\n  if (argv.length === 0 || argv.includes('--help') || argv[0] === 'help') return { help: true };\n  const direction = argv[0];\n  if (!['to-xlsx', 'to-json'].includes(direction)) throw new Error('Choose to-xlsx or to-json.');\n  const allowed = new Set(['input', 'output-dir', 'output-name', 'input-shape', 'format', 'timeout-seconds', 'max-input-mib', 'max-response-mib']);\n  const flags = {};\n  for (let i = 1; i \u003c argv.length; i += 2) {\n    const name = argv[i];\n    if (!name?.startsWith('--') || !allowed.has(name.slice(2)) || argv[i + 1] === undefined || argv[i + 1].startsWith('--')) throw new Error('Unknown option or missing value; use --help.');\n    const key = name.slice(2);\n    if (Object.hasOwn(flags, key)) throw new Error('Duplicate option: --' + key);\n    flags[key] = argv[i + 1];\n  }\n  if (!flags.input || !flags['output-dir']) throw new Error('--input and --output-dir are required.');\n  if (direction === 'to-xlsx' && flags.format) throw new Error('to-xlsx reads JSON; use --input-shape for records or envelope.');\n  if (direction === 'to-json' && flags['input-shape']) throw new Error('--input-shape applies only to to-xlsx.');\n  const format = direction === 'to-xlsx' ? 'json' : flags.format;\n  if (!['json', 'xlsx', 'csv'].includes(format) || (direction === 'to-json' && format === 'json')) throw new Error('to-json requires --format xlsx or --format csv.');\n  const inputShape = flags['input-shape'] || 'records';\n  if (!['records', 'envelope'].includes(inputShape)) throw new Error('--input-shape must be records or envelope.');\n  const outputName = flags['output-name'] || (direction === 'to-xlsx' ? 'converted.xlsx' : 'converted.json');\n  const wantedExt = direction === 'to-xlsx' ? '.xlsx' : '.json';\n  if (!/^[A-Za-z0-9][A-Za-z0-9._-]{0,159}$/.test(outputName) || !outputName.toLowerCase().endsWith(wantedExt) || RESERVED.has(outputName.toLowerCase())) throw new Error('--output-name must be a simple new ' + wantedExt + ' filename and must not use a reserved source/result name.');\n  const positive = (name, fallback) => {\n    const n = Number(flags[name] ?? fallback);\n    if (!Number.isFinite(n) || n \u003c= 0) throw new Error('--' + name + ' must be a positive number.');\n    return n;\n  };\n  const timeoutMs = Math.ceil(positive('timeout-seconds', 180) * 1000);\n  const maxInputBytes = Math.floor(positive('max-input-mib', 32) * 1024 * 1024);\n  const maxResponseBytes = Math.floor(positive('max-response-mib', 64) * 1024 * 1024);\n  if (![timeoutMs, maxInputBytes, maxResponseBytes].every(Number.isSafeInteger) || timeoutMs > 2147483647 || maxInputBytes \u003c 1 || maxResponseBytes \u003c 1) throw new Error('Local limits are outside the supported numeric range.');\n  return { direction, format, inputShape, input: flags.input, outputDir: flags['output-dir'], outputName, timeoutMs, maxInputBytes, maxResponseBytes };\n}\n\nexport function buildRequest(options, bytes) {\n  if (options.direction === 'to-xlsx') {\n    // Parse for shape only. Embed original text to preserve large integers and decimals.\n    let text = utf8(bytes);\n    if (text.charCodeAt(0) === 0xfeff) text = text.slice(1);\n    let value;\n    try { value = JSON.parse(text); } catch { throw new Error('Input is not valid JSON. The original file is unchanged.'); }\n    let body;\n    if (options.inputShape === 'envelope') {\n      if (!plainObject(value) || Object.keys(value).length !== 1 || !recordArray(value.data)) throw new Error('Envelope input must contain only data: an array of objects.');\n      body = text;\n    } else {\n      if (!plainObject(value) && !recordArray(value)) throw new Error('Records input must be one JSON object or an array of objects.');\n      body = '{\"data\":' + (Array.isArray(value) ? text : '[' + text + ']') + '}';\n    }\n    return { url: ORIGIN + '/dev/v1/convert', body: Buffer.from(body, 'utf8'), inputRows: Array.isArray(value) ? value.length : options.inputShape === 'envelope' ? value.data.length : 1 };\n  }\n  if (options.format === 'xlsx') assertXlsx(bytes, options.maxInputBytes);\n  const file = options.format === 'xlsx' ? bytes.toString('base64') : utf8(bytes);\n  return { url: ORIGIN + '/dev/v1/excel-to-json', body: Buffer.from(JSON.stringify({ format: options.format, file }), 'utf8'), inputRows: null };\n}\n\nfunction crc32(bytes) {\n  let value = 0xffffffff;\n  for (const byte of bytes) {\n    value ^= byte;\n    for (let bit = 0; bit \u003c 8; bit++) value = (value >>> 1) ^ (0xedb88320 & -(value & 1));\n  }\n  return (value ^ 0xffffffff) >>> 0;\n}\n\nexport function assertXlsx(bytes, maxXmlBytes = 64 * 1024 * 1024) {\n  if (bytes.length \u003c 22) throw new Error('XLSX response/input is not a complete ZIP workbook.');\n  let eocd = -1;\n  for (let i = bytes.length - 22; i >= Math.max(0, bytes.length - 65557); i--) {\n    if (bytes.readUInt32LE(i) === 0x06054b50 && i + 22 + bytes.readUInt16LE(i + 20) === bytes.length) { eocd = i; break; }\n  }\n  if (eocd \u003c 0 || bytes.readUInt16LE(eocd + 4) !== 0 || bytes.readUInt16LE(eocd + 6) !== 0) throw new Error('XLSX must be a complete single-disk ZIP workbook.');\n  const entries = bytes.readUInt16LE(eocd + 10);\n  const directorySize = bytes.readUInt32LE(eocd + 12);\n  let at = bytes.readUInt32LE(eocd + 16);\n  const directoryStart = at;\n  if (entries === 0xffff || directorySize === 0xffffffff || at === 0xffffffff) throw new Error('ZIP64 workbook is not supported by this local adapter.');\n  if (bytes.readUInt16LE(eocd + 8) !== entries || at + directorySize !== eocd) throw new Error('XLSX central directory is incomplete.');\n  const end = at + directorySize, members = new Map(), extents = [];\n  for (let i = 0; i \u003c entries; i++) {\n    if (at + 46 > end || bytes.readUInt32LE(at) !== 0x02014b50) throw new Error('Invalid XLSX central directory entry.');\n    const flags = bytes.readUInt16LE(at + 8), method = bytes.readUInt16LE(at + 10);\n    const crc = bytes.readUInt32LE(at + 16), compressedSize = bytes.readUInt32LE(at + 20), size = bytes.readUInt32LE(at + 24);\n    const nameLength = bytes.readUInt16LE(at + 28), extraLength = bytes.readUInt16LE(at + 30), commentLength = bytes.readUInt16LE(at + 32);\n    const local = bytes.readUInt32LE(at + 42), next = at + 46 + nameLength + extraLength + commentLength;\n    if (next > end || bytes.readUInt16LE(at + 34) !== 0) throw new Error('Truncated or multi-disk XLSX member.');\n    const nameBytes = bytes.subarray(at + 46, at + 46 + nameLength), name = nameBytes.toString('utf8');\n    if (members.has(name)) throw new Error('Duplicate XLSX archive member.');\n    if (flags & 1) throw new Error('Encrypted workbook is not accepted.');\n    if ([compressedSize, size, local].includes(0xffffffff)) throw new Error('ZIP64 workbook is not supported by this local adapter.');\n    if (local + 30 > directoryStart || bytes.readUInt32LE(local) !== 0x04034b50) throw new Error('XLSX member has no actual local header.');\n    const localFlags = bytes.readUInt16LE(local + 6), localMethod = bytes.readUInt16LE(local + 8);\n    const localNameLength = bytes.readUInt16LE(local + 26), localExtraLength = bytes.readUInt16LE(local + 28);\n    const dataStart = local + 30 + localNameLength + localExtraLength, dataEnd = dataStart + compressedSize;\n    if (dataStart > directoryStart || dataEnd > directoryStart || localFlags !== flags || localMethod !== method) throw new Error('XLSX member data/header does not match its directory.');\n    if (!bytes.subarray(local + 30, local + 30 + localNameLength).equals(nameBytes)) throw new Error('XLSX member names differ between headers.');\n    if (!(flags & 8) && (bytes.readUInt32LE(local + 14) !== crc || bytes.readUInt32LE(local + 18) !== compressedSize || bytes.readUInt32LE(local + 22) !== size)) throw new Error('XLSX member size/checksum headers disagree.');\n    members.set(name, { method, crc, compressedSize, size, dataStart, dataEnd });\n    extents.push({ start: local, end: dataEnd });\n    at = next;\n  }\n  if (at !== end) throw new Error('XLSX directory size differs.');\n  extents.sort((a,b) => a.start - b.start);\n  if (extents.some((v,i) => i && v.start \u003c extents[i-1].end)) throw new Error('XLSX member data overlaps.');\n  const required = [['[Content_Types].xml', 'Types'], ['xl/workbook.xml', 'workbook']];\n  let totalXml = 0;\n  for (const [name, root] of required) {\n    const m = members.get(name);\n    if (!m || m.size === 0 || m.size > maxXmlBytes - totalXml) throw new Error('Required workbook XML is missing, empty or above the local decompression limit.');\n    const compressed = bytes.subarray(m.dataStart, m.dataEnd);\n    let raw;\n    if (m.method === 0) raw = compressed;\n    else if (m.method === 8) raw = inflateRawSync(compressed, { maxOutputLength: m.size });\n    else throw new Error('Required workbook XML uses an unsupported ZIP compression method.');\n    if (raw.length !== m.size || crc32(raw) !== m.crc) throw new Error('Actual workbook member bytes/checksum differ.');\n    totalXml += raw.length;\n    const xml = utf8(raw);\n    const rootPattern = new RegExp('\u003c(?:[A-Za-z_][\\\\w.-]*:)?' + root + '(?:\\\\s|/?>)');\n    if (!rootPattern.test(xml)) throw new Error('Required XLSX part has no expected XML root.');\n  }\n  return { kind: 'xlsx', check: 'local_headers_directory_required_xml_bytes_crc', verified_parts: required.map(([name]) => name) };\n}\n\nexport function validateResult(direction, bytes, maxXmlBytes = 64 * 1024 * 1024) {\n  if (direction === 'to-xlsx') return assertXlsx(bytes, maxXmlBytes);\n  const parsed = JSON.parse(utf8(bytes));\n  if (!plainObject(parsed) || !recordArray(parsed.data)) throw new Error('Vendor JSON must contain data: an array of row objects.');\n  return { kind: 'json', check: 'data_array_of_objects', rows: parsed.data.length };\n}\n\nexport function makeRedactor(key) {\n  const tokens = [...new Set([key, encodeURIComponent(key), Buffer.from(key, 'utf8').toString('base64'), JSON.stringify(key).slice(1, -1)])].filter(Boolean).sort((a, b) => b.length - a.length);\n  return value => {\n    let text = String(value);\n    for (const token of tokens) text = text.split(token).join('[REDACTED]');\n    // Suppress labeled credential values even if a provider uses a different token.\n    return text.replace(/(\"(?:x-api-key|api[_-]?key|authorization|access[_-]?token|secret)\"\\s*:\\s*\")[^\"]*\"/gi, '$1[REDACTED]\"');\n  };\n}\n\nasync function readResponse(response, maxBytes) {\n  if (!response.body) return { bytes: Buffer.alloc(0), complete: true, error: null };\n  const reader = response.body.getReader();\n  const chunks = [];\n  let total = 0;\n  try {\n    while (true) {\n      const item = await reader.read();\n      if (item.done) break;\n      const chunk = Buffer.from(item.value);\n      const room = maxBytes - total;\n      if (chunk.length > room) {\n        if (room > 0) { chunks.push(chunk.subarray(0, room)); total += room; }\n        await reader.cancel().catch(() => {});\n        return { bytes: Buffer.concat(chunks, total), complete: false, error: 'Response exceeded the local byte limit.' };\n      }\n      chunks.push(chunk); total += chunk.length;\n    }\n    return { bytes: Buffer.concat(chunks, total), complete: true, error: null };\n  } catch {\n    return { bytes: Buffer.concat(chunks, total), complete: false, error: 'Response body interrupted; the captured prefix is retained.' };\n  } finally { reader.releaseLock(); }\n}\n\nconst describe = (filename, bytes, mediaType) => ({ filename, bytes: bytes.length, sha256: sha(bytes), media_type: mediaType });\nasync function writeNew(root, filename, bytes) {\n  const handle = await fs.open(path.join(root, filename), 'wx', 0o600);\n  try { await handle.writeFile(bytes); await handle.sync(); } finally { await handle.close(); }\n}\nasync function writeOperation(root, operation) {\n  const temporary = '.operation-' + randomUUID() + '.json';\n  await writeNew(root, temporary, Buffer.from(JSON.stringify(operation, null, 2) + '\\n', 'utf8'));\n  await fs.rename(path.join(root, temporary), path.join(root, 'operation.json'));\n}\n\nexport async function convert(options, { env = process.env, fetchImpl = globalThis.fetch } = {}) {\n  if (Number(process.versions.node.split('.')[0]) \u003c 22) throw new Error('Node 22 or newer is required.');\n  const key = env.JSON_SUPPORT_API_KEY;\n  if (typeof key !== 'string' || !key.length || key.trim() !== key || /[\\r\\n]/.test(key)) throw new Error('JSON_SUPPORT_API_KEY must be set without surrounding whitespace or newlines.');\n  const redact = makeRedactor(key);\n  const inputPath = await fs.realpath(options.input);\n  const stat = await fs.stat(inputPath);\n  if (!stat.isFile() || stat.size > options.maxInputBytes) throw new Error('Input must be a regular file within --max-input-mib.');\n  const original = await fs.readFile(inputPath);\n  if (original.length > options.maxInputBytes) throw new Error('Input grew beyond --max-input-mib.');\n  const request = buildRequest(options, original);\n  const outputDir = path.resolve(options.outputDir);\n  // Exclusive directory creation is the operation reservation; existing paths are refused.\n  await fs.mkdir(outputDir, { mode: 0o700 });\n  const sourceName = 'original-input.' + options.format;\n  const operation = {\n    schema: 'json-support.conversion-return/v1',\n    operation_id: randomUUID(), status: 'preparing', direction: options.direction,\n    created_at: now(), completed_at: null, contract_url: CONTRACT,\n    request: { endpoint: request.url, method: 'POST', body: describe('request.json', request.body, 'application/json'), attempts: 0 },\n    input: { ...describe(sourceName, original, options.format === 'xlsx' ? MIME_XLSX : options.format === 'json' ? 'application/json' : 'text/csv; charset=utf-8'), original_filename: path.basename(inputPath), rows_if_known: request.inputRows },\n    output: null, response: null, failure: null,\n    local_limits: { timeout_ms: options.timeoutMs, input_bytes: options.maxInputBytes, response_bytes: options.maxResponseBytes }\n  };\n  let response;\n  let captured;\n  const controller = new AbortController();\n  const interrupt = () => controller.abort(new Error('Operator interrupted the request.'));\n  let timer;\n  const recordFailure = async (code, message, uncertain) => {\n    operation.status = uncertain ? 'uncertain' : 'failed';\n    operation.completed_at = now();\n    operation.failure = { code, message: redact(message), automatic_retry: false, provider_may_have_processed: uncertain };\n    if (captured) {\n      const clean = Buffer.from(redact(captured.bytes.toString('utf8')), 'utf8');\n      await writeNew(outputDir, 'response-error.txt', clean);\n      operation.failure.response_body = {\n        ...describe('response-error.txt', clean, 'text/plain; charset=utf-8'),\n        original_captured_bytes: captured.bytes.length,\n        original_captured_sha256: sha(captured.bytes),\n        complete: captured.complete, credential_redacted: true,\n        encoding_note: 'UTF-8 text with replacement for invalid bytes; original raw error bytes are not saved.'\n      };\n    }\n    await writeOperation(outputDir, operation);\n    return { exitCode: 1, outputDir, operation };\n  };\n  try {\n    await writeNew(outputDir, sourceName, original);\n    await writeNew(outputDir, 'request.json', request.body);\n    operation.status = 'prepared';\n    await writeOperation(outputDir, operation);\n    operation.status = 'requesting';\n    operation.request.attempts = 1;\n    operation.request.started_at = now();\n    await writeOperation(outputDir, operation);\n    process.once('SIGINT', interrupt);\n    process.once('SIGTERM', interrupt);\n    timer = setTimeout(() => controller.abort(new Error('Request timeout.')), options.timeoutMs);\n    response = await fetchImpl(request.url, {\n      method: 'POST', redirect: 'error',\n      headers: { 'content-type': 'application/json', 'x-api-key': key, accept: options.direction === 'to-xlsx' ? MIME_XLSX : 'application/json' },\n      body: request.body, signal: controller.signal\n    });\n    operation.response = { status: response.status, ok: response.ok, received_at: now(), headers: {} };\n    for (const name of ['content-type', 'retry-after', 'x-amzn-requestid', 'x-amz-apigw-id', 'date']) {\n      const value = response.headers.get(name);\n      if (value !== null) operation.response.headers[name] = redact(value);\n    }\n    captured = await readResponse(response, options.maxResponseBytes);\n    if (!captured.complete) return await recordFailure('response_incomplete', captured.error, true);\n    if (!response.ok) return await recordFailure('http_error', 'Provider returned HTTP ' + response.status + '. Inspect the retained redacted response and Retry-After, if present.', response.status >= 500);\n    let validated;\n    try { validated = validateResult(options.direction, captured.bytes, options.maxResponseBytes); }\n    catch { return await recordFailure('invalid_success_body', 'Provider returned success with a body outside the documented output contract.', true); }\n    await writeNew(outputDir, options.outputName, captured.bytes);\n    operation.output = { ...describe(options.outputName, captured.bytes, options.direction === 'to-xlsx' ? MIME_XLSX : 'application/json'), validation: validated };\n    operation.status = 'succeeded';\n    operation.completed_at = now();\n    await writeOperation(outputDir, operation);\n    return { exitCode: 0, outputDir, operation };\n  } catch (error) {\n    const uncertain = operation.request.attempts > 0;\n    try { return await recordFailure(uncertain ? 'request_or_save_interrupted' : 'local_preparation_failed', error?.message || 'Operation failed.', uncertain); }\n    catch (saveError) {\n      const failure = new Error('Operation could not save its final state in ' + redact(outputDir) + ': ' + redact(saveError?.message || 'local write failed') + '. Preserve the directory and inspect operation.json before a deliberate retry.');\n      failure.exitCode = 1;\n      throw failure;\n    }\n  } finally {\n    if (timer) clearTimeout(timer);\n    process.removeListener('SIGINT', interrupt);\n    process.removeListener('SIGTERM', interrupt);\n  }\n}\n\nexport async function main(argv = process.argv.slice(2)) {\n  let options;\n  try {\n    options = parseArgs(argv);\n    if (options.help) { console.log(help()); return 0; }\n    const result = await convert(options);\n    console.log(JSON.stringify({ status: result.operation.status, operation_id: result.operation.operation_id, output_directory: result.outputDir, result_file: path.join(result.outputDir, 'operation.json'), output: result.operation.output, failure: result.operation.failure }, null, 2));\n    return result.exitCode;\n  } catch (error) {\n    const key = process.env.JSON_SUPPORT_API_KEY || '';\n    const safe = key ? makeRedactor(key)(error?.message || 'Local error.') : (error?.message || 'Local error.');\n    console.error('JSON Support: ' + safe);\n    return error.exitCode || 2;\n  }\n}\nif (process.argv[1] && import.meta.url === pathToFileURL(path.resolve(process.argv[1])).href) process.exitCode = await main();\n","bytes":21063,"sha256":"7ab848392b49eba564a56b079ce3c95fdf3df875d23f894cd18a722bb98ae33c"},{"path":"CONVERSION-ADAPTER.md","content":"# JSON Support conversion adapter\nNode.js 22 or newer. No installed packages are required.\n\n## What this adapter does\nThis is a customer-run command line companion to the report desk. It implements the vendor's two published conversion routes: a JSON data envelope returns binary XLSX; XLSX encoded as base64 or CSV text returns a JSON data envelope. Both use the same API key header. The API is metered; an invocation can consume the customer's allowance. The public contract is https://www.jsonsupport.com/developers.html, read October 13, 2026.\n\nThe separate website converter performs its interactive conversion in the browser; its local-data statement does not apply to this API command. API inputs go to the published vendor endpoint. The report desk continues to own its local source review, mapping, decisions and handover.\n\n## Files and execution\nKeep conversion-adapter.mjs and this guide together. Select an existing input file and a NEW output directory whose parent already exists. Existing directories and output files are refused. Every invocation gets its own output directory, original input, request body, result and operation record.\n\nUse an existing environment/secret-manager injection to set JSON_SUPPORT_API_KEY for the process. Do not put the key in arguments, source, a customer archive or a report. The adapter never retrieves a key, signs up, changes billing or configures a webhook.\n\n### JSON records to Excel\n```sh\nnode conversion-adapter.mjs to-xlsx --input ./records.json --output-dir ./conversion-001\n```\n\nThe default records shape is an array of objects or one object. A single object becomes one row. An object containing a field named data is still one record: it is not silently unwrapped.\n\nFor an existing exact API envelope containing only a data array:\n```sh\nnode conversion-adapter.mjs to-xlsx --input ./request-envelope.json --input-shape envelope --output-dir ./conversion-002 --output-name client-report.xlsx\n```\n\nThe adapter validates the JSON shape and embeds the original numeric/text representation in the request. It does not parse then reserialize record values, so large integer literals and decimal spellings are preserved before the vendor receives them. The original source bytes are retained, including any original UTF-8 BOM. Any BOM removed for the JSON request stays in the original-input file.\n\n### Excel or CSV to JSON\n```sh\nnode conversion-adapter.mjs to-json --format xlsx --input ./client-report.xlsx --output-dir ./conversion-003\nnode conversion-adapter.mjs to-json --format csv --input ./client-report.csv --output-dir ./conversion-004 --output-name client-rows.json\n```\n\nXLSX bytes are base64 encoded without a text conversion. CSV must be valid UTF-8; its text, line endings and BOM are preserved in the JSON string sent to the vendor. This adapter does not guess a legacy encoding or parse/reformat the CSV. It does not guess an undocumented raw-CSV body for the forward endpoint; the forward command accepts the published JSON data shape.\n\n### Local limits\nDefaults are 180 seconds for the full request/body, 32 MiB of input and 64 MiB of response. These are adapter limits, not published vendor limits. Set --timeout-seconds, --max-input-mib or --max-response-mib explicitly when the actual input needs different local limits. A response exceeding the selected limit is retained as a truncated, redacted failure prefix and receives no valid converted-output filename.\n\nOnly one HTTP request is attempted. Redirects are rejected, so the key cannot follow a redirect to a different host. The published endpoint is fixed in the source. There is no automatic retry after timeout, interruption, HTTP error or failed local save.\n\n## Read the result directory\nA successful operation contains:\n\n| File | Purpose |\n| --- | --- |\n| original-input.json, .csv or .xlsx | Exact original input bytes |\n| request.json | Exact transmitted JSON body, without the API key |\n| converted.xlsx or selected XLSX filename | Exact successful binary response |\n| converted.json or selected JSON filename | Exact successful JSON response, including its data envelope |\n| operation.json | Operation ID, original/request/output names, byte counts, SHA256, dates, response status, selected nonsecret headers and final state |\n\nThe source directory is created with POSIX mode 0700 and files with 0600; normal operating-system ACL semantics still apply. Original filenames are recorded as metadata; the original bytes use a fixed safe filename inside the new directory. No existing source or output file is overwritten.\n\nExit 0 means the successful response was saved and passed the stated structural check. XLSX validation checks the complete single-disk ZIP directory, each actual local header/name/data extent, nonoverlapping entries, and the stored/deflated bytes, size, CRC32 and expected XML roots of [Content_Types].xml and xl/workbook.xml. Required XML decompression is capped by the selected local input/response byte limit. It does not evaluate workbook formulas or the correctness of customer calculations. ZIP64/encrypted workbooks are refused by this adapter. JSON validation checks that data is an array of objects, and preserves the exact response bytes rather than reserializing numbers.\n\nBefore using a report, open the actual workbook/returned rows, reconcile the expected row/column structure and review any vendor transformations against the original input. A technically valid spreadsheet is not by itself an accepted client report.\n\n## Receive into the current report desk\nSelect the same agency and saved report in the desk. Inspect the selected conversion's operation.json: require schema json-support.conversion-return/v1, status succeeded, the intended direction and the output metadata. Recompute the output's byte count and SHA256 against that record, and retain the complete original output.\n\nFor a to-json result, open Conversion and results. Paste the complete returned JSON envelope into Optional actual reverse-conversion JSON, then choose Compare returned JSON. The comparison uses every row's position, field name, value and type against the currently saved mapped sample. Review differences against the original source; choose the actual outcome and enter the output filename, observed row count and inspection notes. Include the adapter operation ID and any transformation decision in those notes, then choose Record result.\n\nFor a to-xlsx result, open the actual workbook in the intended spreadsheet software, inspect its rows and formatting, and record the output filename and the actual inspection outcome in Conversion and results. Keep that workbook in the same handover folder as its complete adapter operation directory. An optional round trip uses a separate explicit to-json invocation on this exact XLSX into a new output directory, followed by the comparison above; it is another metered request.\n\nAfter recording the result, use Handovers to save the named report edition and download its full JSON and readable report. Also download the complete working file. Deliver those files together with the original-input, request, actual converted output and operation.json, preserving the full conversion directory so the recipient can trace the recorded result and continue the same report.\n\n## Failure and restart\nExit 1 means a started/retained operation failed or is uncertain. Exit 2 means local arguments, input or configuration failed before a request was issued. When a directory exists, operation.json is the authoritative local record; a process killed before it can finish may leave prepared/requesting state.\n\nAn HTTP error records status, selected request identifiers and Retry-After if provided. Its response-error.txt is a UTF-8, credential-redacted rendering of the captured body. Metadata records the original captured bytes/hash and whether the body was complete. Raw error bytes are deliberately not retained; the actual output and input source files have their own exact identities.\n\nA timeout, broken response, interrupt, 5xx or successful response that fails format validation can mean the provider already processed the request. The record says uncertain and provider_may_have_processed true. A local save failure after response receipt also needs reconciliation; preserve every existing file before deciding whether a new request is necessary.\n\nThe adapter does not claim idempotency or retry safety for these endpoints. Inspect the retained status, account usage and actual vendor result first. If a deliberate retry is appropriate, choose a new output directory and record the earlier operation in the desk's history. Never reuse or delete the prior operation merely to make the next command run.\n\n## Source and limits of the contract\nPrimary developer reference: https://www.jsonsupport.com/developers.html.\nLocal browser behavior: https://www.jsonsupport.com/.\nThe developer page supplies the endpoints, data shapes and binary/envelope return formats. It does not publish idempotency keys, a bulk limit, a complete error schema, an output download endpoint or callback signing. This adapter uses only the documented synchronous conversion contract. Its private file layout, checksums, explicit result states and desk receiving rules are engineering additions.\n","bytes":9269,"sha256":"af53a01893d0aa03a2fae84fec551e9c0826b3ecdb890f0c78d566957605250b"},{"path":"conversion-return-contract.json","content":"{\n  \"schema\": \"json-support.conversion-return-contract/v1\",\n  \"artifact\": \"operation.json\",\n  \"produced_by\": \"conversion-adapter.mjs\",\n  \"contract_url\": \"https://www.jsonsupport.com/developers.html\",\n  \"states\": {\n    \"preparing\": \"Owned fresh directory; original/request writes underway\",\n    \"prepared\": \"Original and request saved, no attempt recorded\",\n    \"requesting\": \"One request is about to be or has been issued; interrupted state requires reconciliation\",\n    \"succeeded\": \"Exact output saved and final metadata committed\",\n    \"failed\": \"Known error or local preparation failure; inspect actual HTTP/phase\",\n    \"uncertain\": \"Provider may have processed; no automatic retry\"\n  },\n  \"fields\": {\n    \"schema\": \"json-support.conversion-return/v1\",\n    \"operation_id\": \"unique local UUID\",\n    \"direction\": \"to-xlsx|to-json\",\n    \"created_at\": \"UTC\",\n    \"completed_at\": \"UTC|null\",\n    \"input\": \"filename, original_filename, bytes, sha256, media_type, rows_if_known\",\n    \"request\": \"fixed endpoint,POST,exact request body metadata,attempts0or1,started_at\",\n    \"response\": \"HTTP status,ok,received_at,allowlisted redacted headers|null\",\n    \"output\": \"exact filename,bytes,sha256,media_type,structural validation|null\",\n    \"failure\": \"code,message,automatic_retry:false,provider_may_have_processed,response_body metadata|null\",\n    \"local_limits\": \"timeout_ms,input_bytes,response_bytes\"\n  },\n  \"desk_receiving\": {\n    \"required_status\": \"succeeded\",\n    \"original_files\": \"Preserve all original-input/request/output/operation bytes\",\n    \"output_validation\": \"Match selected filename/bytes/SHA256 before parsing\",\n    \"json_input\": \"Use exact returned envelope.data as existing desk intake; preserve the whole envelope and operation ID\",\n    \"review\": \"Existing report identity, header mapping, corrections and accepted revision remain authoritative\",\n    \"failed_operation\": \"Keep source/status/failure with report operation history; never promote an error body into data\",\n    \"credentials\": \"Environment-only key; never retain headers or a secret in the workspace\"\n  }\n}\n","bytes":2086,"sha256":"5ebc37ed8f2ad7b02c0c6581f0f4df0c6a262f755481ba762ed47bbeda9a47ff"},{"path":"initial-working.json","content":"{\n  \"version\": \"jsonsupport.report-handover.v1\",\n  \"revision\": 0,\n  \"seed\": {\n    \"edition\": \"sample\",\n    \"title\": \"JSON Support — free agency report desk\",\n    \"pack_id\": \"JSONSUPPORT-AUTOMATION-PARTNER-PACK-20261013\",\n    \"edition_id\": \"JSONSUPPORT-AUTOMATION-PARTNER-PACK-20261013:sample-01\",\n    \"leads\": [\n      {\n        \"id\": \"JSONSUPPORT-AUTOMATION-PARTNER-PACK-20261013:smoothwork\",\n        \"pack_id\": \"JSONSUPPORT-AUTOMATION-PARTNER-PACK-20261013\",\n        \"revision\": 1,\n        \"document\": {\n          \"organization\": \"SmoothWork\",\n          \"company_domain\": \"smoothwork.ai\",\n          \"company_url\": \"https://smoothwork.ai/\",\n          \"buyer_key\": \"company:smoothwork.ai\",\n          \"person\": \"Milan, Automation and Airtable consultant\",\n          \"source_url\": \"https://smoothwork.ai/custom-api-integration-services/\",\n          \"published_on\": \"\",\n          \"author_updated_on\": \"\",\n          \"lead_kind\": \"company_fit\",\n          \"checked_at\": \"2026-10-13\",\n          \"deadline_on\": \"\",\n          \"deadline_at\": \"\",\n          \"demand\": \"SmoothWork explicitly offers API integrations that collect data and build reports, alongside code and no-code workflows, Airtable implementations and ongoing support. Its own n8n guide covers authenticated HTTP requests and JSON responses.\",\n          \"fit\": \"Offer a short comparison for one existing API-to-spreadsheet report: post an approved small JSON response to JSON Support, receive the XLSX and compare column expansion, dates, numbers and file handoff with SmoothWork's current implementation. For recurring client delivery, compare the Pro inbound webhook's emailed workbook with the existing n8n or scripted delivery step. Keep data preparation and client-specific business logic in SmoothWork's existing workflow.\",\n          \"contact_url\": \"mailto:hello@smoothwork.ai\",\n          \"contact_instructions\": \"Published business email hello@smoothwork.ai; +36 30 367 9742. The service page names Milan as its automation and Airtable consultant and lists 1053 Budapest, Ferenciek Square 2.\",\n          \"geography\": \"Budapest, Hungary; remote clients across markets\",\n          \"budget\": \"\",\n          \"opening_message\": \"Your API integration service already covers collecting data and building reports, and your n8n guide walks through authenticated JSON requests. Would a small JSON-to-XLSX comparison be useful for a client workflow where the last step is delivering a spreadsheet? We can compare it with the component you already use.\",\n          \"source_status\": \"unconfirmed\",\n          \"status_note\": \"First-party service and contact sources reviewed on 13 October 2026. Product fit and comparison suggestions are research judgments for qualification.\",\n          \"tags\": [\n            \"automation-integration\",\n            \"spreadsheet-reporting\",\n            \"role:sample\"\n          ],\n          \"operator_note\": \"Original JSON Support case C0BTTA66TK3/1791877916.462569. Complete source-qualified potential partner profile; retain current workflow and public business contact. https://smoothwork.ai/custom-api-integration-services/ | https://smoothwork.ai/connect_to_any_apis_in_n8n/\"\n        },\n        \"sha256\": \"0d737489b7fffe355bdb25bf0512c85e93ec21f30e063a1bacd71782d46d47e7\",\n        \"updated_at\": \"2026-10-13T08:08:00.000Z\",\n        \"history\": []\n      }\n    ],\n    \"product_sources\": [\n      {\n        \"url\": \"https://www.jsonsupport.com/developers.html\",\n        \"supports\": \"Authenticated conversion/reverse endpoints, Pro inbound webhook, published current usage and price.\"\n      },\n      {\n        \"url\": \"https://www.jsonsupport.com/contact.html\",\n        \"supports\": \"Published company business contact supportgdl@jsonsupport.com.\"\n      },\n      {\n        \"url\": \"https://www.jsonsupport.com/\",\n        \"supports\": \"Browser-local conversion, nested records and JSON/JSONL/CSV input.\"\n      },\n      {\n        \"url\": \"https://www.firstusers.tech/startups/json-support\",\n        \"supports\": \"Founder Jonathan Augustin and August30,2026 product introduction seeking early adopters.\"\n      }\n    ]\n  },\n  \"seed_sha256\": \"6be8d56f5342f737c3facf8fb01caf90b1fe694e7402ea33294cee9ec94fc3ff\",\n  \"projects\": {\n    \"JSONSUPPORT-AUTOMATION-PARTNER-PACK-20261013:smoothwork\": {\n      \"revision\": 0,\n      \"config\": {\n        \"report_name\": \"\",\n        \"client\": \"\",\n        \"source_system\": \"\",\n        \"existing_process\": \"\",\n        \"operator\": \"\",\n        \"recipient\": \"\",\n        \"route\": \"browser\",\n        \"cadence\": \"\",\n        \"requests_per_mont
