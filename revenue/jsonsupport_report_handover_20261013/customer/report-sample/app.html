<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JSON Support report handover desk</title></head><body><style>#json-report-desk{font:16px/1.5 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#202124;background:#f6f6f5;max-width:1440px;margin:auto;padding:24px;box-sizing:border-box}#json-report-desk *,#json-report-desk *:before,#json-report-desk *:after{box-sizing:border-box}#json-report-desk a{color:#202124;text-decoration:underline}#json-report-desk p,#json-report-desk li,#json-report-desk a,#json-report-desk pre,#json-report-desk td{overflow-wrap:anywhere}#json-report-desk h1{font-size:30px;line-height:1.2;margin:5px 0 12px}#json-report-desk h2{font-size:25px;margin:0}#json-report-desk h3{font-size:20px;margin:0 0 12px}#json-report-desk h4{font-size:16px;margin:20px 0 7px}#json-report-desk p{margin:10px 0}#json-report-desk button,#json-report-desk input,#json-report-desk select,#json-report-desk textarea{font:inherit;max-width:100%;border-radius:2px}#json-report-desk button{background:#262626;color:#fff;border:1px solid #262626;min-height:42px;padding:8px 14px;cursor:pointer}#json-report-desk button.secondary,#json-report-desk [role=tab]{background:#fff;color:#202124;border-color:#aaa}#json-report-desk button:focus-visible,#json-report-desk input:focus-visible,#json-report-desk select:focus-visible,#json-report-desk textarea:focus-visible{outline:3px solid #777;outline-offset:2px}#json-report-desk button[aria-current=true],#json-report-desk [aria-selected=true]{border:2px solid #202124;background:#e5e5e3;font-weight:700}#json-report-desk header{border-bottom:1px solid #aaa;padding-bottom:20px}#json-report-desk .eyebrow{font-size:13px;letter-spacing:.09em;text-transform:uppercase}#json-report-desk .actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:16px 0}#json-report-desk .actions>*{min-width:0}#json-report-desk .file-control{display:inline-flex;position:relative;min-height:42px;align-items:center;justify-content:center;background:#fff;color:#202124;border:1px solid #aaa;padding:8px 14px;cursor:pointer;overflow:hidden}#json-report-desk .file-control input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%}#json-report-desk .file-control:focus-within{outline:3px solid #777;outline-offset:2px}#json-report-desk .layout{display:grid;grid-template-columns:230px minmax(0,1fr);gap:24px;margin-top:24px}#json-report-desk aside,#json-report-desk main,#json-report-desk article,#json-report-desk .grid>*{min-width:0}#json-report-desk #agency-list{display:flex;flex-direction:column;gap:9px}#json-report-desk #agency-list button{text-align:left;overflow-wrap:anywhere}#json-report-desk .tabs{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}#json-report-desk article{border:1px solid #bbb;background:#fff;padding:22px;margin-bottom:18px}#json-report-desk .pair,#json-report-desk .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}#json-report-desk .pair article{margin-bottom:0}#json-report-desk .pair{margin-bottom:18px}#json-report-desk label{display:block;min-width:0;margin-bottom:14px}#json-report-desk label>span{display:block;font-weight:600;margin-bottom:6px}#json-report-desk input,#json-report-desk textarea,#json-report-desk select{width:100%;background:#fff;color:#202124;border:1px solid #888;min-height:42px;padding:8px}#json-report-desk textarea{min-height:110px;resize:vertical}#json-report-desk textarea.source-text{min-height:230px;font:14px/1.5 ui-monospace,SFMono-Regular,Consolas,monospace;white-space:pre}#json-report-desk label small{display:block;font-size:13px;margin-top:6px;color:#555}#json-report-desk .column-row{display:grid;grid-template-columns:minmax(90px,1.2fr) minmax(100px,1.3fr) minmax(90px,.8fr) 100px 90px;gap:10px;align-items:end;border-bottom:1px solid #ddd;padding:10px 0}#json-report-desk .column-row button{margin-bottom:14px}#json-report-desk .check{display:flex;align-items:center;gap:7px;min-height:42px}#json-report-desk .check input{width:18px;min-height:18px;flex:0 0 18px}#json-report-desk .notice{padding:12px 15px;background:#eee;border-left:4px solid #555;margin-top:18px;overflow-wrap:anywhere}#json-report-desk .notice:empty{display:none}#json-report-desk .notice.error{border:2px solid #333}#json-report-desk .muted{color:#555;font-size:14px}#json-report-desk .table-scroll{overflow:auto;max-width:100%;margin:15px 0}#json-report-desk table{border-collapse:collapse;font-size:14px;min-width:100%}#json-report-desk th,#json-report-desk td{border:1px solid #bbb;padding:8px;text-align:left;vertical-align:top;max-width:300px}#json-report-desk pre{white-space:pre-wrap;font:14px/1.5 ui-monospace,Consolas,monospace;max-width:100%}#json-report-desk pre.guide{font:16px/1.6 system-ui,sans-serif}#json-report-desk summary{cursor:pointer;font-weight:600;margin:8px 0}#json-report-desk footer{font-size:13px;color:#555;margin-top:24px;border-top:1px solid #bbb;padding-top:16px}@media(max-width:1100px){#json-report-desk .column-row{grid-template-columns:1fr 1fr}#json-report-desk .column-row button{align-self:center}#json-report-desk .layout{grid-template-columns:190px minmax(0,1fr)}}@media(max-width:700px){#json-report-desk{padding:16px}#json-report-desk h1{font-size:26px}#json-report-desk .layout{grid-template-columns:minmax(0,1fr);gap:20px}#json-report-desk #agency-list{display:flex;flex-direction:row;flex-wrap:wrap}#json-report-desk #agency-list button{flex:1 1 140px}#json-report-desk .pair,#json-report-desk .grid{grid-template-columns:1fr}#json-report-desk article{padding:17px}#json-report-desk .actions{align-items:stretch}#json-report-desk .actions>button,#json-report-desk .actions>.file-control{flex:1 1 180px}#json-report-desk .tabs>button{flex:1 1 100px}#json-report-desk .column-row{grid-template-columns:minmax(0,1fr)}#json-report-desk .column-row label{margin-bottom:2px}#json-report-desk .column-row button{margin:8px 0}}</style><div id="json-report-desk"><header><p class="eyebrow">Report preparation and client handover</p><h1>JSON Support report desk</h1><p id="edition"></p><div class="actions"><button id="export-working">Download working file</button><label class="file-control">Open working file<input id="open-working" type="file" accept=".json,application/json"></label><button id="reopen-browser" class="secondary">Reopen browser copy</button><button id="download-source" class="secondary">Download application source</button></div><div id="notice" class="notice" role="status" aria-live="polite"></div></header><div class="layout"><aside><h3>Agencies</h3><div id="agency-list"></div></aside><main><h2 id="agency-name"></h2><p id="revision" class="muted"></p><nav class="tabs" aria-label="Report sections"><button role="tab" data-tab="context" aria-selected="false">Agency context</button><button role="tab" data-tab="report" aria-selected="false">Report setup</button><button role="tab" data-tab="run" aria-selected="false">Conversion and results</button><button role="tab" data-tab="handover" aria-selected="false">Handovers</button><button role="tab" data-tab="guide" aria-selected="false">Guide</button></nav><section id="panel"></section></main></div><footer>Complete editable report preparation, actual result notes and original source context. Save the working file to continue on another device.</footer></div><script>(function reportApp(INITIAL, GUIDE, SOURCE_FILES, CORE_SOURCE, SHA_SOURCE) {
 "use strict";
 const sm={exports:{}};Function("module","exports",SHA_SOURCE)(sm,sm.exports);
 const cm={exports:{}};Function("module","exports","require",CORE_SOURCE)(cm,cm.exports,p=>{if(p!=="../runtime/host/connected_sha256.cjs")throw Error(p);return sm.exports;});const api=cm.exports;
 const $=s=>document.querySelector(s),root=$("#json-report-desk"),key="tjl-json-report:"+INITIAL.seed_sha256;
 let state=api.receiveWorking(JSON.stringify(INITIAL),INITIAL.seed_sha256),leadId=state.seed.leads[0].id,tab="context",dirty=false,storedText=null,storage=true,reportDraft=null;
 const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
 const safeUrl=u=>/^https?:\/\/|^mailto:/i.test(u||"")?u:"";
 const link=(u,label)=>safeUrl(u)?'<a href="'+esc(u)+'" target="_blank" rel="noopener noreferrer">'+esc(label||u)+'</a>':esc(label||u);
 const dateTime=value=>new Intl.DateTimeFormat("en-US",{dateStyle:"medium",timeStyle:"short",timeZone:"UTC"}).format(new Date(value))+" UTC";
 const slug=v=>v.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
 function note(t,error=false){$("#notice").textContent=t;$("#notice").className="notice"+(error?" error":"");}
 function browserPreimage(){if(!storage)return;try{const value=localStorage.getItem(key);if(value!==storedText)throw Object.assign(Error("Another tab saved a different copy. Download your current saved work, then reopen the current browser copy before changing it."),{conflict:true});}catch(e){if(e.conflict)throw e;storage=false;}}
 function persist(){if(!storage){note("Session mode: browser storage is unavailable. Download the complete working file to keep your edits.",true);return false;}try{storedText=api.exportWorking(state);localStorage.setItem(key,storedText);return true;}catch(e){storage=false;note("Session mode: browser storage could not save. Download the complete working file to retain these edits.",true);return false;}}
 try{storedText=localStorage.getItem(key);if(storedText)state=api.receiveWorking(storedText,INITIAL.seed_sha256);}catch(e){storage=false;note("Session mode: "+e.message+" Download a complete working file after editing.",true);}
 function leave(){if(!dirty)return true;if(!confirm("Discard the unsaved fields in this form? Saved reports and handovers remain in the working file."))return false;dirty=false;reportDraft=null;return true;}
 function savedOnly(){if(dirty)throw Error("Save the current form before downloading saved work or recording another operation.");}
 const unique=()=>globalThis.crypto?.randomUUID?.()||"operation-"+Date.now()+"-"+Math.random().toString(16).slice(2);
 function act(kind,input){browserPreimage();const next=api.apply(state,{id:unique(),expected_revision:state.revision,lead_id:leadId,kind,input},new Date().toISOString()).root;state=next;dirty=false;reportDraft=null;const ok=persist();render();if(ok)note("Saved. Complete working revision "+state.revision+".");return true;}
 function guarded(f){try{return f();}catch(e){note(e.message,true);return false;}}
 function download(name,body,type="application/json;charset=utf-8"){const a=document.createElement("a"),url=URL.createObjectURL(new Blob([body],{type}));a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000);}
 function field(name,label,value="",type="text",hint=""){return'<label><span>'+esc(label)+'</span><input name="'+esc(name)+'" type="'+type+'" value="'+esc(value??"")+'"'+(type==="number"?' min="0" step="any"':'')+'>'+(hint?'<small>'+esc(hint)+'</small>':'')+'</label>';}
 function area(name,label,value="",large=false){return'<label><span>'+esc(label)+'</span><textarea name="'+esc(name)+'"'+(large?' class="source-text"':'')+'>'+esc(value)+'</textarea></label>';}
 function select(name,label,options,value){return'<label><span>'+esc(label)+'</span><select name="'+esc(name)+'">'+options.map(([v,l])=>'<option value="'+esc(v)+'"'+(v===value?' selected':'')+'>'+esc(l)+'</option>').join('')+'</select></label>';}
 const project=()=>state.projects[leadId],lead=()=>state.seed.leads.find(x=>x.id===leadId).document;
 function form(id,run){const f=$(id);if(!f)return;f.oninput=f.onchange=()=>{dirty=true;};f.onsubmit=e=>{e.preventDefault();guarded(()=>run(f));};}
 function readReport(){const f=$("#report-form"),v=Object.fromEntries(new FormData(f)),config={};for(const k of Object.keys(project().config))config[k]=["requests_per_month","existing_minutes","pilot_minutes","maintenance_minutes"].includes(k)?(v[k]===""?null:Number(v[k])):v[k];const columns=[...f.querySelectorAll(".column-row")].map(r=>({name:r.querySelector('[data-field="name"]').value,pointer:r.querySelector('[data-field="pointer"]').value,type:r.querySelector('[data-field="type"]').value,required:r.querySelector('[data-field="required"]').checked}));return {config,source:{format:v.format,text:v.source_text,records_pointer:v.records_pointer},columns};}
 function contextView(){const d=lead();return'<div class="pair"><article><h3>Existing agency workflow</h3><p>'+esc(d.demand)+'</p><h4>Suggested comparison</h4><p>'+esc(d.fit)+'</p><button id="start-report">Prepare report</button></article><article><h3>Published business contact</h3><p>'+link(d.contact_url,d.person||d.organization)+'</p><p>'+esc(d.contact_instructions)+'</p><p>'+esc(d.geography)+'</p><h4>Original source</h4><p>'+link(d.source_url)+'</p><p class="muted">Reviewed '+esc(d.checked_at)+'. Confirm the agency’s actual client workflow before entering a pilot.</p></article></div><article><h3>Product routes</h3><p>JSON Support’s browser converter processes the entered sample in the browser. Its authenticated API and configured email webhook process submitted data through the service. Choose the actual route and the approved sample for this report.</p><p>'+link("https://www.jsonsupport.com/developers.html","Current developer documentation")+' · '+link("https://www.jsonsupport.com/privacy.html","Current privacy information")+'</p><details><summary>Original suggested introduction</summary><p>'+esc(d.opening_message)+'</p></details></article>';}
 function reportView(){const p=reportDraft||api.proposalOf(project()),c=p.config;return'<form id="report-form"><article><h3>Client and delivery</h3><div class="grid">'+field("report_name","Report name",c.report_name)+field("client","Client / engagement",c.client)+field("source_system","Source system",c.source_system)+field("operator","Operator",c.operator)+field("recipient","Agreed recipient",c.recipient)+select("route","Proposed route",[["browser","Browser converter"],["api","Authenticated API"],["webhook","Configured email webhook"]],c.route)+field("cadence","Delivery cadence",c.cadence)+field("requests_per_month","Estimated monthly requests",c.requests_per_month,"number")+area("existing_process","Existing reporting process",c.existing_process)+area("data_notes","Source, permission and data notes",c.data_notes)+area("delivery_notes","Delivery and acceptance notes",c.delivery_notes)+'</div></article><article><h3>Representative source records</h3><p>Use the small, approved source sample for this report. It stays in this desk until you choose to submit a request with the separate adapter or vendor app.</p><div class="grid">'+select("format","Source format",[["json","JSON"],["jsonl","JSON Lines"]],p.source.format)+field("records_pointer","Records JSON pointer",p.source.records_pointer,"text","Blank uses the whole JSON value; /records selects its records property. Leave blank for JSON Lines.")+'</div>'+area("source_text","Actual sample JSON / JSON Lines",p.source.text,true)+'<label class="file-control">Open sample file<input id="source-file" type="file" accept=".json,.jsonl,.ndjson,application/json,text/plain"></label></article><article><h3>Selected output columns</h3><p>Choose the exact fields and types. A missing optional field becomes null. Keep references and identifiers as text to preserve leading zeros. JSON pointer escapes are ~1 for / and ~0 for ~.</p><div id="columns">'+p.columns.map((col,i)=>'<div class="column-row"><label><span>Heading</span><input data-field="name" value="'+esc(col.name)+'"></label><label><span>Field pointer</span><input data-field="pointer" value="'+esc(col.pointer)+'"></label><label><span>Type</span><select data-field="type">'+["preserve","text","number","boolean","date","json"].map(t=>'<option'+(t===col.type?' selected':'')+'>'+t+'</option>').join('')+'</select></label><label class="check"><input type="checkbox" data-field="required"'+(col.required?' checked':'')+'>Required</label><button type="button" class="secondary remove-column" data-index="'+i+'" aria-label="Remove column '+(i+1)+'">Remove</button></div>').join('')+'</div><button type="button" class="secondary" id="add-column">Add column</button></article><article><h3>Measured effort comparison</h3><p>Enter observations from the existing report and actual pilot. Blank fields keep the comparison uncalculated.</p><div class="grid">'+field("existing_minutes","Existing minutes per report",c.existing_minutes,"number")+field("pilot_minutes","Pilot minutes per report",c.pilot_minutes,"number")+field("maintenance_minutes","Monthly maintenance minutes",c.maintenance_minutes,"number")+'</div></article><div class="actions"><button>Save report</button><button type="button" class="secondary" id="preview-draft">Preview current fields</button></div></form><div id="preview"></div>';}
 function previewHTML(p){const r=api.compile(p),e=api.estimate(p);return'<article><h3>Prepared rows</h3><p>'+r.input_rows+' source records · '+p.columns.length+' selected columns · '+r.issue_count+' issues</p>'+(r.issue_count?'<ul>'+r.issues.slice(0,30).map(x=>'<li>Row '+x.row+' '+esc(x.column)+': '+esc(x.message)+'</li>').join('')+'</ul>'+(r.issue_count>30?'<p>Showing the first 30 findings. Resolve those and preview again.</p>':''):'<p>'+(r.ready?'The selected sample is ready to prepare a conversion request.':'Add the sample and its selected columns.')+'</p>')+'<div class="table-scroll"><table><thead><tr>'+p.columns.map(c=>'<th>'+esc(c.name)+'</th>').join('')+'</tr></thead><tbody>'+r.rows.slice(0,25).map(row=>'<tr>'+p.columns.map(c=>'<td>'+esc(typeof row[c.name]==="object"?JSON.stringify(row[c.name]):row[c.name])+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>'+(r.rows.length>25?'<p>Preview shows the first 25 rows. Downloaded files include every prepared row.</p>':'')+(e?'<p>Entered estimates: '+e.existing_monthly_minutes+' existing minutes/month; '+e.proposed_monthly_minutes+' proposed minutes/month; difference '+e.difference_minutes+' minutes/month.</p>':'')+'</article>';}
 function runView(){const p=project();return'<article><h3>Prepare and operate the conversion</h3><p>Download the request for the separate Node adapter, or use the approved sample in JSON Support’s selected browser or email workflow. The adapter takes its key from your terminal environment. This desk does not collect credentials or send data.</p><div class="actions"><button id="request-file">Download API request</button><button class="secondary" id="preview-csv">Download preview CSV</button></div><p class="muted">The CSV is a local review file. A leading apostrophe protects spreadsheet formula-like text; the API request retains the actual mapped values.</p><details><summary>Adapter commands</summary><pre>JSON_SUPPORT_API_KEY is supplied through your existing environment.\nnode conversion-adapter.mjs --help\nSee the included adapter guide for the exact forward, reverse and receiving commands.</pre></details></article><article><h3>Record an actual result</h3><p>Enter what happened when you operated the chosen conversion and checked its returned file. Earlier runs remain bound to their original report fields.</p><form id="run-form"><div class="grid">'+select("status","Outcome",[["needs-work","Needs work"],["accepted","Accepted"]],"needs-work")+field("output_name","Actual output filename")+field("output_rows","Observed returned rows",null,"number")+field("minutes","Observed minutes",null,"number")+area("notes","Actual result and inspection notes")+'</div>'+area("returned_json","Optional actual reverse-conversion JSON","",true)+'<div class="actions"><button>Record result</button><button type="button" id="compare-returned" class="secondary">Compare returned JSON</button></div></form><div id="returned-comparison"></div></article>'+p.runs.slice().reverse().map(r=>'<article><h3>'+esc(r.status==="accepted"?"Accepted result":"Result requiring work")+'</h3><p>'+esc(r.output_name||"Output name not entered")+' · '+esc(dateTime(r.at))+'</p><p>'+esc(r.notes)+'</p><p class="muted">'+(r.contract_sha256===api.contractHash(p)?"Applies to the current report fields.":"The report fields changed after this result; inspect the current conversion before reusing that decision.")+'</p><p>Rows: '+esc(r.output_rows??"Not recorded")+' · Minutes: '+esc(r.minutes??"Not recorded")+'</p></article>').join('');}
 function handoverView(){const p=project();return'<article><h3>Client handover</h3><p>Save a named copy of the current report configuration, source sample, selected columns and all mapped rows. Later edits leave it intact.</p><form id="handover-form">'+field("title","Handover name")+'<button>Save handover</button></form></article>'+p.handovers.slice().reverse().map(h=>'<article><h3>'+esc(h.title)+'</h3><p>'+esc(dateTime(h.at))+' · '+h.rows.length+' rows</p><div class="actions"><button class="download-handover" data-id="'+esc(h.id)+'">Download full JSON</button><button class="secondary handover-report" data-id="'+esc(h.id)+'">Download readable report</button></div></article>').join('')+'<article><h3>Report history</h3><details><summary>'+p.history.length+' saved report revisions</summary><ol>'+p.history.map(h=>'<li>Revision '+h.revision+' · '+esc(dateTime(h.at))+' · '+esc(h.proposal.config.report_name||"Untitled report")+'</li>').join('')+'</ol></details></article>';}
 function handoverHTML(h){return'<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>'+esc(h.title)+'</title><style>body{font:16px/1.6 system-ui;color:#202020;background:#fff;max-width:1100px;margin:30px auto;padding:0 18px}p,a,pre,td{overflow-wrap:anywhere}pre{white-space:pre-wrap;font:14px/1.5 ui-monospace,monospace}table{border-collapse:collapse;width:100%}td,th{padding:9px;border:1px solid #aaa;text-align:left}.scroll{overflow:auto}h1{font-size:28px}</style><body><p>JSON Support · Report handover</p><h1>'+esc(h.title)+'</h1><h2>'+esc(lead().organization)+'</h2><p>'+esc(dateTime(h.at))+'</p><h2>Report and delivery</h2>'+Object.entries(h.proposal.config).map(([k,v])=>'<p><strong>'+esc(k.replace(/_/g," "))+':</strong> '+esc(v??"Not entered")+'</p>').join('')+'<h2>Prepared rows</h2><div class="scroll"><table><thead><tr>'+h.proposal.columns.map(c=>'<th>'+esc(c.name)+'</th>').join('')+'</tr></thead><tbody>'+h.rows.map(row=>'<tr>'+h.proposal.columns.map(c=>'<td>'+esc(typeof row[c.name]==="object"?JSON.stringify(row[c.name]):row[c.name])+'</td>').join('')+'</tr>').join('')+'</tbody></table></div><h2>Selected columns</h2><pre>'+esc(JSON.stringify(h.proposal.columns,null,2))+'</pre><h2>Original sample</h2><pre>'+esc(h.proposal.source.text)+'</pre><h2>Original agency source</h2><p>'+link(lead().source_url)+'</p></body></html>';}
 function render(){const d=lead(),p=project();$("#agency-list").innerHTML=state.seed.leads.map(l=>'<button class="secondary" data-lead="'+esc(l.id)+'" aria-current="'+(l.id===leadId)+'">'+esc(l.document.organization)+'</button>').join('');$("#agency-name").textContent=d.organization;$("#edition").textContent=state.seed.edition==="sample"?"Free example · one agency":"Paid edition · five agencies";$("#revision").textContent="Working revision "+state.revision;root.querySelectorAll("[data-tab]").forEach(b=>b.setAttribute("aria-selected",String(b.dataset.tab===tab)));$("#panel").innerHTML=({context:contextView,report:reportView,run:runView,handover:handoverView,guide:()=>'<article><h3>Operator guide</h3><pre class="guide">'+esc(GUIDE)+'</pre></article>'}[tab])();
 root.querySelectorAll("[data-lead]").forEach(b=>b.onclick=()=>{if(!leave())return;leadId=b.dataset.lead;render();});
 const go=t=>{if(!leave())return;tab=t;render();};if($("#start-report"))$("#start-report").onclick=()=>go("report");
 form("#report-form",()=>act("save",readReport()));
 if($("#add-column"))$("#add-column").onclick=()=>guarded(()=>{reportDraft=readReport();if(reportDraft.columns.length>=128)throw Error("Use up to 128 columns.");reportDraft.columns.push({name:"",pointer:"",type:"text",required:false});dirty=true;render();});

})({"version":"jsonsupport.report-handover.v1","revision":0,"seed":{"edition":"sample","title":"JSON Support — free agency report desk","pack_id":"JSONSUPPORT-AUTOMATION-PARTNER-PACK-20261013","edition_id":"JSONSUPPORT-AUTOMATION-PARTNER-PACK-20261013:sample-01","leads":[{"id":"JSONSUPPORT-AUTOMATION-PARTNER-PACK-20261013:smoothwork","pack_id":"JSONSUPPORT-AUTOMATION-PARTNER-PACK-20261013","revision":1,"document":{"organization":"SmoothWork","company_domain":"smoothwork.ai","company_url":"https://smoothwork.ai/","buyer_key":"company:smoothwork.ai","person":"Milan, Automation and Airtable consultant","source_url":"https://smoothwork.ai/custom-api-integration-services/","published_on":"","author_updated_on":"","lead_kind":"company_fit","checked_at":"2026-10-13","deadline_on":"","deadline_at":"","demand":"SmoothWork explicitly offers API integrations that collect data and build reports, alongside code and no-code workflows, Airtable implementations and ongoing support. Its own n8n guide covers authenticated HTTP requests and JSON responses.","fit":"Offer a short comparison for one existing API-to-spreadsheet report: post an approved small JSON response to JSON Support, receive the XLSX and compare column expansion, dates, numbers and file handoff with SmoothWork's current implementation. For recurring client delivery, compare the Pro inbound webhook's emailed workbook with the existing n8n or scripted delivery step. Keep data preparation and client-specific business logic in SmoothWork's existing workflow.","contact_url":"mailto:hello@smoothwork.ai","contact_instructions":"Published business email hello@smoothwork.ai; +36 30 367 9742. The service page names Milan as its automation and Airtable consultant and lists 1053 Budapest, Ferenciek Square 2.","geography":"Budapest, Hungary; remote clients across markets","budget":"","opening_message":"Your API integration service already covers collecting data and building reports, and your n8n guide walks through authenticated JSON requests. Would a small JSON-to-XLSX comparison be useful for a client workflow where the last step is delivering a spreadsheet? We can compare it with the component you already use.","source_status":"unconfirmed","status_note":"First-party service and contact sources reviewed on 13 October 2026. Product fit and comparison suggestions are research judgments for qualification.","tags":["automation-integration","spreadsheet-reporting","role:sample"],"operator_note":"Original JSON Support case C0BTTA66TK3/1791877916.462569. Complete source-qualified potential partner profile; retain current workflow and public business contact. https://smoothwork.ai/custom-api-integration-services/ | https://smoothwork.ai/connect_to_any_apis_in_n8n/"},"sha256":"0d737489b7fffe355bdb25bf0512c85e93ec21f30e063a1bacd71782d46d47e7","updated_at":"2026-10-13T08:08:00.000Z","history":[]}],"product_sources":[{"url":"https://www.jsonsupport.com/developers.html","supports":"Authenticated conversion/reverse endpoints, Pro inbound webhook, published current usage and price."},{"url":"https://www.jsonsupport.com/contact.html","supports":"Published company business contact supportgdl@jsonsupport.com."},{"url":"https://www.jsonsupport.com/","supports":"Browser-local conversion, nested records and JSON/JSONL/CSV input."},{"url":"https://www.firstusers.tech/startups/json-support","supports":"Founder Jonathan Augustin and August30,2026 product introduction seeking early adopters."}]},"seed_sha256":"6be8d56f5342f737c3facf8fb01caf90b1fe694e7402ea33294cee9ec94fc3ff","projects":{"JSONSUPPORT-AUTOMATION-PARTNER-PACK-20261013:smoothwork":{"revision":0,"config":{"report_name":"","client":"","source_system":"","existing_process":"","operator":"","recipient":"","route":"browser","cadence":"","requests_per_month":null,"existing_minutes":null,"pilot_minutes":null,"maintenance_minutes":null,"data_notes":"","delivery_notes":""},"source":{"format":"json","text":"","records_pointer":""},"columns":[],"runs":[],"handovers":[],"history":[]}},"events":[]},"JSON SUPPORT — REPORT HANDOVER DESK\nOperator guide · 13 October 2026\n\nOPEN THE CORRECT EDITION\nOpen app.html in a modern browser. The free edition contains SmoothWork. The paid edition contains the five original additional agency profiles. Each edition keeps its own complete working file and browser storage. Original research, contact routes and source URLs remain attached to each agency.\n\n1. SELECT THE ACTUAL REPORT\nUse Agency context to review the agency's current workflow. In Report setup, enter the actual client, reporting system, operator, recipient and cadence. Choose the route you intend to operate: browser converter, authenticated API or configured email webhook. Keep the report's existing formulas, transformations and delivery arrangements in the source process.\n\n2. PREPARE A REPRESENTATIVE SAMPLE\nPaste or open up to 1 MiB of JSON or JSON Lines. For JSON, a blank records pointer selects the whole value; /records selects a records array. A single selected object becomes one row. JSON Lines treats each nonempty line as one object.\n\nEnter explicit output headings and JSON pointers. /customer/name selects a nested property. Escape ~ as ~0 and / as ~1 inside property names. Use text for references such as 00017. Number accepts finite values within JavaScript's exact integer range. Unsafe integers and nonfinite values are rejected with a correction prompt; quote identifiers and precise decimal values in the source and keep them as text. Date requires an actual YYYY-MM-DD calendar date. JSON serializes an object/list into text. Preserve retains the selected JSON value. Missing optional values become null.\n\nPreview the current fields and resolve every required-field/type issue. Preview shows the first 25 rows; output files retain all mapped rows. The desk allows at most 20,000 sample records, 128 columns and 200,000 selected cells. These are preparation-desk limits, not statements of a vendor account's limits.\n\n3. SAVE AND OPERATE THE SELECTED ROUTE\nSave report. Conversion and results provides the exact documented API request, { \"data\": [ mapped records ] }, and a local review CSV. The review CSV protects spreadsheet formula-like strings with a leading apostrophe. The API request retains the original mapped values.\n\nFor an authenticated conversion, use the included conversion-adapter.mjs and its full operator guide with Node 22+. Credentials come from your existing terminal environment. The adapter makes the explicitly selected request, saves the complete returned output and records its operation. Read its --help and included guide before invoking it.\n\nFor JSON Support's browser converter or a configured email webhook, use the actual vendor account and agreed recipient. The browser route and service routes have different data-processing contexts. Review the current vendor documentation and privacy terms for the selected route. The desk itself stores data only in its browser session or the working files you download.\n\nCurrent source reviewed 13 October 2026:\nhttps://www.jsonsupport.com/\nhttps://www.jsonsupport.com/developers.html\nhttps://www.jsonsupport.com/privacy.html\nThe developer page describes forward JSON-to-XLSX and reverse XLSX/CSV-to-JSON endpoints, x-api-key authentication and a Pro inbound email webhook. Confirm current account entitlements, limits and pricing in the actual account when commissioning a workflow.\n\n4. INSPECT AND RECORD THE ACTUAL RESULT\nOpen the returned workbook with the intended spreadsheet software and inspect headers, identifiers, dates, numeric values, row totals and delivery. Record the actual output filename, observed rows, time and decision. Enter factual notes about the operation and the remaining changes.\n\nFor an actual reverse-conversion response, paste the raw array of records or the vendor's {data:[…]} JSON response. Compare returned JSON checks all row positions, field names, values and types against the saved mapped sample. It shows up to 50 differing rows while counting the full difference. It is an exact structured-data comparison; use the workbook inspection for formatting, formulas and spreadsheet behavior.\n\nA changed report configuration or source marks earlier results as belonging to an earlier report. Their original notes stay in the complete working file.\n\n5. HAND OVER AND CONTINUE\nSave a named handover after the report sample is valid. Each handover retains its full configuration, original sample, selected columns and all prepared rows. Download its full JSON and readable HTML report. Later edits preserve earlier handovers.\n\nDownload the complete working file after meaningful edits. It contains original research, every agency project, saved proposal history, actual result notes and named handovers. Open working file verifies the original edition and complete operation history before receiving it. The complete saved working file is limited to 20 MiB. A change that would exceed that full export size is refused before saving. Download the current complete copy, then open the original working.json from the selected edition to begin another report with a smaller representative sample; the downloaded earlier copy remains available.\n\nThe application uses browser storage when available. Session mode keeps all functionality available when storage is denied or full; download the working file before closing that session. A stale tab refuses to overwrite a newer browser copy. Use Reopen browser copy to continue the latest saved copy. Unsaved form changes require an explicit discard before switching agency or section.\n\nCOMPLETE SOURCE\nDownload application source supplies every file required to rebuild this same edition, its opening working file, complete model, renderer, adapter and guides. Use the included rebuild.cjs under Node 22+:\nnode rebuild.cjs --source report-sample/application-source.json --output-dir ./received-report-app\nChoose the source path from the selected edition and an absent output directory. This receives every complete source file and rebuilds app.html in that new directory. The complete customer ZIP also retains all original agency HTML/CSV/JSON profiles and instructions.\n",[{"path":"desk/report-core.cjs","content":"\"use strict\";\nconst Sha = require(\"../runtime/host/connected_sha256.cjs\");\nconst VERSION = \"jsonsupport.report-handover.v1\";\nconst API = \"https://veqix61rpf.execute-api.us-east-1.amazonaws.com/dev/v1/convert\";\nfunction clone(value) { return JSON.parse(JSON.stringify(value)); }\nfunction stable(value) {\n  if (value === null || typeof value !== \"object\") return JSON.stringify(value);\n  if (Array.isArray(value)) return \"[\" + value.map(stable).join(\",\") + \"]\";\n  return \"{\" + Object.keys(value).sort().map(key => JSON.stringify(key) + \":\" + stable(value[key])).join(\",\") + \"}\";\n}\nfunction hash(value) { return Sha.sha256Utf8(stable(value)).sha256; }\nfunction text(value, name, max = 4000) {\n  if (typeof value !== \"string\" || value.length > max) throw Error(name + \" must be text up to \" + max + \" characters.\");\n  return value;\n}\nfunction finite(value, name) {\n  if (value === null) return null;\n  if (typeof value !== \"number\" || !Number.isFinite(value) || value \u003c 0) throw Error(name + \" must be a nonnegative number or blank.\");\n  return value;\n}\nfunction exactKeys(value, keys, name) {\n  if (!value || typeof value !== \"object\" || Array.isArray(value)) throw Error(\"Open a valid \" + name + \".\");\n  if (Object.keys(value).some(key => !keys.includes(key)) || keys.some(key => !Object.hasOwn(value, key))) throw Error(name + \" fields changed.\");\n}\nfunction now(value) {\n  if (typeof value !== \"string\" || !/^\\d{4}-\\d\\d-\\d\\dT\\d\\d:\\d\\d:\\d\\d(?:\\.\\d{3})?Z$/.test(value) || !Number.isFinite(Date.parse(value))) throw Error(\"Use a valid UTC operation time.\");\n  return value;\n}\nfunction pointerParts(pointer) {\n  text(pointer, \"JSON pointer\", 1000);\n  if (pointer === \"\") return [];\n  if (!pointer.startsWith(\"/\") || /~(?![01])/.test(pointer)) throw Error(\"Use a JSON pointer such as /customer/name; escape ~ as ~0 and / as ~1.\");\n  return pointer.slice(1).split(\"/\").map(part => part.replace(/~1/g, \"/\").replace(/~0/g, \"~\"));\n}\nfunction lookup(value, pointer) {\n  for (const key of pointerParts(pointer)) {\n    if (value === null || typeof value !== \"object\" || !Object.hasOwn(value, key)) return {found: false};\n    value = value[key];\n  }\n  return {found: true, value};\n}\nfunction blankConfig() {\n  return {report_name:\"\", client:\"\", source_system:\"\", existing_process:\"\", operator:\"\", recipient:\"\",\n    route:\"browser\", cadence:\"\", requests_per_month:null, existing_minutes:null, pilot_minutes:null,\n    maintenance_minutes:null, data_notes:\"\", delivery_notes:\"\"};\n}\nfunction validateConfig(config) {\n  exactKeys(config, Object.keys(blankConfig()), \"report configuration\");\n  for (const key of Object.keys(config)) {\n    if ([\"requests_per_month\",\"existing_minutes\",\"pilot_minutes\",\"maintenance_minutes\"].includes(key)) finite(config[key], key);\n    else text(config[key], key);\n  }\n  if (![\"browser\",\"api\",\"webhook\"].includes(config.route)) throw Error(\"Choose browser, API or webhook.\");\n  if (config.requests_per_month !== null && !Number.isSafeInteger(config.requests_per_month)) throw Error(\"Monthly requests must be a whole number.\");\n  return config;\n}\nfunction validateSource(source) {\n  exactKeys(source, [\"format\",\"text\",\"records_pointer\"], \"sample source\");\n  if (![\"json\",\"jsonl\"].includes(source.format)) throw Error(\"Choose JSON or JSONL.\");\n  text(source.text, \"Sample\", 1048576);\n  if (Sha.sha256Utf8(source.text).bytes > 1048576) throw Error(\"This preparation workspace accepts sample text up to 1 MiB.\");\n  pointerParts(source.records_pointer);\n  if (source.format === \"jsonl\" && source.records_pointer !== \"\") throw Error(\"JSONL uses each nonempty line as one record; leave the records pointer blank.\");\n  return source;\n}\nfunction validateColumns(columns) {\n  if (!Array.isArray(columns) || columns.length > 128) throw Error(\"Use up to 128 explicit columns.\");\n  const names = new Set();\n  for (const column of columns) {\n    exactKeys(column, [\"name\",\"pointer\",\"type\",\"required\"], \"column\");\n    text(column.name, \"Column heading\", 160);\n    if (!column.name.trim() || names.has(column.name)) throw Error(\"Column headings must be nonempty and unique.\");\n    names.add(column.name); pointerParts(column.pointer);\n    if (![\"preserve\",\"text\",\"number\",\"boolean\",\"date\",\"json\"].includes(column.type)) throw Error(\"Choose an available column type.\");\n    if (typeof column.required !== \"boolean\") throw Error(\"Column required flag must be true or false.\");\n  }\n  return columns;\n}\nfunction validateProposal(proposal) {\n  exactKeys(proposal, [\"config\",\"source\",\"columns\"], \"report proposal\");\n  validateConfig(proposal.config); validateSource(proposal.source); validateColumns(proposal.columns);\n  return proposal;\n}\nfunction proposalOf(project) { return clone({config:project.config,source:project.source,columns:project.columns}); }\nfunction contractHash(project) { return hash(proposalOf(project)); }\nfunction parseData(body,label) {\n let parsed;try{parsed=JSON.parse(body);}catch{throw Error(label+\" is not valid JSON.\");}\n let quoted=false,escaped=false;\n const token=/-?(?:0|[1-9]\\d*)(?:\\.\\d+)?(?:[eE][+-]?\\d+)?/y;\n for(let i=0;i\u003cbody.length;i++){\n  const c=body[i];\n  if(quoted){if(escaped)escaped=false;else if(c===\"\\\\\")escaped=true;else if(c==='\"')quoted=false;continue;}\n  if(c==='\"'){quoted=true;continue;}\n  if(c===\"-\"||(c>=\"0\"&&c\u003c=\"9\")){\n   token.lastIndex=i;const matched=token.exec(body);if(!matched)continue;\n   const value=Number(matched[0]);\n   if(!Number.isFinite(value)||(Number.isInteger(value)&&!Number.isSafeInteger(value)))throw Error(label+\" contains a number outside the exact supported integer/finite range. Quote identifiers or precise decimal values and select text; keep the original source unchanged.\");\n   i=token.lastIndex-1;\n  }\n }\n return parsed;\n}\nfunction records(source) {\n  validateSource(source);\n  if (!source.text.trim()) return [];\n  let value;\n  if (source.format === \"jsonl\") {\n    value = source.text.split(/\\r?\\n/).map((line,index) => ({line,index})).filter(x => x.line.trim())\n      .map(x => { return parseData(x.line,\"JSON on line \"+(x.index+1));});\n  } else {\n    value = parseData(source.text,\"The sample\");\n    const selected = lookup(value, source.records_pointer);\n    if (!selected.found) throw Error(\"The records pointer does not exist in the sample.\");\n    value = selected.value;\n    if (!Array.isArray(value)) value = [value];\n  }\n  if (value.length > 20000) throw Error(\"Prepare a representative sample of at most 20,000 records.\");\n  if (value.some(row => row === null || typeof row !== \"object\" || Array.isArray(row))) throw Error(\"The selected records must be JSON objects.\");\n  return value;\n}\nfunction convert(value, type) {\n  if (value === null) return null;\n  if (type === \"json\") return JSON.stringify(value);\n  if (type === \"preserve\") return clone(value);\n  if (type === \"text\") {\n    if (typeof value === \"object\") throw Error(\"Choose JSON for an object or list.\");\n    return String(value);\n  }\n  if (type === \"number\") {\n    if (typeof value === \"string\" && !/^-?(?:0|[1-9]\\d*)(?:\\.\\d+)?(?:[eE][+-]?\\d+)?$/.test(value)) throw Error(\"Expected a JSON-format number.\");\n    const n = typeof value === \"number\" ? value : Number(value);\n    if (![\"string\",\"number\"].includes(typeof value) || !Number.isFinite(n) || (Number.isInteger(n)&&!Number.isSafeInteger(n))) throw Error(\"Expected a finite number within the exact supported integer range; keep identifiers or precise decimal values as text.\");\n    return n;\n  }\n  if (type === \"boolean\") {\n    if (value === true || value === \"true\") return true;\n    if (value === false || value === \"false\") return false;\n    throw Error('Expected true or false.');\n  }\n  if (type === \"date\") {\n    if (typeof value !== \"string\" || !/^\\d{4}-\\d\\d-\\d\\d$/.test(value)) throw Error(\"Expected YYYY-MM-DD.\");\n    const d = new Date(value + \"T00:00:00Z\");\n    if (!Number.isFinite(d.valueOf()) || d.toISOString().slice(0,10) !== value) throw Error(\"The calendar date does not exist.\");\n    return value;\n  }\n  throw Error(\"Unknown column type.\");\n}\nfunction compile(project) {\n  validateProposal(proposalOf(project));\n  const input = records(project.source), issues = [], rows = []; let issue_count=0;\n  if(input.length*project.columns.length>200000)throw Error(\"Use a smaller preparation sample: at most 200,000 selected cells.\");\n  function issue(item){issue_count++;if(issues.length\u003c500)issues.push(item);}\n  if (!project.columns.length && input.length) issue({row:0,column:\"\",message:\"Add explicit columns to prepare the request.\"});\n  for (let index = 0; index \u003c input.length; index++) {\n    const row = Object.create(null);\n    for (const column of project.columns) {\n      const selected = lookup(input[index], column.pointer);\n      if (!selected.found || selected.value === null) {\n        if (column.required) issue({row:index+1,column:column.name,message:selected.found?\"Required value is null.\":\"Required field is absent.\"});\n        row[column.name] = null;\n      } else {\n        try { row[column.name] = convert(selected.value, column.type); }\n        catch (error) { issue({row:index+1,column:column.name,message:error.message}); row[column.name]=null; }\n      }\n    }\n    rows.push(row);\n  }\n  return {rows,input_rows:input.length,issues,issue_count,ready:input.length>0&&project.columns.length>0&&issue_count===0,\n    contract_sha256:contractHash(project)};\n}\nfunction validateSeed(seed) {\n  exactKeys(seed, [\"edition\",\"title\",\"pack_id\",\"edition_id\",\"leads\",\"product_sources\"], \"edition source\");\n  for (const name of [\"edition\",\"title\",\"pack_id\",\"edition_id\"]) text(seed[name],name,500);\n  if (![\"sample\",\"paid\"].includes(seed.edition)||!Array.isArray(seed.leads)||seed.leads.length!==(seed.edition===\"sample\"?1:5)) throw Error(\"Open the original selected customer edition.\");\n  const ids=new Set();\n  for(const lead of seed.leads) {\n    if(!lead||typeof lead.id!==\"string\"||!lead.id.startsWith(seed.pack_id+\":\")||ids.has(lead.id)||!lead.document||typeof lead.document.organization!==\"string\")throw Error(\"Original agency selection is invalid.\");\n    ids.add(lead.id);\n  }\n  if(!Array.isArray(seed.product_sources))throw Error(\"Retain the complete product source notes.\");\n  return seed;\n}\nfunction create(seed) {\n  validateSeed(seed);\n  const root={version:VERSION,revision:0,seed:clone(seed),seed_sha256:hash(seed),projects:{},events:[]};\n  for(const lead of seed.leads)root.projects[lead.id]={revision:0,config:blankConfig(),source:{format:\"json\",text:\"\",records_pointer:\"\"},columns:[],runs:[],handovers:[],history:[]};\n  return validate(root);\n}\nfunction verifyOperationHistory(root) {\n const replay={};\n for(const lead of root.seed.leads)replay[lead.id]={revision:0,proposal:{config:blankConfig(),source:{format:\"json\",text:\"\",records_pointer:\"\"},columns:[]},runs:new Set(),handovers:new Set()};\n for(const event of root.events){\n  const original=root.projects[event.lead_id],current=replay[event.lead_id];let input;\n  if(event.kind===\"save\"){\n   const old=original.history[current.revision],next=original.history[current.revision+1];\n   if(!old||old.at!==event.at||stable(old.proposal)!==stable(current.proposal))throw Error(\"Saved proposal history does not match its original operation.\");\n   input=next?next.proposal:proposalOf(original);\n   current.proposal=clone(input);current.revision++;\n  }else if(event.kind===\"record-run\"){\n   const run=original.runs.find(x=>x.id===event.id);\n   if(!run||current.runs.has(event.id)||run.at!==event.at||run.contract_sha256!==hash(current.proposal)||!compile(current.proposal).ready)throw Error(\"Actual result does not match its original report operation.\");\n   input=clone(run);for(const k of [\"id\",\"at\",\"contract_sha256\"])delete input[k];current.runs.add(event.id);\n  }else{\n   const handover=original.handovers.find(x=>x.id===event.id);\n   if(!handover||current.handovers.has(event.id)||handover.at!==event.at||handover.contract_sha256!==hash(current.proposal)||stable(handover.proposal)!==stable(current.proposal))throw Error(\"Handover does not match its original report operation.\");\n   const compiled=compile(current.proposal);if(!compiled.ready||stable(compiled.rows)!==stable(handover.rows))throw Error(\"Handover rows differ from their selected source.\");\n   input={title:handover.title};current.handovers.add(event.id);\n  }\n  if(event.project_revision!==current.revision||event.request_sha256!==hash({id:event.id,expected_revision:event.sequence-1,lead_id:event.lead_id,kind:event.kind,input}))throw Error(\"The complete saved operation content changed.\");\n }\n for(const[id,current]of Object.entries(replay)){\n  const original=root.projects[id];\n  if(current.revision!==original.revision||stable(current.proposal)!==stable(proposalOf(original))||current.runs.size!==original.runs.length||current.handovers.size!==original.handovers.length)throw Error(\"Current report or result history contains an unrecorded change.\");\n }\n}\nfunction validate(root, expectedSeedHash) {\n  exactKeys(root,[\"version\",\"revision\",\"seed\",\"seed_sha256\",\"projects\",\"events\"],\"working project\");\n  if(root.version!==VERSION||!Number.isSafeInteger(root.revision)||root.revision\u003c0)throw Error(\"Working project version is invalid.\");\n  validateSeed(root.seed);\n  if(root.seed_sha256!==hash(root.seed)||(expectedSeedHash&&root.seed_sha256!==expectedSeedHash))throw Error(\"This working file belongs to a different original customer edition.\");\n  if(!root.projects||Array.isArray(root.projects)||typeof root.projects!==\"object\"||!Array.isArray(root.events)||root.events.length!==root.revision)throw Error(\"Working project history is incomplete.\");\n  const ids=root.seed.leads.map(x=>x.id);\n  if(Object.keys(root.projects).length!==ids.length||ids.some(id=>!Object.hasOwn(root.projects,id)))throw Error(\"Keep the original agency selection.\");\n  const operationIds=new Set();\n  for(let i=0;i\u003croot.events.length;i++) {\n    const e=root.events[i];\n    exactKeys(e,[\"id\",\"sequence\",\"lead_id\",\"kind\",\"at\",\"request_sha256\",\"project_revision\"],\"event\");\n    text(e.id,\"operation id\",200);now(e.at);\n    if(!e.id||operationIds.has(e.id)||e.sequence!==i+1||!ids.includes(e.lead_id)||![\"save\",\"record-run\",\"handover\"].includes(e.kind)||typeof e.request_sha256!==\"string\")throw Error(\"Original operation history changed.\");\n    operationIds.add(e.id);\n  }\n  for(const id of ids) {\n    const p=root.projects[id];\n    exactKeys(p,[\"revision\",\"config\",\"source\",\"columns\",\"runs\",\"handovers\",\"history\"],\"agency project\");\n    if(!Number.isSafeInteger(p.revision)||p.revision\u003c0||!Array.isArray(p.runs)||!Array.isArray(p.handovers)||!Array.isArray(p.history)||p.history.length!==p.revision)throw Error(\"Agency revision history is incomplete.\");\n    validateProposal(proposalOf(p));\n    for(let i=0;i\u003cp.history.length;i++){const h=p.history[i];exactKeys(h,[\"revision\",\"at\",\"proposal\"],\"saved proposal\");if(h.revision!==i)throw Error(\"Saved proposal sequence changed.\");now(h.at);validateProposal(h.proposal);}\n    for(const run of p.runs)validateRun(run,true);\n    for(const h of p.handovers){exactKeys(h,[\"id\",\"at\",\"title\",\"contract_sha256\",\"proposal\",\"rows\"],\"handover\");text(h.id,\"handover id\",200);now(h.at);text(h.title,\"handover title\",200);validateProposal(h.proposal);if(h.contract_sha256!==hash(h.proposal)||!Array.isArray(h.rows)||stable(compile(h.proposal).rows)!==stable(h.rows)||!compile(h.proposal).ready)throw Error(\"Saved handover content changed.\");}\n    if(root.events.filter(e=>e.lead_id===id&&e.kind===\"save\").length!==p.revision)throw Error(\"Project revision and event history differ.\");\n  }\n  verifyOperationHistory(root);\n  if(Sha.sha256Utf8(JSON.stringify(root,null,2)+\"\\n\").bytes>20971520)throw Error(\"This change exceeds the 20 MiB complete working-file limit. Download the current copy, then open the edition’s original working.json to start another report with a smaller representative sample.\");\n  return root;\n}\nfunction validateRun(run,stored=false) {\n  exactKeys(run,stored?[\"id\",\"at\",\"contract_sha256\",\"status\",\"output_name\",\"output_rows\",\"minutes\",\"notes\",\"returned_json\"]:[\"status\",\"output_name\",\"output_rows\",\"minutes\",\"notes\",\"returned_json\"],\"actual run\");\n  if(![\"accepted\",\"needs-work\"].includes(run.status))throw Error(\"Choose accepted or needs work.\");\n  text(run.output_name,\"Returned file\",500);text(run.notes,\"Actual result notes\",8000);text(run.returned_json,\"Returned JSON\",1048576);if(run.returned_json.trim()) returnedRows(run.returned_json);finite(run.output_rows,\"Returned rows\");finite(run.minutes,\"Actual minutes\");\n  if(run.output_rows!==null&&!Number.isSafeInteger(run.output_rows))throw Error(\"Returned rows must be a whole number.\");\n  if(!run.notes.trim())throw Error(\"Record what happened in the actual conversion or handover.\");\n  if(stored){text(run.id,\"run id\",200);now(run.at);if(typeof run.contract_sha256!==\"string\")throw Error(\"Run binding is missing.\");}\n  return run;\n}\nfunction apply(root, request, at) {\n  validate(root);now(at);\n  exactKeys(request,[\"id\",\"expected_revision\",\"lead_id\",\"kind\",\"input\"],\"operation\");\n  text(request.id,\"operation id\",200);\n  if(!request.id)throw Error(\"Operation identity is required.\");\n  const digest=hash(request),existing=root.events.find(e=>e.id===request.id);\n  if(existing){if(existing.request_sha256!==digest)throw Error(\"This operation identity was already used for different content.\");return {root:clone(root),replayed:true};}\n  if(request.expected_revision!==root.revision)throw Error(\"The working project changed. Reopen the current copy before saving.\");\n  if(!Object.hasOwn(root.projects,request.lead_id))throw Error(\"Select an agency in this edition.\");\n  const next=clone(root),p=next.projects[request.lead_id];\n  if(request.kind===\"save\") {\n    validateProposal(request.input);\n    p.history.push({revision:p.revision,at,proposal:proposalOf(p)});\n    Object.assign(p,clone(request.input));p.revision++;\n  } else if(request.kind===\"record-run\") {\n    validateRun(request.input);\n    const result=compile(p);if(!result.ready)throw Error(\"Prepare a valid report request before recording its actual result.\");\n    p.runs.push({id:request.id,at,contract_sha256:result.contract_sha256,...clone(request.input)});\n  } else if(request.kind===\"handover\") {\n    exactKeys(request.input,[\"title\"],\"handover title\");text(request.input.title,\"Handover title\",200);\n    if(!request.input.title.trim())throw Error(\"Name this client handover.\");\n    const result=compile(p);if(!result.ready)throw Error(\"Resolve the report fields before preparing this handover.\");\n    p.handovers.push({id:request.id,at,title:request.input.title,contract_sha256:result.contract_sha256,proposal:proposalOf(p),rows:result.rows});\n  } else throw Error(\"Unknown operation.\");\n  next.revision++;\n  next.events.push({id:request.id,sequence:next.revision,lead_id:request.lead_id,kind:request.kind,at,request_sha256:digest,project_revision:p.revision});\n  validate(next,root.seed_sha256);\n  return {root:next,replayed _minutes:c.requests_per_month*(c.existing_minutes-c.pilot_minutes)-c.maintenance_minutes};\n}\nfunction requestBody(project) {\n  const result=compile(project);\n  if(!result.ready)throw Error(\"Resolve the sample and explicit fields before downloading the API request.\");\n  return JSON.stringify({data:result.rows},null,2)+\"\\n\";\n}\nfunction exportWorking(root) { validate(root);return JSON.stringify(root,null,2)+\"\\n\"; }\nfunction receiveWorking(textBody,seedHash) {\n  text(textBody,\"Working file\",20971520);\n  let root;try{root=JSON.parse(textBody);}catch{throw Error(\"The working file is not valid JSON.\");}\n  return clone(validate(root,seedHash));\n}\nmodule.exports={VERSION,API,hash,clone,create,validate,apply,compile,records,lookup,pointerParts,proposalOf,contractHash,requestBody,previewCsv,estimate,exportWorking,receiveWorking,returnedRows,compareReturned};\n","bytes":21614,"sha256":"1bef68520cc0ee38420e4566d0c57ca7212b09a4462f9dec670d0c1aa420f749"},{"path":"desk/report-view.cjs","content":"\"use strict\";\nconst STYLE=\"#json-report-desk{font:16px/1.5 system-ui,-apple-system,BlinkMacSystemFont,\\\"Segoe UI\\\",sans-serif;color:#202124;background:#f6f6f5;max-width:1440px;margin:auto;padding:24px;box-sizing:border-box}#json-report-desk *,#json-report-desk *:before,#json-report-desk *:after{box-sizing:border-box}#json-report-desk a{color:#202124;text-decoration:underline}#json-report-desk p,#json-report-desk li,#json-report-desk a,#json-report-desk pre,#json-report-desk td{overflow-wrap:anywhere}#json-report-desk h1{font-size:30px;line-height:1.2;margin:5px 0 12px}#json-report-desk h2{font-size:25px;margin:0}#json-report-desk h3{font-size:20px;margin:0 0 12px}#json-report-desk h4{font-size:16px;margin:20px 0 7px}#json-report-desk p{margin:10px 0}#json-report-desk button,#json-report-desk input,#json-report-desk select,#json-report-desk textarea{font:inherit;max-width:100%;border-radius:2px}#json-report-desk button{background:#262626;color:#fff;border:1p
