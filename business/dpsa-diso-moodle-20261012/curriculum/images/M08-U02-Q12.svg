<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" role="img" aria-labelledby="title desc">
<title id="title">Review the complete service architecture</title><desc id="desc">A: Staff sign in through the departmental identity service. B: The API receives a record ID and a requested payment action. C: Supplier support connects to selected departmental datasets. D: The recovery site needs keys and access during an outage.</desc>
<rect width="100%" height="100%" fill="#fff"/>
<g font-family="DejaVu Sans, sans-serif" fill="#111"><text x="16" y="20" font-size="17" font-weight="bold">Review the complete service architecture</text><text x="16" y="39" font-size="12">Match each marked boundary to its required control.</text>
<rect x="16" y="54" width="296" height="144" fill="#fafafa" stroke="#555"/><text x="28" y="77" font-size="16" font-weight="bold">A</text>
<text x="28" y="102" font-size="14">Staff sign in through the</text>
<text x="28" y="122" font-size="14">departmental identity service.</text>
<rect x="26" y="149" width="270" height="32" fill="#fff" stroke="#777" stroke-dasharray="4 3"/>
<rect x="328" y="54" width="296" height="144" fill="#fafafa" stroke="#555"/><text x="340" y="77" font-size="16" font-weight="bold">B</text>
<text x="340" y="102" font-size="14">The API receives a record ID</text>
<text x="340" y="122" font-size="14">and a requested payment action.</text>
<rect x="338" y="149" width="270" height="32" fill="#fff" stroke="#777" stroke-dasharray="4 3"/>
<rect x="16" y="232" width="296" height="144" fill="#fafafa" stroke="#555"/><text x="28" y="255" font-size="16" font-weight="bold">C</text>
<text x="28" y="280" font-size="14">Supplier support connects to</text>
<text x="28" y="300" font-size="14">selected departmental datasets.</text>
<rect x="26" y="327" width="270" height="32" fill="#fff" stroke="#777" stroke-dasharray="4 3"/>
<rect x="328" y="232" width="296" height="144" fill="#fafafa" stroke="#555"/><text x="340" y="255" font-size="16" font-weight="bold">D</text>
<text x="340" y="280" font-size="14">The recovery site needs keys</text>
<text x="340" y="300" font-size="14">and access during an outage.</text>
<rect x="338" y="327" width="270" height="32" fill="#fff" stroke="#777" stroke-dasharray="4 3"/>
<path d="M312 117 L328 117 m-6 -4 l6 4 -6 4" fill="none" stroke="#333" stroke-width="2"/>
<path d="M312 295 L328 295 m-6 -4 l6 4 -6 4" fill="none" stroke="#333" stroke-width="2"/>
</g>
</svg>
