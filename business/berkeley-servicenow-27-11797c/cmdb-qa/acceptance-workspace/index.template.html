<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light"><title>CMDB acceptance workspace</title><style>/*STYLE*/</style></head>
<body><header><div><p class="eyebrow">TJLabs · Data operations</p><h1>CMDB acceptance workspace</h1><p>Receive exports, review changes and deliver an editable acceptance record.</p></div><div class="header-actions"><label>Operating person<input id="actor" autocomplete="name" placeholder="Your name"></label><button id="save-file">Save private workspace</button><button id="package">Download complete handover</button></div></header>
<section class="workspace-bar"><label>Saved workspace<select id="workspace-select" aria-label="Saved workspace"></select></label><button data-action="new">New workspace</button><label class="file-button">Open saved workspace<input id="open-file" type="file" accept=".json,application/json"></label><button data-action="example">Open worked example</button><button id="retry" hidden>Continue saved operation</button><span id="save-state" role="status"></span></section>
<div id="notice" class="notice" role="status" aria-live="polite" hidden></div>
<nav aria-label="Operating steps"><button data-tab="overview">Overview</button><button data-tab="intake">1. Receive exports</button><button data-tab="mapping">2. Map fields</button><button data-tab="comparison">3. Compare & review</button><button data-tab="receiving">4. Acceptance & handover</button><button data-tab="history">History</button></nav>
<main id="content"></main>
<dialog id="new-dialog"><form id="new-form"><h2>New acceptance workspace</h2><label>Workspace name<input name="label" required value="CMDB acceptance"></label><label>Customer<input name="customer" required></label><label>CMDB class or agreed scope<input name="tableClass" value="Hardware assets" required></label><label>Operating owner<input name="owner" required></label><div class="actions"><button type="button" data-action="cancel-new">Cancel</button><button type="submit" class="primary">Create workspace</button></div></form></dialog>
<footer>Files and working data stay in this browser. Save the complete private workspace to continue on another machine. <a href="#guide" data-action="guide">Operating guide</a></footer>
<script type="application/json" id="source-bundle">/*SOURCE*/</script><script type="application/json" id="included-workspace">/*WORKING*/</script>
<script>/*RUNTIME*/</script></body></html>
