<script type="application/json" id="source-bundle">{"schema":"cmdb-acceptance-complete-source/1","files":{"../cmdb_qa.mjs":"// MIT — Berkeley ServiceNow RFP 27-11797-C: offline, vendor-neutral acceptance aid.\n// Not a ServiceNow connector. Requires operator-authorized local CSV exports.\nimport { createHash } from 'node:crypto';\nimport { readFileSync, writeFileSync, mkdirSync, renameSync } from 'node:fs';\nimport { resolve, join } from 'node:path';\nimport { pathToFileURL } from 'node:url';\n\nexport const DEFAULT_FIELDS = Object.freeze([\n  'name', 'sys_class_name', 'assigned_to', 'install_status', 'serial_number', 'location',\n]);\nconst MAX_BYTES = 16 * 1024 * 1024;\nconst MAX_RECORDS = 100_000;\nconst sha256 = value => createHash('sha256').update(value).digest('hex');\nconst cmp = (a, b) => a \u003c b ? -1 : a > b ? 1 : 0;\n\n/** RFC 4180-style quoted fields, escaped quotes, embedded line breaks and UTF-8 BOM. */\nexport function parseCsv(source, { maxRows = MAX_RECORDS } = {}) {\n  if (typeof source !== 'string') throw new TypeError('CSV_TEXT_REQUIRED');\n  if (Buffer.byteLength(source, 'utf8') > MAX_BYTES) throw new RangeError('CSV_BYTE_LIMIT');\n  if (source.includes('\\0') || source.includes('\\uFFFD')) throw new TypeError('CSV_INVALID_ENCODING');\n  const s = source.startsWith('\\uFEFF') ? source.slice(1) : source;\n  const rows = []; let row = []; let field = ''; let quoted = false;\n  let closed = false; let rowCount = 0;\n  function finishField() { row.push(field); field = ''; closed = false; }\n  function finishRow() {\n    finishField(); rows.push(row); row = []; rowCount++;\n    if (rowCount > maxRows + 1) throw new RangeError('CSV_RECORD_LIMIT');\n  }\n  for (let i = 0; i \u003c s.length; i++) {\n    const c = s[i];\n    if (quoted) {\n      if (c === '\"') {\n        if (s[i+1] === '\"') { field += '\"'; i++; }\n        else { quoted = false; closed = true; }\n      } else field += c;\n    } else if (c === ',') finishField();\n    else if (c === '\\n' || c === '\\r') {\n      if (c === '\\r' && s[i+1] === '\\n') i++;\n      finishRow();\n    } else if (c === '\"' && field === '' && !closed) quoted = true;\n    else if (c === '\"' || closed) throw new TypeError('CSV_QUOTE_INVALID');\n    else field += c;\n  }\n  if (quoted) throw new TypeError('CSV_UNTERMINATED_QUOTE');\n  if (field !== '' || row.length > 0 || closed) finishRow();\n  if (!rows.length) throw new TypeError('CSV_EMPTY');\n  const headers = rows.shift().map(v => v.trim());\n  if (headers.some(v => !v || v.length > 128) || new Set(headers).size !== headers.length) {\n    throw new TypeError('CSV_HEADER_INVALID_OR_DUPLICATE');\n  }\n  return { headers, records: rows.map((cells, index) => {\n    if (cells.length !== headers.length) throw new TypeError(`CSV_COLUMN_COUNT:${index + 2}`);\n    return Object.fromEntries(headers.map((name, col) => [name, cells[col]]));\n  }) };\n}\n\nfunction validateTable(text, required, key, label) {\n  const table = parseCsv(text);\n  for (const name of required) {\n    if (!table.headers.includes(name)) throw new TypeError(`${label}_FIELD_MISSING:${name}`);\n  }\n  const byId = new Map();\n  for (const [index, row] of table.records.entries()) {\n    const id = row[key];\n    if (!id || id !== id.trim() || id.length > 512 || /[\\x00-\\x1f\\x7f]/.test(id)) {\n      throw new TypeError(`${label}_RECORD_KEY_INVALID:${index+2}`);\n    }\n    if (byId.has(id)) throw new TypeError(`${label}_DUPLICATE_KEY:${id}`);\n    byId.set(id, row);\n  }\n  return { byId, count: table.records.length };\n}\n\n/** Exact-string comparison, no invented key joins or normalization. Hashes avoid raw value disclosure. */\nexport function reconcileCsv(beforeText, afterText, { key = 'sys_id', fields = DEFAULT_FIELDS } = {}) {\n  if (typeof key !== 'string' || !key.trim() || !Array.isArray(fields) || !fields.length ||\n      fields.some(v => typeof v !== 'string' || !v || v === key) ||\n      new Set(fields).size !== fields.length) throw new TypeError('AUDIT_FIELD_SPEC_INVALID');\n  const required = [key, ...fields];\n  const before = validateTable(beforeText, required, key, 'SOURCE');\n  const after = validateTable(afterText, required, key, 'TARGET');\n  const ids = [...new Set([...before.byId.keys(), ...after.byId.keys()])].sort(cmp);\n  const findings = [];\n  for (const id of ids) {\n    const a = before.byId.get(id), b = after.byId.get(id);\n    if (!a || !b) {\n      findings.push({ record_key: id, reason: a ? 'RECORD_REMOVED' : 'RECORD_ADDED',\n        field: '*', severity: a ? 'critical' : 'review',\n        before_sha256: a ? sha256(JSON.stringify(required.map(f => a[f]))) : '',\n        after_sha256: b ? sha256(JSON.stringify(required.map(f => b[f]))) : '' });\n      continue;\n    }\n    for (const field of fields) {\n      if (a[field] !== b[field]) findings.push({ record_key: id, reason: 'FIELD_CHANGED', field,\n        severity: ['sys_class_name', 'assigned_to', 'install_status'].includes(field) ? 'critical' : 'review',\n        before_sha256: sha256(a[field]), after_sha256: sha256(b[field]) });\n    }\n  }\n  const reasons = Object.fromEntries([...new Set(findings.map(f => f.reason))].sort(cmp)\n    .map(reason => [reason, findings.filter(f => f.reason === reason).length]));\n  return {\n    schema: 'berkeley-servicenow-cmdb-qa/v1',\n    result: findings.length ? 'REVIEW_REQUIRED' : 'PASS',\n    source_sha256: sha256(beforeText), target_sha256: sha256(afterText),\n    fields: { key, compared: [...fields] },\n    summary: { source_records: before.count, target_records: after.count,\n      findings: findings.length, critical: findings.filter(f => f.severity === 'critical').length, by_reason: reasons },\n    findings,\n  };\n}\n\nconst COLS = ['record_key','reason','field','severity','before_sha256','after_sha256'];\nexport function findingsCsv(findings) {\n  const safe = v => {\n    let str = String(v ?? '');\n    // Excel/Sheets formula injection protection, even for untrusted identifier strings.\n    if (/^[\\s]*[=+\\-@]/u.test(str)) str = \"'\" + str;\n    return '\"' + str.replaceAll('\"','\"\"') + '\"';\n  };\n  return [COLS.join(','), ...findings.map(f => COLS.map(k => safe(f[k])).join(','))].join('\\r\\n') + '\\r\\n';\n}\n\nfunction argsOf(argv) {\n  const opts = {};\n  for (let i = 0; i \u003c argv.length; i+=2) {\n    const flag = argv[i];\n    if (!['--source','--target','--out','--fields'].includes(flag) || !argv[i+1] || opts[flag]) {\n      throw new TypeError('CLI_USAGE: --source before.csv --target after.csv --out DIRECTORY [--fields col,col]');\n    }\n    opts[flag] = argv[i+1];\n  }\n  if (!opts['--source'] || !opts['--target'] || !opts['--out']) throw new TypeError('CLI_USAGE');\n  return opts;\n}\n\nexport function runCli(argv) {\n  const options = argsOf(argv);\n  const fields = options['--fields'] ? options['--fields'].split(',') : DEFAULT_FIELDS;\n  const source = readFileSync(resolve(options['--source']), 'utf8');\n  const target = readFileSync(resolve(options['--target']), 'utf8');\n  const audit = reconcileCsv(source, target, { fields });\n  const dir = resolve(options['--out']); mkdirSync(dir, { recursive: true });\n  // The two outputs are deterministic for identical inputs and settings.\n  for (const [name, value] of [\n    ['audit.json', JSON.stringify(audit, null, 2) + '\\n'],\n    ['discrepancies.csv', findingsCsv(audit.findings)],\n  ]) {\n    const tmp = join(dir, `.${name}.${process.pid}.tmp`);\n    writeFileSync(tmp, value, { mode: 0o600 });\n    renameSync(tmp, join(dir, name));\n  }\n  console.log(`${audit.result} findings=${audit.summary.findings} critical=${audit.summary.critical}`);\n  return audit.result === 'PASS' ? 0 : 1;\n}\n\nif (process.argv[1] && import.meta.url === pathToFileURL(resolve(process.argv[1])).href) {\n  try { process.exitCode = runCli(process.argv.slice(2)); }\n  catch (e) { console.error(`INPUT_REJECTED: ${e.message}`); process.exitCode = 2; }\n}\n","../cmdb_qa.test.mjs":"// Focused offline regression on this one changed utility; no hosted Actions.\nimport test from 'node:test';\nimport assert from 'node:assert/strict';\nimport { mkdtempSync, readFileSync, writeFileSync, rmSync } from 'node:fs';\nimport { tmpdir } from 'node:os';\nimport { join } from 'node:path';\nimport { spawnSync } from 'node:child_process';\nimport { parseCsv, reconcileCsv, findingsCsv } from './cmdb_qa.mjs';\n\nconst h = 'sys_id,name,sys_class_name,assigned_to,install_status,serial_number,location';\nconst row = (id, name, owner = 'tech-1', status = 'installed', serial = 'SN1', location = 'Office') =>\n  [id, name, 'cmdb_ci_computer', owner, status, serial, location].join(',');\n\n// One test covering parser, audit invariants, fail-closed inputs and CLI receipts.\ntest('quote parsing, source/target reconciliation, evidence redaction and offline exit contract', () => {\n  const parser = parseCsv('\\uFEFFid,description\\r\\na,\"hello, \"\"world\"\"\\r\\nwith newline\"\\r\\n');\n  assert.deepEqual(parser.headers, ['id', 'description']);\n  assert.equal(parser.records[0].description, 'hello, \"world\"\\r\\nwith newline');\n  assert.throws(() => parseCsv('id,name\\na,\"unterminated'), /CSV_UNTERMINATED_QUOTE/);\n  assert.throws(() => parseCsv('id,id\\na,b'), /CSV_HEADER_INVALID_OR_DUPLICATE/);\n  assert.throws(() => parseCsv('id,name\\na,b,c'), /CSV_COLUMN_COUNT/);\n\n  const source = [h, row('ASSET-1', 'Laptop', 'alice'), row('ASSET-2', 'Switch', 'bob')].join('\\r\\n') + '\\r\\n';\n  const same = reconcileCsv(source, source);\n  assert.equal(same.result, 'PASS');\n  assert.equal(same.summary.findings, 0);\n  assert.deepEqual(same.findings, []);\n  const changed = [h, row('ASSET-1', 'Laptop', 'charlie'), row('ASSET-3', 'Router', 'bob')].join('\\r\\n') + '\\r\\n';\n  const findings = reconcileCsv(source, changed);\n  assert.equal(findings.result, 'REVIEW_REQUIRED');\n  assert.deepEqual(findings.findings.map(f => `${f.record_key}:${f.reason}:${f.field}`), [\n    'ASSET-1:FIELD_CHANGED:assigned_to', 'ASSET-2:RECORD_REMOVED:*', 'ASSET-3:RECORD_ADDED:*',\n  ]);\n  assert.equal(findings.summary.critical, 2);\n  assert.equal(findings.summary.findings, 3);\n  assert.equal(findings.findings[0].before_sha256.length, 64);\n  assert.equal(JSON.stringify(findings).includes('alice'), false, 'private values must be hashed');\n  assert.deepEqual(reconcileCsv(source, changed), findings, 'same text produces deterministic audit');\n  const safe = findingsCsv([{ record_key: '=HYPERLINK(\"example\")', reason: 'FIELD_CHANGED',\n    field: 'assigned_to', severity: 'critical', before_sha256: '0', after_sha256: '1' }]);\n  assert.match(safe, /\"'=HYPERLINK\\(\"\"example\"\"\\)\"/);\n\n  assert.throws(() => reconcileCsv([h, row('ASSET-1', 'a'), row('ASSET-1', 'b')].join('\\n'), source), /SOURCE_DUPLICATE_KEY/);\n  assert.throws(() => reconcileCsv(source, 'sys_id,name\\na,b'), /TARGET_FIELD_MISSING/);\n  assert.throws(() => reconcileCsv(source, changed, { fields: ['name','name'] }), /AUDIT_FIELD_SPEC_INVALID/);\n\n  const dir = mkdtempSync(join(tmpdir(), 'berkeley-snow-qa-'));\n  try {\n    const src = join(dir, 'src.csv'), dst = join(dir, 'dst.csv'), out = join(dir, 'results');\n    writeFileSync(src, source); writeFileSync(dst, changed);\n    const run = spawnSync(process.execPath, [new URL('./cmdb_qa.mjs', import.meta.url).pathname,\n      '--source', src, '--target', dst, '--out', out], { encoding: 'utf8' });\n    assert.equal(run.status, 1, run.stderr);\n    assert.match(run.stdout, /REVIEW_REQUIRED findings=3 critical=2/);\n    const report = JSON.parse(readFileSync(join(out, 'audit.json'), 'utf8'));\n    assert.equal(report.summary.findings, 3);\n    assert.equal(readFileSync(join(out, 'discrepancies.csv'), 'utf8').split('\\r\\n').length, 5);\n    const rerun = spawnSync(process.execPath, [new URL('./cmdb_qa.mjs', import.meta.url).pathname,\n      '--source', src, '--target', dst, '--out', out], { encoding: 'utf8' });\n    assert.equal(rerun.status, 1);\n    assert.deepE e,column:\"\",key:\"\"}],headers:s.headers,rows:s.rows};}};\n  return {source:one(source,\"source\"),target:one(target,\"target\")};\n }\n const fingerprint=f=>hash([f.record_key,f.reason,f.field,f.before_sha256,f.after_sha256]);\n function latestReviews(w,runId){const result=new Map();for(const r of w.reviews)if(r.runId===runId)result.set(r.findingId,r);return result;}\n function reviewRows(w,runId){\n  const run=by(w.runs,runId,\"Comparison\"),reviews=latestReviews(w,runId);\n  return run.audit.findings.map(f=>({...f,id:fingerprint(f),review:reviews.get(fingerprint(f))||null,status:reviews.get(fingerprint(f))?.status||\"open\"}));\n }\n function reviewDigest(w,runId){return hash(reviewRows(w,runId).map(row=>({id:row.id,review:row.review})));}\n function acceptance(w,runId){\n  const records=w.acceptances.filter(x=>x.runId===runId),last=records.at(-1);\n  return last?{...last,current:last.reviewDigest===reviewDigest(w,runId)}:null;\n }\n function lineage(w,runId){\n  const run=by(w.runs,runId,\"Comparison\");if(!run.previousRunId)return {previousRunId:null,unchanged:0,changedOrNew:run.audit.findings.length,absent:[]};\n  const old=by(w.runs,run.previousRunId,\"Earlier comparison\"),now=new Set(run.audit.findings.map(fingerprint)),previous=new Set(old.audit.findings.map(fingerprint));\n  return {previousRunId:old.id,unchanged:[...now].filter(x=>previous.has(x)).length,changedOrNew:[...now].filter(x=>!previous.has(x)).length,\n   absent:old.audit.findings.filter(f=>!now.has(fingerprint(f)))};\n }\n function transition(workspace,command){\n  const w=metadata(workspace);\n  if(!command||typeof command!==\"object\")throw Error(\"A complete operation is required.\");\n  const requestId=id(command.requestId),actor=text(command.actor,\"Operating person\",160),at=date(command.at),action=text(command.action,\"Action\",80);\n  const payload=command.payload||{},requestDigest=hash({action,actor,at,payload});\n  const prior=w.requests.find(x=>x.id===requestId);\n  if(prior){if(prior.digest!==requestDigest)throw Error(\"This operation ID already records different work.\");return {workspace:w,result:copy(prior.result),replayed:true};}\n  if(command.expectedRevision!==w.revision)throw Error(\"Workspace changed in another window. Reload the current saved edition before applying this operation.\");\n  const next=copy(w),entityId=action+\"-\"+requestId;let result;\n  if(action===\"import\"){\n   if(![\"source\",\"target\"].includes(payload.side))throw Error(\"Choose source or target.\");\n   if(payload.parentId){const parent=by(next.snapshots,payload.parentId,\"Prior export\");if(parent.side!==payload.side)throw Error(\"A correction must retain the original export side.\");}\n   const info=inspectCsv(payload.text);\n   const row={id:entityId,side:payload.side,label:text(payload.label,\"Export label\",160),filename:text(payload.filename,\"Original filename\",240),\n    text:payload.text,...info,parentId:payload.parentId||null,note:optional(payload.note),receivedBy:actor,receivedAt:at};\n   next.snapshots.push(row);result={id:row.id,rows:row.rows,parseError:row.parseError};\n  }else if(action===\"mapping\"){\n   const row={id:entityId,label:text(payload.label,\"Mapping name\",160),...validateMapping(payload),createdBy:actor,createdAt:at};\n   next.mappings.push(row);result={id:row.id};\n  }else if(action===\"compare\"){\n   const mapping=by(next.mappings,payload.mappingId,\"Field mapping\"),source=by(next.snapshots,payload.sourceId,\"Source export\"),target=by(next.snapshots,payload.targetId,\"Target export\");\n   const selected=preview(next,source.id,target.id,mapping);\n   if(selected.source.problems.length||selected.target.problems.length)throw Error(\"Resolve all source/target column and stable-key problems before comparing.\");\n   const audit=Original.reconcileCsv(selected.source.text,selected.target.text,{key:mapping.key.name,fields:mapping.fields.map(x=>x.name)});\n   const previous=payload.previousRunId?by(next.runs,payload.previousRunId,\"Earlier comparison\"):null;\n   if(previous&&by(next.mappings,previous.mappingId,\"Earlier mapping\").key.name!==mapping.key.name)throw Error(\"Keep the same canonical stable-key name when continuing a comparison.\");\n   const row={id:entityId,label:text(payload.label,\"Comparison name\",160),sourceId:source.id,targetId:target.id,mappingId:mapping.id,\n    previousRunId:previous?.id||null,original:{source:{sha256:source.sha256,bytes:source.bytes},target:{sha256:target.sha256,bytes:target.bytes}},audit,createdBy:actor,createdAt:at};\n   next.runs.push(row);\n   if(payload.carryAccepted===true&&previous){\n    const priorMapping=by(next.mappings,previous.mappingId,\"Earlier mapping\");\n    const priorSource=by(next.snapshots,previous.sourceId,\"Earlier source export\");\n    if(priorSource.sha256!==source.sha256||priorSource.bytes!==source.bytes||\n       canonical(validateMapping(priorMapping))!==canonical(validateMapping(mapping)))\n     throw Error(\"Carry accepted changes only with the same original source baseline and complete field mapping. Disable carry to review a changed baseline or mapping.\");\n    const priorReviews=latestReviews(next,previous.id);\n    for(const f of audit.findings){const key=fingerprint(f),review=priorReviews.get(key);if(review?.status===\"accepted_change\")next.reviews.push({...copy(review),id:entityId+\"-carry-\"+key,runId:row.id,carriedFrom:review.id,actor,at});}\n   }\n   result={id:row.id,findings:audit.summary.findings,critical:audit.summary.critical};\n  }else if(action===\"review\"){\n   const run=by(next.runs,payload.runId,\"Comparison\");\n   if(!statuses.includes(payload.status))throw Error(\"Choose an exception disposition.\");\n   if(!Array.isArray(payload.findingIds)||!payload.findingIds.length||new Set(payload.findingIds).size!==payload.findingIds.length)throw Error(\"Select at least one distinct exception.\");\n   const allowed=new Set(run.audit.findings.map(fingerprint));\n   if(payload.findingIds.some(x=>!allowed.has(x)))throw Error(\"The selected exception does not belong to this comparison.\");\n   const owner=payload.status===\"open\"?optional(payload.owner,160):text(payload.owner,\"Responsible owner\",160);\n   const note=text(payload.note,\"Review note\",4000),evidence=payload.status===\"accepted_change\"?text(payload.evidence,\"Acceptance reference\",2000):optional(payload.evidence,2000);\n   const due=optional(payload.due,10);if(due&&!/^\\d{4}-\\d{2}-\\d{2}$/.test(due))throw Error(\"Use a calendar due date.\");\n   for(const findingId of payload.findingIds)next.reviews.push({id:entityId+\"-\"+findingId,runId:run.id,findingId,status:payload.status,owner,note,evidence,due,actor,at});\n   result={runId:run.id,reviewed:payload.findingIds.length};\n  }else if(action===\"accept\"){\n   const run=by(next.runs,payload.runId,\"Comparison\");\n   if(![\"ACCEPTED\",\"REVIEW_REQUIRED\",\"REJECTED\"].includes(payload.status))throw Error(\"Choose a receiving decision.\");\n   const rows=reviewRows(next,run.id),open=rows.filter(x=>x.status!==\"accepted_change\");\n   if(payload.status===\"ACCEPTED\"&&open.length)throw Error(\"Every exception needs an explicit accepted-change decision before accepting this comparison.\");\n   const row={id:entityId,runId:run.id,status:payload.status,signoffBy:text(payload.signoffBy,\"Receiving reviewer\",160),\n    authority:text(payload.authority,\"Review authority or written reference\",2000),note:text(payload.note,\"Receiving decision\",4000),actor,at,\n    reviewDigest:reviewDigest(next,run.id),source:copy(run.original),summary:copy(run.audit.summary)};\n   next.acceptances.push(row);result={id:row.id,status:row.status};\n  }else if(action===\"settings\"){\n   for(const k of [\"label\",\"customer\",\"tableClass\",\"owner\"])next[k]=text(payload[k],k,160);\n   result={id:next.id};\n  }else throw Error(\"Unknown CMDB workspace action.\");\n  next.revision++;next.updatedAt=at;\n  next.events.push({revision:next.revision,id:requestId,action,actor,at,result:copy(result)});\n  next.requests.push({id:requestId,digest:requestDigest,result:copy(result)});\n  return {workspace:next,result,replayed:false};\n }\n function validate(workspace){\n  const w=metadata(workspace);id(w.id,\"Workspace ID\");date(w.createdAt);date(w.updatedAt);\n  for(const key of [\"label\",\"customer\",\"tableClass\",\"owner\"])text(w[key],key,160);\n  for(const key of [\"snapshots\",\"mappings\",\"runs\",\"reviews\",\"acceptances\",\"requests\"])if(new Set(w[key].map(x=>x.id)).size!==w[key].length)throw Error(\"Duplicate saved \"+key+\" identity.\");\n  if(w.events.length!==w.revision||w.requests.length!==w.revision||w.events.some((e,i)=>e.revision!==i+1||e.id!==w.requests[i].id))throw Error(\"The original operation sequence is incomplete.\");\n  for(const s of w.snapshots){\n   const fresh=inspectCsv(s.text);for(const k of [\"bytes\",\"sha256\",\"headers\",\"rows\",\"parseError\"])if(canonical(s[k])!==canonical(fresh[k]))throw Error(\"Original export differs: \"+s.filename);\n   if(![\"source\",\"target\"].includes(s.side))throw Error(\"Saved export side differs.\");\n   if(s.parentId&&by(w.snapshots,s.parentId,\"Prior export\").side!==s.side)throw Error(\"Saved correction changed export side.\");\n  }\n  for(const mapping of w.mappings)validateMapping(mapping);\n  for(const run of w.runs){\n   const mapping=by(w.mappings,run.mappingId,\"Original mapping\"),s=by(w.snapshots,run.sourceId,\"Original source\"),t=by(w.snapshots,run.targetId,\"Original target\");\n   const p=preview(w,s.id,t.id,mapping);if(p.source.problems.length||p.target.problems.length)throw Error(\"A saved comparison has invalid original inputs.\");\n   const audit=Original.reconcileCsv(p.source.text,p.target.text,{key:mapping.key.name,fields:mapping.fields.map(x=>x.name)});\n   if(canonical(audit)!==canonical(run.audit)||canonical(run.original)!==canonical({source:{sha256:s.sha256,bytes:s.bytes},target:{sha256:t.sha256,bytes:t.bytes}}))throw Error(\"Saved comparison differs from its full original inputs.\");\n   if(run.previousRunId)by(w.runs,run.previousRunId,\"Earlier comparison\");\n  }\n  for(const r of w.reviews){const run=by(w.runs,r.runId,\"Review comparison\");if(!statuses.includes(r.status)||!run.audit.findings.some(f=>fingerprint(f)===r.findingId))throw Error(\"Saved review has no original exception.\");text(r.note,\"Saved review note\");text(r.actor,\"Saved reviewer\",160);date(r.at);if(r.status===\"accepted_change\"){text(r.owner,\"Acceptance owner\",160);text(r.evidence,\"Acceptance reference\",2000);}}\n  for(const a of w.acceptances){const run=by(w.runs,a.runId,\"Receiving comparison\");if(![\"ACCEPTED\",\"REVIEW_REQUIRED\",\"REJECTED\"].includes(a.status)||canonical(a.source)!==canonical(run.original)||canonical(a.summary)!==canonical(run.audit.summary))throw Error(\"Saved receiving decision differs.\");text(a.signoffBy,\"Receiving reviewer\",160);text(a.authority,\"Review reference\",2000);text(a.note,\"Receiving note\");date(a.at);}\n  return w;\n }\n function pack(w){validate(w);return {schema:PACKAGE,workspace:copy(w),sha256:hash(w)};}\n function receive(input){\n  const p=typeof input===\"string\"?JSON.parse(input):input;\n  if(!p||p.schema!==PACKAGE||p.sha256!==hash(p.workspace))throw Error(\"Open the complete unchanged workspace package.\");\n  return copy(validate(p.workspace));\n }\n const escape=v=>String(v??\"\").replace(/[&\u003c>\"']/g,c=>({\"&\":\"&amp;\",\"\u003c\":\"&lt;\",\">\":\"&gt;\",'\"':\"&quot;\",\"'\":\"&#39;\"}[c]));\n function report(w,runId){\n  const run=by(w.runs,runId,\"Comparison\"),rows=reviewRows(w,runId),decision=acceptance(w,runId);\n  const source=by(w.snapshots,run.sourceId,\"Source\"),target=by(w.snapshots,run.targetId,\"Target\"),mapping=by(w.mappings,run.mappingId,\"Mapping\");\n  const status=decision?.current?decision.status:\"REVIEW_REQUIRED\";\n  const table=(heads,items)=>\"\u003ctable>\u003cthead>\u003ctr>\"+heads.map(h=>\"\u003cth>\"+escape(h)+\"\u003c/th>\").join(\"\")+\"\u003c/tr>\u003c/thead>\u003ctbody>\"+items.map(row=>\"\u003ctr>\"+row.map(x=>\"\u003ctd>\"+escape(x)+\"\u003c/td>\").join(\"\")+\"\u003c/tr>\").join(\"\")+\"\u003c/tbody>\u003c/table>\";\n  return '\u003c!doctype html>\u003chtml lang=\"en\">\u003chead>\u003cmeta charset=\"utf-8\">\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\u003ctitle>'+escape(w.customer+\" — CMDB receiving\")+'\u003c/title>\u003cstyle>body{font:15px/1.55 system-ui,sans-serif;color:#191919;max-width:1200px;margin:24px auto;padding:0 18px}h1{font-size:28px}h2{font-size:19px;border-top:1px solid #bbb;padding-top:18px}table{border-collapse:collapse;width:100%;table-layout:fixed}th,td{border:1px solid #bbb;text-align:left;vertical-align:top;padding:8px;overflow-wrap:anywhere}th{background:#eee}p{overflow-wrap:anywhere}small{color:#555}@media print{tr{break-inside:avoid}h2{break-after:avoid}}\u003c/style>\u003c/head>\u003cbody>'+\n   \"\u003ch1>\"+escape(w.customer)+\" — CMDB acceptance\u003c/h1>\u003cp>\"+escape(w.tableClass)+\" · \"+escape(run.label)+\"\u003c/p>\u003cp>\u003cstrong>\"+escape(status.replaceAll(\"_\",\" \"))+\"\u003c/strong>\u003c/p>\"+\n   \"\u003cp>\"+escape(decision?.current?decision.note:\"Record a current receiving decision after reviewing every exception.\")+\"\u003c/p>\"+\n   (decision?\"\u003cp>Reviewer: \"+escape(decision.signoffBy)+\" · Reference: \"+escape(decision.authority)+\" · \"+escape(new Date(decision.at).toLocaleDateString(\"en-US\",{year:\"numeric\",month:\"long\",day:\"numeric\",timeZone:\"UTC\"}))+(decision.current?\"\":\" · superseded by later exception review\")+\"\u003c/p>\":\"\")+\n   \"\u003ch2>Compared exports\u003c/h2>\"+table([\"Side\",\"Original file\",\"Rows\",\"Original SHA-256\"],[[\"Source\",source.filename,source.rows,source.sha256],[\"Target\",target.filename,target.rows,target.sha256]])+\n   \"\u003ch2>Field mapping\u003c/h2>\"+table([\"Canonical field\",\"Source column\",\"Target column\"],[mapping.key,...mapping.fields].map(x=>[x.name,x.source,x.target]))+\n   \"\u003ch2>Exceptions and responsible owners\u003c/h2>\u003cp>\"+rows.length+\" findings; \"+run.audit.summary.critical+\" critical. Exact source/target values remain in the private editable workspace.\u003c/p>\"+\n   table([\"Record\",\"Finding / field\",\"Disposition\",\"Owner\",\"Decision / reference\"],rows.map(r=>[r.record_key,r.reason.replaceAll(\"_\",\" \")+\" / \"+r.field,r.status.replaceAll(\"_\",\" \"),r.review?.owner||\"Unassigned\",[r.review?.note,r.review?.evidence].filter(Boolean).join(\" — \")]))+\n   \"\u003ch2>Source and receiving\u003c/h2>\u003cp>The comparison uses the original PR481 CMDB comparator with explicit column mapping and exact string comparison. The complete editable package retains original exports, comparisons, review history and this receiving decision.\u003c/p>\u003c/body>\u003c/html>\";\n }\n function exceptionsCsv(w,runId){\n  const columns=[\"record_key\",\"reason\",\"field\",\"severity\",\"status\",\"owner\",\"due\",\"note\",\"evidence\",\"before_sha256\",\"after_sha256\"];\n  const safe=v=>{let s=String(v??\"\");if(/^\\s*[=+\\-@]/u.test(s))s=\"'\"+s;return quote(s);};\n  return [columns.join(\",\"),...reviewRows(w,runId).map(r=>columns.map(k=>safe(r[k]??r.review?.[k]??\"\")).join(\",\"))].join(\"\\r\\n\")+\"\\r\\n\";\n }\n return {SCHEMA,PACKAGE,create,transition,validate,pack,receive,preview,reviewRows,acceptance,lineage,report,exceptionsCsv,canonical,hash,inspectCsv,validateMapping,fingerprint,escape};\n});\n","index.template.html":"\u003c!doctype html>\n\u003chtml lang=\"en\">\u003chead>\u003cmeta charset=\"utf-8\">\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\u003cmeta name=\"color-scheme\" content=\"light\">\u003ctitle>CMDB acceptance workspace\u003c/title>\u003cstyle>/*STYLE*/\u003c/style>\u003c/head>\n\u003cbody>\u003cheader>\u003cdiv>\u003cp class=\"eyebrow\">TJLabs · Data operations\u003c/p>\u003ch1>CMDB acceptance workspace\u003c/h1>\u003cp>Re medium\",timeStyle:\"short\"});\nconst uid=()=>crypto.randomUUID();\nconst note=(message,error=false)=>{$(\"notice\").hidden=!message;$(\"notice\").textContent=message;$(\"notice\").className=\"notice\"+(error?\" error\":\"\");};\nfunction openDb(){return new Promise((resolve,reject)=>{const r=indexedDB.open(\"tjlabs-cmdb-acceptance\",1);r.onupgradeneeded=()=>{for(const name of [\"books\",\"meta\",\"pending\"])r.result.createObjectStore(name);};r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error);});}\nfunction read(store,key){return new Promise((resolve,reject)=>{const r=db.transaction(store,\"readonly\").objectStore(store).get(key);r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error);});}\nfunction put(store,key,value){return new Promise((resolve,reject)=>{const t=db.transaction(store,\"readwrite\");t.objectStore(store).put(value,key);t.oncomplete=resolve;t.onerror=()=>reject(t.error);t.onabort=()=>reject(t.error||Error(\"The browser could not save this operation.\"));});}\nasync function refreshPicker(){\n const rows=await new Promise((resolve,reject)=>{const r=db.transaction(\"books\",\"readonly\").objectStore(\"books\").getAll();r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error);});\n $(\"workspace-select\").innerHTML=rows.map(r=>'\u003coption value=\"'+esc(r.key)+'\" '+(r.key===activeKey?\"selected\":\"\")+'>'+esc(r.workspace.label+\" · \"+r.workspace.customer+\" · edition \"+r.workspace.revision)+'\u003c/option>').join(\"\");\n}\nasync function select(key){\n const row=await read(\"books\",key);if(!row)throw Error(\"That saved workspace could not be opened.\");\n workspace=C.validate(row.workspace);activeKey=key;pending=await read(\"pending\",key)||null;\n await put(\"meta\",\"active\",key);selectedRun=workspace.runs.at(-1)?.id||\"\";page=0;detail=\"\";draftMapping=null;\n $(\"retry\").hidden=!pending;await refreshPicker();render();\n}\nasync function addBook(w){\n C.validate(w);const key=w.id+\"-\"+C.hash(w).slice(0,16),old=await read(\"books\",key);\n if(old&&C.canonical(old.workspace)!==C.canonical(w))throw Error(\"An existing received copy has different content.\");\n if(!old)await put(\"books\",key,{key,workspace:w});\n await select(key);\n}\nfunction command(action,payload){return {requestId:uid(),expectedRevision:workspace.revision,actor:$(\"actor\").value.trim(),at:new Date().toISOString(),action,payload};}\nasync function commit(cmd){\n if(!activeKey||!workspace)throw Error(\"Create or open a workspace first.\");\n const key=activeKey;pending=cmd;$(\"retry\").hidden=false;await put(\"pending\",key,cmd);\n const result=await new Promise((resolve,reject)=>{\n  const tx=db.transaction([\"books\",\"pending\"],\"readwrite\"),books=tx.objectStore(\"books\");let value,error;\n  const r=books.get(key);\n  r.onsuccess=()=>{try{if(!r.result)throw Error(\"The original saved workspace is missing.\");value=C.transition(r.result.workspace,cmd);books.put({key,workspace:value.workspace},key);tx.objectStore(\"pending\").delete(key);}catch(e){error=e;tx.abort();}};\n  tx.oncomplete=()=>resolve(value);tx.onerror=()=>reject(error||tx.error);tx.onabort=()=>reject(error||tx.error||Error(\"The complete save did not finish.\"));\n });\n workspace=result.workspace;pending=null;$(\"retry\").hidden=true;\n await refreshPicker();return result;\n}\nconst value=id=>$(id)?.value??\"\";\nconst options=(rows,chosen,empty=\"Choose a saved item\")=>'\u003coption value=\"\">'+esc(empty)+'\u003c/option>'+rows.map(x=>'\u003coption value=\"'+esc(x.id)+'\" '+(x.id===chosen?\"selected\":\"\")+'>'+esc(x.label+(x.rows==null?\"\":\" · \"+x.rows+\" rows\"))+'\u003c/option>').join(\"\");\nconst latestSide=side=>workspace.snapshots.filter(s=>s.side===side).at(-1)?.id||\"\";\nconst selected=()=>workspace.runs.find(r=>r.id===selectedRun)||workspace.runs.at(-1)||null;\nconst table=(headers,rows)=>'\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>'+headers.map(x=>\"\u003cth>\"+x+\"\u003c/th>\").join(\"\")+\"\u003c/tr>\u003c/thead>\u003ctbody>\"+rows.map(r=>\"\u003ctr>\"+r.map(c=>\"\u003ctd>\"+c+\"\u003c/td>\").join(\"\")+\"\u003c/tr>\").join(\"\")+\"\u003c/tbody>\u003c/table>\u003c/div>\";\nconst badge=t=>'\u003cspan class=\"status\">'+esc(String(t).replaceAll(\"_\",\" \"))+\"\u003c/span>\";\nconst field=(id,label,v=\"\",type=\"text\")=>'\u003clabel>'+esc(label)+'\u003cinput id=\"'+id+'\" type=\"'+type+'\" value=\"'+esc(v)+'\">\u003c/label>';\nconst selectField=(id,label,body)=>'\u003clabel>'+esc(label)+'\u003cselect id=\"'+id+'\">'+body+\"\u003c/select>\u003c/label>\";\nfunction overview(){\n const run=selected(),rows=run?C.reviewRows(workspace,run.id):[],open=rows.filter(r=>r.status!==\"accepted_change\"),a=run?C.acceptance(workspace,run.id):null;\n const stale=run&&(run.sourceId!==latestSide(\"source\")||run.targetId!==latestSide(\"target\"));\n return '\u003cdiv class=\"metrics\">'+[[workspace.snapshots.length,\"Retained exports\"],[workspace.runs.length,\"Saved comparisons\"],[open.length,\"Exceptions in review\"],[workspace.acceptances.length,\"Receiving decisions\"]].map(([n,l])=>'\u003cdiv class=\"metric\">\u003cstrong>'+n+\"\u003c/strong>\"+esc(l)+\"\u003c/div>\").join(\"\")+\n '\u003c/div>\u003cdiv class=\"grid\">\u003csection class=\"panel\">\u003ch2>'+esc(workspace.label)+'\u003c/h2>\u003cp>'+esc(workspace.customer)+\" · \"+esc(workspace.tableClass)+'\u003c/p>\u003cp>Operating owner: '+esc(workspace.owner)+'\u003c/p>\u003cp>'+badge(a?.current?a.status:\"Review in progress\")+'\u003c/p>'+\n (stale?'\u003cp>\u003cstrong>Newer exports are available.\u003c/strong> Compare the selected new editions before making a new receiving decision.\u003c/p>':\"\")+\n '\u003cdiv class=\"actions\">\u003cbutton data-tab=\"intake\">Receive original exports\u003c/button>\u003cbutton data-tab=\"comparison\">Continue review\u003c/button>\u003c/div>\u003c/section>'+\n '\u003csection class=\"panel\">\u003ch2>One complete operating record\u003c/h2>\u003col>\u003cli>Receive source and target files; preserve every corrected edition.\u003c/li>\u003cli>Map the stable record key and agreed comparison fields.\u003c/li>\u003cli>Assign each difference and record its correction or accepted change.\u003c/li>\u003cli>Record the receiving reviewer and download the complete private handover.\u003c/li>\u003c/ol>\u003cp class=\"muted\">The original comparator uses exact strings. Column mapping is explicit; no inferred record joins or silent normalization are applied.\u003c/p>\u003c/section>\u003c/div>'+\n '\u003csection class=\"panel\">\u003ch2>Current comparison\u003c/h2>'+(run?'\u003cp>'+esc(run.label)+\" · \"+readable(run.createdAt)+\" · \"+esc(run.createdBy)+'\u003c/p>'+table([\"Source records\",\"Target records\",\"Findings\",\"Critical\"],[[run.audit.summary.source_records,run.audit.summary.target_records,run.audit.summary.findings,run.audit.summary.critical]]) :'\u003cp>Receive two exports and map their fields to begin.\u003c/p>')+\"\u003c/section>\";\n}\nfunction intake(){\n return '\u003cdiv class=\"grid\">\u003csection class=\"panel\">\u003ch2>Receive an export edition\u003c/h2>\u003cdiv class=\"fields\">'+selectField(\"import-side\",\"Export side\",'\u003coption value=\"source\">Source / baseline\u003c/option>\u003coption value=\"target\">Target / changed system\u003c/option>')+field(\"import-label\",\"Export label\")+\n '\u003clabel class=\"wide\">Original CSV file\u003cinput id=\"csv-file\" type=\"file\" accept=\".csv,text/csv\">\u003c/label>'+selectField(\"import-parent\",\"Corrects an earlier export (optional)\",options(workspace.snapshots,\"\",\"New original export\"))+\n '\u003clabel class=\"wide\">Receipt or correction note\u003ctextarea id=\"import-note\">\u003c/textarea>\u003c/label>\u003c/div>\u003cp class=\"muted\">Keep the complete issued CSV. Each file may contain up to 100,000 records and 16 MiB. Parsing failures are retained for correction; the comparison will identify missing columns and invalid keys.\u003c/p>\u003cdiv class=\"actions\
