\");\n const parent=path.dirname(destination);fs.mkdirSync(parent,{recursive:true,mode:0o700});\n const staging=fs.mkdtempSync(path.join(parent,\".cmdb-delivery-\"));fs.chmodSync(staging,0o700);\n const members=[];function put(name,body){const target=path.join(staging,name);fs.mkdirSync(path.dirname(target),{recursive:true,mode:0o700});exclusive(target,body);members.push({path:name,bytes:Buffer.byteLength(body),sha256:digest(body)});}\n try{\n  put(\"workspace.package.json\",stringify(C.pack(w)));put(\"receiving-summary.json\",stringify(summary(w,runId)));\n  put(\"acceptance.html\",C.report(w,runId));put(\"exceptions.csv\",C.exceptionsCsv(w,runId));put(\"audit.json\",stringify(run.audit));\n  const mapping=w.mappings.find(x=>x.id===run.mappingId),mapped=C.preview(w,run.sourceId,run.targetId,mapping);\n  put(\"mapped-source.csv\",mapped.source.text);put(\"mapped-target.csv\",mapped.target.text);\n  const originals=[];for(const [i,s]of w.snapshots.entries()){const name=\"originals/\"+String(i+1).padStart(3,\"0\")+\".csv\";put(name,s.text);originals.push({path:name,id:s.id,filename:s.filename,side:s.side,sha256:s.sha256,bytes:s.bytes,parentId:s.parentId});}\n  put(\"original-exports.json\",stringify(originals));put(\"operations.json\",stringify(w.events));\n  put(\"README.md\",\"# CMDB migration acceptance\\n\\nOpen acceptance.html for the receiving decision and exceptions.csv for the assigned findings. workspace.package.json contains the full editable original exports, mapping, comparisons and review history. Receive it into a new workspace with the included operating CLI. Original filenames and correction ancestry are listed in original-exports.json. The mapped CSVs reproduce this selected comparison with the original comparator. Exact source and target values stay in this private delivery; share through the agreed customer route.\\n\");\n  put(\"manifest.json\",stringify({schema:\"cmdb-workspace-delivery/1\",workspaceId:w.id,revision:w.revision,workspaceSha256:C.pack(w).sha256,runId,files:members.slice()}));\n  for(const dir of [\"originals\",\"\"]){syncDir(path.join(staging,dir));}\n  if(fs.existsSync(destination))fail(\"The export destination was created by another writer.\",\"EXPORT_EXISTS\");\n  fs.renameSync(staging,destination);syncDir(parent);\n  return {directory:destination,workspaceSha256:C.pack(w).sha256,revision:w.revision,runId,files:members};\n }catch(e){e.message+=\" Prepared delivery remains at \"+staging;throw e;}\n}\nconst USAGE=\"CMDB acceptance CLI\\n\\nnode cli.cjs init --workspace FILE --settings JSON\\nnode cli.cjs receive --workspace NEW_FILE --package JSON\\nnode cli.cjs apply --workspace FILE --command JSON\\nnode cli.cjs import --workspace FILE --command JSON --csv ORIGINAL_CSV\\nnode cli.cjs show --workspace FILE [--run COMPARISON_ID]\\nnode cli.cjs preview --workspace FILE --source EXPORT_ID --target EXPORT_ID --mapping JSON\\nnode cli.cjs export --workspace FILE --run COMPARISON_ID --out NEW_DIRECTORY\\nnode cli.cjs unlock --workspace FILE --token OBSERVED_LOCK_TOKEN\\n\\nSettings match workspace.create. Commands contain requestId, expectedRevision, actor, exact UTC at, action and payload. apply supports mapping, compare, review, accept and settings as well as complete imports. import reads the original CSV bytes and sets payload.text; retain filename, label, side and correction parent in the command. Each write reserves one writer, checks the current saved edition and commits an atomic durable package. unlock only removes an observed same-host lock whose process is absent. Never remove another active writer's reservation.\\n\";\nfunction run(argv){\n if(!argv.length||argv[0]===\"help\"||argv[0]===\"--help\")return {help:USAGE};\n const [action,...args]=argv,opts={};for(let i=0;i\u003cargs.length;i+=2){if(!args[i].startsWith(\"--\")||!args[i+1]||args[i+1].startsWith(\"--\")||opts[args[i]])fail(\"Use a value once for every option.\\n\"+USAGE);opts[args[i]]=args[i+1];}\n const allowed={init:[\"workspace\",\"settings\"],receive:[\"workspace\",\"package\"],apply:[\"workspace\",\"command\"],import:[\"workspace\",\"command\",\"csv\"],show:[\"workspace\",\"run\"],preview:[\"workspace\",\"source\",\"target\",\"mapping\"],export:[\"workspace\",\"run\",\"out\"],unlock:[\"workspace\",\"token\"]};\n if(!allowed[action])fail(\"Unknown command.\\n\"+USAGE);for(const k of Object.keys(opts))if(!allowed[action].includes(k.slice(2)))fail(\"Unknown option \"+k+\".\");\n const required=action===\"show\"?[\"workspace\"]:allowed[action];for(const k of required)if(!opts[\"--\"+k])fail(\"Missing --\"+k+\".\\n\"+USAGE);\n const file=path.resolve(opts[\"--workspace\"]);\n if(action===\"show\")return summary(readWorkspace(file),opts[\"--run\"]);\n if(action===\"preview\")return C.preview(readWorkspace(file),opts[\"--source\"],opts[\"--target\"],jsonFile(path.resolve(opts[\"--mapping\"])));\n if(action===\"export\"){const destination=path.resolve(opts[\"--out\"]);return lockFor(destination,()=>exportDirectory(readWorkspace(file),opts[\"--run\"],destination));}\n if(action===\"unlock\"){\n  const name=file+\".lock\",record=jsonFile(name);if(record.schema!==\"cmdb-workspace-writer/1\"||record.token!==opts[\"--token\"]||record.host!==os.hostname()||!Number.isSafeInteger(record.pid)||record.pid\u003c=0)fail(\"Use the exact same-host reservation and token.\");\n  let active=true;try{process.kill(record.pid,0);}catch(e){if(e.code===\"ESRCH\")active=false;else throw e;}\n  if(active)fail(\"The recorded writer process is still present. Resume that process.\",\"WRITER_BUSY\");\n  if(jsonFile(name).token!==record.token)fail(\"The writer reservation changed.\",\"WRITER_CHANGED\");\n  fs.unlinkSync(name);syncDir(path.dirname(name));return {unlocked:true,workspace:file};\n }\n return lockFor(file,()=>{\n  if(action===\"init\"||action===\"receive\"){const w=action===\"init\"?C.create(jsonFile(path.resolve(opts[\"--settings\"]))):C.receive(jsonFile(path.resolve(opts[\"--package\"])));writeWorkspace(file,w,null);return summary(w);}\n  regular(file);const before=fs.readFileSync(file),w=C.receive(new TextDecoder(\"utf-8\",{fatal:true}).decode(before)),command=jsonFile(path.resolve(opts[\"--command\"]));\n  if(action===\"import\"){if(command.action!==\"import\")fail(\"The import command must use action import.\");command.payload={...command.payload,text:readText(path.resolve(opts[\"--csv\"]),16*1024*1024,true)};}\n  const result=C.transition(w,command);writeWorkspace(file,result.workspace,digest(before));\n  return {workspaceId:result.workspace.id,revision:result.workspace.revision,sha256:C.pack(result.workspace).sha256,replayed:result.replayed,result:result.result};\n });\n}\nmodule.exports={run,readWorkspace,summary,exportDirectory,USAGE};\nif(require.main===module){try{const out=run(process.argv.slice(2));process.stdout.write(out.help||stringify(out));}catch(e){process.stderr.write(stringify({error:e.code||\"INPUT_REJECTED\",message:e.message}));process.exitCode=2;}}\n","native-receiving.cjs":"#!/usr/bin/env node\n/* SPDX-License-Identifier: MIT */\n\"use strict\";\nconst fs=require(\"node:fs\"),path=require(\"node:path\"),crypto=require(\"node:crypto\"),os=require(\"node:os\");\nconst {spawnSync}=require(\"node:child_process\");\nconst C=require(\"./workspace.cjs\"),Example=require(\"./example.cjs\");\nconst cli=path.join(__dirname,\"cli.cjs\"),original=path.resolve(__dirname,\"../cmdb_qa.mjs\");\nconst canonical=C.canonical,sha=x=>crypto.createHash(\"sha256\").update(x).digest(\"hex\"),json=x=>JSON.stringify(x,null,2)+\"\\n\";\nfunction ensure(v,message){if(!v)throw Error(message);}\nfunction write(file,content){\n if(fs.existsSync(file)){ensure(fs.lstatSync(file).isFile()&&!fs.lstatSync(file).isSymbolicLink(),\"Existing receiving input is not a regular file: \"+file);ensure(fs.readFileSync(file).equals(Buffer.from(content)),\"Existing receiving input differs: \"+file);return;}\n fs.writeFileSync(file,content,{flag:\"wx\",mode:0o600});\n}\nfunction main(out,{resumeOriginal=false}={}){\n out=path.resolve(out);\n const commands=path.join(out,\"commands\");\n if(resumeOriginal){\n  ensure(fs.lstatSync(out).isDirectory()&&!fs.lstatSync(out).isSymbolicLink(),\"Receiving directory is not a regular directory.\");\n  const names=fs.readdirSync(commands).sort();\n  ensure(canonical(names)===canonical(Array.from({length:13},(_,i)=>String(i+1).padStart(3,\"0\")+\".json\")),\"Resume requires the thirteen original operation receipts and no later receiving receipt.\");\n  ensure(!fs.existsSync(path.join(out,\"received.workspace.json\"))&&!fs.existsSync(path.join(out,\"COMPLETE_RECEIVING.json\")),\"The independent receiving has already advanced; preserve its current state.\");\n }else{fs.mkdirSync(out,{recursive:false,mode:0o700});fs.mkdirSync(commands,{mode:0o700});}\n const observed=[],run=(args,expected=0)=>{\n  if(resumeOriginal&&observed.length\u003c13){\n   const row=JSON.parse(fs.readFileSync(path.join(commands,String(observed.length+1).padStart(3,\"0\")+\".json\"),\"utf8\"));\n   ensure(canonical(row.args)===canonical(args)&&row.exitCode===expected&&!row.error,\"Retained original command receipt differs.\");observed.push(row);\n   return expected===0?JSON.parse(row.stdout):JSON.parse(row.stderr);\n  }\n  const result=spawnSync(process.execPath,[cli,...args],{encoding:\"utf8\",timeout:120000,maxBuffer:32*1024*1024});\n  const row={args,exitCode:result.status,stdout:result.stdout||\"\",stderr:result.stderr||\"\",error:result.error?.message||null};observed.push(row);\n  write(path.join(commands,String(observed.length).padStart(3,\"0\")+\".json\"),json(row));\n  if(result.status!==expected)throw Error(\"Original CLI returned \"+result.status+\" for \"+args[0]+\": \"+row.stderr+\" \"+row.error);\n  return expected===0?JSON.parse(row.stdout):JSON.parse(row.stderr);\n };\n const worked=Example.operate(),initial={id:worked.workspace.id,label:worked.workspace.label,customer:worked.workspace.customer,tableClass:worked.workspace.tableClass,owner:worked.workspace.owner,at:worked.workspace.createdAt};\n const settings=path.join(out,\"settings.json\");write(settings,json(initial));\n const file=path.join(out,\"operated.workspace.json\");run([\"init\",\"--workspace\",file,\"--settings\",settings]);\n for(const [name,text]of Object.entries(worked.files))write(path.join(out,name),text);\n for(const [i,step]of worked.steps.entries()){\n  const command=JSON.parse(JSON.stringify(step.command)),request=path.join(out,\"operation-\"+String(i+1).padStart(2,\"0\")+\".json\");\n  if(command.action===\"import\"){\n   const originalText=command.payload.text,source=path.join(out,command.payload.filename);delete command.payload.text;write(request,json(command));\n   ensure(fs.readFileSync(source,\"utf8\")===originalText,\"Original CSV selection differs.\");\n   run([\"import\",\"--workspace\",file,\"--command\",request,\"--csv\",source]);\n  }else{write(request,json(command));run([\"apply\",\"--workspace\",file,\"--command\",request]);}\n }\n const operated=C.receive(fs.readFileSync(file,\"utf8\"));\n ensure(canonical(operated)===canonical(worked.workspace),\"The CLI changed the complete authored case.\");\n const show=run([\"show\",\"--workspace\",file,\"--run\",worked.finalRun]);\n ensure(show.revision===11&&show.selected.receivingStatus===\"ACCEPTED\",\"The original final receiving differs.\");\n const rawBefore=fs.readFileSync(file);\n const stale={requestId:\"receiving-stale-write\",expectedRevision:0,actor:\"Example delivery lead\",at:\"2026-10-13T09:12:00.000Z\",action:\"settings\",payload:{...initial,label:\"Stale workspace edit\"}};\n const staleFile=path.join(out,\"stale-operation.json\");write(staleFile,json(stale));const staleReturn=run([\"apply\",\"--workspace\",file,\"--command\",staleFile],2);\n ensure(/changed in another window/.test(staleReturn.message)&&fs.readFileSync(file).equals(rawBefore),\"Stale request changed the original state.\");\n const first=path.join(out,\"replay-original.json\");write(first,json(worked.steps[0].command));const replay=run([\"apply\",\"--workspace\",file,\"--command\",first]);\n ensure(replay.replayed&&replay.revision===11&&fs.readFileSync(file).equals(rawBefore),\"Replay replaced later work.\");\n const firstExport=run([\"export\",\"--workspace\",file,\"--run\",worked.firstRun,\"--out\",path.join(out,\"first-comparison\")]);\n const finalExport=run([\"export\",\"--workspace\",file,\"--run\",worked.finalRun,\"--out\",path.join(out,\"final-comparison\")]);\n const parity=[];\n for(const [id,selection]of [[worked.firstRun,firstExport],[worked.finalRun,finalExport]]){\n  const target=path.join(out,\"original-comparator-\"+parity.length);\n  const mapping=operated.mappings.find(x=>x.id===operated.runs.find(r=>r.id===id).mappingId);\n  const result=spawnSync(process.execPath,[original,\"--source\",path.join(selection.directory,\"mapped-source.csv\"),\"--target\",path.join(selection.directory,\"mapped-target.csv\"),\"--out\",target,\"--fields\",mapping.fields.map(x=>x.name).join(\",\")],{encoding:\"utf8\",timeout:120000,maxBuffer:32*1024*1024});\n  ensure(result.status===1,\"Original comparison CLI did not retain its actual findings.\");\n  const originalAudit=JSON.parse(fs.readFileSync(path.join(target,\"audit.json\"),\"utf8\")),savedAudit=operated.runs.find(x=>x.id===id).audit;\n  ensure(canonical(originalAudit)===canonical(savedAudit),\"Original comparator and complete application differ.\");\n  parity.push({runId:id,exitCode:result.status,summary:originalAudit.summary,stdout:result.stdout,auditSha256:sha(fs.readFileSync(path.join(target,\"audit.json\")))});\n }\n const receivedPath=path.join(out,\"received.workspace.json\");\n run([\"receive\",\"--workspace\",receivedPath,\"--package\",path.join(finalExport.directory,\"workspace.package.json\")]);\n ensure(canonical(C.receive(fs.readFileSync(receivedPath,\"utf8\")))===canonical(operated),\"Independent full receiving differs.\");\n const receivedExport=run([\"export\",\"--workspace\",receivedPath,\"--run\",worked.finalRun,\"--out\",path.join(out,\"independent-received\")]);\n for(const entry of finalExport.files)ensure(fs.readFileSync(path.join(finalExport.directory,entry.path)).equals(fs.readFileSync(path.join(receivedExport.directory,entry.path))),\"Received export differs: \"+entry.path);\n const selected=C.reviewRows(operated,worked.finalRun)[0],reviewFile=path.join(out,\"revised-review.json\");\n const changed={requestId:\"receiving-review-revision\",expectedRevision:11,actor:\"Example receiving lead\",at:\"2026-10-13T09:12:00.000Z\",action:\"review\",payload:{runId:worked.finalRun,findingIds:[selected.id],status:\"accepted_change\",owner:selected.review.owner,note:selected.review.note+\" Confirmed during receiving.\",evidence:selected.review.evidence}};\n write(reviewFile,json(changed));run([\"apply\",\"--workspace\",receivedPath,\"--command\",reviewFile]);\n const changedShow=run([\"show\",\"--workspace\",receivedPath,\"--run\",worked.finalRun]);\n ensure(changedShow.selected.decision.current===false&&changedShow.selected.receivingStatus===\"REVIEW_REQUIRED\",\"Changed review reused the earlier acceptance.\");\n const changedExport=run([\"export\",\"--workspace\",receivedPath,\"--run\",worked.finalRun,\"--out\",path.join(out,\"review-updated\")]);\n const reaffirm=path.join(out,\"reaffirm-acceptance.json\");write(reaffirm,json({requestId:\"receiving-reaffirm-acceptance\",expectedRevision:12,actor:\"Example receiving lead\",at:\"2026-10-13T09:13:00.000Z\",action:\"accept\",payload:{runId:worked.finalRun,status:\"ACCEPTED\",signoffBy:\"Example receiving lead\",authority:\"Authored receiving continuation EX-44\",note:\"Receiving review is confirmed against the retained original exports and current decisions.\"}}));\n run([\"apply\",\"--workspace\",receivedPath,\"--command\",reaffirm]);\n const finalShow=run([\"show\",\"--workspace\",receivedPath,\"--run\",worked.finalRun]);\n ensure(finalShow.revision===13&&finalShow.selected.decision.current&&finalShow.selected.receivingStatus===\"ACCEPTED\",\"Current receiving decision did not advance.\");\n const continuedExport=run([\"export\",\"--workspace\",receivedPath,\"--run\",worked.finalRun,\"--out\",path.join(out,\"continued-receiving\")]);\n const lockPath=receivedPath+\".lock\",lockBody={schema:\"cmdb-workspace-writer/1\",host:os.hostname(),pid:process.pid,token:crypto.randomUUID(),createdAt:new Date().toISOString()};\n write(lockPath,json(lockBody));let conflict;\n try{conflict=run([\"apply\",\"--workspace\",receivedPath,\"--command\",reaffirm],2);ensure(conflict.error===\"WRITER_BUSY\",\"A second writer entered the same workspace.\");}\n finally{ensure(JSON.parse(fs.readFileSync(lockPath,\"utf8\")).token===lockBody.token,\"The original writer reservation changed.\");fs.unlinkSync(lockPath);}\n const complete={schema:\"cmdb-native-complete-receiving/1\",status:\"PASS\",completedAt:new Date().toISOString(),originalCase:{...worked.receiving,workspaceSha256:C.pack(operated).sha256},\n  commandInvocations:observed.length,originalComparatorParity:parity,originalCsvsPreserved:4,comparisonsPreserved:2,staleRequestPreservedOriginal:true,originalReplayPreservedLaterRevision:true,independentReceivingEqual:true,allReceivedExportFilesEqual:true,changedReviewRequiresNewAcceptance:true,writerReservationRespected:true,\n  receivingContinuation:{revision:finalShow.revision,acceptances:C.receive(fs.readFileSync(receivedPath,\"utf8\")).acceptances.length,status:finalShow.selected.receivingStatus,sha256:finalShow.sha256},\n  deliveries:[firstExport,finalExport,receivedExport,changedExport,continuedExport],originalComparator:{path:original,sha256:sha(fs.readFileSync(original))}};\n complete.resumedFromOriginal=resumeOriginal;\n write(path.join(out,\"COMPLETE_RECEIVING.json\"),json(complete));process.stdout.write(json({status:\"PASS\",directory:out,originalRevision:11,continuedRevision:13,commands:observed.length,comparisons:parity.map(x=>x.summary),result:path.join(out,\"COMPLETE_RECEIVING.json\")}));\n return complete;\n}\nmodule.exports={main};\nif(require.main===module){try{if(process.argv.length!==3&&!(process.argv.length===4&&process.argv[2]===\"--resume-original\"))throw Error(\"Usage: node native-receiving.cjs NEW_OUTPUT_DIRECTORY | --resume-original EXISTING_OUTPUT_DIRECTORY\");main(process.argv.at(-1),{resumeOriginal:process.argv[2]===\"--resume-original\"});}catch(e){process.stderr.write(json({error:\"RECEIVING_FAILED\",message:e.message,stack:e.stack}));process.exitCode=2;}}\n","browser-receiving.cjs":"#!/usr/bin/env node\n/* SPDX-License-Identifier: MIT */\n\"use strict\";\nconst fs=require(\"node:fs\"),path=require(\"node:path\"),http=require(\"node:http\"),assert=require(\"node:assert/strict\"),cp=require(\"node:child_process\");\nconst C=require(\"./workspace.cjs\"),Example=require(\"./example.cjs\"),{build}=require(\"./build.cjs\");\nasync function receive(out){\n fs.mkdirSync(out,{recursive:true});build(path.join(out,\"release\"));\n const root=path.resolve(out),{chromium}=require(path.join(process.env.CODEX_PRIMARY_RUNTIME_NODE_MODULES||\"\",\"playwright\"));\n const views=[],events=[],errors=[];let browser,server;\n const record=(stage,details={})=>{const e={stage,...details};events.push(e);console.log(JSON.stringify(e));};\n const result={operation:\"ALCOR-ORIGINAL-CMDB-BROWSER-379A\",status:\"RUNNING\",views,events};\n const save=()=>fs.writeFileSync(path.join(root,\"BROWSER_RECEIVING.json\"),JSON.stringify(result,null,2)+\"\\n\");\n try{\n  server=http.createServer((req,res)=>{let name;try{name=decodeURIComponent(new URL(req.url,\"http://localhost\").pathname);}catch{return res.writeHead(400).end();}\n   const p=path.resolve(root,\".\"+name);if(!p.startsWith(root+path.sep))return res.writeHead(403).end();\n   try{const data=fs.readFileSync(p);res.setHeader(\"Content-Type\",p.endsWith(\".html\")?\"text/html; charset=utf-8\":\"application/octet-stream\");res.end(data);}catch{res.writeHead(404).end();}});\n  await new Promise(resolve=>server.listen(0,\"127.0.0.1\",resolve));const origin=\"http://127.0.0.1:\"+server.address().port;\n  browser=await chromium.launch({executablePath:process.env.CHROMIUM_PATH||\"/workspace/scratch/5403360e55a4/counterpress-capture-runtime/bin/chromium\",headless:true,args:[\"--no-sandbox\",\"--disable-dev-shm-usage\"]});\n  record(\"original_browser_started\");const context=await browser.newContext({viewport:{width:1440,height:1080},acceptDownloads:true});\n  let page=await context.newPage();page.on(\"pageerror\",error=>errors.push(error.message));\n  const idle=()=>page.waitForFunction(()=>!document.body.dataset.busy);\n  const click=async(selector)=>{await page.locator(selector).click();await idle();};\n  const tab=async(name)=>click('[data-tab=\"'+name+'\"]');\n  const screenshot=async(name,width)=>{await idle();const dims=await page.evaluate(()=>({page:document.documentElement.scrollWidth,viewport:innerWidth}));\n   assert(dims.page\u003c=dims.viewport+1,\"Page overflow: \"+name+\" \"+JSON.stringify(dims));const filename=name+\".jpg\";\n   await page.screenshot({path:path.join(root,filename),type:\"jpeg\",quality:85,fullPage:true});views.push({name,width,...dims,file:filename});save();};\n  const download=async(selector,name)=>{const waiting=page.waitForEvent(\"download\");await click(selector);const d=await waiting;await d.saveAs(path.join(root,name));return path.join(root,name);};\n  await page.goto(origin+\"/release/Open_CMDB_Workspace.html\");await page.locator('[data-action=\"new\"]').first().waitFor();\n  await page.locator(\"#actor\").fill(\"Authored browser operator\");await page.locator(\"#actor\").blur();await click('.workspace-bar [data-action=\"new\"]');\n  for(const [name,value]of Object.entries({label:\"Original hardware receiving\",customer:\"Authored acceptance customer\",tableClass:\"Authored hardware assets\",owner:\"Authored delivery owner\"}))await page.locator('#new-form [name=\"'+name+'\"]').fill(value);\n  await click('#new-form button[type=\"submit\"]');await page.locator(\"#new-dialog\").waitFor({state:\"hidden\"});\n  async function importCsv(label,side,text,parentLabel){\n   await tab(\"intake\");await page.selectOption(\"#import-side\",side);await page.fill(\"#import-label\",label);\n   if(parentLabel){const v=await page.locator(\"#import-parent option\").evaluateAll((xs,label)=>xs.find(x=>x.textContent.startsWith(label))?.value,parentLabel);assert(v);await page.selectOption(\"#import-parent\",v);}\n   await page.fill(\"#import-note\",\"Authored complete file received through the original browser workflow.\");\n   await page.locator(\"#csv-file\").setInputFiles({name:label+\".csv\",mimeType:\"text/csv\",buffer:Buffer.from(text)});await click('[data-action=\"import\"]');\n   await page.locator(\"#content tbody tr\").filter({hasText:label}).first().waitFor();\n  }\n  async function map(){\n   await tab(\"mapping\");await page.selectOption(\"#key-target\",\"asset_id\");\n   for(let i=0;i\u003cExample.mapping.fields.length;i++){const r=Example.mapping.fields[i];await page.fill(\"#field-name-\"+i,r.name);await page.selectOption(\"#field-source-\"+i,r.source);await page.selectOption(\"#field-target-\"+i,r.target);}\n  }\n  await importCsv(\"Original baseline\",\"source\",\"\\ufeff\"+Example.source);await importCsv(\"Duplicate target\",\"target\",Example.invalid);\n  await map();await click('[data-action=\"preview-mapping\"]');await page.getByText(\"Duplicate stable key\",{exact:true}).waitFor();await screenshot(\"desktop-01-input-problem\",1440);\n  await importCsv(\"First valid target\",\"target\",Example.target,\"Duplicate target\");await map();await page.fill(\"#mapping-label\",\"Original hardware mapping\");\n  await click('[data-action=\"preview-mapping\"]');await screenshot(\"desktop-02-field-mapping\",1440);await click('[data-action=\"save-mapping\"]');\n  await page.fill(\"#compare-label\",\"First received target\");await click('[data-action=\"compare\"]');await page.locator(\".finding-choice\").first().waitFor();\n  assert.equal(await page.locator(\".finding-choice\").count(),4);await screenshot(\"desktop-03-original-comparison\",1440);\n  async function review(keys,status,note,evidence){\n   await page.locator(\".finding-choice\").evaluateAll(xs=>xs.forEach(x=>x.checked=false));\n   for(const key of keys)await page.locator('.finding-choice[aria-label^=\"Select '+key+' \"]').check();\n   await page.selectOption(\"#review-status\",status);await page.fill(\"#review-owner\",\"Authored receiving owner\");await page.fill(\"#review-note\",note);await page.fill(\"#review-evidence\",evidence);await click('[data-action=\"review\"]');\n  }\n  await review([\"A-100\",\"A-400\"],\"correction_required\",\"Restore original owner and missing laptop.\",\"Authored correction 12\");\n  await review([\"A-200\",\"A-700\"],\"accepted_change\",\"Relocation and new asset are approved.\",\"Authored approval 42\");await screenshot(\"desktop-04-exception-ownership\",1440);\n  async function accept(status,note,reference){\n   await tab(\"receiving\");await page.selectOption(\"#accept-status\",status);await page.fill(\"#accept-person\",\"Authored receiving lead\");await page.fill(\"#accept-authority\",reference);await page.fill(\"#accept-note\",note);await click('[data-action=\"accept\"]');\n  }\n  await accept(\"REVIEW_REQUIRED\",\"Correct the two original asset differences.\",\"Authored acceptance 10\");\n  await importCsv(\"Corrected target\",\"target\",Example.correction,\"First valid target\");\n  await tab(\"comparison\");await page.fill(\"#compare-label\",\"Corrected target received\");await page.locator(\"#carry-accepted\").check();await click('[data-action=\"compare\"]');\n  assert.equal(await page.locator(\".finding-choice\").count(),2);await screenshot(\"desktop-05-corrected-comparison\",1440);\n  await accept(\"ACCEPTED\",\"Original ownership and inventory restored; approved changes retained.\",\"Authored acceptance 43\");await screenshot(\"desktop-06-acceptance\",1440);\n  const saved=await download('[data-action=\"workspace\"]',\"browser-workspace.json\"),workspace=C.receive(fs.readFileSync(saved,\"utf8\"));\n  assert.equal(workspace.snapshots.length,4);assert.equal(workspace.runs.length,2);assert.equal(workspace.revision,11);\n  assert.equal(workspace.snapshots[0].text,\"\\ufeff\"+Example.source);assert.equal(workspace.snapshots[0].bytes,Buffer.byteLength(\"\\ufeff\"+Example.source));\n  assert.equal(C.acceptance(workspace,workspace.runs.at(-1).id).status,\"ACCEPTED\");\n  await download('[data-action=\"report\"]',\"browser-acceptance-report.html\");await download('[data-action=\"exceptions\"]',\"browser-exceptions.csv\");\n  const zip=await download('[data-action=\"package\"]',\"browser-complete-handover.zip\"),extracted=path.join(root,\"received-handover\");\n  const py=`import sys,json,zipfile,pathlib,hashlib\narchive,out=pathlib.Path(sys.argv[1]),pathlib.Path(sys.argv[2])\nout.mkdir(parents=True,exist_ok=True)\nwith zipfile.ZipFile(archive) as z:\n manifest=json.loads(z.read(\"HANDOVER.json\"))\n for row in manifest[\"files\"]:\n  data=z.read(row[\"path\"])\n  if len(data)!=row[\"bytes\"] or hashlib.sha256(data).hexdigest()!=row[\"sha256\"]:raise ValueError(\"Original member differs: \"+row[\"path\"])\n for member in z.infolist():\n  p=(out/member.filename).resolve()\n  if not p.is_relative_to(out.resolve()):raise ValueError(\"Unsafe archive member\")\n  if member.is_dir():p.mkdir(parents=True,exist_ok=True)\n  else:p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(z.read(member))\n print(json.dumps({\"members\":len(z.infolist()),\"verified\":len(manifest[\"files\"]),\"workspaceSha256\":manifest[\"workspaceSha256\"]}))\n`;\n  const zipResult=JSON.parse(cp.execFileSync(process.env.CODEX_PRIMARY_RUNTIME_PYTHON||\"python3\",[\"-c\",py,zip,extracted],{encoding:\"utf8\"}));\n  assert.equal(C.canonical(C.receive(fs.readFileSync(path.join(extracted,\"workspace.json\"),\"utf8\"))),C.canonical(workspace));\n  result.archive=zipResult;result.originalBomPreserved=true;record(\"complete_original_handover_reopened\",zipResult);\n  await tab(\"history\");await screenshot(\"desktop-07-history\",1440);await tab(\"overview\");await screenshot(\"desktop-08-overview\",1440);\n  await click('[data-action=\"guide\"]');await screenshot(\"desktop-09-operating-guide\",1440);\n  await context.close();\n  const phone=await browser.newContext({viewport:{width:390,height:844},acceptDownloads:true});page=await phone.newPage();page.on(\"pageerror\",error=>errors.push(error.message));\n  await page.goto(origin+\"/received-handover/Open_CMDB_Workspace.html\");await page.getByText(\"Original hardware receiving\",{exact:true}).waitFor();\n  for(const [name,key]of [[\"overview\",\"overview\"],[\"intake\",\"intake\"],[\"mapping\",\"mapping\"],[\"comparison\",\"comparison\"],[\"acceptance\",\"receiving\"],[\"history\",\"history\"]]){\n   await tab(key);await screenshot(\"phone-\"+name,390);\n  }\n  await tab(\"comparison\");await page.fill(\"#actor\",\"Authored phone reviewer\");await page.locator(\"#actor\").blur();\n  await review([\"A-200\"],\"assigned\",\"Confirm revised customer reference on the received copy.\",\"\");\n  await tab(\"receiving\");await page.getByText(\"superseded by later exception review\",{exact:false}).waitFor();await screenshot(\"phone-later-review\",390);\n  await tab(\"comparison\");await review([\"A-200\"],\"accepted_change\",\"Reconfirmed the same approved relocation.\",\"Authored approval 42, received copy\");\n  await accept(\"ACCEPTED\",\"Received full original record and reconfirmed the updated review.\",\"Authored phone receiving 44\");\n  const phoneSaved=await download('[data-action=\"workspace\"]',\"phone-received-workspace.json\"),phoneWorkspace=C.receive(fs.readFileSync(phoneSaved,\"utf8\"));\n  assert.equal(phoneWorkspace.revision,14);assert.equal(phoneWorkspace.id,workspace.id);assert.equal(phoneWorkspace.acceptances.length,3);\n  assert(C.acceptance(phoneWorkspace,phoneWorkspace.runs.at(-1).id).current);await screenshot(\"phone-complete-receiving\",390);\n  await page.reload();await page.getByText(\"Original hardware receiving\",{exact:true}).waitFor();await tab(\"history\");\n  assert.equal(await page.locator(\"#content table\").first().locator(\"tbody tr\").count(),14);await screenshot(\"phone-reopened-history\",390);\n  assert.deepEqual(errors,[]);result.status=\"PASS\";result.originalRevision=11;result.receivedRevision=14;result.browserErrors=errors;record(\"original_browser_complete\",{views:views.length});save();\n }catch(error){result.status=\"FAILED\";result.error={message:error.message,stack:error.stack};save();throw error;}\n finally{if(browser)await browser.close();if(server)await new Promise(resolve=>server.close(resolve));record(\"original_browser_closed\");save();}\n return result;\n}\nif(require.main===module){receive(path.resolve(process.argv[2]||\"browser-output\")).then(r=>console.log(JSON.stringify({status:r.status,views:r.views.length}))).catch(e=>{console.error(e.stack);process.exitCode=1;});}\nmodule.exports={receive};\n","OPERATOR.md":"# CMDB acceptance workspace\n\n## Open and continue work\n\nOpen **Open_CMDB_Workspace.html** in a current browser. The complete application is inside that file, including its operating source and this guide. The workspace runs locally and does not call a ServiceNow instance or send your exports to a server.\n\nEnter the name of the **Operating person** before making changes. Use **New workspace** to name the customer, the CMDB class or agreed scope, and the responsible operating owner. The authored worked example can be opened separately to learn the workflow; its asset names, people, references and decisions are fictional.\n\nThe browser saves each completed operation in IndexedDB. **Save private workspace** writes the complete editable JSON package for another machine or a later session. **Open saved workspace** verifies the original file identities and recomputes each saved comparison before opening a received copy. Original workspace identity and operation history remain inside that copy.\n\nBrowser storage belongs to this browser profile and origin. Keep the downloaded private workspace and complete handover with your approved working files. A downloaded workspace contains the complete original CSV exports and review notes; handle it with the same access controls as the source exports. There is no built-in account or encryption service.\n\n## 1. Receive the full exports\n\nIn **Receive exports**, select Source for the baseline and Target for the received migration or upgrade export. Add a short, meaningful edition name and a receiving note. Choose the actual UTF-8 CSV file. The original text, file name, length and SHA-256 are retained with your name and the receipt time.\n\nKeep all original editions. When a file is corrected, import it as a new edition and select the preceding export as its correction parent. This makes the correction chain visible without replacing the delivered file. The worked example retains a target containing a duplicated stable key, the first valid target, and the corrected target as separate exports.\n\nThe original CSV parser handles quoted fields, embedded line breaks and a UTF-8 byte-order mark. Each export is limited to 16 MiB and the original parser's 100,000-record limit. Empty, duplicated or missing mapped keys and invalid rows need correction before comparison. A structurally invalid received CSV can still be retained as an input edition with its parse error.\n\nSelect the customer-approved scope before exporting from the source system. A file pair should describe one agreed CMDB class or coherent scope and a documented extraction time. Record filters, exclusions and extraction responsibilities in the receiving note or your acceptance reference.\n\n## 2. Map the stable key and compared fields\n\nOpen **Map fields**. Select the retained source and target editions. Map one stable key and each field that belongs in the acceptance scope. A mapping row contains the canonical name used by the report, the source column and the corresponding target column.\n\nUse a key that identifies the same configuration item in both exports, such as an agreed retained sys_id or migration mapping key. Display names are suitable only if the customer has explicitly established their uniqueness and stability. The workspace does not infer record matches.\n\nMappings compare exact CSV strings. They do not trim values, merge equivalent spellings, treat blank as null, resolve display names or normalize dates. If the receiving agreement requires a transformation, make it explicit in the upstream export and retain that transformed file as its own documented edition.\n\nUse the mapping preview to inspect missing columns, blank or duplicate stable keys and row counts. Correct the supplied export or the explicit mapping, then save the mapping as a new edition. Saved comparisons retain the mapping edition they actually used.\n\n## 3. Compare and resolve exceptions\n\nIn **Compare & review**, choose the complete source, target and mapping editions. Give the comparison a readable name. A comparison invokes the original CMDB comparator on the explicitly mapped columns and retains its complete audit.\n\nEvery finding begins open. Assign an owner and record the action required. Available dispositions are:\n\n- **Open**: the difference has not yet been resolved.\n- **Assigned**: a named owner is responsible for review.\n- **Correction required**: a source or target correction is needed.\n- **Accepted change**: the named receiving owner accepts the specific difference, with a decision note and an approval or evidence reference.\n\nYou can select multiple findings with the same disposition, owner and evidence. Use the detail view to inspect the original source and target values. The exported exception CSV contains value hashes alongside the finding, owner and review history fields; the private editable workspace retains the complete raw inputs.\n\nWhen a corrected target arrives, import it as a new edition and create a new comparison linked to the preceding comparison. **Carry identical accepted changes** copies only accepted reviews whose entire original finding is unchanged. It requires the same original baseline and complete canonical field/key mapping. If either changes, turn off carry and review the resulting findings anew. Changed values and newly detected differences require a new review. The comparison lineage separately shows findings absent from the corrected comparison.\n\nA disappearing difference is a result of the new compared inputs. It does not by itself establish that every upstream correction was authorized. The retained edition chain and receiving reference explain the correction.\n\n## 4. Record the receiving decision and deliver the package\n\nIn **Acceptance & handover**, choose the comparison and enter the named receiving reviewer, the customer authority or acceptance reference, and the decision note.\n\n- **Accepted** requires every current finding to be marked Accepted change.\n- **Review required** preserves the outstanding work while recording the current receiving position.\n- **Rejected** records the rejection and its reason without removing the compared exports.\n\nThe application records a named receiving decision. It does not issue a cryptographic signature or establish that the person entered has contractual authority. Agree the actual sign-off role and retain its approval reference in the customer's normal process.\n\nChanging an exception review after a receiving decision makes that decision historical. The workspace displays the comparison as needing a current decision until a reviewer records the updated position. Earlier receiving decisions remain in History.\n\nDownload the readable HTML report for a human review, the exception CSV for the worklist, and the original audit JSON for the technical record. **Download complete handover** writes one ZIP containing:\n\n- The complete editable workspace JSON.\n- A self-contained copy of the application with that workspace included.\n- Every retained original export at its original text content.\n- The selected comparison's audit, exception CSV and readable receiving report.\n- This guide and the complete application source, including the original comparator.\n- A member inventory with file lengths and hashes.\n\nThe ZIP and workspace JSON contain the original customer data. Share them only with the authorized receiving team. The readable report contains customer names, record keys and decision notes, so review those fields before sending it outside that team.\n\n## History and interrupted work\n\nHistory retains each successful operation, the performing person, time, action, revision and result. Corrections, reviews and acceptance decisions append to the record.\n\nAn interrupted save can leave **Continue saved operation** available. It uses the same operation identity and body; a completed operation returns its original result without replacing later work. A changed body with the same identity is rejected. If another browser tab has advanced the workspace, reopen the saved current workspace before making a new change.\n\n## Worked example\n\nThe included hardware example is an authored operating demonstration, not a City of Berkeley or Alcor export. It receives six original assets and a target with a duplicated key. The duplicate is retained and corrected. The first comparison has four findings, including two critical differences: a lost owning team and an omitted laptop.\n\nThe owner approves a relocation and a new asset, requests correction of the two critical differences, and records Review required. A corrected target restores the owner and the missing asset. The next comparison carries only the two identical accepted changes and records a named Accepted decision. The complete package is reopened and its original first import can be replayed while preserving the final revision.\n\n## Source and integration\n\nThe application retains the original comparator from public-commons-sprint-2026 PR481 unchanged as `cmdb-qa/cmdb_qa.mjs`. The browser adapter uses the same parser, validation, comparison and exception CSV bodies with a browser-compatible SHA-256 binding. The operating core adds original-file retention, explicit mappings, review decisions, correction lineage and complete receiving around that comparator.\n\nThe source distribution also includes the headless operating interface and a complete native receiving example. Use the source README for command syntax and the exact run result delivered with your edition.\n","README.md":"# CMDB acceptance workspace\n\nA complete local operating workspace for receiving a pair of CMDB exports, mapping their columns, assigning and resolving exceptions, comparing corrected editions, recording a receiving decision, and delivering an editable handover.\n\n## Run\n\nOpen the delivered `Open_CMDB_Workspace.html` in a browser. It is self-contained. Use **Open worked example** for the complete authored hardware case, or **New workspace** for an authorized customer export pair. The complete operator guide is included in the application and in `OPERATOR.md`.\n\nTo build the customer HTML from this source directory:\n\n```sh\nnode build.cjs --out ./output\n```\n\nThe build emits the clean application, the worked example application, the exact original example CSVs and the complete operated workspace, audit, report and exception CSV. It copies complete source for the portable handover. Node built-ins supply the file operations; no npm installation is required.\n\n## Original comparison behavior\n\nThe parent `../cmdb_qa.mjs` and its original test are unchanged. They come from the original PR481 release. The explicit mapping converts source and target column names to the agreed canonical fields before invoking the same original reconciliation functions.\n\nExact strings are compared. The operator chooses the key and scope; there is no heuristic record matching, hidden normalization, ServiceNow API connection or automatic migration write. The original input and mapped-input identities are retained for every comparison.\n\n## Complete operating record\n\n`workspace.cjs` is the shared browser and headless core. Its operations append original exports, mapping editions, comparisons, exception reviews and receiving decisions. Commands carry a request identity and expected revision. Repeating an identical successful command returns its original result against the current workspace; changing its body is rejected.\n\n`pack` and `receive` preserve the complete record. Receiving verifies all original input hashes and recomputes the original comparison. Hashes detect accidental changes; they are not a user identity or signature service.\n\nThe application saves completed work in IndexedDB and provides full JSON export/import. Downloaded handovers contain all input files, source, a self-contained application, and the chosen report/worklist. See `OPERATOR.md` for handling and sign-off responsibilities.\n\n## Source layout\n\n- `workspace.cjs`: immutable operating core and reports.\n- `original-adapter.cjs`: browser/CommonJS binding for the unchanged original comparator functions.\n- `app.js`, `style.css`, `index.template.html`: industrial browser workspace.\n- `compose.cjs`: complete self-contained HTML composition.\n- `example.cjs`: authored hardware receipt, correction and acceptance operation.\n- `build.cjs`: native complete source and customer-file builder.\n- `cli.cjs`: headless operations over the same workspace and durable saved record.\n- `native-receiving.cjs`: original comparator parity and complete operating continuation.\n- `browser-receiving.cjs`: actual desktop/phone operating journey and downloaded-package reopening.\n- `OPERATOR.md`: full operating instructions.\n- `SOURCE_PROVENANCE.md`: original comparator and reused helper identities.\n\nThe example contains fictional assets and customer approvals. Actual customer receiving decisions belong to the selected source files and their authorized reviewer.\n\n## Defined delivery workshare\n\n[WORKSHARE.md](WORKSHARE.md) describes the prepared $3,600 acceptance and correction work package for one agreed CMDB class, original comparison, corrected-target rerun and complete receiving handover. The original customer contact and source record are kept in the existing Alcor commercial case.\n\n## Native receiving\n\nThe complete original authored case has passed through 26 native CLI operations and both original comparator executions. The full independent receive and every re-exported member matched. A later exception review required a new acceptance, completed at revision 13. A focused carry-forward continuation also protects the original baseline and complete mapping when carrying accepted decisions.\n","SOURCE_PROVENANCE.md":"# Source provenance\n\n## Existing comparator\n\nRepository: `woahwhattheheck/public-commons-sprint-2026`.\n\nOriginal location: `business/berkeley-servicenow-27-11797c/cmdb-qa/cmdb_qa.mjs`.\n\nOriginal PR481 merge: `4714646d7fe09db36fdf7844385d2ddd5e5eb9f0`.\n\nCurrent full original Git blob: `2186ed145d7f9a50bd3066c3c33d1e7fbad453b0`.\n\nUTF-8 length: 7,625 bytes. SHA-256: `f4eb477a76903ed8aaf72f0fb05e70db4b66729fe6914c925183726edd6164f3`.\n\nThat complete parent file is preserved unchanged. The original test is preserved unchanged as well. `original-adapter.cjs` copies the original parser, table validation, reconciliation and finding-CSV function bodies, removes their module-export declarations, and binds SHA-256 and UTF-8 length to the maintained browser-compatible helper. The native receiving operation compares its result with the original ESM module on the same full input strings.\n\n## Existing helper components\n\n`vendor/connected_sha256.cjs` is the complete maintained Commons SHA-256 helper. Its original license and provenance comments are preserved in that file.\n\n`vendor/zip-original.js` reuses the complete small ZIP writer from the original Managed Platform customer-companion source. Two byte-buffer allocations are adapted: UTF-8 encoding returns the Uint8Array directly, and file chunks retain the existing Uint8Array rather than copying it. These changes avoid expanding file bytes into ordinary JavaScript number arrays. The archive format and member accounting are unchanged.\n\n## New operating source\n\nThe acceptance workspace, browser UI, HTML composer, operating guide, source builder and original worked case extend the original comparator. They retain full original input editions and implement explicit mapping, exception ownership, immutable comparison history, corrected-target lineage, named receiving decisions, complete export/reopen and a portable customer handover.\n\nThe worked case is authored for the operating demonstration. It is not drawn from an Alcor or Berkeley instance.\n","WORKSHARE.md":"# CMDB acceptance and correction workshare\n\n## Prepared for Alcor\n\n**Fixed fee: $3,600. Delivery: ten business days from an agreed start and complete authorized inputs.**\n\nWe can take the export reconciliation and receiving record for one agreed CMDB class or asset scope through delivery. Alcor retains the ServiceNow engagement, platform operations and customer relationship. We provide the selected source/target comparison, exception ownership record, corrected-target rerun and complete portable acceptance package.\n\nThis is a concrete specialist work package alongside your existing quality and CMDB services. The supplied application works from complete authorized CSV exports and keeps the receiving record editable by your team.\n\n## Included work\n\n1. **Agree and record the data scope.** Confirm the CMDB class or coherent asset cohort, extraction dates and filters, stable record key, compared fields and receiving reviewer.\n2. **Receive the original exports.** Retain the baseline, first target and each correction as complete file editions. Identify missing columns, malformed rows and blank or duplicate keys before the comparison.\n3. **Prepare the exception register.** Compare the selected source and target using the explicit field mapping. Review the results with named owners, correction actions and accepted changes linked to a written reference.\n4. **Operate one corrected-target rerun.** Keep the original comparison, link the corrected target to the received edition, and carry only identical accepted findings when the reviewer selects that behavior.\n5. **Deliver the receiving record.** Assemble the readable acceptance report, exception CSV, original audit, complete editable workspace, all original inputs, operating guide and self-contained application. Reopen the delivered package and confirm that the same decisions and source editions are present.\n\nThe fixed scope includes one baseline, one first target, one corrected target, one agreed mapping and one receiving review cycle. Each original CSV may contain up to 100,000 records and 16 MiB. A larger export, additional class or changed matching/transformation requirement is scoped separately before that work starts.\n\n## Delivery and payment\n\n| Stage | Complete output | Fee |\n| --- | --- | ---: |\n| Intake and agreed mapping | Retained original exports, documented scope and field/key mapping, input-quality findings | $1,200 |\n| Corrected receiving and handover | Original and corrected comparisons, owner dispositions, receiving report, complete editable package and reopened delivery | $2,400 |\n| **Total** | **Complete selected workshare** | **$3,600** |\n\nThe ten-business-day delivery window begins after the start date and input scope are agreed. The schedule depends on receipt of the original and corrected exports and timely decisions from the named receiving reviewer. Any affected date or additional scope is agreed before changing the work.\n\n## Your team's inputs\n\nSupply the authorized baseline and target exports through your selected private route, identify the stable cross-system record key, select the acceptance fields, and name the receiving reviewer. Your team retains the instance access and customer approvals. We use the complete files within the agreed scope and return the full working record.\n\nThe application compares exact values. If your acceptance process requires normalization or identifier translation, specify that transformation explicitly and retain its resulting export as a documented edition. The deliverable records the named review and its reference; your normal approval process establishes the reviewer's authority.\n\n## Prepared operating demonstration\n\nThe included authored hardware case shows a retained duplicate-key export, four initial differences, assigned corrections, two intentional accepted changes, the corrected target and a reopened accepted receiving record. The application retains each original CSV and both comparisons. The browser and headless interfaces use the same operating core and the original comparator.\n\nThe application runs locally, saves working editions in the browser, and exports the complete private record for another operator. Its full source is included in the handover. Customer exports, record keys and review notes remain private working data under the agreed handling arrangements.\n\n## Potential Berkeley fit\n\nThe City of Berkeley's ServiceNow Professional Services solicitation, Specification 27-11797-C, includes CMDB/ITAM, endpoint asset interfaces, platform upgrades, regression and integration testing, remediation and handoff. Its currently published proposal deadline is November 20, 2026, at 2 PM Pacific. A certified ServiceNow partner must hold the prime role.\n\nIf your team is considering that opportunity, the workshare above provides a defined acceptance component. The same work can be applied to another selected migration or upgrade.\n\nPublished sources:\n\n- City solicitation: https://berkeleyca.gov/doing-business/working-city/bid-proposal-opportunities/servicenow-professional-services\n- Official specification: https://berkeleyca.gov/sites/default/files/RFP-27-11797-C-SnowProfessionalServices_0.pdf\n- Alcor Quality-as-a-Service: https://www.alcortech.com/quality-as-a-service/\n\n## Start\n\nSelect the CMDB class or asset scope and the intended export pair. We will confirm the same fixed workshare, the receiving reviewer and the start date with your delivery lead.\n"}}</script><script type="application/json" id="included-workspace">{"schema":"cmdb-acceptance-package/1","workspace":{"schema":"cmdb-acceptance-workspace/1","id":"cmdb-authored-hardware-example","label":"Hardware migration acceptance","customer":"Example service team","tableClass":"Authored hardware asset example","owner":"Example delivery lead","revision":11,"createdAt":"2026-10-13T09:00:00.000Z","updatedAt":"2026-10-13T09:11:00.000Z","snapshots":[{"id":"import-example-001","side":"source","label":"Original baseline","filename":"baseline.csv","text":"sys_id,name,sys_class_name,assigned_to,install_status,serial_number,location\r\nA-100,Finance laptop,cmdb_ci_computer,IT Operations,Installed,DEMO-100,Main office\r\nA-200,Reception desktop,cmdb_ci_computer,Service Desk,Installed,DEMO-200,Main office\r\nA-300,Network switch,cmdb_ci_netgear,Network Team,Installed,DEMO-300,Server room\r\nA-400,Training laptop,cmdb_ci_computer,Learning Team,Installed,DEMO-400,Training room\r\nA-500,Warehouse printer,cmdb_ci_printer,Facilities,Installed,DEMO-500,Warehouse\r\nA-600,Spare laptop,cmdb_ci_computer,IT Operations,In stock,DEMO-600,Store room\r\n","bytes":578,"sha256":"df8edb0a4af888d4fe1f5e7a296800c2114c0be20982dab43d26cc4b192433d8","headers":["sys_id","name","sys_class_name","assigned_to","install_status","serial_number","location"],"rows":6,"parseError":null,"parentId":null,"note":"Authored example source; all asset and team names are fictional."  const run=selected(),rows=run?C.reviewRows(workspace,run.id):[],open=rows.filter(r=>r.status!=="accepted_change"),a=run?C.acceptance(workspace,run.id):null;
 const stale=run&&(run.sourceId!==latestSide("source")||run.targetId!==latestSide("target"));
 return '<div class="metrics">'+[[workspace.snapshots.length,"Retained exports"],[workspace.runs.length,"Saved comparisons"],[open.length,"Exceptions in review"],[workspace.acceptances.length,"Receiving decisions"]].map(([n,l])=>'<div class="metric"><strong>'+n+"</strong>"+esc(l)+"</div>").join("")+
 '</div><div class="grid"><section class="panel"><h2>'+esc(workspace.label)+'</h2><p>'+esc(workspace.customer)+" · "+esc(workspace.tableClass)+'</p><p>Operating owner: '+esc(workspace.owner)+'</p><p>'+badge(a?.current?a.status:"Review in progress")+'</p>'+
 (stale?'<p><strong>Newer exports are available.</strong> Compare the selected new editions before making a new receiving decision.</p>':"")+
 '<div class="actions"><button data-tab="intake">Receive original exports</button><button data-tab="comparison">Continue review</button></div></section>'+
 '<section class="panel"><h2>One complete operating record</h2><ol><li>Receive source and target files; preserve every corrected edition.</li><li>Map the stable record key and agreed comparison fields.</li><li>Assign each difference and record its correction or accepted change.</li><li>Record the receiving reviewer and download the complete private handover.</li></ol><p class="muted">The original comparator uses exact strings. Column mapping is explicit; no inferred record joins or silent normalization are applied.</p></section></div>'+
 '<section class="panel"><h2>Current comparison</h2>'+(run?'<p>'+esc(run.label)+" · "+readable(run.createdAt)+" · "+esc(run.createdBy)+'</p>'+table(["Source records","Target records","Findings","Critical"],[[run.audit.summary.source_records,run.audit.summary.target_records,run.audit.summary.findings,run.audit.summary.critical]]) :'<p>Receive two exports and map their fields to begin.</p>')+"</section>";
}
function intake(){
 return '<div class="grid"><section class="panel"><h2>Receive an export edition</h2><div class="fields">'+selectField("import-side","Export side",'<option value="source">Source / baseline</option><option value="target">Target / changed system</option>')+field("import-label","Export label")+
 '<label class="wide">Original CSV file<input id="csv-file" type="file" accept=".csv,text/csv"></label>'+selectField("import-parent","Corrects an earlier export (optional)",options(workspace.snapshots,"","New original export"))+
 '<label class="wide">Receipt or correction note<textarea id="import-note"></textarea></label></div><p class="muted">Keep the complete issued CSV. Each file may contain up to 100,000 records and 16 MiB. Parsing failures are retained for correction; the comparison will identify missing columns and invalid keys.</p><div class="actions"><button data-action="import" class="primary">Receive complete file</button></div></section>'+
 '<section class="panel"><h2>Original data stays intact</h2><p>Every received edition retains its full UTF-8 file, filename, checksum, receipt person and source relationship. A corrected export is a new edition. Earlier comparisons and review decisions keep their original inputs.</p><p>Choose the appropriate side and prior export when receiving a correction. Save the private workspace before handing it to another operator.</p></section></div>'+
 '<section class="panel"><h2>Received exports</h2>'+table(["Export","Side / receipt","Rows / parsing","Original file",""],workspace.snapshots.map(s=>[esc(s.label)+(s.parentId?"<small> · corrected edition</small>":""),esc(s.side)+"<br><small>"+readable(s.receivedAt)+" · "+esc(s.receivedBy)+"</small>",s.parseError?esc(s.parseError):String(s.rows),esc(s.filename)+"<details><summary>Original identity</summary><div class=hash>"+s.sha256+"</div>"+s.bytes.toLocaleString()+" bytes</details>",'<button data-action="export-original" data-id="'+esc(s.id)+'">Save original CSV</button>']))+"</section>";
}
function mapping(){
 const sourceRow=workspace.snapshots.find(s=>s.id===value("mapping-source"))||workspace.snapshots.find(s=>s.id===latestSide("source"));
 const targetRow=workspace.snapshots.find(s=>s.id===value("mapping-target"))||workspace.snapshots.find(s=>s.id===latestSide("target"));
 const initial=draftMapping||workspace.mappings.at(-1)||{key:{name:"sys_id",source:"sys_id",target:"sys_id"},fields:CmdbOriginal.DEFAULT_FIELDS.map(name=>({name,source:name,target:name}))};
 const column=(columns,chosen)=>'<option value="">Choose a column</option>'+columns.map(c=>'<option '+(c===chosen?"selected":"")+' value="'+esc(c)+'">'+esc(c)+'</option>').join("");
 return '<section class="panel"><h2>Explicit field mapping</h2><p>Match the two exported schemas without changing original file values. The stable key must identify the same record on both sides.</p><div class="fields">'+selectField("mapping-source","Source export",options(workspace.snapshots.filter(x=>x.side==="source"),sourceRow?.id))+selectField("mapping-target","Target export",options(workspace.snapshots.filter(x=>x.side==="target"),targetRow?.id))+field("mapping-label","Mapping name",initial.label||"Hardware asset mapping")+'</div><h3>Stable record key</h3><div class="fields">'+field("key-name","Canonical key",initial.key.name)+selectField("key-source","Source key",column(sourceRow?.headers||[],initial.key.source))+selectField("key-target","Target key",column(targetRow?.headers||[],initial.key.target))+'</div><h3>Compared fields</h3><div id="mapping-rows">'+initial.fields.map((r,i)=>'<div class="fields mapping-row" data-index="'+i+'">'+field("field-name-"+i,"Canonical field",r.name)+selectField("field-source-"+i,"Source column",column(sourceRow?.headers||[],r.source))+selectField("field-target-"+i,"Target column",column(targetRow?.headers||[],r.target))+'<button data-action="remove-field" data-index="'+i+'">Remove field</button></div>').join("")+'</div><div class="actions"><button data-action="add-field">Add field</button><button data-action="preview-mapping">Review input problems</button><button class="primary" data-action="save-mapping">Save complete mapping</button></div><div id="mapping-preview"></div></section>'+
 '<section class="panel"><h2>Saved mapping editions</h2>'+table(["Mapping","Key","Fields","Saved"],workspace.mappings.map(m=>[esc(m.label),esc(m.key.name),m.fields.length,readable(m.createdAt)+" · "+esc(m.createdBy)]))+"</section>";
}
function readMapping(){return {label:value("mapping-label"),key:{name:value("key-name"),source:value("key-source"),target:value("key-target")},fields:[...document.querySelectorAll(".mapping-row")].map((r,i)=>({name:value("field-name-"+i),source:value("field-source-"+i),target:value("field-target-"+i)}))};}
function runSelector(){const r=selected();return selectField("run-select","Saved comparison",options(workspace.runs,r?.id));}
function filtered(){const r=selected();return r?C.reviewRows(workspace,r.id).filter(row=>(filter==="all"||row.status===filter)&&(query===""||[row.record_key,row.field,row.reason,row.review?.owner||""].join(" ").toLowerCase().includes(query.toLowerCase()))):[];}
function comparison(){
 const run=selected(),items=filtered(),shown=items.slice(page*50,page*50+50);
 const lineage=run?C.lineage(workspace,run.id):null;
 return '<section class="panel"><h2>Compare selected export editions</h2><div class="fields">'+selectField("compare-source","Source",options(workspace.snapshots.filter(s=>s.side==="source"),latestSide("source")))+selectField("compare-target","Target",options(workspace.snapshots.filter(s=>s.side==="target"),latestSide("target")))+selectField("compare-mapping","Field mapping",options(workspace.mappings,workspace.mappings.at(-1)?.id))+field("compare-label","Comparison name","Comparison "+(workspace.runs.length+1))+selectField("compare-previous","Continues earlier comparison",options(workspace.runs,run?.id,"First comparison"))+'</div><label class="check"><input type="checkbox" id="carry-accepted">Carry accepted decisions only with the same baseline, field mapping and identical findings</label><div class="actions"><button data-action="compare" class="primary">Create comparison</button></div></section>'+
 (run?'<section class="panel">'+runSelector()+'<p>'+run.audit.summary.findings+' findings · '+run.audit.summary.critical+' critical'+(lineage?.previousRunId?" · "+lineage.unchanged+" identical to prior · "+lineage.absent.length+" prior findings absent from this comparison":"")+'</p><div class="fields">'+selectField("filter-status","Disposition",'<option value="all">All findings</option>'+["open","assigned","correction_required","accepted_change"].map(s=>'<option value="'+s+'" '+(s===filter?"selected":"")+'>'+esc(s.replaceAll("_"," "))+'</option>').join(""))+field("filter-query","Record, field or owner",query)+'</div></section>'+
 '<div class="review-grid"><section class="panel"><h2>Exceptions</h2>'+table(['<input type="checkbox" id="select-page" aria-label="Select visible findings">',"Record / field","Finding","Disposition / owner",""],shown.map(r=>['<input type="checkbox" class="finding-choice" value="'+r.id+'" aria-label="Select '+esc(r.record_key+" "+r.field)+'">',esc(r.record_key)+"<br><small>"+esc(r.field)+"</small>",badge(r.reason)+"<br>"+esc(r.severity),badge(r.status)+"<br>"+esc(r.review?.owner||"Unassigned"),'<button data-action="inspect-finding" data-id="'+r.id+'">Inspect</button>']))+
 '<div class="page-controls"><button data-action="prev-page" '+(page===0?"disabled":"")+'>Previous</button><span>'+items.length+' matching · page '+(page+1)+'</span><button data-action="next-page" '+((page+1)*50>=items.length?"disabled":"")+'>Next</button></div><div id="finding-detail">'+findingDetail()+'</div></section>'+
 '<section class="panel"><h2>Review selected exceptions</h2><p>Only the checked findings are changed. Each saved decision keeps the named reviewer and original comparison.</p><div class="fields">'+selectField("review-status","Disposition",'<option value="assigned">Assign owner</option><option value="correction_required">Correction required</option><option value="accepted_change">Accepted change</option><option value="open">Reopen review</option>')+field("review-owner","Responsible owner")+field("review-due","Due date","","date")+'<label>Decision and next work<textarea id="review-note"></textarea></label>'+field("review-evidence","Written reference / change approval")+'</div><div class="actions"><button data-action="review" class="primary">Save selected review</button></div><p class="muted">Receive a corrected target as a new export and compare it again. Earlier findings and decisions remain in History.</p></section></div>':'<section class="empty"><h2>Receive and map exports to compare</h2><p>The source and target files plus a saved field mapping create a complete comparison.</p></section>');
}
function findingDetail(){
 const run=selected();if(!run||!detail)return "";const f=C.reviewRows(workspace,run.id).find(x=>x.id===detail);if(!f)return "";
 const mapping=workspace.mappings.find(m=>m.id===run.mappingId),fields=[mapping.key,...mapping.fields];
 const values=side=>{const snapshot=workspace.snapshots.find(s=>s.id===run[side+"Id"]),rows=CmdbOriginal.parseCsv(snapshot.text).records;return rows.find(row=>row[mapping.key[side]]===f.record_key);};
 const a=values("source"),b=values("target"),chosen=f.field==="*"?fields:fields.filter(x=>x.name===f.field);
 return '<h3>'+esc(f.record_key)+" · "+esc(f.reason.replaceAll("_"," "))+'</h3>'+table(["Field","Original source value","Original target value"],chosen.map(c=>[esc(c.name),'<div class=value>'+esc(a?a[c.source]:"Record absent")+"</div>",'<div class=value>'+esc(b?b[c.target]:"Record absent")+"</div>"]))+
 '<p>'+esc(f.review?.note||"No review note yet.")+'</p>';
}
function receiving(){
 const run=selected();if(!run)return '<section class="empty"><h2>Complete a comparison first</h2><p>A receiving decision is tied to its exact source, target, mapping and exception review.</p></section>';
 const a=C.acceptance(workspace,run.id),rows=C.reviewRows(workspace,run.id),remaining=rows.filter(x=>x.status!=="accepted_change").length;
 return '<div class="grid"><section class="panel"><h2>Receiving decision</h2>'+runSelector()+'<p>'+remaining+' exceptions still require an accepted-change disposition.</p><div class="fields">'+selectField("accept-status","Decision",'<option value="REVIEW_REQUIRED">Review required</option><option value="ACCEPTED">Accepted</option><option value="REJECTED">Rejected</option>')+field("accept-person","Receiving reviewer")+field("accept-authority","Authority or written approval reference")+'<label class="wide">Acceptance terms or remaining work<textarea id="accept-note"></textarea></label></div><div class="actions"><button data-action="accept" class="primary">Record receiving decision</button></div>'+
 (a?'<h3>Latest saved decision</h3><p>'+badge(a.status)+(a.current?"":" · superseded by later exception review")+'</p><p>'+esc(a.signoffBy)+" · "+readable(a.at)+'</p><p>'+esc(a.note)+"</p>":"")+'</section>'+
 '<section class="panel"><h2>Complete handover</h2><p>The editable package contains the full original CSV editions, mappings, comparison results, ownership decisions, acceptance history and application source.</p><div class="actions"><button data-action="report">Save acceptance report</button><button data-action="exceptions">Save exceptions CSV</button><button data-action="audit">Save original audit JSON</button><button data-action="workspace">Save private workspace</button><button data-action="package">Download complete handover</button></div><h3>Receiving on another machine</h3><ol><li>Extract the handover into a private folder.</li><li>Open Open_CMDB_Workspace.html in a browser.</li><li>Open the supplied workspace.json to receive the same operating history.</li><li>Select the saved comparison, inspect its original inputs and continue the named review.</li></ol></section></div>';
}
function history(){
 return '<section class="panel"><h2>Complete operation history</h2><p>Every original export, comparison, review and receiving decision remains attached to this workspace.</p>'+table(["Edition","Operation","Person","Time","Result"],workspace.events.map(e=>[e.revision,esc(e.action),esc(e.actor),readable(e.at),esc(e.result.status||e.result.reviewed&&e.result.reviewed+" reviewed"||e.result.rows!=null&&e.result.rows+" rows"||"Saved")]))+'</section><section class="panel"><h2>Comparison editions</h2>'+table(["Comparison","Source / target","Findings","Saved",""],workspace.runs.map(r=>[esc(r.label),esc(workspace.snapshots.find(s=>s.id===r.sourceId).label)+" / "+esc(workspace.snapshots.find(s=>s.id===r.targetId).label),r.audit.summary.findings,readable(r.createdAt),'<button data-action="open-comparison" data-id="'+r.id+'">Open comparison</button>']))+"</section>";
}
function guide(){
 const inline=s=>esc(s).replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>").replace(/\x60([^\x60]+)\x60/g,"<code>$1</code>");
 const blocks=source.files["OPERATOR.md"].trim().split(/\n\s*\n/).map(block=>{
  const head=block.match(/^(#{1,3}) (.*)$/);
  if(head)return "<h"+Math.min(3,head[1].length+1)+">"+inline(head[2])+"</h"+Math.min(3,head[1].length+1)+">";
  const lines=block.split("\n");if(lines.every(s=>s.startsWith("- ")))return "<ul>"+lines.map(s=>"<li>"+inline(s.slice(2))+"</li>").join("")+"</ul>";
  return "<p>"+inline(block).replaceAll("\n"," ")+"</p>";
 }).join("");
 return '<section class="panel guide"><button data-action="save-guide">Save operating guide</button>'+blocks+"</section>";
}
function render(){
 document.querySelectorAll("nav [data-tab]").forEach(b=>b.setAttribute("aria-current",b.dataset.tab===tab?"page":"false"));
 $("save-file").disabled=$("package").disabled=!workspace;
 $("save-state").textContent=workspace?"Saved edition "+workspace.revision+" · "+readable(workspace.updatedAt):"No workspace open";
 $("content").innerHTML=workspace?({overview,intake,mapping,comparison,receiving,history,guide}[tab]||overview)():'<section class="empty"><h2>Open a complete operating workspace</h2><p>Create a workspace for authorized customer exports, receive an existing handover, or open the included worked example.</p><div class="actions"><button data-action="new">New workspace</button><button data-action="example">Open worked example</button></div></section>';
}
function download(name,body,type="application/json"){
 const blob=new Blob([body],{type}),url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1500);
}
const json=x=>JSON.stringify(x,null,2)+"\n";
function saveWorkspace(){download("workspace.json",json(C.pack(workspace)));}
function handover(){
 const packet=C.pack(workspace),run=selected(),all={"Open_CMDB_Workspace.html":CmdbCompose.build(source.files,packet),"workspace.json":json(packet),"OPERATOR.md":source.files["OPERATOR.md"]};
 for(const [name,content]of Object.entries(source.files)){const path=name.startsWith("../")?"cmdb-qa/"+name.slice(3):"cmdb-qa/acceptance-workspace/"+name;all[path]=content;}
 workspace.snapshots.forEach((s,i)=>all["original-exports/"+String(i+1).padStart(3,"0")+"-"+s.filename.replace(/[^A-Za-z0-9_.-]/g,"_")]=s.text);
 if(run){all["acceptance-report.html"]=C.report(workspace,run.id);all["exceptions.csv"]=C.exceptionsCsv(workspace,run.id);all["audit.json"]=json(run.audit);}
 all["HANDOVER.json"]=json({schema:"cmdb-acceptance-handover/1",workspaceId:workspace.id,revision:workspace.revision,workspaceSha256:packet.sha256,files:Object.entries(all).map(([path,text])=>({path,...CmdbHash.sha256Utf8(text)}))});
 download("CMDB_Acceptance_Handover.zip",buildCompanionZip(all),"application/zip");
}
async function act(action,button){
 if(action==="new"){$("new-form").elements.owner.value=$("actor").value;$("new-dialog").showModal();return;}
 if(action==="cancel-new"){$("new-dialog").close();return;}
 if(action==="guide"){tab="guide";render();return;}
 if(action==="save-guide"){download("OPERATOR.md",source.files["OPERATOR.md"],"text/markdown");return;}
 if(action==="example"){const result=CmdbExample.operate();await addBook(result.workspace);note("Opened the complete authored hardware-asset example, including its original exports and two comparison editions.");return;}
 if(!workspace)throw Error("Open a workspace first.");
 if(action==="workspace"){saveWorkspace();return;}
 if(action==="package"){handover();return;}
 if(action==="export-original"){const s=workspace.snapshots.find(x=>x.id===button.dataset.id);download(s.filename,s.text,"text/csv");return;}
 if(action==="import"){
  const f=$("csv-file").files[0];if(!f)throw Error("Select the complete original CSV.");
  if(f.size>CmdbOriginal.MAX_BYTES)throw Error("Each CSV may be at most 16 MiB.");
  const raw=new TextDecoder("utf-8",{fatal:true,ignoreBOM:true}).decode(await f.arrayBuffer());
  const r=await commit(command("import",{side:value("import-side"),label:value("import-label")||f.name,filename:f.name,text:raw,parentId:value("import-parent")||null,note:value("import-note")}));
  note(r.result.parseError?"Received and retained the original file. Correct its parsing problem: "+r.result.parseError:"Received "+r.result.rows+" original rows.");render();return;
 }
 if(action==="add-field"||action==="remove-field"){draftMapping=readMapping();if(action==="add-field")draftMapping.fields.push({name:"",source:"",target:""});else draftMapping.fields.splice(Number(button.dataset.index),1);render();return;}
 if(action==="preview-mapping"){
  const result=C.preview(workspace,value("mapping-source"),value("mapping-target"),readMapping());
  $("mapping-preview").innerHTML="<h3>Input review</h3>"+["source","target"].map(side=>"<h4>"+esc(side)+"</h4>"+(result[side].problems.length?table(["Row","Problem","Column","Key"],result[side].problems.slice(0,200).map(p=>[p.row??"—",esc(p.kind),esc(p.column),esc(p.key)])):"<p>All "+result[side].rows+" row keys and selected columns are valid.</p>")+(result[side].problems.length>200?"<p>Showing 200 of "+result[side].problems.length+" original input problems.</p>":"")).join("");return;
 }
 if(action==="save-mapping"){await commit(command("mapping",readMapping()));draftMapping=null;tab="comparison";render();note("Saved the complete field mapping.");return;}
 if(action==="compare"){const r=await commit(command("compare",{sourceId:value("compare-source"),targetId:value("compare-target"),mappingId:value("compare-mapping"),label:value("compare-label"),previousRunId:value("compare-previous")||null,carryAccepted:$("carry-accepted").checked}));selectedRun=r.result.id;page=0;detail="";render();note("Comparison saved: "+r.result.findings+" findings.");return;}
 if(action==="prev-page"||action==="next-page"){page+=action==="next-page"?1:-1;render();return;}
 if(action==="inspect-finding"){detail=button.dataset.id;$("finding-detail").innerHTML=findingDetail();return;}
 if(action==="review"){const ids=[...document.querySelectorAll(".finding-choice:checked")].map(el=>el.value);await commit(command("review",{runId:selected().id,findingIds:ids,status:value("review-status"),owner:value("review-owner"),due:value("review-due"),note:value("review-note"),evidence:value("review-evidence")}));render();note("Saved the selected exception decisions.");return;}
 if(action==="accept"){await commit(command("accept",{runId:selected().id,status:value("accept-status"),signoffBy:value("accept-person"),authority:value("accept-authority"),note:value("accept-note")}));render();note("Saved the receiving decision.");return;}
 if(action==="open-comparison"){selectedRun=button.dataset.id;tab="comparison";page=0;render();return;}
 if(action==="report"){download("acceptance-report.html",C.report(workspace,selected().id),"text/html");return;}
 if(action==="exceptions"){download("exceptions.csv",C.exceptionsCsv(workspace,selected().id),"text/csv");return;}
 if(action==="audit"){download("audit.json",json(selected().audit));return;}
}
async function run(fn){if(busy)return;busy=true;document.body.dataset.busy="true";try{note("");await fn();}catch(e){note(e.message,true);}finally{busy=false;delete document.body.dataset.busy;}}
document.addEventListener("click",event=>{
 const b=event.target.closest("[data-action],[data-tab]");if(!b)return;event.preventDefault();
 if(b.dataset.tab){if(busy)return;tab=b.dataset.tab;render();return;}
 run(()=>act(b.dataset.action,b));
});
document.addEventListener("change",event=>{
 const t=event.target;
 if(t.id==="run-select"){selectedRun=t.value;page=0;detail="";render();}
 if(t.id==="filter-status"){filter=t.value;page=0;render();}
 if(t.id==="mapping-source"||t.id==="mapping-target"){draftMapping=readMapping();render();}
 if(t.id==="select-page")document.querySelectorAll(".finding-choice").forEach(x=>x.checked=t.checked);
});
document.addEventListener("input",event=>{if(event.target.id==="filter-query"){query=event.target.value;page=0;const start=event.target.selectionStart;render();$("filter-query").focus();$("filter-query").setSelectionRange(start,start);}});
$("save-file").onclick=()=>run(saveWorkspace);$("package").onclick=()=>run(handover);
$("retry").onclick=()=>run(async()=>{if(!pending)throw Error("No saved operation needs continuation.");await commit(pending);render();note("Continued the original saved operation.");});
$("workspace-select").onchange=()=>run(()=>select($("workspace-select").value));
$("actor").onchange=()=>run(()=>put("meta","actor",$("actor").value));
$("open-file").onchange=()=>run(async()=>{const f=$("open-file").files[0];if(!f)return;if(f.size>128*1024*1024)throw Error("The complete workspace exceeds 128 MiB.");const w=C.receive(await f.text());await addBook(w);$("open-file").value="";note("Received the complete original workspace in a separate saved copy.");});
$("new-form").onsubmit=event=>{event.preventDefault();run(async()=>{const p=Object.fromEntries(new FormData(event.target));const w=C.create({...p,id:uid(),at:new Date().toISOString()});await addBook(w);$("new-dialog").close();note("Created the acceptance workspace.");});};
(async()=>{try{db=await openDb();$("actor").value=await read("meta","actor")||"";const active=await read("meta","active");if(active&&await read("books",active))await select(active);else if(included)await addBook(C.receive(included));else{await refreshPicker();render();}}catch(e){note("Browser working storage could not open: "+e.message+". Keep the original workspace file and open this application in a browser with local storage enabled.",true);}})();
})();
</script></body></html>
