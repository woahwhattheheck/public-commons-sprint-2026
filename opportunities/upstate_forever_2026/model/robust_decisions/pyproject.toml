[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ecosci-robust-decisions"
version = "0.1.0"
description = "Private multi-profile ecological intervention decision studies"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "scipy>=1.11", "pydantic>=2.7", "fastapi>=0.110", "uvicorn>=0.27"]

[project.scripts]
ecosci-robust = "eco_robust.cli:main"

[tool.setuptools.package-data]
eco_robust = ["panel.html"]

[tool.setuptools.packages.find]
include = ["eco_robust*"]
