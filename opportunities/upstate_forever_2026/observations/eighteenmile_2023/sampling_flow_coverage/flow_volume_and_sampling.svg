<svg xmlns="http://www.w3.org/2000/svg" width="820" height="760" viewBox="0 0 820 760" role="img" aria-labelledby="fc-title fc-desc">
<title id="fc-title">Eighteenmile flow volume and sampling coverage</title><desc id="fc-desc">Original USGS-02186702 daily mean discharge, all 365 approved 2023 reporting days. Water-volume shares sum original daily means with equal nominal 86400-second reporting days. Each CHLA or SWS sampling calendar date is counted once across its selected stations. Both panels use the same annual flow-band thresholds. The 19 days at or above 134.8 cfs carried 25.35% of annual observed gauge volume; no CHLA visit date falls in either band above the annual 90th percentile. Cohort percentages describe original visit-date coverage of flow conditions.</desc>
