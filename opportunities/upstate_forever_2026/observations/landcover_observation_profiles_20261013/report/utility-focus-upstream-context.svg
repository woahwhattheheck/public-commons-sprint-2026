<title id="profiles-title">Utility focus areas and distinct upstream context</title><desc id="profiles-desc">Panel A compares each issuer focus pair with its unique original-network upstream union using the same native-cell area. The union includes the anchors. Panel B preserves gross forest-class gains, losses and net change for those four footprints; negative loss marks are a plotting convention. Whole-HUC12 planning extents are distinct from intake-point catchments and service areas. Source classifications are 2023 and 2025; the source table records original network memberships and all eight group balances.</desc>
