</style></head><body>
<header><small>TokenJunkieLabs / Ecosystem Sciences / Regional observation atlas</small><h1>Source-calendar review</h1><p class="subtitle">Inspect the original sampling calendar, select a planning objective and carry the same source into Monitoring design. All 217 catchments and 36 source-station locations stay intact.</p></header>
<main>
<div class="toolbar"><label>First year<select id="first"></select></label><label>Last year<select id="last"></select></label><label>Exact analytical method<select id="method"><option value="">All retained methods</option></select></label><label class="search">Find a station or catchment<input id="search" type="search" placeholder="Station ID, HUC12 or watershed name"></label><label>Watershed scope<select id="scope"><option value="all">Complete domain</option><option value="sourcewater">Source-water catchments</option><option value="gap">Source-water, no selected rows</option><option value="observed">Catchments with selected rows</option></select></label><button id="reset">Reset view</button></div>
<div class="metrics" id="metrics"></div>
<div id="message" role="status" aria-live="polite"></div>
<nav aria-label="Source-calendar views"><button data-tab="watersheds" aria-selected="true">Watersheds</button><button data-tab="stations">Stations</button><button data-tab="calendar">Calendar</button><button data-tab="compare">Comparable months</button><button data-tab="records">Original records</button><button data-tab="planning">Planning handover</button><button data-tab="sources">Sources & methods</button></nav>
<section class="panel" id="view" aria-live="polite"></section>
</main>
<script id="data" type="application/json">__DATA_PAYLOAD__</script>
<script>
'use strict';
const D=JSON.parse(document.getElementById('data').textContent);
const $=s=>document.querySelector(s), esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=(n,d=0)=>Number(n).toLocaleString('en-US',{maximumFractionDigits:d});
const months=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const origin=JSON.stringify(D.input_manifest.map(f=>[f.original_path,f.sha256]));
const storageKey='upstate-atlas-calendar:'+D.summary.project_id+':'+D.input_manifest.find(f=>f.original_path==='original/original_intervals/record-intervals.csv').sha256;
let state={first:D.summary.start_year,last:D.summary.end_year,method:'',search:'',scope:'all',tab:'watersheds',calendarYear:D.summary.end_year,priority:'calendar_gap_priority_ha',selected:[],notes:'',configuration:null};
let rendered=[],detailStation=null;
for(let y=D.summary.start_year;y<=D.summary.end_year;y++){ $('#first').add(new Option(y,y));$('#last').add(new Option(y,y)); }
for(const m of D.summary.selected_method_keys)$('#method').add(new Option(m,m));
const say=text=>{$('#message').textContent=text;};
function controls(){for(const k of ['first','last','method','search','scope'])$('#'+k).value=state[k];}
function eligibleRows(){return D.observations.filter(r=>r.year>=state.first&&r.year<=state.last&&(!state.method||r.method_key===state.method));}
function aggregate(){
 const rows=eligibleRows(), sm=new Map(),hm=new Map();
 for(const r of rows){if(!sm.has(r.station_id))sm.set(r.station_id,[]);if(!hm.has(r.huc12))hm.set(r.huc12,[]);sm.get(r.station_id).push(r);hm.get(r.huc12).push(r);}
 const total=(state.last-state.first+1)*12;
 const stats=rs=>{const bins=new Set(rs.map(r=>r.year+'-'+r.month));return {routine_records:rs.length,observed_months:bins.size,reference_months:total,calendar_support_fraction:bins.size/total,method_keys:[...new Set(rs.map(r=>r.method_key))].sort(),months_ever_observed:[...new Set(rs.map(r=>r.month))].sort((a,b)=>a-b),first_observed_date:rs.length?rs.map(r=>r.date).sort()[0]:null,last_observed_date:rs.length?rs.map(r=>r.date).sort().at(-1):null,rs};};
 const hucs=D.watersheds.map(h=>{const s=stats(hm.get(h.huc12)||[]);return {...h,...s,historical_gap_priority_ha:h.source_water_union_ha*(1-s.calendar_support_fraction),no_observation_priority_ha:s.routine_records?0:h.source_water_union_ha};});
 const stations=D.stations.map(s=>({...s,...stats(sm.get(s.station_id)||[])}));
 const hucMap=new Map(hucs.map(h=>[h.huc12,h]));return {rows,hucs,stations,hucMap};
}
function matchesHuc(h){
 if(state.scope==='sourcewater'&&h.source_water_union_ha<=0)return false;
 if(state.scope==='gap'&&(!h.source_water_union_ha||h.routine_records))return false;
 if(state.scope==='observed'&&!h.routine_records)return false;
 const q=state.search.trim().toLowerCase();return !q||[h.huc12,h.name,...h.station_ids].join(' ').toLowerCase().includes(q);
}
function matchesStation(id,h){
 if(!matchesHuc(h))return false;const q=state.search.trim().toLowerCase();
 return !q||[id,h.huc12,h.name].join(' ').toLowerCase().includes(q);
}
function csv(rows){if(!rows.length)return '';const keys=Object.keys(rows[0]);const field=v=>{if(v===null||v===undefined)return '';if(typeof v==='object')v=JSON.stringify(v);if(typeof v==='string'&&/^[\s]*[=+\-@]/.test(v))v="'"+v;return '"'+String(v).replaceAll('"','""')+'"';};return keys.map(field).join(',')+'\n'+rows.map(r=>keys.map(k=>field(r[k])).join(',')).join('\n')+'\n';}
function download(name,data,type='application/json'){const blob=new Blob([typeof data==='string'?data:JSON.stringify(data,null,2)+'\n'],{type});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);}
function exportRows(){const clean=rendered.map(({rs,...r})=>r);download('calendar-'+state.tab+'-'+state.first+'-'+state.last+'.csv',csv(clean),'text/csv');say('Exported all '+clean.length+' rows in this filtered view.');}
const table=(headers,rows)=>'<div class="scroll"><table><thead><tr>'+headers.map(x=>'<th>'+esc(x)+'</th>').join('')+'</tr></thead><tbody>'+rows.join('')+'</tbody></table></div>';
const intro=(title,copy)=>'<div class="sectiontitle"><div><h2>'+title+'</h2><p class="muted">'+copy+'</p></div><button class="noprint" id="export">Export displayed cohort CSV</button></div>';
function render(){
 controls();const a=aggregate();const sw=a.hucs.filter(h=>h.source_water_union_ha>0),gaps=sw.filter(h=>!h.routine_records),bins=a.stations.reduce((n,s)=>n+s.observed_months,0);
 $('#metrics').innerHTML=[['Routine activities',num(a.rows.length),'Original source rows within the selected year/method window'],['Station-month cells',num(bins)+' / '+num(36*(state.last-state.first+1)*12),'At least one selected activity; fixed 36-station cohort'],['Observed catchments',a.hucs.filter(h=>h.routine_records).length+' / 217','Whole source domain retained'],['Source-water cohort gaps',gaps.length+' / '+sw.length,num(gaps.reduce((n,h)=>n+h.source_water_union_ha,0),2)+' ha of original source-water intersection']].map(([label,value,sub])=>'<div class="metric"><span>'+label+'</span><strong>'+value+'</strong><span>'+sub+'</span></div>').join('');
 document.querySelectorAll('nav button').forEach(b=>b.setAttribute('aria-selected',b.dataset.tab===state.tab));
 const hucs=a.hucs.filter(matchesHuc);let content='';
 if(state.tab==='watersheds'){
  rendered=hucs.sort((a,b)=>b.historical_gap_priority_ha-a.historical_gap_priority_ha||a.huc12.localeCompare(b.huc12));
  content=intro('Watershed sampling support',rendered.length+' complete catchment rows. Sorting uses source-water area × absent-reference-month fraction.')+
   '<div class="note">Absent rows describe this original microbial cohort, not absence of every monitoring programme. Gap weight is a planning preference, not a water-quality risk score.</div>'+
   table(['HUC12 / watershed','Source-water ha','Activities','Observed months','Gap weight','Original stations','Review'],rendered.map(h=>'<tr><td class="name"><span class="mono">'+h.huc12+'</span><br>'+esc(h.name)+'</td><td class="num">'+num(h.source_water_union_ha,2)+'</td><td class="num">'+h.routine_records+'</td><td>'+h.observed_months+' / '+h.reference_months+'<br><progress max="1" value="'+h.calendar_support_fraction+'"></progress></td><td class="num">'+num(h.historical_gap_priority_ha,2)+'</td><td>'+h.station_ids.length+'</td><td><input type="checkbox" aria-label="Select '+h.huc12+'" data-huc="'+h.huc12+'" '+(state.selected.includes(h.huc12)?'checked':'')+'></td></tr>'));
 }else if(state.tab==='stations'){
  rendered=a.stations.filter(s=>matchesStation(s.station_id,a.hucMap.get(s.huc12))).sort((a,b)=>a.station_id.localeCompare(b.station_id));
  content=intro('Original station coverage',rendered.length+' retained station locations; original analytical methods remain distinct.')+
   table(['Station / HUC12','Activities','Month cells','Calendar months ever sampled','Exact method identities','First / last selected date'],rendered.map(s=>'<tr><td class="name"><button class="rowbutton" data-station="'+esc(s.station_id)+'">'+esc(s.station_id)+'</button><br><span class="mono">'+s.huc12+'</span></td><td class="num">'+s.routine_records+'</td><td>'+s.observed_months+' / '+s.reference_months+'</td><td>'+s.months_ever_observed.map(m=>months[m-1]).join(', ')+'</td><td>'+s.method_keys.map(esc).join('<br>')+'</td><td class="nowrap">'+esc(s.first_observed_date||'No selected rows')+'<br>'+esc(s.last_observed_date||'')+'</td></tr>'))+'<div id="station-detail"></div>';
 }else if(state.tab==='calendar'){
  const cy=Math.min(state.last,Math.max(state.first,state.calendarYear));state.calendarYear=cy;
  const ss=a.stations.filter(s=>matchesStation(s.station_id,a.hucMap.get(s.huc12)));rendered=[];
  content=intro('Station-by-month calendar','Each cell is the number of distinct retained routine activities, not a scheduled-visit completion percentage.')+'<div class="flex"><label>Calendar year<select id="cy">'+Array.from({length:state.last-state.first+1},(_,i)=>state.first+i).map(y=>'<option '+(y===cy?'selected':'')+'>'+y+'</option>').join('')+'</select></label><span class="muted">'+ss.length+' original stations. Empty cells remain visible.</span></div>';
  content+=table(['Station',...months],ss.map(s=>{const counts=months.map((_,i)=>s.rs.filter(r=>r.year===cy&&r.month===i+1).length);counts.forEach((n,i)=>rendered.push({station_id:s.station_id,huc12:s.huc12,year:cy,month:i+1,activities:n}));return '<tr><td class="code">'+esc(s.station_id)+'</td>'+counts.map(n=>'<td class="monthcell '+(n?'occupied':'empty')+'">'+(n||'0')+'</td>').join('')+'</tr>';}));
 }else if(state.tab==='compare'){
  const ids=new Set(hucs.map(h=>h.huc12));rendered=D.comparisons.filter(c=>ids.has(c.huc12)&&matchesStation(c.station_id,a.hucMap.get(c.huc12))&&c.year_a>=state.first&&c.year_b<=state.last&&(!state.method||c.method_key===state.method));
  content=intro('Same-station, same-method calendar comparisons',rendered.length+' original year pairs. Shared months alone do not control weather, flow or sampling frequency.')+
   table(['Station / method','Years','Common months','Original rows in common months','Same month set?'],rendered.map(c=>'<tr><td>'+esc(c.station_id)+'<br><span class="muted">'+esc(c.method_key)+'</span></td><td>'+c.year_a+' / '+c.year_b+'</td><td>'+c.common_months.map(m=>months[m-1]).join(', ')+'</td><td>'+c.records_a_in_common_months+' / '+c.records_b_in_common_months+'</td><td>'+ (c.same_calendar_month_set?'Yes':'No')+'</td></tr>'));
 }else if(state.tab==='records'){
  const ids=new Set(hucs.map(h=>h.huc12));rendered=a.rows.filter(r=>ids.has(r.huc12)&&matchesStation(r.station_id,a.hucMap.get(r.huc12)));
  content=intro('Complete original activity rows',rendered.length+' selected rows. Exact publisher method and interval endpoints are retained.')+
   '<div class="note">An open upper bound stays open. Limits and non-detects are not replaced by half a limit or by zero.</div>'+
   table(['Station / date','Method','Original status','Lower','Upper','Unit','Original row'],rendered.map(r=>'<tr><td>'+esc(r.station_id)+'<br>'+r.date+'</td><td>'+esc(r.method_key)+'</td><td>'+esc(r.status)+'</td><td class="num">'+(r.lower===null?'Not reported':num(r.lower,4))+'</td><td class="num">'+(r.upper===null?(r.status==='above_limit'?'Unbounded':'Not reported'):num(r.upper,4))+'</td><td>'+esc(r.unit)+'</td><td>'+esc(r.source_file)+' : '+r.source_row+'</td></tr>'));
 }else if(state.tab==='planning'){
  rendered=hucs.filter(h=>state.selected.includes(h.huc12));
  content='<h2>Planning handover</h2><p>Carry this original source edition and explicit review choices into the existing Monitoring desk. The campaign configuration remains the original operator-supplied object.</p><div class="split"><div><h3>Objective and reviewed catchments</h3><label>Native planning priority<select id="priority"><option value="calendar_gap_priority_ha">Source-water area × historical month gap</option><option value="calendar_source_water_ha">Original source-water area</option><option value="calendar_no_observation_priority_ha">Source-water area with no selected rows</option></select></label><p class="muted">Selected year/method window: '+state.first+'–'+state.last+'; '+esc(state.method||D.summary.selected_method_keys.join(', '))+'.</p><p>'+state.selected.length+' reviewed catchments. Review selection is recorded separately; it is not silently added to the campaign’s required sites.</p><div class="scroll" style="max-height:230px"><table><thead><tr><th>HUC12</th><th>Name</th><th>Source stations</th></tr></thead><tbody>'+D.watersheds.filter(h=>state.selected.includes(h.huc12)).map(h=>'<tr><td>'+h.huc12+'</td><td>'+esc(h.name)+'</td><td>'+h.station_ids.length+'</td></tr>').join('')+'</tbody></table></div><label style="margin-top:14px">Review notes<textarea id="notes" placeholder="Record decisions for the existing campaign owner.">'+esc(state.notes)+'</textarea></label></div><div><h3>Original campaign configuration</h3><p class="muted">Load an existing native plan, receiver selection or configuration JSON. Budget, currency, costs, dates, crew capacity, constraints and station-baseline choices are carried unchanged.</p><label class="noprint">Load original configuration<input type="file" id="configFile" accept=".json,application/json"></label><div id="configSummary" class="note">'+configSummary()+'</div><button id="clearConfig" class="noprint">Clear loaded configuration</button><h3>Save and receive</h3><div class="flex noprint"><button id="save" class="primary">Save review locally</button><button id="exportReview">Export native review request</button></div><label class="noprint">Restore a saved review<input type="file" id="reviewFile" accept=".json,application/json"></label><p class="muted">The saved review is bound to the complete original source hashes. A different source edition is reported before any review is applied.</p><p class="mono">python source/receive_atlas_calendar.py --application-root APP --workspace WORKSPACE --package PACK --request review.json --output OPERATION</p></div></div>';
 }else{
  rendered=D.input_manifest;
  content=intro('Original sources and reproducible methods','Full files, not selected snippets, accompany the study.')+'<div class="downloads noprint"><a href="calendar-support.pdf">Scientific report PDF</a><a href="gis/calendar-support.gpkg">Editable GIS</a><a href="calendar-monitoring.sources.json">Monitoring source manifest</a><a href="calendar-report.sources.json">Scientific report source</a><a href="source/README.md">Operating guide</a></div>'+D.interpretation.map(t=>'<p>'+esc(t)+'</p>').join('')+'<h3>Retained original inputs</h3>'+table(['Original source','Bytes','SHA256'],D.input_manifest.map(f=>'<tr><td><a href="'+esc(f.path)+'">'+esc(f.original_path)+'</a></td><td class="num">'+num(f.bytes)+'</td><td class="mono">'+f.sha256+'</td></tr>'));
 }
 if(!content)content='<p class="emptymsg">No view selected.</p>';$('#view').innerHTML=content;
 if($('#export'))$('#export').onclick=exportRows;
 $('#cy')?.addEventListener('change',e=>{state.calendarYear=Number(e.target.value);render();});
 document.querySelectorAll('[data-huc]').forEach(el=>el.addEventListener('change',()=>{state.selected=el.checked?[...new Set([...state.selected,el.dataset.huc])]:state.selected.filter(k=>k!==el.dataset.huc);say(state.selected.length+' catchments retained in your review.');}));
 document.querySelectorAll('[data-station]').forEach(b=>b.addEventListener('click',()=>stationDetail(b.dataset.station,a)));
 if(state.tab==='planning'){
  $('#priority').value=state.priority;$('#priority').onchange=e=>state.priority=e.target.value;
  $('#notes').oninput=e=>state.notes=e.target.value;
  $('#save').onclick=()=>{try{localStorage.setItem(storageKey,JSON.stringify(review()));say('Saved the source-bound review on this device. Export a JSON copy for transfer.');}catch(e){say('Local browser storage is unavailable here. Export the review JSON to preserve your work.');}};
  $('#exportReview').onclick=()=>{download('atlas-calendar-review.json',review());say('Exported the complete source-bound review and original campaign configuration.');};
  $('#clearConfig').onclick=()=>{state.configuration=null;render();say('Loaded campaign configuration cleared.');};
  $('#configFile').onchange=async e=>{try{const obj=JSON.parse(await e.target.files[0].text()),c=obj.configuration??obj;if(!c||typeof c!=='object'||Array.isArray(c)||!c.calendar||c.budget===undefined)throw Error('Choose a saved native configuration containing calendar and budget');state.configuration=structuredClone(c);render();say('Loaded the original configuration without modifying its fields.');}catch(err){say(err.message);}};
  $('#reviewFile').onchange=async e=>{try{applyReview(JSON.parse(await e.target.files[0].text()));render();say('Restored the matching source-bound review.');}catch(err){say(err.message);}};
 }
}
function configSummary(){const c=state.configuration;if(!c)return 'No original campaign configuration loaded. Source analysis and source import remain available.';return '<strong>Budget: '+esc(c.currency||'Currency not explicitly specified')+' '+esc(c.budget)+'</strong><br>Sites: '+esc(c.min_sites??0)+' to '+esc(c.max_sites??'engine default')+'<br>Calendar: <span class="mono">'+esc(JSON.stringify(c.calendar))+'</span><br>Coverage mode: '+esc(c.coverage_mode||'local')+'<br>Existing-station baseline choices: '+esc((c.existing_station_ids||[]).length);}
function review(){return {schema:'upstate.atlas-calendar-review/v1',project_id:D.summary.project_id,source_inputs:D.input_manifest.map(f=>({original_path:f.original_path,sha256:f.sha256})),source_selection:{start_year:state.first,end_year:state.last,method_keys:state.method?[state.method]:[...D.summary.selected_method_keys]},priority_field:state.priority,reviewed_huc12s:[...state.selected].sort(),notes:state.notes,configuration:state.configuration};}
function applyReview(obj){
 if(obj.schema!=='upstate.atlas-calendar-review/v1'||obj.project_id!==D.summary.project_id)throw Error('This review belongs to another study');
 if(JSON.stringify(obj.source_inputs.map(f=>[f.original_path,f.sha256]))!==origin)throw Error('This review has a different original source edition');
 const sel=obj.source_selection;if(!Number.isInteger(sel.start_year)||!Number.isInteger(sel.end_year)||sel.start_year<D.summary.start_year||sel.end_year>D.summary.end_year||sel.start_year>sel.end_year)throw Error('Review year window is outside this study');
 const requested=sel.method_keys??D.summary.selected_method_keys;const base=D.summary.selected_method_keys;
 if(!Array.isArray(requested)||!requested.length||new Set(requested).size!==requested.length||requested.some(m=>!base.includes(m))||(requested.length!==1&&JSON.stringify([...requested].sort())!==JSON.stringify([...base].sort())))throw Error('Review method selection is not available in this edition');
 const allowed=['calendar_gap_priority_ha','calendar_source_water_ha','calendar_no_observation_priority_ha'];if(!allowed.includes(obj.priority_field))throw Error('Unknown planning priority');
 const known=new Set(D.watersheds.map(h=>h.huc12));if(!Array.isArray(obj.reviewed_huc12s)||obj.reviewed_huc12s.some(h=>!known.has(h)))throw Error('Unknown reviewed catchment');
 state.first=sel.start_year;state.last=sel.end_year;state.method=requested.length===base.length?'':requested[0];state.priority=obj.priority_field;state.selected=[...new Set(obj.reviewed_huc12s)];state.notes=String(obj.notes||'');state.configuration=obj.configuration??null;
}
function stationDetail(id,a){const s=a.stations.find(s=>s.station_id===id);const rows=s.rs;$('#station-detail').innerHTML='<div class="detail"><h3>'+esc(id)+'</h3><p>Original source position: '+s.longitude_wgs84+', '+s.latitude_wgs84+'. '+rows.length+' selected routine activities.</p>'+table(['Date','Method','Status','Original source row'],rows.map(r=>'<tr><td>'+r.date+'</td><td>'+esc(r.method_key)+'</td><td>'+esc(r.status)+'</td><td>'+esc(r.source_file)+' : '+r.source_row+'</td></tr>'))+'</div>';$('#station-detail').scrollIntoView({behavior:'smooth',block:'nearest'});}
for(const k of ['first','last','method','search','scope'])$('#'+k).addEventListener(k==='search'?'input':'change',e=>{state[k]=['first','last'].includes(k)?Number(e.target.value):e.target.value;if(state.first>state.last){if(k==='first')state.last=state.first;else state.first=state.last;}render();});
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{state.tab=b.dataset.tab;render();});
$('#reset').onclick=()=>{state.first=D.summary.start_year;state.last=D.summary.end_year;state.method='';state.scope='all';state.search='';render();say('Filters reset. Review notes and selected catchments preserved.');};
try{const saved=localStorage.getItem(storageKey);if(saved){applyReview(JSON.parse(saved));say('Restored your saved matching-source review.');}}catch(e){say('Saved review could not be opened: '+e.message);}
render();
