<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 529" role="img" aria-labelledby="sv833-calendar-support-title sv833-calendar-support-desc"><title id="sv833-calendar-support-title">SV-833: the sampled calendar changes the comparison</title><desc id="sv833-calendar-support-desc">The original all-date medians are 419.6→387.3 MPN/100 mL (9 and 11 records). Restricting both years to January, February, April, May, July, August, November and December gives 298.9→666.8 (8 records in each year). Lines connect endpoint summaries only. These selected medians have exact original interval bounds; no inferential confidence intervals or management effects are implied. Matching months does not match exact dates, weather or flow.</desc><style>text{font-family:Arial,Helvetica,sans-serif;fill:#222;font-size:12px}.title{font-size:23px;font-weight:600}.panel-title{font-size:14px;font-weight:600}.axis{stroke:#333;stroke-width:1}.grid{stroke:#ddd;stroke-width:1}.tick{font-size:11px}.caption{font-size:13px;fill:#444}</style><rect width="1100" height="529" fill="#fff"/><text x="30" y="34" class="title">SV-833: the sampled calendar changes the comparison</text><text x="100" y="90" class="panel-title">2021 and 2025 sample medians</text><text x="1054" y="106" text-anchor="end" class="tick">E. coli (MPN/100 mL)</text><line x1="100" y1="318" x2="1054" y2="318" class="grid"/><text x="91" y="322" text-anchor="end" class="tick">0</text><line x1="100" y1="266.75" x2="1054" y2="266.75" class="grid"/><text x="91" y="270.75" text-anchor="end" class="tick">200</text><line x1="100" y1="215.5" x2="1054" y2="215.5" class="grid"/><text x="91" y="219.5" text-anchor="end" class="tick">400</text><line x1="100" y1="164.25" x2="1054" y2="164.25" class="grid"/><text x="91" y="168.25" text-anchor="end" class="tick">600</text><line x1="100" y1="113" x2="1054" y2="113" class="grid"/><text x="91" y="117" text-anchor="end" class="tick">800</text><line x1="210.077" y1="318" x2="210.077" y2="323" class="axis"/><text x="210.077" y="338" text-anchor="middle" class="tick">2021</text><line x1="943.923" y1="318" x2="943.923" y2="323" class="axis"/><text x="943.923" y="338" text-anchor="middle" class="tick">2025</text><line x1="100" y1="318" x2="1054" y2="318" class="axis"/><line x1="100" y1="318" x2="100" y2="113" class="axis"/><text x="577" y="360" text-anchor="middle">Year</text><path d="M210.077,210.477L943.923,218.754" fill="none" stroke="#222" stroke-width="1.5"/><g><title>All dates: 2021, 419.6</title><circle cx="210.077" cy="210.477" r="3" fill="#222" stroke="#222" stroke-width="1.2"/></g><g><title>All dates: 2025, 387.3</title><circle cx="943.923" cy="218.754" r="3" fill="#222" stroke="#222" stroke-width="1.2"/></g><path d="M210.077,241.407L943.923,147.133" fill="none" stroke="#222" stroke-width="1.5" stroke-dasharray="5 3"/><g><title>Common months: 2021, 298.9</title><rect x="207.077" y="238.407" width="6" height="6" fill="#fff" stroke="#222" stroke-width="1.2"/></g><g><title>Common months: 2025, 666.8</title><rect x="940.923" y="144.133" width="6" height="6" fill="#fff" stroke="#222" stroke-width="1.2"/></g><g class="scientific-annotation"><title>419.6; n=9</title><line x1="210.077" y1="210.477" x2="210.077" y2="202.477" stroke="#444" stroke-width="0.6"/><rect x="180.927" y="186.477" width="58.3" height="16" fill="#fff"/><text x="183.927" y="197.977" class="tick" textLength="52.3" lengthAdjust="spacingAndGlyphs">419.6; n=9</text></g><g class="scientific-annotation"><title>387.3; n=11</title><line x1="943.923" y1="218.754" x2="943.923" y2="210.754" stroke="#444" stroke-width="0.6"/><rect x="911.723" y="194.754" width="64.4" height="16" fill="#fff"/><text x="914.723" y="206.254" class="tick" textLength="58.4" lengthAdjust="spacingAndGlyphs">387.3; n=11</text></g><g class="scientific-annotation"><title>298.9; n=8</title><line x1="210.077" y1="241.407" x2="210.077" y2="233.407" stroke="#444" stroke-width="0.6"/><rect x="180.927" y="217.407" width="58.3" height="16" fill="#fff"/><text x="183.927" y="228.907" class="tick" textLength="52.3" lengthAdjust="spacingAndGlyphs">298.9; n=8</text></g><g class="scientific-annotation"><title>666.8; n=8</title><line x1="943.923" y1="147.133" x2="943.923" y2="139.133" stroke="#444" stroke-width="0.6"/><rect x="914.773" y="123.133" width="58.3" height="16" fill="#fff"/><text x="917.773" y="134.633" class="tick" textLength="52.3" lengthAdjust="spacingAndGlyphs">666.8; n=8</text></g><line x1="100" y1="384" x2="120" y2="384" stroke="#222"/><circle cx="110" cy="384" r="2.7" fill="#222" stroke="#222" stroke-width="1.2"/><text x="127" y="388" class="tick">All dates</text><line x1="190.8" y1="384" x2="210.8" y2="384" stroke="#222" stroke-dasharray="5 3"/><rect x="198.1" y="381.3" width="5.4" height="5.4" fill="#fff" stroke="#222" stroke-width="1.2"/><text x="217.8" y="388" class="tick">Common months</text><text x="30" y="421" class="caption">The original all-date medians are 419.6→387.3 MPN/100 mL (9 and 11 records). Restricting both years to January, February, April, May, July,</text><text x="30" y="441" class="caption">August, November and December gives 298.9→666.8 (8 records in each year). Lines connect endpoint summaries only. These selected medians have</text><text x="30" y="461" class="caption">exact original interval bounds; no inferential confidence intervals or management effects are implied. Matching months does not match exact</text><text x="30" y="481" class="caption">dates, weather or flow.</text></svg>
