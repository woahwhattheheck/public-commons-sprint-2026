function download(name,body,type){const blob=new Blob([body],{type}),url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),10000);$("usc-status").textContent="Downloaded "+name+".";}
$("usc-utility").addEventListener("change",render);$("usc-huc").addEventListener("change",detail);
$("usc-json").addEventListener("click",()=>download("utility-source-context.json",JSON.stringify(result,null,2)+"\n","application/json"));
$("usc-csv").addEventListener("click",()=>download("utility-state-context.csv",csv,"text/csv"));
$("usc-report").addEventListener("click",()=>download("utility-source-context.html",report,"text/html"));
render();
