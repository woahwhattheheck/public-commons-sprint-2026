[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eco-scenario-lab"
version = "0.1.2"
description = "Retained full-watershed InVEST scenario execution, comparison, and handover"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24", "rasterio>=1.3", "fiona>=1.9", "shapely>=2", "pyproj>=3.5"]

[project.scripts]
eco-scenarios = "eco_scenario_lab.cli:main"

[tool.setuptools.packages.find]
include = ["eco_scenario_lab*"]
