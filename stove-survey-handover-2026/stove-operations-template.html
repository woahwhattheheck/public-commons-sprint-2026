<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Stove work and handover</title>
<style>
*{box-sizing:border-box}html{color-scheme:light}body{margin:0;background:#ececec;color:#202020;font:15px/1.5 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
#app{min-height:100vh;max-width:1480px;margin:auto;background:#f7f7f7;color:#202020;font:15px/1.5 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
#app header,#app main,#app footer,#app nav,#app form,#app article,#app section,#app table,#app td,#app th{color:#202020}
header{padding:24px 30px 18px;background:#fff;border-bottom:1px solid #bbb}
h1{font-size:29px;line-height:1.18;letter-spacing:-.02em;margin:0 0 8px}h2{font-size:21px;line-height:1.3;margin:0 0 14px}h3{font-size:16px;margin:20px 0 8px}h4{font-size:15px;margin:16px 0 8px}p{margin:0 0 12px}a{color:#202020;text-underline-offset:3px}a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid #333;outline-offset:3px}
header p{max-width:85ch}.small,small{font-size:13px}.muted{color:#555!important}.mono,code,pre{font:12px/1.5 ui-monospace,SFMono-Regular,Consolas,monospace;overflow-wrap:anywhere}code{background:#eee;padding:2px 4px;color:#202020}pre{white-space:pre-wrap;max-height:380px;overflow:auto;background:#f5f5f5;color:#202020;padding:12px;border:1px solid #ccc}
.toolbar,.actions,.inline{display:flex;flex-wrap:wrap;align-items:center;gap:9px}.toolbar{margin:16px 0 0}.toolbar label{min-width:180px;flex:1}.actions{margin:16px 0 0}
nav{display:flex;flex-wrap:wrap;gap:6px;padding:14px 30px;background:#eee;border-bottom:1px solid #bbb}nav button{background:#fff}nav button[aria-current="page"]{background:#292929;color:#fff;border-color:#292929}
button,a.button{appearance:none;border:1px solid #666;border-radius:3px;padding:9px 13px;background:#f4f4f4;color:#202020;font:inherit;font-weight:600;min-height:42px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;text-align:center;gap:6px;white-space:normal}
button.primary{background:#292929;color:#fff;border-color:#292929}button:disabled{background:#e9e9e9;color:#666;border-color:#aaa;cursor:not-allowed}button.quiet{font-weight:400;background:#fff}button.danger{border:2px solid #444;background:#fff;color:#111}
main{padding:24px 30px}.layout{display:grid;grid-template-columns:minmax(270px,.9fr) minmax(0,1.65fr);gap:20px;align-items:start}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px 18px}.grid.three{grid-template-columns:repeat(3,minmax(0,1fr))}.wide{grid-column:1/-1}.panel{border:1px solid #b5b5b5;background:#fff;color:#202020;padding:20px;margin:0 0 20px;border-radius:3px;min-width:0}.panel>*:last-child{margin-bottom:0}
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:10px;margin:0 0 20px}.metric{border:1px solid #bbb;padding:14px;background:#fff;color:#202020}.metric strong{display:block;font-size:26px;line-height:1.2}.metric span{font-size:13px;color:#444}
label{display:block;font-size:13px;font-weight:600;min-width:0}input,select,textarea{display:block;width:100%;font:inherit;font-weight:400;padding:9px 10px;border:1px solid #888;border-radius:2px;background:#fff;color:#202020;margin:5px 0 0;min-height:42px}input:disabled,select:disabled,textarea:disabled{background:#ececec;color:#595959;border-color:#aaa}textarea{min-height:90px;resize:vertical}input[type=checkbox],input[type=radio]{width:auto;min-height:0;display:inline;margin:0 8px 0 0;accent-color:#333}input[type=file]{max-width:100%}.check{font-weight:400;display:flex;align-items:flex-start;gap:6px;padding:7px 0}.check input{margin-top:4px;flex:none}.hint{font-size:12px;font-weight:400;color:#555;margin:5px 0 0}.error,.notice,.success{padding:12px 14px;border:1px solid #777;border-left:4px solid #333;background:#f1f1f1;color:#202020;margin:12px 0}.error{border-style:double;border-width:3px;background:#fff}.success{border-left-width:6px}.empty{padding:22px;border:1px dashed #999;background:#fafafa;color:#444}
.table-wrap{width:100%;max-width:100%;overflow-x:auto;border:1px solid #bbb;margin:12px 0}table{width:100%;border-collapse:collapse;background:#fff;color:#202020;text-align:left;font-size:13px}th,td{vertical-align:top;padding:10px;border-bottom:1px solid #ccc;overflow-wrap:anywhere}th{background:#eee;color:#202020;font-size:12px;letter-spacing:.02em}tr:last-child td{border-bottom:0}td .actions{margin:0;gap:5px}td button{font-size:12px;padding:5px 8px;min-height:34px}.tag{display:inline-block;font-size:12px;line-height:1.4;border:1px solid #999;padding:3px 6px;background:#eee;color:#202020;white-space:normal}.tag.strong{background:#333;color:#fff;border-color:#333}
dl{display:grid;grid-template-columns:minmax(110px,.65fr) minmax(0,2fr);gap:8px 14px;margin:12px 0}dt{font-size:13px;color:#555}dd{margin:0;overflow-wrap:anywhere}ul,ol{padding-left:21px}li{margin:4px 0}details{margin:12px 0}summary{cursor:pointer;font-weight:600;min-height:36px}fieldset{border:1px solid #bbb;padding:15px;margin:14px 0;min-width:0}legend{font-weight:600;padding:0 7px}.preserved{border-left:5px solid #555;padding:12px 14px;background:#f1f1f1;color:#202020}.evidence-preview{max-width:100%;max-height:340px;object-fit:contain;border:1px solid #aaa;background:#fff}
#status{min-height:2em;padding:10px 30px;background:#f5f5f5;color:#202020;border-bottom:1px solid #ccc;overflow-wrap:anywhere}footer{padding:18px 30px;border-top:1px solid #bbb;background:#eee;font-size:12px}.nowrap{white-space:nowrap}.row-actions{display:flex;gap:5px;flex-wrap:wrap}.busy{padding:12px;border:1px dashed #666;background:#eee;color:#202020}[hidden]{display:none!important}
@media(max-width:900px){.layout{grid-template-columns:1fr}.grid.three{grid-template-columns:repeat(2,minmax(0,1fr))}header,main{padding:20px}nav{padding:12px 20px}#status,footer{padding-left:20px;padding-right:20px}}
@media(max-width:560px){header,main{padding:16px 12px}nav{padding:10px 12px;gap:5px}nav button{flex:1 1 43%;font-size:13px;padding:8px}.grid,.grid.three{grid-template-columns:1fr}.wide{grid-column:auto}.panel{padding:15px 12px}h1{font-size:25px}.toolbar{align-items:stretch}.toolbar>*{flex:1 1 100%}.actions>*{flex:1 1 auto}dl{grid-template-columns:1fr;gap:2px}dd{margin-bottom:9px}#status,footer{padding:10px 12px}th,td{padding:8px}.table-wrap{max-width:100%}}
@media print{nav,.toolbar,.actions,button,input[type=file],#status{display:none!important}body,#app{background:#fff}.layout{display:block}.panel{break-inside:avoid}main{padding:0}.table-wrap{overflow:visible}header{padding:12px 0}footer{padding:10px 0}}
</style></head><body>
