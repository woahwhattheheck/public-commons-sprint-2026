function render(){const actor=get("actor")?.value||"Operator";root.innerHTML='<header><p class="eyebrow">Customer and job data</p><h1>Migration & commissioning</h1><p class="lede">Keep original records, review each decision, and reconcile the actual receiving result.</p><div class="topbar">'+programmeSelect()+'<label>Recorded by<input id="actor" value="'+esc(actor)+'" required></label><div class="workspace-id"><strong>'+esc(w.title)+'</strong><small>Revision '+w.revision+' · '+esc(w.id)+'</small></div></div></header><nav aria-label="Workflow">'+tabs.map(([id,label])=>'<button type="button" data-tab="'+id+'" '+(tab===id?'aria-current="page"':"")+'>'+esc(label)+'</button>').join("")+'</nav><p id="message" class="message" role="status">'+esc(flash)+'</p><main>'+({overview:overviewPage,sources:sourcePage,mapping:mappingPage,rows:rowsPage,handover:handoverPage,outcomes:outcomesPage,records:recordsPage,receiving:receivingPage}[tab]())+'</main><footer>Local editable workspace. Export before closing. No target import, email, payment or external request is sent by this application.</footer>'; }
function parseMapping(f){return [...f.querySelectorAll("[data-field-row]")].map(row=>{const e=n=>row.querySelector('[name="'+n+'"]'),v=n=>e(n).value;
const maps=JSON.parse(v("valueMap")||"[]");if(!Array.isArray(maps))throw Error("Value translations must be a JSON array.");
return {field:{key:v("key").trim(),label:v("label"),type:v("type"),required:e("required").checked,trim:e("trim").checked,empty:v("empty"),from:v("fromKind")==="column"?{column:v("fromValue")}:{constant:v("fromValue")},values:maps,referenceEntity:v("referenceEntity")},target:v("targetColumn")?{field:v("key").trim(),column:v("targetColumn"),relationshipMode:v("relationshipMode")}:null};});}
function decisions(f){return [...f.querySelectorAll("[data-decision-row]")].map(row=>({rowId:row.dataset.rowId,action:row.querySelector('[name="action"]').value,recordId:row.querySelector('[name="recordId"]').value,reason:row.querySelector('[name="reason"]').value}));}
function outcomes(f){return [...f.querySelectorAll("[data-outcome-row]")].map(row=>({rowId:row.dataset.rowId,status:row.querySelector('[name="status"]').value,nativeId:row.querySelector('[name="nativeId"]').value,reason:row.querySelector('[name="reason"]').value})).filter(x=>x.status);}
function refreshBatch(input,formId){if(!discard(formId))return;try{const r=C.reviewBatch(w,input);batchReview={input,result:r,ready:!r.issues.length};dirty.clear();flash="Review updated. Every row needs an explicit decision.";render();}catch(e){setMessage(e.message,true);}}
async function readSource(file){const generation=++fileEpoch,selectedProgramme=programmeId,selectedWorkspace=w.id,edit=epoch;pendingSource=null;const btn=get("source-form")?.querySelector('button[type="submit"]');if(btn)btn.disabled=true;get("source-file-status").textContent="Reading selected original…";
try{if(!file||file.size>8*1024*1024)throw Error("Choose an original file no larger than 8 MiB.");const text=await file.text();if(generation!==fileEpoch)return;if(programmeId!==selectedProgramme||w.id!==selectedWorkspace||epoch!==edit)throw Error("The programme or source form changed while reading. Select the original again.");pendingSource={name:file.name,text,format:/\.json$/i.test(file.name)?"json":"csv"};const f=get("source-form");if(!f)return;f.elements.name.value=file.name;f.elements.format.value=pendingSource.format;get("source-file-status").textContent=file.name+" · "+file.size+" bytes selected. Save original to retain.";dirty.add("source-form");epoch++;}
catch(e){if(generation===fileEpoch){pendingSource=null;setMessage(e.message,true);if(get("source-file-status"))get("source-file-status").textContent="No valid pending original.";}}
finally{if(generation===fileEpoch){if(btn)btn.disabled=!pendingSource;const picker=get("source-file");if(picker)picker.value="";}}}
async function readWorkspace(file){const generation=++workspaceEpoch,rev=w.revision,edit=++epoch;incoming=null;const view=get("incoming-review"),status=get("workspace-file-status");if(!view||!status)return;view.innerHTML="";status.textContent="Reading and validating…";
const current=()=>generation===workspaceEpoch&&tab==="receiving"&&get("incoming-review")&&get("workspace-file-status");
try{if(!file||file.size>64*1024*1024)throw Error("Choose a working JSON no larger than 64 MiB.");const text=await file.text();if(!current())return;const next=C.importWorkspace(text,{catalogue:CAT});if(!current())return;if(rev!==w.revision||edit!==epoch)throw Error("The workspace or a form changed while reading. Select the file again to review it.");incoming={workspace:next,name:file.name};get("incoming-review").innerHTML=incomingHTML();get("workspace-file-status").textContent="Complete workspace validated; current work is still unchanged.";}
catch(e){if(current()){incoming=null;get("incoming-review").innerHTML="";get("workspace-file-status").textContent="No validated incoming workspace.";setMessage(e.message,true);}}finally{if(generation===workspaceEpoch){const picker=get("workspace-file");if(picker)picker.value="";}}}
async function example(){if(exampleBusy||!discard())return;dirty.clear();epoch++;workspaceEpoch++;incoming=null;const start=epoch,rev=w.revision;exampleBusy=true;const exampleButton=root.querySelector('[data-action="example"]');if(exampleButton)exampleButton.disabled=true;root.setAttribute("aria-busy","true");let replaced=false;get("example-progress").textContent="Building complete worked programme…";try{const build=E.buildAsync||E.build;const r=await build(C,CAT,p=>{if(epoch===start&&get("example-progress"))get("example-progress").textContent=p.message||p.label||("Operation "+(p.operations||p.step||""));});if(epoch!==start||w.revision!==rev)throw Error("Your work changed while the example was building. Current work was kept.");download(w.id+"-before-example.json","application/json",C.exportWorkspace(w));w=r.workspace;programmeId=w.programmes[0]?.id||"";sourceId=profileId=recordId=deliveryId=batchId="";incoming=pendingSource=null;invalidateReviews();epoch++;flash="Complete demonstration loaded. All people, jobs and receiving IDs are example values.";replaced=true;}
catch(e){setMessage(e.message,true);}finally{exampleBusy=false;root.removeAttribute("aria-busy");if(replaced)render();else{const b=root.querySelector('[data-action="example"]');if(b)b.disabled=false;}}}
root.addEventListener("input",e=>{const f=e.target.closest("form");if(f){dirty.add(f.id);epoch++;if(f.id==="decisions-form"&&batchReview){batchReview.ready=false;const b=root.querySelector('[data-action="commit-batch"]');if(b)b.disabled=true;}if(f.id==="delivery-form"){deliveryReview=null;const b=root.querySelector('[data-action="commit-delivery"]');if(b)b.disabled=true;}if(f.id==="receipt-form"){receiptReview=null;const b=root.querySelector('[data-action="commit-receipt"]');if(b)b.disabled=true;}}});
root.addEventListener("change",e=>{const n=e.target;if(n.id==="source-file"){readSource(n.files?.[0]);return;}if(n.id==="workspace-file"){readWorkspace(n.files?.[0]);return;}if(n.id==="programme-select"){if(!selectProgramme(n.value))n.value=programmeId;return;}if(n.id==="delivery-select"){if(!discard()){n.value=deliveryId;return;}deliveryId=n.value;dirty.clear();epoch++;receiptReview=null;render();return;}if(n.hasAttribute("data-select-source")){const s=pick(w.files,n.value);const note=n.closest("form").querySelector("p.wide code");if(note)note.textContent=s?(C.sourceView(w,s.id).headers||s.headers||[]).join(" | "):"";}});
root.addEventListener("submit",e=>{e.preventDefault();const f=e.target,v=values(f);try{
if(f.id==="programme-form"){const id=v.id||C.uid("programme");commit({type:"programme.save",value:{...v,id}} ,f.id,()=>{programmeId=id;});}
else if(f.id==="source-form"){if(!pendingSource)throw Error("Select a valid original file first.");let path=JSON.parse(v.jsonPath||"[]");if(!Array.isArray(path))throw Error("JSON path must be an array of property names.");const id=C.uid("source");commit({type:"source.add",value:{id,programmeId,entity:v.entity,kind:v.kind,name:v.name,format:v.format,text:pendingSource.text,jsonPath:path,sourceSystem:v.sourceSystem,capturedAt:v.capturedAt,parentId:v.parentId||undefined,notes:v.notes}},f.id,()=>{sourceId=id;pendingSource=null;fileEpoch++;});}
else if(f.id==="mapping-form"){const rows=parseMapping(f),id=C.uid("profile");commit({type:"profile.save",value:{id,sourceId:v.sourceId,name:v.name,parentId:v.parentId||undefined,keyField:v.keyField,fields:rows.map(x=>x.field),targetFields:rows.map(x=>x.target).filter(Boolean),targetContractLabel:v.targetContractLabel,notes:v.notes}},f.id,()=>{profileId=id;sourceId=v.sourceId;});}

else if(f.id==="delivery-form"){if(!discard(f.id))return;const input={batchId:v.batchId,title:v.title,notes:v.notes},r=C.reviewDelivery(w,input);deliveryReview={input,result:r,ready:!r.issues.length};batchId=v.batchId;dirty.clear();render();}
else if(f.id==="receipt-form"){if(!discard(f.id))return;const input={deliveryId,evidenceFileId:v.evidenceFileId,observedAt:v.observedAt,reference:v.reference,notes:v.notes,outcomes:outcomes(f)},r=C.reviewReceipt(w,input);receiptReview={input,result:r,ready:!r.issues.length};dirty.clear();const old=receiptReview;get("message").textContent="Receiving result reviewed.";let panel=f.parentElement.querySelector(".receipt-review");if(!panel){panel=document.createElement("div");panel.className="receipt-review";f.parentElement.appendChild(panel);}panel.innerHTML=issues(r.issues)+pretty(r,"Full reviewed outcome snapshot")+button("Save reviewed result","commit-receipt",old.ready?"":"disabled");}
}catch(err){setMessage(err.message,true);}});
root.addEventListener("click",e=>{const n=e.target.closest("button");if(!n)return;if(n.dataset.tab){go(n.dataset.tab);return;}const a=n.dataset.action,id=n.dataset.id;if(!a)return;try{
if(a==="go-overview"){go("overview");return;}
if(a==="new-programme"){selectProgramme("");}
else if(a==="open-programme"){selectProgramme(id);}
else if(a==="open-source"){if(!discard())return;sourceId=id;dirty.clear();epoch++;render();}

else if(a==="commit-batch"){if(!batchReview?.ready)throw Error("Review all current row decisions first.");const x=batchReview;commit({type:"batch.commit",input:x.input,expectedReviewSha:x.result.reviewSha256},"decisions-form",()=>{batchId="batch_"+x.result.reviewSha256;});}

else if(a==="download-delivery"){const files=C.deliveryFiles(w,id),f=files.find(x=>x.name.toLowerCase().endsWith("."+n.dataset.kind));if(!f)throw Error("The selected saved file is unavailable.");download(f.name,f.mime,f.content);}

else if(a==="programme-report")download(prog().id+"-reconciliation.html","text/html",C.renderProgrammeReport(w,programmeId));

}catch(err){setMessage(err.message,true);}});
