<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Stellar Forge · Grant purchase reviewer</title><link rel="stylesheet" href="/style.css"></head>
<body>
<header class="top"><div><span class="eyebrow">STELLAR FORGE / SCF #46</span><h1>Grant purchase reviewer</h1></div>
<div id="connection-state" class="status">Private connection</div></header>
<section id="connect-panel" class="connect"><h2>Open this reviewer</h2>
<p>Use the access code from this workbench’s private connection file, or open it from Applications.</p>
<form id="connect-form"><label for="access-token">Workbench access code</label><input id="access-token" type="password" autocomplete="off" required>
<button type="submit">Connect</button></form></section>
<div id="workspace" hidden>
<nav aria-label="Reviewer views">
<button data-view="overview" type="button">Overview</button><button data-view="intake" type="button">Packet intake</button>
<button data-view="source" type="button">Source and query</button><button data-view="buyer" type="button">Buyer results</button>
<button data-view="handover" type="button">Handover</button><button data-view="history" type="button">Activity</button>
</nav>
<div class="selection-bar"><label for="selection">Selected packet</label><select id="selection"></select>
<button id="refresh" type="button">Refresh</button><button id="disconnect" type="button">Disconnect</button></div>
<main id="main" tabindex="-1"></main>
</div>
<div id="notice" role="status" aria-live="polite"></div>
<script type="module" src="/app.mjs"></script>
</body></html>
