<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light"><title>Record mastering</title><link rel="stylesheet" href="/style.css"></head>
<body><header><div><div class="eyebrow">STARFORGE / DATA OPERATIONS</div><h1>Record mastering</h1><p id="workspace-name">Opening workspace…</p></div><button id="backup" class="secondary">Download private workspace</button></header>
<div id="notice" role="status" aria-live="polite" hidden></div>
<nav aria-label="Workspace"><button data-tab="records" aria-current="page">Master records</button><button data-tab="matches">Matching desk</button><button data-tab="sources">Source editions</button><button data-tab="deliveries">Deliveries</button><button data-tab="history">Activity</button></nav>
<main><section id="metrics" aria-label="Workspace totals"></section><section id="content" aria-live="polite"></section></main>
<footer><span>Private workspace · Original source values retained</span><span id="revision"></span></footer>
<dialog id="dialog"><form method="dialog"><button class="dialog-close" aria-label="Close">×</button></form><div id="dialog-content"></div></dialog>
<script type="module" src="/app.js"></script></body></html>
