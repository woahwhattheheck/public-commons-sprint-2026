{
  "id": "conapi_workflow_acknowledge",
  "namespace": "conapi.commissioning",
  "description": "Return the actual receiver receipt to the sender's original request history.",
  "vars": {
    "runtime": {
      "schema": "stellar-forge.kestra-runtime.v1",
      "analysisRoot": "/opt/tjlabs/merchant/stellar/scf-starforge-20261009/sf30-seller-sdk/datasette-analysis",
      "workspace": "/var/lib/conapi/workflow",
      "configuration": "/etc/conapi/customer-workflow.json",
      "receiverWorkspace": "/var/lib/conapi/received-results",
      "correlationMode": "business-properties",
      "resultDestination": {
        "destinationName": "conapi.results",
        "destinationType": "QUEUE"
      },
      "nativeHeaderJar": "/opt/conapi/conapi-native-header-producer.jar",
      "pythonExecutable": "/usr/bin/python3",
      "javaExecutable": "/usr/bin/java"
    }
  },
  "tasks": [
    {
      "id": "acknowledge",
      "type": "io.kestra.plugin.scripts.python.Script",
      "taskRunner": {
        "type": "io.kestra.plugin.core.runner.Process"
      },
      "env": {
        "CONAPI_ANALYSIS_ROOT": "{{ vars.runtime.analysisRoot }}",
        "CONAPI_REQUEST_ID": "{{ inputs.requestId }}"
      },
      "inputFiles": {
        "runtime.json": "{{ vars.runtime | toJson }}",
        "producer-receipt.json": "{{ inputs.receipt }}"
      },
      "outputFiles": [
        "acknowledgement.json"
      ],
      "script": "import os\nfrom pathlib import Path\nimport sys\nsys.path.insert(0, str(Path(os.environ['CONAPI_ANALYSIS_ROOT']) / 'kestra'))\nfrom flow_driver import main\nraise SystemExit(main([\"acknowledge\"]))\n"
    }
  ],
  "inputs": [
    {
      "id": "requestId",
      "type": "STRING"
    },
    {
      "id": "receipt",
      "type": "STRING",
      "description": "Exact stellar-forge.source-workflow-receipt.v1 JSON from the actual receiver."
    }
  ],
  "outputs": [
    {
      "id": "acknowledgement",
      "type": "JSON",
      "value": "{{ fromJson(read(outputs.acknowledge.outputFiles['acknowledgement.json'])) }}"
    }
  ]
}
