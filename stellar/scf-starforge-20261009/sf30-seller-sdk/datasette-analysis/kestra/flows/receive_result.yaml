{
  "id": "conapi_workflow_receive_result",
  "namespace": "conapi.commissioning",
  "description": "Select the exact original correlated result with native JMS properties, retain the full result and produce the original receiver receipt.",
  "vars": {
    "runtime": {
      "schema": "stellar-forge.kestra-runtime.v1",
      "analysisRoot": "/opt/tjlabs/merchant/stellar/scf-starforge-20261009/sf30-seller-sdk/datasette-analysis",
      "workspace": "/var/lib/conapi/workflow",
      "configuration": "/etc/conapi/customer-workflow.json",
      "receiverWorkspace": "/var/lib/conapi/received-results",
      "correlationMode": "business-properties",
      "resultDestination": {
        "destinationName": "conapi.results",
        "destinationType": "QUEUE"
      },
      "nativeHeaderJar": "/opt/conapi/conapi-native-header-producer.jar",
      "pythonExecutable": "/usr/bin/python3",
      "javaExecutable": "/usr/bin/java"
    }
  },
  "tasks": [
    {
      "id": "select_result",
      "type": "io.kestra.plugin.scripts.python.Script",
      "taskRunner": {
        "type": "io.kestra.plugin.core.runner.Process"
      },
      "env": {
        "CONAPI_ANALYSIS_ROOT": "{{ vars.runtime.analysisRoot }}"
      },
      "inputFiles": {
        "runtime.json": "{{ vars.runtime | toJson }}",
        "selection.json": "{{ {'requestId': inputs.requestId, 'correlationId': inputs.correlationId, 'deliveryId': inputs.deliveryId, 'expectedResultSha256': inputs.expectedResultSha256} | toJson }}"
      },
      "outputFiles": [
        "selector.json"
      ],
      "script": "import os\nfrom pathlib import Path\nimport sys\nsys.path.insert(0, str(Path(os.environ['CONAPI_ANALYSIS_ROOT']) / 'kestra'))\nfrom flow_driver import main\nraise SystemExit(main([\"select\"]))\n"
    },
    {
      "id": "consume_result",
      "type": "io.kestra.plugin.jms.Consume",
      "connectionFactoryConfig": {
        "type": "DIRECT",
        "connectionFactoryClass": "org.apache.activemq.ActiveMQConnectionFactory",
        "providerJarPaths": [
          "file:///opt/conapi/jms-libs/activemq-all.jar"
        ],
        "username": "{{ secret('CONAPI_JMS_USERNAME') }}",
        "password": "{{ secret('CONAPI_JMS_PASSWORD') }}",
        "connectionProperties": {
          "brokerURL": "{{ secret('CONAPI_JMS_BROKER_URL') }}"
        },
        "useFilteredClassLoader": false
      },
      "destination": {
        "destinationName": "conapi.results",
        "destinationType": "QUEUE"
      },
      "serdeType": "JSON",
      "messageSelector": "{{ fromJson(read(outputs.select_result.outputFiles['selector.json'])).messageSelector }}",
      "maxMessages": 1,
      "maxWaitTimeout": 10000
    },
    {
      "id": "receive",
      "type": "io.kestra.plugin.scripts.python.Script",
      "taskRunner": {
        "type": "io.kestra.plugin.core.runner.Process"
      },
      "env": {
        "CONAPI_ANALYSIS_ROOT": "{{ vars.runtime.analysisRoot }}"
      },
      "inputFiles": {
        "runtime.json": "{{ vars.runtime | toJson }}",
        "selection.json": "{{ outputs.select_result.outputFiles['selector.json'] }}",
        "messages.json": "{{ fromIon(read(outputs.consume_result.uri), allRows=true) | toJson }}"
      },
      "outputFiles": [
        "receiving.json"
      ],
      "script": "import os\nfrom pathlib import Path\nimport sys\nsys.path.insert(0, str(Path(os.environ['CONAPI_ANALYSIS_ROOT']) / 'kestra'))\nfrom flow_driver import main\nraise SystemExit(main([\"receive\"]))\n"
    }
  ],
  "inputs": [
    {
      "id": "requestId",
      "type": "STRING"
    },
    {
      "id": "correlationId",
      "type": "STRING"
    },
    {
      "id": "deliveryId",
      "type": "STRING"
    },
    {
      "id": "expectedResultSha256",
      "type": "STRING"
    }
  ],
  "outputs": [
    {
      "id": "receiving",
      "type": "JSON",
      "value": "{{ fromJson(read(outputs.receive.outputFiles['receiving.json'])) }}"
    },
    {
      "id": "originalMessages",
      "type": "STRING",
      "value": "{{ outputs.consume_result.uri }}"
    }
  ]
}
