{
  "id": "conapi_workflow_process",
  "namespace": "conapi.commissioning",
  "description": "Retain the complete original JMS request, execute its selected native source/report, publish the exact saved result and record the actual native producer output.",
  "vars": {
    "runtime": {
      "schema": "stellar-forge.kestra-runtime.v1",
      "analysisRoot": "/opt/tjlabs/merchant/stellar/scf-starforge-20261009/sf30-seller-sdk/datasette-analysis",
      "workspace": "/var/lib/conapi/workflow",
      "configuration": "/etc/conapi/customer-workflow.json",
      "receiverWorkspace": "/var/lib/conapi/received-results",
      "correlationMode": "business-properties",
      "resultDestination": {
        "destinationName": "conapi.results",
        "destinationType": "QUEUE"
      },
      "nativeHeaderJar": "/opt/conapi/conapi-native-header-producer.jar",
      "pythonExecutable": "/usr/bin/python3",
      "javaExecutable": "/usr/bin/java"
    }
  },
  "tasks": [
    {
      "id": "prepare",
      "type": "io.kestra.plugin.scripts.python.Script",
      "taskRunner": {
        "type": "io.kestra.plugin.core.runner.Process"
      },
      "env": {
        "CONAPI_ANALYSIS_ROOT": "{{ vars.runtime.analysisRoot }}",
        "CONAPI_EXECUTION_ID": "{{ execution.id }}"
      },
      "inputFiles": {
        "runtime.json": "{{ vars.runtime | toJson }}",
        "transport.json": "{{ inputs.message }}"
      },
      "outputFiles": [
        "prepared.json",
        "jms-message.json"
      ],
      "script": "import os\nfrom pathlib import Path\nimport sys\nsys.path.insert(0, str(Path(os.environ['CONAPI_ANALYSIS_ROOT']) / 'kestra'))\nfrom flow_driver import main\nraise SystemExit(main([\"prepare\"]))\n"
    },
    {
      "id": "publish_result",
      "type": "io.kestra.plugin.jms.Produce",
      "connectionFactoryConfig": {
        "type": "DIRECT",
        "connectionFactoryClass": "org.apache.activemq.ActiveMQConnectionFactory",
        "providerJarPaths": [
          "file:///opt/conapi/jms-libs/activemq-all.jar"
        ],
        "username": "{{ secret('CONAPI_JMS_USERNAME') }}",
        "password": "{{ secret('CONAPI_JMS_PASSWORD') }}",
        "connectionProperties": {
          "brokerURL": "{{ secret('CONAPI_JMS_BROKER_URL') }}"
        },
        "useFilteredClassLoader": false
      },
      "destination": {
        "destinationName": "conapi.results",
        "destinationType": "QUEUE"
      },
      "serdeType": "JSON",
      "deliveryMode": 2,
      "priority": 4,
      "timeToLive": 0,
      "from": "{{ outputs.prepare.outputFiles['jms-message.json'] }}"
    },
    {
      "id": "record_publication",
      "type": "io.kestra.plugin.scripts.python.Script",
      "taskRunner": {
        "type": "io.kestra.plugin.core.runner.Process"
      },
      "env": {
        "CONAPI_ANALYSIS_ROOT": "{{ vars.runtime.analysisRoot }}"
      },
      "inputFiles": {
        "runtime.json": "{{ vars.runtime | toJson }}",
        "prepared.json": "{{ outputs.prepare.outputFiles['prepared.json'] }}",
        "producer-receipt.json": "{{ outputs.publish_result | toJson }}"
      },
      "outputFiles": [
        "publication.json"
      ],
      "script": "import os\nfrom pathlib import Path\nimport sys\nsys.path.insert(0, str(Path(os.environ['CONAPI_ANALYSIS_ROOT']) / 'kestra'))\nfrom flow_driver import main\nraise SystemExit(main([\"record\"]))\n"
    }
  ],
  "inputs": [
    {
      "id": "message",
      "type": "STRING",
      "description": "Complete original native JMSMessage JSON, including data and headers."
    }
  ],
  "outputs": [
    {
      "id": "publication",
      "type": "JSON",
      "value": "{{ fromJson(read(outputs.record_publication.outputFiles['publication.json'])) }}"
    }
  ]
}
