<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GIS migration</title><link rel="stylesheet" href="/styles.css"><link rel="stylesheet" href="/cartography.css"></head>
<body>
<header><div><p class="eyebrow">GIS MIGRATION WORKSPACE</p><h1 id="workspace-title">Opening workspace</h1><p id="workspace-meta"></p></div>
<label class="actor">Operator name<input id="actor" autocomplete="name" maxlength="240" placeholder="Name recorded with saved changes"></label></header>
<nav id="navigation" aria-label="Workspace sections"></nav>
<div id="notice" role="status" aria-live="polite"></div>
<details id="recovery"><summary>Saved requests and recovery <span id="request-count"></span></summary><div id="request-list"></div></details>
<main id="content" tabindex="-1"></main>
<dialog id="detail-dialog"><form method="dialog"><button type="submit">Close</button></form><h2 id="detail-title"></h2><pre id="detail-body"></pre></dialog>
<script type="module" src="/app.mjs"></script>
</body></html>
