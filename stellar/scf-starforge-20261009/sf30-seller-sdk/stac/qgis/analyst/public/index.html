<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QGIS analyst workspace</title>
<link rel="stylesheet" href="/style.css">
<script type="module" src="/app.js"></script>
</head>
<body>
<header>
<div class="heading"><p class="eyebrow">Starforge · GIS operations</p><h1 id="workspace-title">QGIS analyst workspace</h1>
<p id="workspace-identity"></p><p id="workspace-directory" class="break muted"></p></div>
<div id="actor-control"></div><div id="global-actions" class="actions"></div>
<p id="runtime-state" class="runtime"></p>
</header>
<nav id="navigation" aria-label="Analyst workspace sections"></nav>
<main>
<div id="notice" class="notice" role="status" aria-live="polite" hidden></div>
<div id="content" aria-live="polite"><p>Opening the original project…</p></div>
<aside id="operation" class="panel operation" aria-label="Saved analyst operation" hidden></aside>
</main>
<footer>Original source editions · Native QGIS maps · Field and project receiving</footer>
</body>
</html>
