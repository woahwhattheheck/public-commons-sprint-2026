syntax = "proto3";
package forge.streams;

// Deliberate local operator fixture; it is not a live provider or payment network.
service AccountEvents {
  rpc Watch(WatchRequest) returns (stream AccountEvent);
}
message WatchRequest {
  string account_id = 1;
  uint32 count = 2;
  uint32 delay_ms = 3;
  uint32 fail_after = 4;
  bool keep_open = 5;
}
message AccountEvent {
  uint64 sequence = 1;
  string account_id = 2;
  bytes payload = 3;
  optional string note = 4;
}
