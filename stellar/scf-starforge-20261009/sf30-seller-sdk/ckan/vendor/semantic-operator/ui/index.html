<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Semantic Operator</title><link rel="stylesheet" href="/style.css"><script src="/datasets.js" defer></script><script src="/app.js" defer></script></head>
<body>
<a class="skip" href="#main">Skip to workspace</a>
<header><div><strong>SEMANTIC OPERATOR</strong><span class="muted">Engineering workspace</span></div>
<div class="operator"><label for="actor">Operator</label><input id="actor" value="Local operator" maxlength="200"><button id="refresh" type="button">Refresh</button></div></header>
<div class="shell"><aside><nav id="navigation" aria-label="Workspace views"></nav><div class="workspace-label"><span class="muted">Workspace</span><code id="workspace-id">Opening…</code><small id="worker-state"></small></div></aside>
<main id="main" tabindex="-1"><div id="notice" role="status" aria-live="polite"></div><div id="content"></div></main></div>
<dialog id="detail"><div class="dialog-heading"><h2 id="detail-title">Record</h2><button id="close-detail" type="button">Close</button></div><div id="detail-body"></div></dialog>
</body></html>
