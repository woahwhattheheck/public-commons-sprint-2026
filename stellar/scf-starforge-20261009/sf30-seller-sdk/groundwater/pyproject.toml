[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "starforge-groundwater-workspace"
version = "1.0.0"
description = "Original-file groundwater scenarios, dual native solver results and receiving"
requires-python = ">=3.11"
license = "MIT"
dependencies = []

[project.optional-dependencies]
native = [
  "flopy==3.11.0",
  "modflow-devtools==1.7.0",
  "matplotlib==3.9.4",
  "numpy>=1.26,<3",
  "pandas>=2,<3",
  "GitPython>=3.1,<4",
  "packaging>=24",
]

[tool.setuptools]
packages = ["groundwater_workspace"]
include-package-data = false

[project.scripts]
starforge-groundwater = "groundwater_workspace.cli:entrypoint"
