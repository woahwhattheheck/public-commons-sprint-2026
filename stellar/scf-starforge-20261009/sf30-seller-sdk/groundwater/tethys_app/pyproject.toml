[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "stellar-groundwater-tethys"
version = "1.0.0"
description = "Tethys portal adapter for the original groundwater source, native run and receiving workspace"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = []

[project.urls]
Repository = "https://github.com/woahwhattheheck/public-commons-sprint-2026"

[tool.setuptools.packages.find]
where = ["."]
include = ["tethysapp", "tethysapp.groundwater_workshare*"]
namespaces = true

[tool.setuptools.package-data]
"tethysapp.groundwater_workshare" = [
  "templates/groundwater_workshare/*.html",
  "public/css/*.css",
  "public/images/*.svg",
  "resources/*.json",
]

[tool.setuptools]
include-package-data = true
zip-safe = false
