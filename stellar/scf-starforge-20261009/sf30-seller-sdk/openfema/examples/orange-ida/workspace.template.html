<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<style>
:root{font-family:Arial,Helvetica,sans-serif;color:#222;background:#f5f5f5;font-size:14px}*{box-sizing:border-box}body{margin:0}header{background:#fff;border-bottom:1px solid #aaa;padding:20px 26px}h1{font-size:23px;margin:0 0 8px}h2{font-size:19px;margin:12px 0}h3{font-size:15px;margin:22px 0 9px}p{line-height:1.5}a{color:#333;text-decoration:underline}main{padding:20px 26px;max-width:1600px;margin:auto}button,input,select,textarea{font:inherit}button{background:#fff;border:1px solid #888;border-radius:3px;padding:8px 12px;color:#222;cursor:pointer}button:hover{background:#eee}button.active{background:#333;color:#fff;border-color:#333}.link{border:0;background:transparent;padding:0;text-align:left;text-decoration:underline}input,select,textarea{padding:8px;border:1px solid #999;background:white;border-radius:2px;color:#222;max-width:100%}textarea{width:100%}label{display:block;margin:8px 0}label input:not([type=checkbox]),label select{display:block;width:100%;margin-top:5px}.check{display:flex;gap:6px;align-items:center}fieldset{border:1px solid #bbb;margin:12px 0}.toolbar{display:flex;flex-wrap:wrap;gap:9px;align-items:center;margin:12px 0}.toolbar label{min-width:300px}.toolbar span{margin-left:auto;color:#555}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stats div{background:#fff;border:1px solid #bbb;padding:12px}.stats strong{font-size:24px;display:block;margin-bottom:4px}nav{display:flex;flex-wrap:wrap;gap:5px;border-bottom:1px solid #aaa;padding-bottom:10px;margin-bottom:18px}.split{display:grid;grid-template-columns:minmax(400px,1fr) minmax(360px,1fr);gap:22px}section{background:#fff;border:1px solid #bbb;padding:16px}.sectionhead{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.sectionhead input{flex:1;min-width:200px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;background:#fff;font-size:13px}th,td{border:1px solid #bbb;padding:9px;text-align:left;vertical-align:top}th{background:#eaeaea}tr.selected td{background:#eee}small{display:block;font-size:11px;color:#555;overflow-wrap:anywhere;margin-top:5px}.notice,.error{padding:10px 12px;border:1px solid #aaa;background:#fff;margin:12px 0;white-space:pre-wrap}.error{border-left:5px solid #333;font-weight:bold}.notice:empty{display:none}.muted{font-size:12px;color:#555}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#fff;border:1px solid #bbb;padding:12px;font-size:12px;max-height:500px;overflow:auto}dl{display:grid;grid-template-columns:minmax(160px,1fr) 3fr;gap:8px;margin:12px 0}dt{font-weight:bold}dd{margin:0}details{margin-top:16px}li{margin:8px 0;line-height:1.5}@media(max-width:900px){.split{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}.fields{grid-template-columns:1fr}.toolbar span{margin-left:0}main,header{padding:16px}}@media print{header .toolbar,nav,button,form{display:none}.split{display:block}section{break-inside:avoid}}
</style></head><body>
