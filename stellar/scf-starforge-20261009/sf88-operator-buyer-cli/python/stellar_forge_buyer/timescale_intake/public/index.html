<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Timescale intake · Stellar Forge</title>
  <link rel="stylesheet" href="/timescale-intake/style.css">
  <script defer src="/timescale-intake/app.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to workspace</a>
  <header class="topbar">
    <div><span class="brand">STELLAR FORGE</span><h1>Timescale intake</h1></div>
    <div class="header-actions"><a id="dataset-home" href="/">Dataset workspace</a><a id="reconciliation-home" href="/reconciliation/">Reconciliation</a><a href="/timescale-intake/OPERATING.md" target="_blank" rel="noopener">Operating guide</a><button id="refresh" type="button">Refresh lists</button></div>
  </header>
  <div class="shell">
    <aside class="sidebar">
      <nav aria-label="Timescale intake">
        <button type="button" data-screen="reports" aria-current="page">Commissioning reports</button>
        <button type="button" data-screen="source">Source and field review</button>
        <button type="button" data-screen="editions">Reviewed editions</button>
        <button type="button" data-screen="pair">Pair and compare</button>
        <button type="button" data-screen="requests">Saved requests</button>
      </nav>
      <section class="workspace-info"><h2>Current workspace</h2><p id="workspace-name">Opening local workspace…</p><p id="workspace-id" class="mono wrap"></p><p id="workspace-counts" class="muted"></p></section>
      <p class="sidebar-note">Retain the original commissioning report, review its native fields, then compare two complete editions.</p>
    </aside>
    <main id="main" tabindex="-1">
      <div id="notice" class="notice" role="status" aria-live="polite" hidden></div>
      <div id="storage-notice" class="notice" hidden></div>
      <section id="screen-reports" class="screen" aria-labelledby="title-reports"></section>
      <section id="screen-source" class="screen" aria-labelledby="title-source" hidden></section>
      <section id="screen-editions" class="screen" aria-labelledby="title-editions" hidden></section>
      <section id="screen-pair" class="screen" aria-labelledby="title-pair" hidden></section>
      <section id="screen-requests" class="screen" aria-labelledby="title-requests" hidden></section>
      <noscript><section class="panel"><h2>JavaScript is required</h2><p>The original local DuckDB CLI and MCP tools can also retain a report, review its sources and import editions.</p></section></noscript>
    </main>
  </div>
</body>
</html>
