[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stellar-forge-buyer"
version = "0.4.0"
description = "Durable Python applications on the original Stellar Forge buyer runtime"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = []
readme = "README.md"

[project.scripts]
stellar-forge-buyer = "stellar_forge_buyer.__main__:main"

[tool.setuptools]
packages = ["stellar_forge_buyer"]
