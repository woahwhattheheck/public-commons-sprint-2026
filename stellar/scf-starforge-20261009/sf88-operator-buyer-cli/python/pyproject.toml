[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stellar-forge-buyer"
version = "0.5.0"
description = "Durable Python applications on the original Stellar Forge buyer runtime"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = []
readme = "README.md"

[project.optional-dependencies]
agents = [
  "langchain-core>=1.6.9,<2",
  "langgraph>=1.2.14,<2",
  "langgraph-checkpoint-sqlite>=3.1.1,<4",
  "pydantic>=2.14,<3",
]

[project.scripts]
stellar-forge-buyer = "stellar_forge_buyer.__main__:main"
stellar-forge-agent = "stellar_forge_buyer.agent_workflow:main"

[tool.setuptools]
packages = ["stellar_forge_buyer"]
