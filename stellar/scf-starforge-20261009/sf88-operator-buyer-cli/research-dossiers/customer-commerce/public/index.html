<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Research paid delivery</title><link rel="stylesheet" href="/customer-commerce/style.css">
<script type="module" src="/customer-commerce/browser.mjs"></script></head>
<body>
<header><div><p class="eyebrow">Research workspace</p><h1>Paid customer delivery</h1></div>
<nav aria-label="Research tools"><a id="dossiers-link" href="/">Dossiers</a><a id="customer-link" href="/customer-updates.html">Customer work</a>
<a id="source-link" href="/europe-pmc.html">Source acquisition</a></nav></header>
<main>
<section class="connection"><label>Existing Research session token<input id="token" type="password" autocomplete="off" spellcheck="false"></label>
<button id="connect" type="button">Open workspace</button><span id="identity"></span></section>
<div id="message" role="status" aria-live="polite">Open the existing Research workspace to continue.</div>
<div class="toolbar" aria-label="Workspace views"><button data-tab="publications" type="button">Seller publications</button>
<button data-tab="purchases" type="button">Buyer receiving</button><button data-tab="history" type="button">Saved requests and forms</button>
<button data-tab="configuration" type="button">Connections</button></div>
<div class="layout">
<aside><div class="toolbar"><h2 id="library-title">Publications</h2><button id="library-refresh" type="button">Refresh</button></div>
<div id="library"></div><div id="library-pages" class="toolbar"></div></aside>
<section id="workspace" aria-label="Selected operation"></section>
</div>
</main>
<template id="empty"><p class="muted">Select an item to continue.</p></template>
</body></html>
