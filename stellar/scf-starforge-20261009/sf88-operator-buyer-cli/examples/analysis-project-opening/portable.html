 const inputs=card('Complete source inputs');for(const input of snapshot.sourceInputs)inputs.append(E('div',{class:'file-row'},E('div',{},E('strong',{text:literal(input.source)+' · '+literal(input.role)}),E('div',{class:'mono small-text',text:input.originalPath}),E('div',{class:'hash',text:input.sha256}),muted(literal(input.bytes)+' original bytes')),E('div',{class:'actions'},btn('View original',()=>go('files',{path:input.file}),'small'),fileButton(input.file))));content.append(inputs);

function previewFile(path){

 let text=null;try{text=DECODER.decode(item.bytes);}catch{}
 const readable=text!==null&&!text.includes('\u0000')&&(/(?:json|text|xml|javascript|python|csv|markdown|yaml)/i.test(item.row.mediaType)||/\.(?:json|jsonl|ndjson|txt|md|csv|tsv|xml|mjs|js|py|html|css|toml|sql|sh|yml|yaml)$/.test(path));

  if(parsed)box.append(details('Structured original content',definition(parsed)));
  box.append(E('div',{class:'actions'},btn('Copy complete original text',()=>copy(text),'small')),code(text),muted('The preview is text. Download preserves the original bytes, whitespace and line endings.'));

}
function restorePanel(){

function fileSection(){
 const content=E('div',{},header('Complete files and native restore','Every included file has passed its byte count and SHA-256 check. Search the complete inventory, inspect text safely and download any original file.'));
 content.append(restorePanel());const list=E('div'),search=E('input',{type:'search',placeholder:'Filter paths, media types or SHA-256','aria-label':'Filter original files'}),selection=E('div',{class:'detail'}),paths=[...files.keys()].sort();

async function loadProject(){
 const loading=document.getElementById('loading'),status=document.getElementById('load-status'),progress=document.getElementById('load-progress');
 try{
  const encoded=document.getElementById('project-data').textContent.trim();
  if(!encoded)throw new Error('The complete project snapshot has not been embedded.');
  wrapperText=DECODER.decode(decode64(encoded));const wrapper=parseExact(wrapperText);
  if(wrapper?.schema!=='stellar-forge.analysis-project-reader-wrapper.v1'||!wrapper.snapshot||typeof wrapper.snapshot!=='object'||Array.isArray(wrapper.snapshot))throw new Error('Open the original complete Analysis reader data.');
  snapshot=wrapper.snapshot;snapshotHash=shaValue(wrapper.sha256);
  snapshotText=encodeExact(snapshot)+'\n';
  if(hashText(snapshotText)!==snapshotHash)throw new Error('The complete project snapshot does not match its original SHA-256.');
  if(snapshot.schema!=='stellar-forge.analysis-project-reader.v1'||typeof snapshot.title!=='string'||typeof snapshot.workspaceId!=='string'||!snapshot.workspaceId)throw new Error('The original Analysis workspace identity is incomplete.');
  if(!Array.isArray(snapshot.files)||!Array.isArray(snapshot.tables)||!Array.isArray(snapshot.sourceInputs))throw new Error('The complete file, table and source-input inventories are required.');
  const declared=new Set();for(const item of snapshot.files){
   filePath(item.path);if(declared.has(item.path))throw new Error('Duplicate original file path: '+item.path);declared.add(item.path);
   if(item.encoding!=='base64'||typeof item.mediaType!=='string')throw new Error('Use the original file encoding and media type: '+item.path);
   integer(item.bytes,'file byte count');shaValue(item.sha256);if(typeof item.data!=='string')throw new Error('The complete original bytes are missing: '+item.path);
  }
  progress.max=Math.max(1,snapshot.files.length);
  for(let i=0;i<snapshot.files.length;i++){
   const item=snapshot.files[i];status.textContent='Checking original file '+(i+1)+' of '+snapshot.files.length+': '+item.path;
   const bytes=decode64(item.data);
   if(bytes.length!==integer(item.bytes)||hashBytes(bytes)!==item.sha256)throw new Error('The original file bytes or hash differ: '+item.path);
   files.set(item.path,{row:item,bytes});progress.value=i+1;
   if(i%5===0)await new Promise(resolve=>setTimeout(resolve,0));
  }
  const requireFile=(path,bytes,hash,label)=>{filePath(path);const found=files.get(path);if(!found||found.bytes.length!==integer(bytes,label+' bytes')||found.row.sha256!==shaValue(hash))throw new Error('The complete '+label+' does not match its selected file: '+path);};
  if(!snapshot.archive||typeof snapshot.archive!=='object')throw new Error('The original archive identity is required.');
  requireFile(snapshot.archive.file,snapshot.archive.bytes,snapshot.archive.sha256,'original project archive');
  if(snapshot.archive.manifestFile&&!files.has(filePath(snapshot.archive.manifestFile)))throw new Error('The selected original archive manifest is missing.');
  for(const item of snapshot.sourceInputs){
   if(item.source===undefined||typeof item.role!=='string'||typeof item.originalPath!=='string')throw new Error('The original source-input identity is incomplete.');
   requireFile(item.file,item.bytes,item.sha256,'source input');
  }
  for(const t of snapshot.tables){
   if(typeof t.name!=='string'||!t.name||tableMap.has(t.name)||typeof t.kind!=='string'||!Array.isArray(t.columns)||!Array.isArray(t.rows))throw new Error('The native table inventory is incomplete or repeated.');
   if(integer(t.rowCount,'table row count')!==t.rows.length)throw new Error('A saved table is incomplete: '+t.name);
   const columns=new Set();for(const c of t.columns){if(typeof c.name!=='string'||columns.has(c.name))throw new Error('Duplicate or invalid native table column: '+t.name);columns.add(c.name);}
   for(const row of t.rows){if(!row||typeof row!=='object'||Array.isArray(row)||Object.keys(row).length!==columns.size||Object.keys(row).some(k=>!columns.has(k)))throw new Error('The complete native row shape changed: '+t.name);
    for(const name of columns){const c=row[name];if(!c||!['string','integer','number','sqlite-real','null','blob'].includes(c.type)||typeof c.text!=='string')throw new Error('An original typed cell is missing: '+t.name+'.'+name);
     if(c.type==='integer'&&!/^-?(?:0|[1-9][0-9]*)$/.test(c.text))throw new Error('The original integer text is invalid: '+t.name+'.'+name);
     if(c.type==='number'&&!/^-?(?:0|[1-9][0-9]*)(?:\.[0-9]+)?(?:[eE][+-]?[0-9]+)?$/.test(c.text))throw new Error('The original finite numeric text is invalid: '+t.name+'.'+name);
     if(c.type==='blob')decode64(c.text);
    }
   }tableMap.set(t.name,t);
  }
  document.title=snapshot.title+' · Analysis project';document.getElementById('project-title').textContent=snapshot.title;document.getElementById('workspace-id').textContent=snapshot.workspaceId;
  document.getElementById('verification').textContent=files.size+' original files verified · '+snapshot.tables.length+' complete tables and views';
  document.getElementById('snapshot-short').textContent='Snapshot '+snapshotHash.slice(0,16);
  const nav=document.getElementById('navigation');for(const [id,label] of sections){const b=btn(label,()=>go(id));b.dataset.section=id;nav.append(b);}
  document.getElementById('download-snapshot').addEventListener('click',()=>downloadBytes('analysis-project-snapshot.json',UTF8.encode(snapshotText),'application/json'));
  document.getElementById('download-wrapper').addEventListener('click',()=>downloadBytes('analysis-project-reader-data.json',UTF8.encode(wrapperText),'application/json'));
  render();loading.classList.add('hidden');document.getElementById('app').classList.remove('hidden');
 }catch(error){status.textContent='The original project could not be verified.';document.getElementById('load-error').replaceChildren(E('div',{class:'error'},E('strong',{text:error.message}),E('p',{text:'Keep this original file and reopen the complete handover from its saved source. Downloads are enabled only after the complete embedded inventory passes.'})));progress.classList.add('hidden');}
}
loadProject();
})();
