<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Dataset workspace · Starforge</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="app-header"><div><span class="wordmark">STARFORGE</span><h1>Dataset workspace</h1></div><span id="connection" class="muted">Opening local workspace…</span></header>
  <div id="notice" role="status" aria-live="polite" hidden></div>
  <div class="layout">
    <aside><button id="receive-nav" class="primary wide">Receive a dataset</button><h2>Acquisitions</h2><nav id="sessions" aria-label="Dataset acquisitions"></nav><p class="aside-note">Original merchant terms, retained pages and delivered data in one workspace.</p></aside>
    <main id="main" tabindex="-1"><p class="empty">Opening saved acquisitions…</p></main>
  </div>
  <script type="module" src="/app.mjs"></script>
</body>
</html>
