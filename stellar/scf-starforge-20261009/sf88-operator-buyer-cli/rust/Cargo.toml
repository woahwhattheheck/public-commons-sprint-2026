[package]
name = "starforge-buyer"
version = "0.1.0"
edition = "2021"
rust-version = "1.74"
description = "Rust customer workflows over the original Stellar Forge SF88 buyer"
license = "MIT"
repository = "https://github.com/woahwhattheheck/public-commons-sprint-2026"
publish = false

[lib]
name = "starforge_buyer"
path = "src/lib.rs"

[[bin]]
name = "starforge-buyer-rust"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }

[profile.release]
strip = true
