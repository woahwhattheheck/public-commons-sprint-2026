<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Stellarcarbon statements</title><link rel="stylesheet" href="/stellarcarbon/style.css"></head>
<body>
<header class="masthead"><div><p class="eyebrow">Merchant workspace</p><h1>Stellarcarbon statements</h1><p id="workspace-name" class="muted"></p></div><div class="header-actions"><label>Operator<input id="operator" value="Local operator" maxlength="300"></label><button id="refresh">Refresh</button><a class="button" href="/api/handover">Export whole workspace</a></div></header>
<nav id="navigation" aria-label="Workspace pages">
<button data-tab="overview">Overview</button><button data-tab="contributions">Contributions</button><button data-tab="retirements">Retirements</button><button data-tab="customers">Customers and projects</button><button data-tab="assignments">Assignments</button><button data-tab="statements">Statements</button><button data-tab="sources">Source editions</button><button data-tab="compare">Compare editions</button><button data-tab="capture">Import and receive</button>
</nav>
<section class="selection" aria-label="Working selection"><label>Source edition<select id="edition"></select></label><label>Customer<select id="customer"><option value="">All customers</option></select></label><label>Project<select id="project"><option value="">All projects</option></select></label><label>From date<input id="from-date" type="date"></label><label>Before date<input id="before-date" type="date"></label><button id="apply-filters">Apply selection</button><button id="clear-filters" class="quiet">Clear</button></section>
<p id="notice" class="notice" role="status" aria-live="polite"></p>
<main id="main"><p>Opening the saved workspace…</p></main>
<dialog id="dialog"><header><h2 id="dialog-title"></h2><button id="close-dialog" aria-label="Close dialog">Close</button></header><div id="dialog-body"></div></dialog>
<footer><span>Original sc-audit records · exact decimal amounts · retained statement versions</span><span id="revision"></span></footer>
<script type="module" src="/stellarcarbon/app.mjs"></script></body></html>
