<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Merchant quotations · Stellar</title>
<link rel="stylesheet" href="/commercial-desk.css">
<script type="module" src="/commercial-app.mjs"></script>
<link rel="stylesheet" href="/commercial/receiving-desk.css">
</head>
<body class="commercial-page">
<header class="commercial-shell"><div><p class="commercial-eyebrow">Stellar · Merchant operations</p><h1>Merchant quotations</h1><p>Quote the implementation and recurring service from the original saved case.</p></div><nav aria-label="Merchant tools"><a href="/">Merchant workspace</a></nav></header>
<main class="commercial-shell commercial-main">
<section class="commercial-selector" aria-labelledby="case-heading"><div><h2 id="case-heading">Original saved case</h2><p>Work on its retained source editions. Unfinished quotation drafts remain with the selected case.</p></div>
<form id="case-search"><label for="case-query">Find a case<input id="case-query" name="q" maxlength="1000" type="search" autocomplete="off"></label><button type="submit">Search</button></form>
<div class="commercial-case-controls"><label for="case-selection">Saved case<select id="case-selection"><option value="">Choose a case</option></select></label><button id="open-case" type="button">Open quotation</button><button id="more-cases" type="button" hidden>More cases</button></div>
<p id="case-status" role="status" aria-live="polite"></p>
</section>
<section id="quotation-root" aria-label="Complete quotation workspace"></section>
</main>
</body>
</html>
