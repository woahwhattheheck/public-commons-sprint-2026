<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Service agreements · Merchant workspace</title>
  <link rel="stylesheet" href="/service-agreements/styles.css">
</head>
<body>
  <a class="skip" href="#workspace">Skip to workspace</a>
  <header class="topbar">
    <div><p class="eyebrow">Merchant workspace</p><h1>Service agreements</h1><p class="subtitle">Recurring terms, billing periods and original invoice drafts.</p></div>
    <div class="top-actions">
      <label>Operator<input id="operator" name="operator" maxlength="160" autocomplete="off" value="merchant-operator"></label>
      <a class="button-link" id="receivables-link" href="/receivables/">Receivables</a>
      <a class="button-link" id="customers-link" href="/customer-statements/">Customers</a>
      <button type="button" data-action="refresh">Refresh</button>
      <button type="button" class="primary" data-action="create" data-mutation>New agreement</button>
    </div>
  </header>
  <div class="notice-wrap">
    <div id="message" role="status" aria-live="polite"></div>
    <div id="pending" aria-live="polite"></div>
    <div id="parked-form" aria-live="polite"></div>
  </div>
  <nav class="tabs" aria-label="Agreement sections">
    <button type="button" data-action="view" data-view="agreements" aria-current="page">Agreements</button>
    <button type="button" data-action="view" data-view="calendar">Due calendar</button>
    <button type="button" data-action="view" data-view="history">History</button>
    <span id="revision" class="meta">Opening workspace…</span>
  </nav>
  <main id="workspace" tabindex="-1">
    <section class="filters" aria-label="Agreement filters">
      <label class="grow">Search<input id="search" type="search" placeholder="Agreement, customer or reference"></label>
      <label class="grow">Customer<select id="customer-filter"><option value="">All customers</option></select></label>
      <label>Agreement status<select id="status-filter"><option value="">All statuses</option><option value="ACTIVE">Active</option><option value="ENDED">Ended</option><option value="CANCELLED">Cancelled</option></select></label>
      <label id="period-filter-label" hidden>Billing periods<select id="period-filter"><option value="due">Due and preparing</option><option value="">All periods</option><option value="UPCOMING">Upcoming</option><option value="DRAFT">Draft invoices</option><option value="ISSUED">Issued invoices</option><option value="VOID">Voided invoices</option></select></label>
      <label>As of<input id="as-of" type="date" required></label>
    </section>
    <div id="content"><section class="empty"><h2>Opening service agreements</h2><p>Loading the original accounting workspace.</p></section></div>
    <section id="detail" aria-label="Selected agreement" hidden></section>
  </main>
  <dialog id="dialog" aria-labelledby="dialog-title">
    <div class="dialog-head"><h2 id="dialog-title">Agreement</h2><button type="button" data-action="close-dialog" aria-label="Close form and keep entered values">Close</button></div>
    <div id="dialog-message" role="status" aria-live="polite"></div>
    <div id="dialog-content"></div>
  </dialog>
  <noscript>This local operator workspace requires JavaScript.</noscript>
  <script type="module" src="/service-agreements/app.mjs"></script>
</body>
</html>
