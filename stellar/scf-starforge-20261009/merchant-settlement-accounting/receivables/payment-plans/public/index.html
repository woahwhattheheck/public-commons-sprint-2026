<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Payment plans · Merchant workspace</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <a class="skip" href="#workspace">Skip to payment plans</a>
  <header class="topbar">
    <div><p class="eyebrow">Merchant workspace / Receivables</p><h1>Payment plans</h1></div>
    <div class="actions">
      <label class="operator">Operator<input id="operator" value="merchant-operator" maxlength="160" autocomplete="off"></label>
      <a class="button" href="/receivables/">Invoices and payments</a>
      <a class="button" href="/customer-statements/">Customers</a>
      <button type="button" data-action="refresh">Refresh</button>
      <button class="primary" type="button" data-action="new">New payment plan</button>
    </div>
  </header>
  <div id="message" class="message" role="status" aria-live="polite"></div>
  <div id="pending" class="pending" aria-live="polite"></div>
  <main id="workspace" tabindex="-1">
    <section class="filterbar" aria-label="Payment-plan filters">
      <label>Customer<select id="customer-filter"><option value="">All customers</option></select></label>
      <label class="grow">Search<input id="search" type="search" placeholder="Customer, invoice or plan reference"></label>
      <label>Balance date<input id="as-of" type="date"></label>
      <label>Planning through<input id="through" type="date"></label>
      <button type="button" data-action="apply">Apply dates</button>
    </section>
    <section id="summary" aria-label="Collections by currency"></section>
    <div class="sectionbar">
      <nav class="tabs" aria-label="Payment-plan views">
        <button type="button" data-action="tab" data-tab="plans" aria-current="page">Plans</button>
        <button type="button" data-action="tab" data-tab="collections">Due schedule</button>
        <button type="button" data-action="tab" data-tab="unplanned">Unscheduled balances</button>
      </nav>
      <span id="revision" class="meta">Opening workspace…</span>
      <div class="actions exports"><button type="button" data-action="collections-file" data-name="collections.csv">Export CSV</button><button type="button" data-action="collections-file" data-name="collections.json">Export JSON</button></div>
    </div>
    <section id="content" aria-live="polite"><div class="empty"><h2>Opening payment plans</h2><p>Loading invoices, schedules and recorded payments.</p></div></section>
    <p class="footnote">Balances follow the payments and credits recorded in Receivables. Each currency is shown separately.</p>
  </main>
  <dialog id="dialog" aria-labelledby="dialog-title">
    <div class="dialog-head"><h2 id="dialog-title"></h2><button type="button" data-action="close" aria-label="Close payment-plan detail">Close</button></div>
    <div id="dialog-message" class="message" role="status" aria-live="polite"></div>
    <div id="dialog-content"></div>
  </dialog>
  <noscript>The local payment-plan desk requires JavaScript.</noscript>
  <script type="module" src="./app.mjs"></script>
</body>
</html>
