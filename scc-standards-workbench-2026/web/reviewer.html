<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'none'; base-uri 'none'; form-action 'none'">
<title>Consultation / Consultation</title><style>__REVIEW_STYLE__</style></head>
<body>
<a id="skip-content" class="skip-link" href="#main">Skip to review content</a>
<header class="top"><div><strong>STANDARDS / NORMES</strong><span id="edition-label"></span></div><label><span id="language-label">Language / Langue</span><select id="language"><option value="en">English</option><option value="fr">Français</option><option value="bilingual">English + français</option></select></label></header>
<div class="layout">
<aside>
 <div class="sidebar-heading"><h1 id="packet-title"></h1><p id="packet-dates"></p><p id="reading-progress" class="reading-progress"></p></div>
 <nav id="navigation" aria-label="Review steps"></nav>
 <details id="clause-browser" class="clause-browser" open><summary id="clause-browser-label">Clause index</summary>
  <label id="search-label" for="search">Find a clause</label><input id="search" type="search">
  <label id="clause-filter-label" for="clause-filter">Show clauses</label><select id="clause-filter"><option value="all">All clauses</option></select>
  <div id="outline"></div>
 </details>
</aside>
<main id="main" tabindex="-1"></main>
</div>
<footer class="footer"><span id="saved" role="status" aria-live="polite"></span><div><button type="button" id="save-draft">Save draft</button><button type="button" id="load-draft">Open draft</button><button type="button" id="preview-response">Review response</button><button type="button" id="export-response" class="primary">Export response</button></div></footer>
<p id="error" role="alert" hidden></p><input id="open-file" type="file" accept=".json,application/json" hidden>
<dialog id="comment-dialog" aria-labelledby="comment-heading"><form id="comment-form"><header><h2 id="comment-heading"></h2><button type="button" id="close-comment" aria-label="Close / Fermer">×</button></header><div id="comment-fields"></div><p id="comment-error" role="alert"></p><footer><button type="button" id="delete-comment"></button><button type="submit" class="primary" id="save-comment"></button></footer></form></dialog>
<script id="review-data" type="application/json">__REVIEW_DATA__</script>
<script>__REVIEW_SCRIPT__</script>
</body></html>
