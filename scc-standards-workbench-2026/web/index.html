<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light"><title>Standards drafting workspace</title><link rel="stylesheet" href="/style.css"></head>
<body><header class="topbar"><div><strong>STANDARDS</strong><span>Drafting & delivery</span></div><div class="project-tools"><label class="sr-only" for="project-picker">Project</label><select id="project-picker"><option value="">Choose a project</option></select><button id="new-project">New project</button><button id="more-menu" aria-expanded="false">Workspace</button></div></header>
<div id="workspace-menu" class="menu" hidden><button data-action="public-demo">Open municipal source example</button><button data-action="authored-demo">Open authored workflow example</button><button data-action="restore">Restore complete workspace ZIP</button><button data-action="rename">Rename current project</button><button data-action="export">Export and publish documents</button></div>
<div class="shell"><nav aria-label="Workspace sections" id="nav"></nav><main id="main"><section class="empty"><h1>Standards drafting & delivery</h1><p>Keep original sources, edit paired clauses, manage actual review decisions, and prepare the SCC four-phase delivery package.</p><button data-action="public-demo">Open the Canadian source example</button><button data-action="new-project">Create a working project</button></section></main></div>
<div id="notice" role="status" aria-live="polite"></div><dialog id="editor"><form id="editor-form"><header><div><p class="eyebrow" id="editor-context"></p><h2 id="editor-title"></h2></div><button type="button" class="close" data-action="close-editor" aria-label="Close editor">×</button></header><div id="editor-fields"></div><section id="editor-conflict" hidden></section><p id="editor-error" role="alert"></p><footer><span id="editor-revision"></span><div><button type="button" data-action="close-editor">Cancel</button><button type="submit" class="primary" id="editor-save">Save</button></div></footer></form></dialog>
<dialog id="viewer"><header><h2 id="viewer-title"></h2><button class="close" data-action="close-viewer" aria-label="Close viewer">×</button></header><div id="viewer-content"></div></dialog><input id="restore-file" type="file" accept=".zip" hidden>
<script type="module" src="/app.js"></script></body></html>
